name: PR Checks on Develop

on:
  pull_request:
    branches:
      - develop

env:
  NODE_VERSION: 24

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - run: supabase start -x studio,imgproxy,mailpit,vector,logflare,supavisor
      - run: echo "SUPABASE_URL=\"$(supabase status -o env | sed -n 's/^API_URL=\"\([^\"]*\)\"$/\1/p')\"" >> "$GITHUB_ENV"
      - run: echo "SUPABASE_SERVICE_ROLE_KEY=\"$(supabase status -o env | sed -n 's/^SECRET_KEY=\"\([^\"]*\)\"$/\1/p')\"" >> "$GITHUB_ENV"
      - run: pnpm db:reset
      - run: bash scripts/ci/prepare-edge-functions-env.sh
      - run: pnpm fns:update-env
      - run: nohup pnpm fns:serve > /tmp/supabase-functions.log 2>&1 &
      - run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:54321/rest/v1/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Local Supabase API did not become ready in time." >&2
          exit 1
      - run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:54321/functions/v1/healthz \
              >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Local Supabase Functions did not become ready in time." >&2
          exit 1
      - run: pnpm test
