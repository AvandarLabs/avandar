name: CI/CD for Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: 24

jobs:
  # Run ESLint checks
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Run TypeScript checks
  typescript:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  # Run tests
  test:
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - run: supabase start -x studio,imgproxy,mailpit,vector,logflare,supavisor
      - run: |
          SUPABASE_STATUS_ENV=$(supabase status -o env)
          API_URL=$(echo "$SUPABASE_STATUS_ENV" \
            | sed -n 's/^API_URL=\"\([^\"]*\)\"$/\1/p')
          SECRET_KEY=$(echo "$SUPABASE_STATUS_ENV" \
            | sed -n 's/^SECRET_KEY=\"\([^\"]*\)\"$/\1/p')
          echo "SUPABASE_URL=\"${API_URL}\"" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=\"${SECRET_KEY}\"" >> "$GITHUB_ENV"
          echo "SUPABASE_URL from status: ${API_URL}"
      - run: pnpm db:reset
      - run: pnpm fns:update-env
      - run: nohup pnpm fns:serve > /tmp/supabase-functions.log 2>&1 &
      - run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:54321/rest/v1/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Local Supabase API did not become ready in time." >&2
          exit 1
      - run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:54321/functions/v1/healthz \
              >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Local Supabase Functions did not become ready in time." >&2
          exit 1
      - run: pnpm test

  # Migrate Supabase Staging database
  migrate:
    runs-on: ubuntu-latest
    needs: test

    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - run: supabase link --project-ref $SUPABASE_PROJECT_ID
      - run: supabase db push
      - run: supabase functions deploy
