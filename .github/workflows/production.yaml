name: CI/CD for Mainline Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Pinned to 24.15.0: Node 24.16.0 causes `playwright install` to hang
  # indefinitely after the Chromium download completes (verified against the
  # last green run on 2026-05-18 vs. five consecutive 6h cancellations on
  # 24.16.0). Bump deliberately after re-verifying against this workflow.
  NODE_VERSION: 24.15.0

jobs:
  # Lint and TypeScript checks.
  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm type-check

  # Everything except end-to-end tests. Failure here will prevent the mainline
  # deploy.
  test-quick:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    timeout-minutes: 20
    # Tests run with the staging env vars.
    environment: staging
    env:
      POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_PICKER_APP_ID: ${{ vars.VITE_GOOGLE_PICKER_APP_ID }}
      UPSTASH_REDIS_API_URL: ${{ secrets.UPSTASH_REDIS_API_URL }}
      UPSTASH_REDIS_REST_API_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_API_TOKEN }}
      RESEND_SENDING_API_KEY: ${{ secrets.RESEND_SENDING_API_KEY }}
      RESEND_FULL_ACCESS_API_KEY: ${{ secrets.RESEND_FULL_ACCESS_API_KEY }}
      RESEND_LOCAL_TEST_SEGMENT_ID: ${{ secrets.RESEND_LOCAL_TEST_SEGMENT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
      FEATUREBASE_JWT_SECRET: ${{ secrets.FEATUREBASE_JWT_SECRET }}
      AVA_PIPELINE_SERVER_SECRET: ${{ secrets.AVA_PIPELINE_SERVER_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - run: supabase start -x studio,imgproxy,mailpit,vector,logflare,supavisor
      - run: bash scripts/ci/prepare-envs/prepare-envs.sh
      - run: pnpm db:reset
      - run: nohup pnpm fns:serve > /tmp/supabase-functions.log 2>&1 &
      - run: bash scripts/ci/verify-supabase-api-is-running.sh
      - run: bash scripts/ci/verify-supabase-functions-are-serving.sh
      # No `playwright install` here: nothing in the quick suite drives a
      # browser, and the Chromium download is the single slowest setup step.
      - run: bash scripts/test-runners/run-all-tests.sh --quick
      - name: Upload Supabase functions log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-functions-log-production-quick-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/supabase-functions.log
          retention-days: 30
          if-no-files-found: warn

  # End-to-end tests. Intentionally NOT a dependency of `deploy-mainline`.
  # See `staging.yaml` for the explanation on the timeout threshold.
  test-e2e:
    # Pinned rather than `ubuntu-latest`: some runners now resolve that to
    # Ubuntu 26.04, where Playwright 1.59.1 cannot install Chromium and the
    # job fails before any test runs. Move this with the Playwright version.
    runs-on: ubuntu-24.04
    needs: lint-typecheck
    timeout-minutes: 70
    # Tests run with the staging env vars.
    environment: staging
    env:
      POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_PICKER_APP_ID: ${{ vars.VITE_GOOGLE_PICKER_APP_ID }}
      UPSTASH_REDIS_API_URL: ${{ secrets.UPSTASH_REDIS_API_URL }}
      UPSTASH_REDIS_REST_API_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_API_TOKEN }}
      RESEND_SENDING_API_KEY: ${{ secrets.RESEND_SENDING_API_KEY }}
      RESEND_FULL_ACCESS_API_KEY: ${{ secrets.RESEND_FULL_ACCESS_API_KEY }}
      RESEND_LOCAL_TEST_SEGMENT_ID: ${{ secrets.RESEND_LOCAL_TEST_SEGMENT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
      FEATUREBASE_JWT_SECRET: ${{ secrets.FEATUREBASE_JWT_SECRET }}
      AVA_PIPELINE_SERVER_SECRET: ${{ secrets.AVA_PIPELINE_SERVER_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - run: supabase start -x studio,imgproxy,mailpit,vector,logflare,supavisor
      - run: bash scripts/ci/prepare-envs/prepare-envs.sh
      - run: pnpm db:reset
      - run: nohup pnpm fns:serve > /tmp/supabase-functions.log 2>&1 &
      - run: bash scripts/ci/verify-supabase-api-is-running.sh
      - run: bash scripts/ci/verify-supabase-functions-are-serving.sh
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --no-third-party
      - name: Upload Supabase functions log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-functions-log-production-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/supabase-functions.log
          retention-days: 30
          if-no-files-found: warn
      - name: Upload Playwright report and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          retention-days: 30
          if-no-files-found: warn

  # main no longer serves production: alpha does (see alpha.yaml). main
  # deploys to the `mainline` Vercel environment, a test URL backed by the
  # staging Supabase project, which develop's CI has already migrated.
  deploy-mainline:
    runs-on: ubuntu-latest
    needs: test-quick
    # Only main deploys to the mainline URL, so a manual run on another branch
    # cannot replace it.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    environment:
      name: staging
      deployment: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 64.7.0
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - name: Pull the Vercel mainline environment
        env:
          STAGING_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
        run: |
          # `vercel deploy` looks the team up by this ID and only accepts a
          # Team ID. `vercel pull` skips that lookup, so check it here rather
          # than after a full build.
          if [[ ! "$VERCEL_ORG_ID" =~ ^team_[A-Za-z0-9]+$ ]]; then
            echo "VERCEL_ORG_ID must be the avandar team's Team ID (team_...), with no spaces or quotes." >&2
            exit 1
          fi
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes \
            --environment=mainline --token="$VERCEL_TOKEN"
          env_file=".vercel/.env.mainline.local"
          # Vercel never sends Sensitive values to `vercel pull`, only a
          # "[SENSITIVE]" placeholder, which the build would bake into the
          # app. These three point the app at the staging Supabase project and
          # only come from Vercel, so a placeholder in any of them fails here.
          supabase_pattern='^(VITE_SUPABASE_API_URL|VITE_SUPABASE_ANON_KEY|VITE_APP_URL)="?\[SENSITIVE\]"?$'
          if grep -qE "$supabase_pattern" "$env_file"; then
            echo "Make VITE_SUPABASE_API_URL, VITE_SUPABASE_ANON_KEY and VITE_APP_URL non-Sensitive in the Vercel 'mainline' environment." >&2
            exit 1
          fi
          # The build must point at the staging project, never production, so
          # the URL has to be exactly the staging project's. `vercel pull`
          # writes every value as KEY="value".
          expected_url="https://$STAGING_PROJECT_ID.supabase.co"
          if [ -z "$STAGING_PROJECT_ID" ] ||
            ! grep -qxF "VITE_SUPABASE_API_URL=\"$expected_url\"" "$env_file"; then
            echo "VITE_SUPABASE_API_URL in the Vercel 'mainline' environment must be the staging project's URL." >&2
            exit 1
          fi
          for name in VITE_SUPABASE_ANON_KEY VITE_APP_URL; do
            if ! grep -qE "^$name=\"[^\"]+\"$" "$env_file"; then
              echo "$name is missing or empty in the Vercel 'mainline' environment." >&2
              exit 1
            fi
          done
          # Drop every other placeholder. The Google Picker values come from
          # GitHub instead.
          sensitive_pattern='^[A-Z0-9_]+="?\[SENSITIVE\]"?$'
          sensitive_names="$(grep -E "$sensitive_pattern" "$env_file" | cut -d= -f1 || true)"
          echo "Sensitive Vercel variables left out of the build:"
          echo "${sensitive_names:-(none)}"
          sed -i -E "/$sensitive_pattern/d; /^VITE_GOOGLE_PICKER_(API_KEY|APP_ID)=/d" "$env_file"

      - name: Build and deploy to Vercel
        env:
          VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
          VITE_GOOGLE_PICKER_APP_ID: ${{ vars.VITE_GOOGLE_PICKER_APP_ID }}
        run: |
          npx --yes "vercel@$VERCEL_CLI_VERSION" build \
            --environment=mainline --token="$VERCEL_TOKEN"
          npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt \
            --environment=mainline --token="$VERCEL_TOKEN"
