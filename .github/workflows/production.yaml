name: CI/CD for Production

# Deploys `main` to production (https://app.avandarlabs.com and the
# production Supabase project) after lint, type-check, and the quick suite.
# The end-to-end suite runs alongside and reports its result, but does not
# block the deploy.
#
# Nothing touches production until the deploy job has confirmed it is running
# for the tip of `main`, checked the production configuration, and built the
# web app. Only then does it migrate the database, set the edge function
# secrets, deploy the edge functions, and finally deploy the prebuilt app.
#
# `main` changes only through `ava release` run on `develop`.
#
# There is deliberately no `tags:` trigger. The release pushes the branch and
# its tag together, so a tag trigger would start a second production run.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel a deploy halfway through a migration. Only the newest push
# waits for the running deploy: older pending runs are cancelled.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  # Pinned to 24.15.0: Node 24.16.0 causes `playwright install` to hang
  # indefinitely after the Chromium download completes (verified against the
  # last green run on 2026-05-18 vs. five consecutive 6h cancellations on
  # 24.16.0). Bump deliberately after re-verifying against this workflow.
  NODE_VERSION: 24.15.0
  # Matches the `supabase` devDependency in package.json. CLI 2.98.2 tried
  # import map entries in random order when bundling, so `@avandar/utils/sql`
  # resolved through `@avandar/utils` on some runs and edge functions failed
  # with "Module not found". 2.114.0 picks the longest matching entry.
  SUPABASE_CLI_VERSION: 2.114.0
  VERCEL_CLI_VERSION: 64.7.0
  PRODUCTION_APP_URL: https://app.avandarlabs.com

jobs:
  # Lint and TypeScript checks.
  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm type-check

  # Everything except end-to-end tests. Failure here will prevent db migration.
  test-quick:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    timeout-minutes: 20
    # Even though this is a production CI, we still use the staging env vars
    # to run tests.
    environment: staging
    env:
      POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_PICKER_APP_ID: ${{ vars.VITE_GOOGLE_PICKER_APP_ID }}
      UPSTASH_REDIS_API_URL: ${{ secrets.UPSTASH_REDIS_API_URL }}
      UPSTASH_REDIS_REST_API_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_API_TOKEN }}
      RESEND_SENDING_API_KEY: ${{ secrets.RESEND_SENDING_API_KEY }}
      RESEND_FULL_ACCESS_API_KEY: ${{ secrets.RESEND_FULL_ACCESS_API_KEY }}
      RESEND_LOCAL_TEST_SEGMENT_ID: ${{ secrets.RESEND_LOCAL_TEST_SEGMENT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
      FEATUREBASE_JWT_SECRET: ${{ secrets.FEATUREBASE_JWT_SECRET }}
      AVA_PIPELINE_SERVER_SECRET: ${{ secrets.AVA_PIPELINE_SERVER_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase start -x studio,imgproxy,mailpit,vector,logflare,supavisor
      - run: bash scripts/ci/prepare-envs/prepare-envs.sh
      - run: pnpm check:plugin-bundle
      - run: pnpm db:reset
      - run: nohup pnpm fns:serve > /tmp/supabase-functions.log 2>&1 &
      - run: bash scripts/ci/verify-supabase-api-is-running.sh
      - run: bash scripts/ci/verify-supabase-functions-are-serving.sh
      # No `playwright install` here: nothing in the quick suite drives a
      # browser, and the Chromium download is the single slowest setup step.
      - run: bash scripts/test-runners/run-all-tests.sh --quick
      - name: Upload Supabase functions log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-functions-log-production-quick-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/supabase-functions.log
          retention-days: 30
          if-no-files-found: warn

  # End-to-end tests. Intentionally NOT a dependency of `deploy`.
  # See `staging.yaml` for the explanation on the timeout threshold.
  test-e2e:
    # Pinned rather than `ubuntu-latest`: some runners now resolve that to
    # Ubuntu 26.04, where Playwright 1.59.1 cannot install Chromium and the
    # job fails before any test runs. Move this with the Playwright version.
    runs-on: ubuntu-24.04
    needs: lint-typecheck
    timeout-minutes: 70
    # Even though this is a production CI, we still use the staging env vars
    # to run tests.
    environment: staging
    env:
      POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_PICKER_APP_ID: ${{ vars.VITE_GOOGLE_PICKER_APP_ID }}
      UPSTASH_REDIS_API_URL: ${{ secrets.UPSTASH_REDIS_API_URL }}
      UPSTASH_REDIS_REST_API_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_API_TOKEN }}
      RESEND_SENDING_API_KEY: ${{ secrets.RESEND_SENDING_API_KEY }}
      RESEND_FULL_ACCESS_API_KEY: ${{ secrets.RESEND_FULL_ACCESS_API_KEY }}
      RESEND_LOCAL_TEST_SEGMENT_ID: ${{ secrets.RESEND_LOCAL_TEST_SEGMENT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
      FEATUREBASE_JWT_SECRET: ${{ secrets.FEATUREBASE_JWT_SECRET }}
      AVA_PIPELINE_SERVER_SECRET: ${{ secrets.AVA_PIPELINE_SERVER_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase start -x studio,imgproxy,mailpit,vector,logflare,supavisor
      - run: bash scripts/ci/prepare-envs/prepare-envs.sh
      - run: pnpm db:reset
      - run: nohup pnpm fns:serve > /tmp/supabase-functions.log 2>&1 &
      - run: bash scripts/ci/verify-supabase-api-is-running.sh
      - run: bash scripts/ci/verify-supabase-functions-are-serving.sh
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --no-third-party
      - name: Upload Supabase functions log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-functions-log-production-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/supabase-functions.log
          retention-days: 30
          if-no-files-found: warn
      - name: Upload Playwright report and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          retention-days: 30
          if-no-files-found: warn

  # Deploys to production. The first steps only read: the tip check, the
  # configuration check, and the Vercel pull and build. A failure in any of
  # them leaves production as it was. Then the job migrates the database,
  # sets the edge function secrets, deploys the edge functions, and deploys
  # the prebuilt app last.
  #
  # Production credentials are set on the steps that use them, never on the
  # job, so they do not reach the setup actions or unrelated scripts.
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test-quick
    timeout-minutes: 45
    environment: production

    steps:
      - uses: actions/checkout@v5

      # Re-running an older run would deploy an older commit over a newer
      # one. `actions/checkout` leaves the job token configured for `origin`.
      - name: Refuse anything but the tip of main
        run: |
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$tip" ]; then
            echo "Could not read the tip of main from origin." >&2
            exit 1
          fi
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "main is at $tip, this run is for $GITHUB_SHA. Re-run the newest main run." >&2
            exit 1
          fi

      # Every value comes from the `production` GitHub environment. An empty
      # value would otherwise blank a production edge function secret or
      # point the build at nothing, after the migrations had already run.
      - name: Check the production configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PRODUCTION_SB_SECRET_KEY: ${{ secrets.PRODUCTION_SB_SECRET_KEY }}
          PRODUCTION_SB_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SB_PUBLISHABLE_KEY }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          UPSTASH_REDIS_API_URL: ${{ secrets.UPSTASH_REDIS_API_URL }}
          UPSTASH_REDIS_REST_API_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_API_TOKEN }}
          RESEND_SENDING_API_KEY: ${{ secrets.RESEND_SENDING_API_KEY }}
          RESEND_FULL_ACCESS_API_KEY: ${{ secrets.RESEND_FULL_ACCESS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          FEATUREBASE_JWT_SECRET: ${{ secrets.FEATUREBASE_JWT_SECRET }}
          AVA_PIPELINE_SERVER_SECRET: ${{ secrets.AVA_PIPELINE_SERVER_SECRET }}
          AVA_PIPELINE_SERVER_URL: ${{ secrets.AVA_PIPELINE_SERVER_URL }}
          VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
          VITE_GOOGLE_PICKER_APP_ID: ${{ vars.VITE_GOOGLE_PICKER_APP_ID }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          required_names=(
            SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
            VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID
            PRODUCTION_SB_SECRET_KEY PRODUCTION_SB_PUBLISHABLE_KEY
            PRODUCTION_SUPABASE_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
            POLAR_ACCESS_TOKEN UPSTASH_REDIS_API_URL
            UPSTASH_REDIS_REST_API_TOKEN RESEND_SENDING_API_KEY
            RESEND_FULL_ACCESS_API_KEY OPENAI_API_KEY OPEN_ROUTER_API_KEY
            FEATUREBASE_JWT_SECRET AVA_PIPELINE_SERVER_SECRET
            AVA_PIPELINE_SERVER_URL VITE_GOOGLE_PICKER_API_KEY
            VITE_GOOGLE_PICKER_APP_ID
          )
          # Values written to the edge function secrets file. Each is single
          # quoted there, so none may contain a single quote or a line break.
          secrets_file_names=(
            PRODUCTION_SB_SECRET_KEY PRODUCTION_SB_PUBLISHABLE_KEY
            PRODUCTION_SUPABASE_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
            POLAR_ACCESS_TOKEN UPSTASH_REDIS_API_URL
            UPSTASH_REDIS_REST_API_TOKEN RESEND_SENDING_API_KEY
            RESEND_FULL_ACCESS_API_KEY OPENAI_API_KEY OPEN_ROUTER_API_KEY
            FEATUREBASE_JWT_SECRET AVA_PIPELINE_SERVER_SECRET
            AVA_PIPELINE_SERVER_URL GEOAPIFY_API_KEY
          )
          has_problem=false
          for name in "${required_names[@]}"; do
            if [ -z "${!name}" ]; then
              echo "$name is empty in the production environment." >&2
              has_problem=true
            fi
          done
          # A pasted value often picks up stray whitespace or a Windows line
          # ending, which would reach production as part of the value.
          for name in "${required_names[@]}" GEOAPIFY_API_KEY; do
            value="${!name}"
            if [ -n "$value" ] && [[ "$value" =~ ^[[:space:]]*$ ]]; then
              echo "$name is only whitespace." >&2
              has_problem=true
            elif [[ "$value" =~ ^[[:space:]] || "$value" =~ [[:space:]]$ ]]; then
              echo "$name has leading or trailing whitespace." >&2
              has_problem=true
            fi
            if [[ "$value" == *$'\r'* ]]; then
              echo "$name contains a carriage return." >&2
              has_problem=true
            fi
          done
          for name in "${secrets_file_names[@]}"; do
            if [[ "${!name}" == *"'"* || "${!name}" == *$'\n'* ]]; then
              echo "$name contains a single quote or a line break." >&2
              has_problem=true
            fi
          done
          if [ -n "$SUPABASE_PROJECT_ID" ] &&
            [ "$PRODUCTION_SUPABASE_URL" != "https://$SUPABASE_PROJECT_ID.supabase.co" ]; then
            echo "PRODUCTION_SUPABASE_URL must be https://<PRODUCTION_PROJECT_ID>.supabase.co." >&2
            has_problem=true
          fi
          if [ -n "$PRODUCTION_SB_PUBLISHABLE_KEY" ] &&
            [[ ! "$PRODUCTION_SB_PUBLISHABLE_KEY" =~ ^sb_publishable_[A-Za-z0-9_-]+$ ]]; then
            echo "PRODUCTION_SB_PUBLISHABLE_KEY must be the publishable key (sb_publishable_...)." >&2
            has_problem=true
          fi
          if [ -n "$PRODUCTION_SB_SECRET_KEY" ] &&
            [[ ! "$PRODUCTION_SB_SECRET_KEY" =~ ^sb_secret_[A-Za-z0-9_-]+$ ]]; then
            echo "PRODUCTION_SB_SECRET_KEY must be an unmasked secret key (sb_secret_...)." >&2
            has_problem=true
          fi
          # `vercel deploy` looks the team up by this ID and only accepts a
          # Team ID. `vercel pull` skips that lookup, so check it here rather
          # than after a full build.
          if [ -n "$VERCEL_ORG_ID" ] &&
            [[ ! "$VERCEL_ORG_ID" =~ ^team_[A-Za-z0-9]+$ ]]; then
            echo "VERCEL_ORG_ID must be the avandar team's Team ID (team_...), with no spaces or quotes." >&2
            has_problem=true
          fi
          if [ "$has_problem" = true ]; then
            exit 1
          fi
          echo "The production configuration is complete."

      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Pull the Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes \
            --environment=production --token="$VERCEL_TOKEN"
          env_file=".vercel/.env.production.local"
          # The build sets these three from GitHub below, so a value set in
          # Vercel never reaches the production build.
          sed -i -E '/^(VITE_SUPABASE_API_URL|VITE_SUPABASE_ANON_KEY|VITE_APP_URL)=/d' "$env_file"
          # Vercel never sends Sensitive values to `vercel pull`, only a
          # "[SENSITIVE]" placeholder, which the build would bake into the
          # app. Drop them. The Google Picker values come from GitHub instead.
          sensitive_pattern='^[A-Z0-9_]+="?\[SENSITIVE\]"?$'
          sensitive_names="$(grep -E "$sensitive_pattern" "$env_file" | cut -d= -f1 || true)"
          echo "Sensitive Vercel variables left out of the build:"
          echo "${sensitive_names:-(none)}"
          sed -i -E "/$sensitive_pattern/d; /^VITE_GOOGLE_PICKER_(API_KEY|APP_ID)=/d" "$env_file"

      # Built before anything touches production, so a failed build leaves
      # production as it was. The build only embeds these public values and
      # never connects to the production database.
      - name: Build the web app for Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SUPABASE_API_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.PRODUCTION_SB_PUBLISHABLE_KEY }}
          VITE_APP_URL: ${{ env.PRODUCTION_APP_URL }}
          VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
          VITE_GOOGLE_PICKER_APP_ID: ${{ vars.VITE_GOOGLE_PICKER_APP_ID }}
        run: |
          npx --yes "vercel@$VERCEL_CLI_VERSION" build --prod \
            --token="$VERCEL_TOKEN"

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --include-all

      - name: Set edge function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
          PRODUCTION_SB_SECRET_KEY: ${{ secrets.PRODUCTION_SB_SECRET_KEY }}
          PRODUCTION_SB_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SB_PUBLISHABLE_KEY }}
          PRODUCTION_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          UPSTASH_REDIS_API_URL: ${{ secrets.UPSTASH_REDIS_API_URL }}
          UPSTASH_REDIS_REST_API_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_API_TOKEN }}
          RESEND_SENDING_API_KEY: ${{ secrets.RESEND_SENDING_API_KEY }}
          RESEND_FULL_ACCESS_API_KEY: ${{ secrets.RESEND_FULL_ACCESS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          FEATUREBASE_JWT_SECRET: ${{ secrets.FEATUREBASE_JWT_SECRET }}
          AVA_PIPELINE_SERVER_SECRET: ${{ secrets.AVA_PIPELINE_SERVER_SECRET }}
          AVA_PIPELINE_SERVER_URL: ${{ secrets.AVA_PIPELINE_SERVER_URL }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          secrets_file="$RUNNER_TEMP/production-functions.env"
          trap 'rm -f "$secrets_file"' EXIT
          # The CLI parses this file with `dotenv`, which ends an unquoted
          # value at its first `#`. Single quotes keep every value literal.
          # The configuration check refused values with a single quote or a
          # line break, and this refuses them again in case that check moves.
          write_secret() {
            if [[ "$2" == *"'"* || "$2" == *$'\n'* || "$2" == *$'\r'* ]]; then
              echo "$1 contains a single quote or a line break." >&2
              exit 1
            fi
            printf "%s='%s'\n" "$1" "$2"
          }
          {
            write_secret SB_SECRET_KEY "$PRODUCTION_SB_SECRET_KEY"
            write_secret SB_PUBLISHABLE_KEY "$PRODUCTION_SB_PUBLISHABLE_KEY"
            write_secret MODE production
            write_secret VITE_APP_URL "$PRODUCTION_APP_URL"
            write_secret GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
            write_secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
            write_secret GOOGLE_REDIRECT_URI \
              "$PRODUCTION_SUPABASE_URL/functions/v1/google-auth-callback"
            write_secret POLAR_ACCESS_TOKEN "$POLAR_ACCESS_TOKEN"
            write_secret POLAR_SERVER_TYPE production
            write_secret UPSTASH_REDIS_API_URL "$UPSTASH_REDIS_API_URL"
            write_secret UPSTASH_REDIS_REST_API_TOKEN \
              "$UPSTASH_REDIS_REST_API_TOKEN"
            write_secret RESEND_SENDING_API_KEY "$RESEND_SENDING_API_KEY"
            write_secret RESEND_FULL_ACCESS_API_KEY "$RESEND_FULL_ACCESS_API_KEY"
            write_secret RESEND_SITE_IMG_URL https://avandarlabs.com
            write_secret OPENAI_API_KEY "$OPENAI_API_KEY"
            write_secret OPEN_ROUTER_API_KEY "$OPEN_ROUTER_API_KEY"
            write_secret FEATUREBASE_JWT_SECRET "$FEATUREBASE_JWT_SECRET"
            write_secret AVA_PIPELINE_SERVER_SECRET "$AVA_PIPELINE_SERVER_SECRET"
            write_secret AVA_PIPELINE_SERVER_URL "$AVA_PIPELINE_SERVER_URL"
            # Only when the GitHub secret exists: an empty value would
            # overwrite a key set directly on the production project.
            if [ -n "$GEOAPIFY_API_KEY" ]; then
              write_secret GEOAPIFY_API_KEY "$GEOAPIFY_API_KEY"
            fi
          } > "$secrets_file"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" \
            --env-file "$secrets_file"

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy the prebuilt web app to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod \
            --token="$VERCEL_TOKEN"
