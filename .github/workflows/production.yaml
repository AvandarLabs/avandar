name: CI/CD for Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: 24

jobs:
  # Run ESLint checks
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Run TypeScript checks
  typescript:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  # Run tests
  test:
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - run: supabase start -x studio,imgproxy,mailpit,vector,logflare,supavisor
      - run: bash scripts/ci/prepare-env-github.sh
      - run: bash scripts/ci/prepare-env-development.sh
      - run: bash scripts/ci/prepare-env-edge.sh
      - run: pnpm db:reset
      - run: nohup pnpm fns:serve > /tmp/supabase-functions.log 2>&1 &
      - run: bash scripts/ci/verify-supabase-api-is-running.sh
      - run: bash scripts/ci/verify-supabase-functions-are-serving.sh
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Upload Playwright report and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          retention-days: 30
          if-no-files-found: warn

  # Migrate Supabase Production database
  migrate:
    runs-on: ubuntu-latest
    needs: test

    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - run: supabase link --project-ref $SUPABASE_PROJECT_ID
      - run: supabase db push
      - run: supabase functions deploy
