name: CI/CD for alpha-dev

# Deploys `alpha-dev` to https://alpha.avandarlabs.com on the persistent
# `alpha-dev` branch of the staging Supabase project, after lint, type-check,
# and the quick suite pass. The end-to-end suite runs alongside and reports its
# result, but does not block the deploy.
#
# Secrets are read from the `staging` GitHub environment so alpha-dev reuses
# the staging edge function keys instead of keeping a second copy.
#
# `ava release` checks the newest run of this workflow for the tip of
# `alpha-dev`. Only a completed `success` counts as green, so a failing
# `test-e2e` blocks the release even though it does not block the deploy.

on:
  push:
    branches:
      - alpha-dev
  workflow_dispatch:

# Never cancel a deploy halfway through a migration. Only the newest push
# waits for the running deploy: older pending runs are cancelled.
concurrency:
  group: alpha-dev-deploy
  cancel-in-progress: false

env:
  # Pinned to 24.15.0: Node 24.16.0 causes `playwright install` to hang
  # indefinitely after the Chromium download completes (verified against the
  # last green run on 2026-05-18 vs. five consecutive 6h cancellations on
  # 24.16.0). Bump deliberately after re-verifying against this workflow.
  NODE_VERSION: 24.15.0
  # Matches the `supabase` devDependency in package.json. CLI 2.98.2 tried
  # import map entries in random order when bundling, so `@avandar/utils/sql`
  # resolved through `@avandar/utils` on some runs and edge functions failed
  # with "Module not found". 2.114.0 picks the longest matching entry.
  SUPABASE_CLI_VERSION: 2.114.0
  VERCEL_CLI_VERSION: 64.7.0
  ALPHA_DEV_APP_URL: https://alpha.avandarlabs.com
  VERCEL_ENVIRONMENT: alpha-dev

jobs:
  # ESLint and TypeScript checks.
  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm type-check

  # Everything except end-to-end tests. Failure here will prevent db migration.
  test-quick:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    timeout-minutes: 20
    environment: staging
    env:
      POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_PICKER_APP_ID: ${{ vars.VITE_GOOGLE_PICKER_APP_ID }}
      UPSTASH_REDIS_API_URL: ${{ secrets.UPSTASH_REDIS_API_URL }}
      UPSTASH_REDIS_REST_API_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_API_TOKEN }}
      RESEND_SENDING_API_KEY: ${{ secrets.RESEND_SENDING_API_KEY }}
      RESEND_FULL_ACCESS_API_KEY: ${{ secrets.RESEND_FULL_ACCESS_API_KEY }}
      RESEND_LOCAL_TEST_SEGMENT_ID: ${{ secrets.RESEND_LOCAL_TEST_SEGMENT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
      FEATUREBASE_JWT_SECRET: ${{ secrets.FEATUREBASE_JWT_SECRET }}
      AVA_PIPELINE_SERVER_SECRET: ${{ secrets.AVA_PIPELINE_SERVER_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - run: supabase start -x studio,imgproxy,mailpit,vector,logflare,supavisor
      - run: bash scripts/ci/prepare-envs/prepare-envs.sh
      - run: pnpm db:reset
      - run: nohup pnpm fns:serve > /tmp/supabase-functions.log 2>&1 &
      - run: bash scripts/ci/verify-supabase-api-is-running.sh
      - run: bash scripts/ci/verify-supabase-functions-are-serving.sh
      # No `playwright install` here: nothing in the quick suite drives a
      # browser, and the Chromium download is the single slowest setup step.
      - run: bash scripts/test-runners/run-all-tests.sh --quick
      - name: Upload Supabase functions log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-functions-log-alpha-dev-quick-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/supabase-functions.log
          retention-days: 30
          if-no-files-found: warn

  # End-to-end tests. Intentionally NOT a dependency for `deploy`.
  # Timeout set to 70 minutes because the suite is large and runs on a single
  # worker.
  test-e2e:
    # Pinned rather than `ubuntu-latest`: some runners now resolve that to
    # Ubuntu 26.04, where Playwright 1.59.1 cannot install Chromium and the
    # job fails before any test runs. Move this with the Playwright version.
    runs-on: ubuntu-24.04
    needs: lint-typecheck
    timeout-minutes: 70
    environment: staging
    env:
      POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
      VITE_GOOGLE_PICKER_APP_ID: ${{ vars.VITE_GOOGLE_PICKER_APP_ID }}
      UPSTASH_REDIS_API_URL: ${{ secrets.UPSTASH_REDIS_API_URL }}
      UPSTASH_REDIS_REST_API_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_API_TOKEN }}
      RESEND_SENDING_API_KEY: ${{ secrets.RESEND_SENDING_API_KEY }}
      RESEND_FULL_ACCESS_API_KEY: ${{ secrets.RESEND_FULL_ACCESS_API_KEY }}
      RESEND_LOCAL_TEST_SEGMENT_ID: ${{ secrets.RESEND_LOCAL_TEST_SEGMENT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
      FEATUREBASE_JWT_SECRET: ${{ secrets.FEATUREBASE_JWT_SECRET }}
      AVA_PIPELINE_SERVER_SECRET: ${{ secrets.AVA_PIPELINE_SERVER_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - run: supabase start -x studio,imgproxy,mailpit,vector,logflare,supavisor
      - run: bash scripts/ci/prepare-envs/prepare-envs.sh
      - run: pnpm db:reset
      - run: nohup pnpm fns:serve > /tmp/supabase-functions.log 2>&1 &
      - run: bash scripts/ci/verify-supabase-api-is-running.sh
      - run: bash scripts/ci/verify-supabase-functions-are-serving.sh
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --no-third-party
      - name: Upload Supabase functions log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-functions-log-alpha-dev-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/supabase-functions.log
          retention-days: 30
          if-no-files-found: warn
      - name: Upload Playwright report and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-alpha-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          retention-days: 30
          if-no-files-found: warn

  deploy:
    runs-on: ubuntu-latest
    needs: test-quick
    timeout-minutes: 45
    # Reads the staging secrets without recording a deployment to staging,
    # since this job deploys alpha-dev.
    environment:
      name: staging
      deployment: false
    # SUPABASE_ACCESS_TOKEN is set per step, only where the Supabase CLI or
    # Management API needs it: it can read back the branch's secret key and
    # database password, so the Vercel CLI steps must never see it.
    env:
      STAGING_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: true
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Ensure the alpha-dev Supabase branch exists
        id: supabase_branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # The script masks the database password, publishable key, and
          # secret key before writing them to a temporary file. The branch
          # name, ref, URL, and publishable key go from it to $GITHUB_ENV, so
          # every later step can read them. The database password and secret
          # key go only to this step's outputs, which only "Apply migrations"
          # and "Set edge function secrets" read.
          branch_env_file="$RUNNER_TEMP/alpha-dev-branch.env"
          trap 'rm -f "$branch_env_file"' EXIT
          ALPHA_DEV_ENV_FILE="$branch_env_file" \
            bash scripts/alpha-dev/ensureSupabaseBranch.sh "$GITHUB_REF_NAME"
          while IFS= read -r line; do
            name="${line%%=*}"
            value="${line#*=}"
            case "$name" in
              ALPHA_DEV_DB_PASSWORD) echo "db_password=$value" >> "$GITHUB_OUTPUT" ;;
              ALPHA_DEV_SECRET_KEY) echo "secret_key=$value" >> "$GITHUB_OUTPUT" ;;
              ALPHA_DEV_SUPABASE_BRANCH | ALPHA_DEV_SUPABASE_REF | \
                ALPHA_DEV_SUPABASE_URL | ALPHA_DEV_PUBLISHABLE_KEY)
                echo "$line" >> "$GITHUB_ENV"
                ;;
              # Fails closed: a new value is never shared job-wide by default.
              *)
                echo "Unexpected value from ensureSupabaseBranch.sh: $name" >&2
                exit 1
                ;;
            esac
          done < "$branch_env_file"
          # A missing value would otherwise surface later as an empty
          # project ref or password. Name the key, never its value.
          for required_name in ALPHA_DEV_SUPABASE_BRANCH ALPHA_DEV_SUPABASE_REF \
            ALPHA_DEV_SUPABASE_URL ALPHA_DEV_PUBLISHABLE_KEY \
            ALPHA_DEV_DB_PASSWORD ALPHA_DEV_SECRET_KEY; do
            if ! grep -q "^$required_name=." "$branch_env_file"; then
              echo "ensureSupabaseBranch.sh did not provide $required_name." >&2
              exit 1
            fi
          done

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ steps.supabase_branch.outputs.db_password }}
        run: |
          supabase link --project-ref "$ALPHA_DEV_SUPABASE_REF"
          supabase db push --include-all

      - name: Set edge function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALPHA_DEV_SECRET_KEY: ${{ steps.supabase_branch.outputs.secret_key }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          UPSTASH_REDIS_API_URL: ${{ secrets.UPSTASH_REDIS_API_URL }}
          UPSTASH_REDIS_REST_API_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_API_TOKEN }}
          RESEND_SENDING_API_KEY: ${{ secrets.RESEND_SENDING_API_KEY }}
          RESEND_FULL_ACCESS_API_KEY: ${{ secrets.RESEND_FULL_ACCESS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          FEATUREBASE_JWT_SECRET: ${{ secrets.FEATUREBASE_JWT_SECRET }}
          AVA_PIPELINE_SERVER_SECRET: ${{ secrets.AVA_PIPELINE_SERVER_SECRET }}
          AVA_PIPELINE_SERVER_URL: ${{ vars.AVA_PIPELINE_SERVER_URL }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          secrets_file="$RUNNER_TEMP/alpha-dev-functions.env"
          trap 'rm -f "$secrets_file"' EXIT
          # The CLI parses this file with `dotenv`, which ends an unquoted
          # value at its first `#`. Single quotes keep every value literal,
          # so a value with a single quote or a line break is refused.
          write_secret() {
            if [[ "$2" == *"'"* || "$2" == *$'\n'* || "$2" == *$'\r'* ]]; then
              echo "$1 contains a single quote or a line break." >&2
              exit 1
            fi
            printf "%s='%s'\n" "$1" "$2"
          }
          {
            write_secret SB_SECRET_KEY "$ALPHA_DEV_SECRET_KEY"
            write_secret SB_PUBLISHABLE_KEY "$ALPHA_DEV_PUBLISHABLE_KEY"
            write_secret MODE staging
            write_secret VITE_APP_URL "$ALPHA_DEV_APP_URL"
            write_secret GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
            write_secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
            write_secret GOOGLE_REDIRECT_URI \
              "$ALPHA_DEV_SUPABASE_URL/functions/v1/google-auth-callback"
            write_secret POLAR_ACCESS_TOKEN "$POLAR_ACCESS_TOKEN"
            write_secret POLAR_SERVER_TYPE sandbox
            write_secret UPSTASH_REDIS_API_URL "$UPSTASH_REDIS_API_URL"
            write_secret UPSTASH_REDIS_REST_API_TOKEN \
              "$UPSTASH_REDIS_REST_API_TOKEN"
            write_secret RESEND_SENDING_API_KEY "$RESEND_SENDING_API_KEY"
            write_secret RESEND_FULL_ACCESS_API_KEY "$RESEND_FULL_ACCESS_API_KEY"
            write_secret RESEND_SITE_IMG_URL https://avandarlabs.com
            write_secret OPENAI_API_KEY "$OPENAI_API_KEY"
            write_secret OPEN_ROUTER_API_KEY "$OPEN_ROUTER_API_KEY"
            write_secret FEATUREBASE_JWT_SECRET "$FEATUREBASE_JWT_SECRET"
            write_secret AVA_PIPELINE_SERVER_SECRET "$AVA_PIPELINE_SERVER_SECRET"
            write_secret AVA_PIPELINE_SERVER_URL "$AVA_PIPELINE_SERVER_URL"
            # Only when the GitHub secret exists: an empty value would
            # overwrite a key set directly on the alpha-dev project.
            if [ -n "$GEOAPIFY_API_KEY" ]; then
              write_secret GEOAPIFY_API_KEY "$GEOAPIFY_API_KEY"
            fi
          } > "$secrets_file"
          supabase secrets set --project-ref "$ALPHA_DEV_SUPABASE_REF" \
            --env-file "$secrets_file"

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "$ALPHA_DEV_SUPABASE_REF"

      - name: Point Supabase Auth at the alpha-dev domain
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            "https://api.supabase.com/v1/projects/$ALPHA_DEV_SUPABASE_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"site_url\": \"$ALPHA_DEV_APP_URL\", \"uri_allow_list\": \"$ALPHA_DEV_APP_URL/**\"}" \
            > /dev/null

      - name: Pull the Vercel alpha-dev environment
        run: |
          # `vercel deploy` looks the team up by this ID and only accepts a
          # Team ID. `vercel pull` skips that lookup, so check it here rather
          # than after a full build.
          if [[ ! "$VERCEL_ORG_ID" =~ ^team_[A-Za-z0-9]+$ ]]; then
            echo "VERCEL_ORG_ID must be the avandar team's Team ID (team_...), with no spaces or quotes." >&2
            exit 1
          fi
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes \
            --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"
          env_file=".vercel/.env.$VERCEL_ENVIRONMENT.local"
          # These three come from the alpha-dev Supabase branch below. A value
          # set in Vercel would point the build at the wrong database.
          if grep -qE '^(VITE_SUPABASE_API_URL|VITE_SUPABASE_ANON_KEY|VITE_APP_URL)=' "$env_file"; then
            echo "Remove VITE_SUPABASE_API_URL, VITE_SUPABASE_ANON_KEY and VITE_APP_URL from the Vercel '$VERCEL_ENVIRONMENT' environment." >&2
            exit 1
          fi
          # Vercel never sends Sensitive values to `vercel pull`, only a
          # "[SENSITIVE]" placeholder, which the build would bake into the
          # app. Drop them. The Google Picker values come from GitHub instead.
          sensitive_pattern='^[A-Z0-9_]+="?\[SENSITIVE\]"?$'
          sensitive_names="$(grep -E "$sensitive_pattern" "$env_file" | cut -d= -f1 || true)"
          echo "Sensitive Vercel variables left out of the build:"
          echo "${sensitive_names:-(none)}"
          sed -i -E "/$sensitive_pattern/d; /^VITE_GOOGLE_PICKER_(API_KEY|APP_ID)=/d" "$env_file"

      - name: Build and deploy to Vercel
        env:
          VITE_SUPABASE_API_URL: ${{ env.ALPHA_DEV_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.ALPHA_DEV_PUBLISHABLE_KEY }}
          VITE_APP_URL: ${{ env.ALPHA_DEV_APP_URL }}
          VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
          VITE_GOOGLE_PICKER_APP_ID: ${{ vars.VITE_GOOGLE_PICKER_APP_ID }}
        run: |
          npx --yes "vercel@$VERCEL_CLI_VERSION" build \
            --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"
          npx --yes "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt \
            --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"
