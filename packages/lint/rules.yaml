version: 1
languages:
  - typescript
  - javascript
  - python
  - rust
  - go
  - ruby
  - java
  - kotlin
  - swift
  - c
  - cpp
  - csharp
  - sql
  - css
  - shell
  - yaml
  - jsonc
  - json
rules:
  - id: avlint-ts-001
    slug: curly
    title: Braces around every `if` body
    scope: TS/JS
    applicability:
      - typescript
      - javascript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: Native `curly`; add braces
  - id: avlint-ts-002
    slug: prefer-template
    title: Template interpolation instead of concatenation
    scope: TS/JS
    applicability:
      - typescript
      - javascript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: Native prefer-template changes object coercion and has no operand restriction; disabled and remains fallback
  - id: avlint-ts-003
    slug: consistent-type-imports
    title: "`type` on type-only imports and exports"
    scope: TS
    applicability:
      - typescript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: Native type imports and type-aware exports; import() annotations remain unchanged
  - id: avlint-ts-004
    slug: prefer-as-const
    title: "`as const` for eligible literals"
    scope: TS
    applicability:
      - typescript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: Native `typescript/prefer-as-const`
  - id: avlint-ts-005
    slug: no-unnecessary-type-assertion
    title: Remove unnecessary type assertions
    scope: TS
    applicability:
      - typescript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: Native assertion fixer breaks TS5.9 generic CRUD contracts; disabled and remains fallback
  - id: avlint-common-001
    slug: no-function-body-doc-comments
    title: Ordinary comments inside function bodies
    scope: Generic C-like syntax
    applicability:
      - typescript
      - javascript
      - rust
      - go
      - java
      - kotlin
      - swift
      - c
      - cpp
      - csharp
    repair: safe
    phases:
      - 3
      - 6
    owner: lint
    boundary: TS/JS standalone body prose only; preserve nested declarations, inline comments and directives; unsupported shapes remain fallback
  - id: avlint-common-002
    slug: single-line-doc-comment
    title: Single-line short docstring
    scope: Generic docstrings
    applicability:
      - typescript
      - javascript
      - python
      - rust
      - go
      - ruby
      - java
      - kotlin
      - swift
      - c
      - cpp
      - csharp
      - sql
    repair: safe
    phases:
      - 3
      - 6
    owner: lint
    boundary: TS/JS plain tag-free starred JSDoc only; full line including indentation fits 80; preserve paragraphs and markup; other shapes remain fallback
  - id: avlint-ts-006
    slug: top-level-function-declaration
    title: Top-level function declarations
    scope: TS/JS
    applicability:
      - typescript
      - javascript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: Module-only unique private direct calls after declaration in the same activation; ordinary function expressions or block arrows excluding single-return blocks; refuse exports, recursion, escapes, lexical bindings, comments and competing repairs; unsupported shapes remain fallback
  - id: avlint-ts-007
    slug: nested-arrow-function
    title: Nested arrow functions
    scope: TS/JS
    applicability:
      - typescript
      - javascript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: Module-only unique nested declarations called directly after initialization in the same function body; refuse recursion, overloads, escapes, lexical bindings, nested functions, comments and competing repairs; unsupported shapes remain fallback
  - id: avlint-ts-008
    slug: private-helper-prefix
    title: "`_` prefix on private top-level helpers"
    scope: TS/JS
    applicability:
      - typescript
      - javascript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: Module-only unique private helpers called exclusively by the immediately adjacent exported function; reject scope and unresolved-name collisions, exports, escapes, string contracts, nested functions, comments and competing repairs; unsupported shapes remain fallback
  - id: avlint-ts-009
    slug: module-member-jsdoc
    title: Existing JSDoc on an exported module key
    scope: TS
    applicability:
      - typescript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: TS direct untyped exported object only; one local declaration reference and static key; no intervening comments or owning interface; other shapes remain fallback
  - id: avlint-ts-010
    slug: component-props-name
    title: Component props type named `Props`
    scope: TSX
    applicability:
      - typescript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: TSX adjacent private object alias after a module marker with one JSX owner and parameter reference; no exports, collisions, comments, arrays or intervening repairs; other shapes remain fallback
  - id: avlint-ts-011
    slug: jsx-conditional-ternary
    title: JSX conditional rendering uses a ternary
    scope: JSX/TSX
    applicability:
      - typescript
      - javascript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: Boolean comparison or negation in declaration-owned JSX children with an attribute-free self-closing element; exact false arm preserves child values; other shapes remain fallback
  - id: avlint-ts-012
    slug: prefer-prop-callback
    title: Exact `prop` and `propEq` callbacks
    scope: TS/JS with `@avandar/utils`
    applicability:
      - typescript
      - javascript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: Anonymous ordinary callbacks on literal plain-data arrays with dot-free identifier keys and non-null literal strict equality; existing leading runtime utils imports, capture-safe helper bindings and isolated import edits; other shapes remain fallback
  - id: avlint-ts-013
    slug: straight-line-object
    title: Straight-line object construction
    scope: TS/JS
    applicability:
      - typescript
      - javascript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: Unannotated fresh local data objects with consecutive primitive writes, folded into one returned literal that replaces the declaration; existing own keys or explicit null prototype, scope-proved no escape; annotated bindings and other shapes remain fallback
  - id: avlint-ts-014
    slug: optional-array-candidates
    title: Straight-line optional array candidates
    scope: TS/JS
    applicability:
      - typescript
      - javascript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: TS/TSX explicitly typed primitive or literal arrays excluding undefined, consecutive multiline parameter guards, replaced by a ternary for one candidate or a filtered literal for several; several candidates need an existing resolved isDefined; a declared return type or exactly matching candidate types, unshadowed Array binding and ordinary Array intrinsics; JS, evolving arrays, missing helpers and other shapes remain fallback
  - id: avlint-ts-015
    slug: no-redundant-error-guard
    title: Redundant `instanceof Error` guard
    scope: TS
    applicability:
      - typescript
    repair: safe
    phases:
      - 5
    owner: lint
    boundary: Type information proves the value and branches equivalent
  - id: avlint-ts-016
    slug: import-extensions
    title: File-extension convention
    scope: TS/JS
    applicability:
      - typescript
      - javascript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: Native import/extensions detects resolvable targets but has no safe fixer in Oxlint 1.93.0; repair remains fallback
  - id: avlint-css-001
    slug: css-block-comment
    title: Canonical CSS block comment shape
    scope: CSS
    applicability:
      - css
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: Standalone ordinary CSS prose comment nodes within 80 columns; delimiters and leading markers only; preserve documentation, directives, maps, legal notices, hacks and ambiguous syntax; unsupported shapes remain fallback
  - id: avlint-sql-001
    slug: sql-comment-markers
    title: SQL declaration and body comment markers
    scope: SQL
    applicability:
      - sql
    repair: safe
    phases:
      - 5
    owner: lint
    boundary: SQL parser proves declaration ownership or statement body
  - id: avlint-ts-017
    slug: error-class-suffix
    title: Error subclass names end in `Error`
    scope: TS/JS
    applicability:
      - typescript
      - javascript
    repair: safe
    phases:
      - 3
    owner: lint
    boundary: Reports any class extending `Error` or a class named `*Error` without the suffix; renames module-private class declarations whose references all stay in the file; exported classes, string contracts, reflective names and collisions are reported without a fix
  - id: avlint-common-003
    slug: no-em-dashes
    title: No em dashes
    scope: Generic comments
    applicability:
      - typescript
      - javascript
      - python
      - rust
      - go
      - ruby
      - java
      - kotlin
      - swift
      - c
      - cpp
      - csharp
      - sql
      - css
      - shell
      - yaml
      - jsonc
    repair: guided
    phases:
      - 4
      - 6
    owner: lint
    boundary: Comment token contains U+2014
  - id: avlint-common-004
    slug: lines-stay-within-80-columns
    title: Lines stay within 80 columns
    scope: Generic comments/docstrings
    applicability:
      - typescript
      - javascript
      - python
      - rust
      - go
      - ruby
      - java
      - kotlin
      - swift
      - c
      - cpp
      - csharp
      - sql
      - css
      - shell
      - yaml
      - jsonc
    repair: guided
    phases:
      - 4
      - 6
    owner: lint
    boundary: Comment or docstring token exceeds the configured width
  - id: avlint-common-005
    slug: public-exported-values-have-documentation
    title: Public/exported values have documentation
    scope: Generic public APIs
    applicability: &a1
      - typescript
