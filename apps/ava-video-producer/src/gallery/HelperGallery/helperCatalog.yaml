# The Motion Atlas helper catalog. Validated by parseHelperCatalog and kept in
# step with the source by helperCatalogDrift.test.ts: every runtime export of
# a listed module is either catalogued below or excluded with a reason.
# After editing copy, run `npm run gallery:messages` to regenerate the
# translation descriptors.

categories:
  - id: curves
    title: "Curves and durations"
    description: "Easing curves, the duration scale and stagger tokens every helper builds on."
  - id: interpolation
    title: "Interpolation"
    description: "Turn a frame into progress, a number, a colour or a count."
  - id: entrances
    title: "Entrances and exits"
    description: "Elements arriving, leaving, landing in place and answering a press."
  - id: text
    title: "Text reveals"
    description: "Lines, headings and typed text arriving and leaving."
  - id: masks
    title: "Masks and wipes"
    description: "Clip paths and masks that reveal or erase a layer."
  - id: blur
    title: "Blur"
    description: "Motion blur for layers that travel."
  - id: camera
    title: "Camera"
    description: "Pan and zoom routes over diagrams and windows."
  - id: windows
    title: "Windows"
    description: "The tilted 3D window: its plane, its boxes and its moves."
  - id: media
    title: "Media"
    description: "Stills and footage sampled at an explicit frame."
  - id: transitions
    title: "Transitions"
    description: "How one shot or scene hands over to the next."
  - id: continuity
    title: "Continuity"
    description: "One object kept recognizable while it moves between layouts."
  - id: theme
    title: "Theme"
    description: "Colour tokens applied to a whole film or a single shot."
  - id: pointer
    title: "Pointer"
    description: "The drawn cursor: travel, shape, press and shutter."
  - id: loops
    title: "Loops"
    description: "Periodic motion that returns exactly to where it started."
  - id: builds
    title: "Scene builds"
    description: "Timing helpers behind the brand lockup and bar comparison scenes."

modules:
  - path: src/motion.ts
    exhaustiveMembers: [EASE, DUR]
    excluded: []
  - path: src/motion-components/motionSettings.ts
    excluded:
      - name: motionOptionsSchema
        reason: "Validation schema for the options the motion presets resolve, not motion."
      - name: motionEasingSchema
        reason: "Validation schema for named and cubic Bezier easings, not motion."
  - path: src/cursor-motion.ts
    excluded: []
  - path: src/scenes/textReveal.ts
    excluded:
      - name: getTypographyRevealFrames
        reason: "TypographyScene's own icon-then-lines start frames; not a general helper."
  - path: src/motion-components/eraseMask.ts
    excluded: []
  - path: src/motion-components/HorizontalBlur.tsx
    excluded: []
  - path: src/motion-components/cameraTrack.ts
    excluded: []
  - path: src/motion-components/DiagramCamera.tsx
    excluded: []
  - path: src/scenes/MediaPlane.tsx
    excluded: []
  - path: src/scenes/TiltedWindowScene/windowMotion.ts
    excluded: []
  - path: src/scenes/TiltedWindowScene/windowTilt.ts
    excluded: []
  - path: src/storyboard/StoryFilm/steppedColumnWipe.ts
    excluded: []
  - path: src/storyboard/StoryFilm/getShotTransitionLayers.ts
    excluded: []
  - path: src/storyboard/StoryFilm/createThemeStyleFromTheme.ts
    excluded: []
  - path: src/motion-components/SceneTransition.tsx
    excluded: []
  - path: src/motion-components/SharedElement.tsx
    excluded: []
  - path: src/motion-components/AnchoredOverlay.tsx
    excluded: []
  - path: src/motion-components/SvgObjectDeparture.tsx
    excluded: []
  - path: src/scenes/BrandLockupScene/brandLockupMotion.ts
    excluded: []
  - path: src/scenes/BarComparisonScene/barComparisonMotion.ts
    excluded:
      - name: getRowValueLabel
        reason: "Formats a bar's value text at the panel's precision; not motion."

helpers:
  # ------------------------------------------------------------ curves --
  - id: ease-out
    title: "Ease out"
    category: curves
    description: "Exponential ease-out. Arrives fast and settles slowly: the default for entrances, exits and state responses."
    source: src/motion.ts
    exports: [EASE.out]
    signature: "EASE.out: (t: number) => number"
    defaults:
      - name: definition
        value: "bezier(0.16, 1, 0.3, 1)"
    usage: |
      const progress = ramp(frame, 12, DUR.panel, EASE.out);
    goodFor: "Anything arriving or responding: cards, rows, panels, a whip-in settling into its box."
    avoid: "Travel between two visible landmarks, which reads better on EASE.inOut."
    usedBy:
      - src/scenes/TiltedWindowScene/windowMotion.ts
      - src/compositions/Demo/ResultsPanel.tsx
    demo: { id: curve-out, frames: 75 }

  - id: ease-out-back
    title: "Ease out back"
    category: curves
    description: "Ease-out with a restrained overshoot past 1 before it settles."
    source: src/motion.ts
    exports: [EASE.outBack]
    signature: "EASE.outBack: (t: number) => number"
    defaults:
      - name: definition
        value: "bezier(0.34, 1.56, 0.64, 1)"
    usage: |
      const scale = mix(ramp(frame, 20, DUR.sheet, EASE.outBack), 0.94, 1);
    goodFor: "One element landing in its slot, once per clip."
    avoid: "Repeated use: overshoot everywhere reads as a toy. Values outside 0 to 1 can push layouts past their bounds."
    usedBy: []
    demo: { id: curve-out-back, frames: 75 }

  - id: ease-in-out
    title: "Ease in-out"
    category: curves
    description: "Symmetric ease for something already on screen travelling between positions."
    source: src/motion.ts
    exports: [EASE.inOut]
    signature: "EASE.inOut: (t: number) => number"
    defaults:
      - name: definition
        value: "bezier(0.45, 0, 0.55, 1)"
    usage: |
      const x = mix(ramp(frame, 30, DUR.sheet, EASE.inOut), 120, 640);
    goodFor: "Travel, dissolves, colour cross-fades and staged exits."
    avoid: "Arrivals from off screen: the slow start reads as hesitation."
    usedBy:
      - src/scenes/BarComparisonScene/BarComparisonScene.tsx
      - src/scenes/BrandLockupScene/brandLockupMotion.ts
      - src/motion-components/cameraTrack.ts
    demo: { id: curve-in-out, frames: 75 }

  - id: ease-in-out-cubic
    title: "Ease in-out cubic"
    category: curves
    description: "Symmetric cubic, flatter through the middle than EASE.inOut. The pointer's travel curve."
    source: src/motion.ts
    exports: [EASE.inOutCubic]
    signature: "EASE.inOutCubic: (t: number) => number"
    defaults:
      - name: definition
        value: "t < 0.5 ? 4t³ : 1 - (-2t + 2)³ / 2"
    usage: |
      const progress = ramp(frame, from.at, to.at - from.at, EASE.inOutCubic);
    goodFor: "A thing crossing the frame under its own power: a cursor between targets, an object departing."
    avoid: "Short UI responses, where the long slow start delays the answer."
    usedBy:
      - src/cursor-motion.ts
      - src/motion-components/SvgObjectDeparture.tsx
    demo: { id: curve-in-out-cubic, frames: 75 }

  - id: ease-word
    title: "Ease word"
    category: curves
    description: "The typographic curve: quick to rise, long to settle. Masked words, line fades, rising columns and growing bars."
    source: src/motion.ts
    exports: [EASE.word]
    signature: "EASE.word: (t: number) => number"
    defaults:
      - name: definition
        value: "bezier(0.22, 1, 0.36, 1)"
    usage: |
      const rise = ramp(frame, at, DUR.word, EASE.word);
    goodFor: "Staged builds: words, lines, columns, bars and carousel slides."
    avoid: "Departures; pair it with EASE.in or EASE.inOut on the way out."
    usedBy:
      - src/scenes/textReveal.ts
      - src/scenes/TypographyScene.tsx
      - src/scenes/TiltedWindowScene/windowMotion.ts
    demo: { id: curve-word, frames: 75 }

  - id: ease-in
    title: "Ease in"
    category: curves
    description: "Accelerating ease-in. Starts slowly and leaves at full speed."
    source: src/motion.ts
    exports: [EASE.in]
    signature: "EASE.in: (t: number) => number"
    defaults:
      - name: definition
        value: "bezier(0.55, 0, 1, 0.45)"
    usage: |
      const away = ramp(frame, exitAt, DUR.whip, EASE.in);
    goodFor: "Accelerating departures: a window whipped off the frame, an outgoing shot drifting under a wipe."
    avoid: "Arrivals. It lands at full speed and reads as a crash."
    usedBy:
      - src/scenes/TiltedWindowScene/windowMotion.ts
      - src/storyboard/StoryFilm/getShotTransitionLayers.ts
    demo: { id: curve-in, frames: 75 }

  - id: ease-surge
    title: "Ease surge"
    category: curves
    description: "A strong in-out: lingers at rest, surges through the middle, settles before the cut."
    source: src/motion.ts
    exports: [EASE.surge]
    signature: "EASE.surge: (t: number) => number"
    defaults:
      - name: definition
        value: "bezier(0.7, 0, 0.2, 1)"
    usage: |
      const flight = ramp(frame, flightAt, DUR.hero, EASE.surge);
    goodFor: "A fly-through that fills the frame before a cut."
    avoid: "Ordinary travel; the long hold at each end reads as a stall."
    usedBy:
      - src/scenes/BrandLockupScene/brandLockupMotion.ts
    demo: { id: curve-surge, frames: 75 }

  - id: bezier
    title: "Custom cubic Bezier"
    category: curves
    description: "Builds a CSS-style cubic-bezier easing. Returns 0 at or below 0 and 1 at or above 1; overshooting control points can leave 0 to 1 in between."
    source: src/motion.ts
    exports: [bezier]
    signature: "bezier(x1: number, y1: number, x2: number, y2: number): (t: number) => number"
    defaults: []
    usage: |
      const productEase = bezier(0.2, 0.8, 0.2, 1);
      const progress = ramp(frame, 10, DUR.panel, productEase);
    goodFor: "Matching a curve read from the product's own CSS."
    avoid: "Inventing a new curve per scene; add a named token to EASE instead."
    usedBy:
      - src/motion-components/motionSettings.ts
    demo: { id: curve-bezier, frames: 75 }

  - id: motion-presets
    title: "Motion presets"
    category: curves
    description: "Five semantic presets, deliberate to whip, that scale travel time, shutter angle and easing for the configurable motion components. Reading holds keep their length."
    source: src/motion-components/motionSettings.ts
    exports: [MOTION_PRESETS, resolveMotionSettings, getMotionDuration, getMotionProgress, getMotionEasing]
    signature: "getMotionProgress(frame: number, at: number, duration: number, options?: MotionOptions, fallback?: Easing): number"
    defaults:
      - name: preset
        value: "brisk (speed 1, shutter 180, ease-in-out-cubic)"
      - name: samples
        value: "10"
      - name: blurStrength
        value: "1"
    usage: |
      const duration = getMotionDuration(24, { preset: "gentle" });
      const progress = getMotionProgress(frame, 30, 24, { preset: "gentle" });
    goodFor: "Changing the pace of a camera, overlay or shared element without retiming its holds."
    avoid: "Scene choreography built on ramp(); presets only apply to the configurable motion components."
    usedBy:
      - src/motion-components/SharedElement.tsx
      - src/motion-components/AnchoredOverlay.tsx
      - src/continuity/ContinuityToken.tsx
    demo: { id: motion-presets, frames: 120 }

  - id: dur-press
    title: "Press duration"
    category: curves
    description: "4 frames (133 ms). One half of a press response."
    source: src/motion.ts
    exports: [DUR.press]
    signature: "DUR.press = 4"
    defaults: []
    usage: |
      const split = ramp(frame, at, DUR.press, EASE.out);
    goodFor: "A press answering back, the smallest step of a build."
    avoid: "Entrances; at 4 frames an element appears to pop in."
    usedBy:
      - src/scenes/TiltedWindowScene/windowMotion.ts
      - src/scenes/BrandLockupScene/brandLockupMotion.ts
    demo: { id: duration-press, frames: 60 }

  - id: dur-chip
    title: "Chip duration"
    category: curves
    description: "6 frames (200 ms). Chip and state changes, and the default exit."
    source: src/motion.ts
    exports: [DUR.chip]
    signature: "DUR.chip = 6"
    defaults: []
    usage: |
      const fill = mixToken(ramp(frame, at, DUR.chip), "var(--border)", "var(--brand)");
    goodFor: "State flips, line fades, carousel slides."
    avoid: "Travel across the frame."
    usedBy:
      - src/scenes/MediaScene.tsx
      - src/scenes/textReveal.ts
    demo: { id: duration-chip, frames: 60 }

  - id: dur-panel
    title: "Panel duration"
    category: curves
    description: "9 frames (300 ms). A row, card or panel arriving; the default ramp length."
    source: src/motion.ts
    exports: [DUR.panel]
    signature: "DUR.panel = 9"
    defaults: []
    usage: |
      const style = enter(frame, 12, { dur: DUR.panel });
    goodFor: "Most entrances."
    avoid: "The one hero beat of a phase; use DUR.hero for that."
    usedBy:
      - src/scenes/GraphScene.tsx
      - src/scenes/textReveal.ts
    demo: { id: duration-panel, frames: 60 }

  - id: dur-sheet
    title: "Sheet duration"
    category: curves
    description: "13 frames (433 ms). A sheet or full column; the default spring and counter length."
    source: src/motion.ts
    exports: [DUR.sheet]
    signature: "DUR.sheet = 13"
    defaults: []
    usage: |
      const pose = getWhipEntrance(frame, 0, canvas, box, DUR.sheet);
    goodFor: "Large surfaces, counters, bars growing."
    avoid: "Small chips and labels, which feel sluggish at this length."
    usedBy:
      - src/scenes/GraphScene.tsx
      - src/scenes/MetricScene.tsx
    demo: { id: duration-sheet, frames: 60 }

  - id: dur-hero
    title: "Hero duration"
    category: curves
    description: "18 frames (600 ms). The main visual beat of a phase. Spend it once."
    source: src/motion.ts
    exports: [DUR.hero]
    signature: "DUR.hero = 18"
    defaults: []
    usage: |
      const { rect } = getPullBack(frame, { kind: "pull-back", atFrame: 0 }, canvas, box);
    goodFor: "The pull-back, the fly-through, the result landing."
    avoid: "Several hero beats in one phase."
    usedBy:
      - src/scenes/TiltedWindowScene/windowMotion.ts
      - src/compositions/Demo/ResultsPanel.tsx
    demo: { id: duration-hero, frames: 60 }

  - id: dur-word
    title: "Word duration"
    category: curves
    description: "15 frames (500 ms). One title word rising out of its mask."
    source: src/motion.ts
    exports: [DUR.word]
    signature: "DUR.word = 15"
    defaults: []
    usage: |
      const rise = ramp(frame, 6 + index * 3, DUR.word, EASE.word);
    goodFor: "Masked word rises and the gap between CTA lines."
    avoid: "Line fades, which use DUR.chip."
    usedBy:
      - src/title-card.tsx
      - src/scenes/TypographyScene.tsx
    demo: { id: duration-word, frames: 60 }

  - id: dur-whip
    title: "Whip duration"
    category: curves
    description: "8 frames (267 ms). A whip-out or column wipe, deliberately shorter than a panel entrance so the boundary reads as a cut with motion in it."
    source: src/motion.ts
    exports: [DUR.whip]
    signature: "DUR.whip = 8"
    defaults: []
    usage: |
      const pose = getWhipExit(frame, exitAt, box, DUR.whip);
    goodFor: "Whip exits, flip-ins, mark column rises."
    avoid: "Arrivals the viewer has to read."
    usedBy:
      - src/scenes/TiltedWindowScene/windowMotion.ts
      - src/scenes/BrandLockupScene/brandLockupMotion.ts
    demo: { id: duration-whip, frames: 60 }

  - id: stagger
    title: "Sibling stagger"
    category: curves
    description: "2 frames (67 ms) between siblings in a list, so a group never arrives on one frame."
    source: src/motion.ts
    exports: [STAGGER]
    signature: "STAGGER = 2"
    defaults: []
    usage: |
      rows.map((row, index) => enter(frame, 10 + index * STAGGER));
    goodFor: "Rows, cards, list items, bar rows."
    avoid: "Longer gaps: at 30 fps a six-item list then takes half a second to arrive."
    usedBy:
      - src/scenes/GraphScene.tsx
      - src/scenes/BarComparisonScene/barComparisonMotion.ts
    demo: { id: stagger, frames: 60 }

  - id: stagger-column
    title: "Column stagger"
    category: curves
    description: "Half a frame (17 ms) between columns of a stepped wipe. Fractional on purpose: renderers interpolate each column at its sub-frame offset."
    source: src/motion.ts
    exports: [STAGGER_COLUMN]
    signature: "STAGGER_COLUMN = 0.5"
    defaults: []
    usage: |
      getSteppedColumnWipeStyle(frame, 18, { columns: 8, staggerFrames: STAGGER_COLUMN });
    goodFor: "Eight columns crossing the frame inside one whip."
    avoid: "Rounding the offsets; the columns then move in lockstep pairs."
    usedBy:
      - src/storyboard/StoryFilm/steppedColumnWipe.ts
      - src/scenes/BrandLockupScene/BrandLockupScene.tsx
    demo: { id: stagger-column, frames: 60 }

  # ----------------------------------------------------- interpolation --
  - id: ramp
    title: "Ramp and mix"
    category: interpolation
    description: "ramp() maps a frame window to eased 0 to 1 progress, clamped at both ends. mix() turns that progress into any number."
    source: src/motion.ts
    exports: [ramp, mix]
    signature: "ramp(frame: number, at: number, dur?: number, easing?: (t: number) => number): number"
    defaults:
      - name: dur
        value: "DUR.panel (9)"
      - name: easing
        value: "EASE.out"
    usage: |
      const progress = ramp(frame, 15, DUR.sheet);
      const width = mix(progress, 0, 640);
    goodFor: "Every timed style value; the primitive the other helpers build on."
    avoid: "Unclamped arithmetic on frame, which keeps moving after its window closes."
    usedBy:
      - src/scenes/MetricScene.tsx
      - src/scenes/MediaScene.tsx
      - src/compositions/MotionLab.tsx
    demo: { id: ramp, frames: 75 }

  - id: mix-token
    title: "Mix token"
    category: interpolation
    description: "Blends two design tokens through an OKLab color-mix() string, so a state change ramps instead of snapping."
    source: src/motion.ts
    exports: [mixToken]
    signature: "mixToken(t: number, from: string, to: string): string"
    defaults: []
    usage: |
      const border = mixToken(ramp(frame, 30, DUR.chip), "var(--border)", "var(--brand)");
    goodFor: "Focus, selection and finished states: borders, fills, text colours."
    avoid: "Hex values; pass var(--token) references so the film follows the theme."
    usedBy:
      - src/scenes/GraphScene.tsx
      - src/scenes/TiltedWindowScene/RacePair.tsx
    demo: { id: mix-token, frames: 75 }

  - id: count-to
    title: "Count to"
    category: interpolation
    description: "A rounded integer counting from zero to a value over a ramp."
    source: src/motion.ts
    exports: [countTo]
    signature: "countTo(frame: number, at: number, to: number, dur?: number): number"
    defaults:
      - name: dur
        value: "DUR.sheet (13)"
    usage: |
      const value = countTo(frame, 20, 1280, 30);
    goodFor: "A count the viewer is already reading, so it never snaps."
    avoid: "Changes between two nonzero values; use Math.round(mix(ramp(...), from, to))."
    usedBy:
      - src/compositions/MotionLab.tsx
      - src/compositions/Demo/Demo.tsx
    demo: { id: count-to, frames: 75 }

  # --------------------------------------------------------- entrances --
  - id: enter
    title: "Enter"
    category: entrances
    description: "An element arriving: opacity plus a short translation and optional scale, ending at rest. Returns transform and opacity only."
    source: src/motion.ts
    exports: [enter]
    signature: "enter(frame: number, at: number, opts?: { dur?, x?, y?, scale?, easing? }): CSSProperties"
    defaults:
      - name: dur
        value: "DUR.panel (9)"
      - name: y
        value: "12"
      - name: x
        value: "0"
      - name: scale
        value: "1"
      - name: easing
        value: "EASE.out"
    usage: |
      <div style={enter(frame, 12, { y: 12 })}>Saved</div>
    goodFor: "Cards, labels and panels settling into place."
    avoid: "Travel above 16 px or scale below 0.9, which stops looking like software. A later transform in the same style replaces it."
    usedBy:
      - src/scenes/GraphScene.tsx
      - src/scenes/BarComparisonScene/BarComparisonScene.tsx
      - src/continuity/ContinuityThesis.tsx
    demo: { id: enter, frames: 75 }

  - id: enter-at
    title: "Enter at index"
    category: entrances
    description: "The same entrance, delayed by index times STAGGER, to walk a list in."
    source: src/motion.ts
    exports: [enterAt]
    signature: "enterAt(frame: number, at: number, index: number, opts?: EnterOpts): CSSProperties"
    defaults:
      - name: stagger
        value: "STAGGER (2) per index"
    usage: |
      rows.map((row, index) => <Row key={row.id} style={enterAt(frame, 20, index)} />);
    goodFor: "Sibling rows and cards."
    avoid: "Unrelated elements; give each its own beat instead."
    usedBy:
      - src/scenes/GraphScene.tsx
      - src/compositions/Demo/ResultsPanel.tsx
    demo: { id: enter-at, frames: 75 }

  - id: leave
    title: "Leave"
    category: entrances
    description: "Exit the way it entered: opacity to 0 while translating away on the same axis."
    source: src/motion.ts
    exports: [leave]
    signature: "leave(frame: number, at: number, opts?: EnterOpts): CSSProperties"
    defaults:
      - name: dur
        value: "DUR.chip (6)"
      - name: y
        value: "12"
      - name: easing
        value: "EASE.out"
    usage: |
      <div style={leave(frame, 48)}>Draft</div>
    goodFor: "Short exits that keep a leaving element from drifting where the next phase lands."
    avoid: "Scale: leave() ignores the scale option."
    usedBy: []
    demo: { id: leave, frames: 75 }

  - id: pop
    title: "Pop"
    category: entrances
    description: "A damped spring anchored at a frame, 0 to 1, fitted to settle inside its duration."
    source: src/motion.ts
    exports: [pop]
    signature: "pop(frame: number, at: number, config?: { damping?, stiffness?, mass? }, durationInFrames?: number): number"
    defaults:
      - name: damping
        value: "14"
      - name: stiffness
        value: "120"
      - name: mass
        value: "0.8"
      - name: durationInFrames
        value: "DUR.sheet (13)"
    usage: |
      const landing = pop(frame, 30);
      const y = mix(landing, -40, 0);
    goodFor: "Something physical landing: a toast, a value snapping into a slot."
    avoid: "Damping below 14, which wobbles. Travel, which belongs to ramp()."
    usedBy:
      - src/compositions/Demo/SidePanel.tsx
    demo: { id: pop, frames: 75 }

  - id: press
    title: "Press"
    category: entrances
    description: "A brief scale dip that returns to exactly 1 over an 8-frame envelope."
    source: src/motion.ts
    exports: [press]
    signature: "press(frame: number, at: number, depth?: number): number"
    defaults:
      - name: depth
        value: "0.04"
      - name: envelope
        value: "2 × DUR.press (8 frames)"
    usage: |
      <button style={{ transform: `scale(${press(frame, CLICK)})` }}>Publish</button>
    goodFor: "The clicked element answering on the same beat as the pointer."
    avoid: "Deeper dips than 0.07; the button reads as squashed."
    usedBy:
      - src/compositions/Demo/PublishButton.tsx
      - src/compositions/MotionLab.tsx
      - src/cursor-motion.ts
    demo: { id: press, frames: 75 }

  # -------------------------------------------------------------- text --
  - id: line-fade
    title: "Line fade"
    category: text
    description: "A line fading in with a small rise over DUR.chip on EASE.word."
    source: src/scenes/textReveal.ts
    exports: [getLineRevealStyle]
    signature: "getLineRevealStyle(frame: number, at: number, mode: \"line-fade\", options?: { rise?: number }): CSSProperties"
    defaults:
      - name: rise
        value: "12 px (0 for a pure fade)"
      - name: duration
        value: "DUR.chip (6)"
    usage: |
      <p style={getLineRevealStyle(frame, 10 + index * 3, "line-fade")}>{line}</p>
    goodFor: "Headlines beside a window, statements line by line."
    avoid: "Single-word emphasis; the whole line moves together."
    usedBy:
      - src/scenes/TypographyScene.tsx
      - src/scenes/TiltedWindowScene/WindowHeadlines.tsx
    demo: { id: line-fade, frames: 75 }

