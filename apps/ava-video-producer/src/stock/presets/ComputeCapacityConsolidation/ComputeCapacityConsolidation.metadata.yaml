name:
  id: motionAtlas.compute-capacity-consolidation.name
  message: Pack work, release capacity
description:
  id: motionAtlas.compute-capacity-consolidation.description
  message:
    Fixed compute workloads move between server bays while their total resource
    demand stays constant. An operator-approved placement leaves an empty host eligible
    for sleep without claiming a measured energy saving.
category:
  id: motionAtlas.compute-capacity-consolidation.category
  message: Physical resource packing
useWhen:
  id: motionAtlas.compute-capacity-consolidation.useWhen
  message: Show how a placement decision can free capacity while preserving the work performed.
prompt:
  id: motionAtlas.compute-capacity-consolidation.prompt
  message:
    Reveal host bays holding the supplied work blocks. After the scheduler cue,
    slide intact blocks into the authored available capacity on retained hosts; emptied
    hosts fold into the chosen idle-state outline. Hold unchanged total work beside
    occupied and empty host counts derived from the inputs, then fade to ground.
    Workload consolidation does not invent measured energy savings.
creativeDirection:
  id: motionAtlas.compute-capacity-consolidation.creativeDirection
  message:
    Reveal host bays holding the supplied work blocks. After the scheduler cue,
    slide intact blocks into the authored available capacity on retained hosts; emptied
    hosts fold into the chosen idle-state outline. Hold unchanged total work beside
