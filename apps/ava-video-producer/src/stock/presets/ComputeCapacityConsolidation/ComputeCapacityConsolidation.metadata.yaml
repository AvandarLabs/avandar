intent:
  id: motionAtlas.compute-capacity-consolidation.intent
  message: Show how a placement decision can free capacity while preserving the work performed.
distinction:
  id: motionAtlas.compute-capacity-consolidation.distinction
  message:
    The main action is geometric bin packing with an emptied physical resource.
    Unlike source-merge, each job keeps its identity and size; unlike bar-race, there is
    no ranking.
