notFor:
  - id: motionAtlas.compute-capacity-consolidation.notFor.0
    message:
      The workload total is the sum of jobs in both placements. Host counts and
      occupied capacity are derived from assignments, never separately entered.
  - id: motionAtlas.compute-capacity-consolidation.notFor.1
    message:
      CPU-hours do not establish kWh, carbon emissions, runtime, latency or monetary
      savings. Memory, locality, reliability and migration cost are outside this
      schematic.
  - id: motionAtlas.compute-capacity-consolidation.notFor.2
    message:
      Defaults are fictional and represent supplied feasible placements, not a
      scheduling algorithm or an optimization guarantee.
