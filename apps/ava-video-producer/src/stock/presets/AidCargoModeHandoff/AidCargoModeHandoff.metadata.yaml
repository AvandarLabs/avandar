name:
  id: motionAtlas.aid-cargo-mode-handoff.name
  message: One load, several carriers
description:
  id: motionAtlas.aid-cargo-mode-handoff.description
  message: The same labeled aid parcels move between physical transport modes. Keeping
    each parcel visible through the handoffs explains how a load can continue when the
    carrier changes.
category:
  id: motionAtlas.aid-cargo-mode-handoff.category
  message: Physical supply chain
useWhen:
  id: motionAtlas.aid-cargo-mode-handoff.useWhen
  message: Show that assistance continues as the same physical load across different carriers.
intent:
  id: motionAtlas.aid-cargo-mode-handoff.intent
  message: Show that assistance continues as the same physical load across different carriers.
creativeDirection:
  id: motionAtlas.aid-cargo-mode-handoff.creativeDirection
  message: "Within six seconds, reveal a boat or truck carrying the supplied parcels at
    the first transfer point. Animate one restrained unload-and-load motion per
    boundary: a dock hoist or handcart moves those exact parcels onto the next carrier,
    then the carrier advances into the next part of the cutaway landscape. End with the
    final carrier and its intact load at the named receiving point. Keep a persistent
    parcel identity mark through every handoff, hold the result, and use the shared
    entrance and opaque exit envelope."
distinction:
  id: motionAtlas.aid-cargo-mode-handoff.distinction
  message: This is a physical transshipment cutaway with unloading, loading, and conserved
    parcel identity. data-pipeline changes abstract stages; packet-stream moves
    interchangeable packets without carrier changes or handling actions.
prompt:
  id: motionAtlas.aid-cargo-mode-handoff.prompt
  message: One load, several carriers. Show that assistance continues as the same physical
    load across different carriers.
