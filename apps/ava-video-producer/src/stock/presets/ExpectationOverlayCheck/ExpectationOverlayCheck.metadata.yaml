name:
  id: motionAtlas.expectation-overlay-check.name
  message: Compare the observed result with its expectation
description:
  id: motionAtlas.expectation-overlay-check.description
  message: An expected-result sheet aligns over an observed-result sheet for each authored
    test. Matching wording registers exactly, mismatches separate into a visible gap,
    and unobserved results remain untested.
category:
  id: motionAtlas.expectation-overlay-check.category
  message: Evidence and verification
useWhen:
  id: motionAtlas.expectation-overlay-check.useWhen
  message: Make a test judgment inspectable through its expected and observed values.
intent:
  id: motionAtlas.expectation-overlay-check.intent
  message: Make a test judgment inspectable through its expected and observed values.
creativeDirection:
  id: motionAtlas.expectation-overlay-check.creativeDirection
  message: Frames 12..42 reveal up to three test stations with short input captions.
    Frames 43..108 register the expected translucent strip over each observed strip,
    matching their fixed left edges. For lower, translate it vertically into place. For
    hinge, rotate it around its fixed upper edge and settle it flat before judging
    equality. Equal strings register into a double outline. Unequal strings separate
    vertically and retain both complete values with a mismatch bracket. A null
    observation retains an empty lower slot and never receives a verdict. Frames
    109..167 hold all tests, expected results, observations and derived states together.
    Use deterministic frame-driven React/SVG at 960x600, 180 frames and 30 fps, with the
    shared palette. Reveal during frames 0..11 and fade to the common opaque ground
    during frames 168..179.
distinction:
  id: motionAtlas.expectation-overlay-check.distinction
  message: Unlike capability-matrix, test states are derived from explicit expected and
    observed values rather than entered as capability claims. Unlike scan-lines, the
    animation exposes the comparison oracle and retains the discrepant result.
prompt:
  id: motionAtlas.expectation-overlay-check.prompt
  message: An expected-result sheet aligns over an observed-result sheet for each authored
    test. Matching wording registers exactly, mismatches separate into a visible gap,
    and unobserved results remain untested.
