notFor:
  - id: motionAtlas.expectation-overlay-check.notFor.0
    message: No software or model is executed. The cases and observations are authored examples.
  - id: motionAtlas.expectation-overlay-check.notFor.1
    message: A finite set of matches does not establish safety, reliability, quality, or
      complete test coverage.
  - id: motionAtlas.expectation-overlay-check.notFor.2
    message: String equality is the only comparison. No semantic equivalence, tolerance,
      hidden normalization, or causal diagnosis is inferred.
  - id: motionAtlas.expectation-overlay-check.notFor.3
    message: Free prose is author supplied; only structural, reference, numeric and
      documented lexical constraints are runtime-validated.
  - id: motionAtlas.expectation-overlay-check.literal-whitespace
    message: Whitespace uses amber presentation markers, distinct from authored marker
      glyphs. Exact original values remain unchanged.
motionBeats:
  - startFrame: 0
    endFrame: 11
    description:
      id: motionAtlas.expectation-overlay-check.beats.0
      message: Reveal the authored scene.
  - startFrame: 12
    endFrame: 42
    description:
      id: motionAtlas.expectation-overlay-check.beats.1
      message: Reveal all authored test stations.
  - startFrame: 43
    endFrame: 108
    description:
      id: motionAtlas.expectation-overlay-check.beats.2
      message: Register expected sheets, then separate mismatches.
  - startFrame: 109
    endFrame: 167
    description:
      id: motionAtlas.expectation-overlay-check.beats.3
      message: Hold exact observations and unobserved slots without inferred verdicts.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.expectation-overlay-check.beats.4
      message: Return to the common opaque ground.
