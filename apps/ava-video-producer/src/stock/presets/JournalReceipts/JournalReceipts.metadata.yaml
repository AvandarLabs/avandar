useWhen:
  id: motionAtlas.journal-receipts.useWhen
  message:
    Explain that confirmation closes a pending entry while missing confirmation
    leaves it visibly unresolved.
prompt:
  id: motionAtlas.journal-receipts.prompt
  message:
    Use Motion Atlas "Receipts Close the Journal" (journal-receipts) as an
    illustrative conceptual graphic. Explain that confirmation closes a pending entry
    while missing confirmation leaves it visibly unresolved. Bind complete authored
    inputs and preserve the stated limits.
creativeDirection:
  id: motionAtlas.journal-receipts.creativeDirection
  message:
    Reveal a compact accordion journal with one folded tab per pending entry. As
    the connection caption changes, unfold the journal just enough to expose each
    identifier. Authored receipt halves emerge from a separate acknowledgment pocket and
    register precisely against matching journal tabs; the paired tabs flatten into the
    page, leaving unpaired tabs raised. Hold on the visibly retained journal with only
    the supplied receipts closed, then fade to the shared opaque ground.
goodFor:
  - id: motionAtlas.journal-receipts.goodFor.0
    message: Explain why a locally saved action can still await confirmation
  - id: motionAtlas.journal-receipts.goodFor.1
    message: Show reconnection clearing only acknowledged offline changes
  - id: motionAtlas.journal-receipts.goodFor.2
    message:
      Illustrate a dispatch log, expense envelope, or hand-carried register with
      signed receipts
