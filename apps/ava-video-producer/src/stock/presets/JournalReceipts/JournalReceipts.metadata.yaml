name:
  id: motionAtlas.journal-receipts.name
  message: Receipts Close the Journal
description:
  id: motionAtlas.journal-receipts.description
  message: A retained journal folds open when a connection returns. Matching
    acknowledgments settle onto its entries while any unacknowledged entries keep their
    pending tabs.
category:
  id: motionAtlas.journal-receipts.category
  message: Acknowledgment and retention
