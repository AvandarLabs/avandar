notFor:
  - id: motionAtlas.journal-receipts.notFor.0
    message:
      One supplied receipt closes exactly one entry. A missing receipt means
      acknowledgment is absent from this illustration, not that remote processing
      failed.
  - id: motionAtlas.journal-receipts.notFor.1
    message: No retransmission, conflict resolution, deduplication guarantee, or
      exactly-once delivery claim is implied.
  - id: motionAtlas.journal-receipts.notFor.2
    message:
      The final state may intentionally contain pending entries. The loop reset is
      editorial, not a depiction of receipts being revoked.
distinction:
  id: motionAtlas.journal-receipts.distinction
  message:
    Packet-stream depicts movement; this depicts identity-matched acknowledgments
    changing the physical condition of a retained journal. Source-merge combines
    sources, whereas the original entries remain in place and a matching receipt closes
    each obligation.
