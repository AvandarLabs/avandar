intent:
  id: motionAtlas.kernel-density-spread.intent
  message: Expose smoothing assumptions without presenting intensity as observed counts.
distinction:
  id: motionAtlas.kernel-density-spread.distinction
  message:
    Spatial-grid-binning assigns each point once to an exact count cell. This
    spreads each contribution across neighboring cells and makes radius a visible
    modeling choice.
