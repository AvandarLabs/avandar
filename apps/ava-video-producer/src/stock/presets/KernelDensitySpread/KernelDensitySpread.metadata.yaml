name:
  id: motionAtlas.kernel-density-spread.name
  message: A smooth surface depends on its radius
description:
  id: motionAtlas.kernel-density-spread.description
  message:
    Each supplied point contributes a bounded kernel to a schematic grid. The
    kernels add into one intensity field, then a second radius changes the smoothing
    without creating or deleting any point observations.
category:
  id: motionAtlas.kernel-density-spread.category
  message: Spatial smoothing
useWhen:
  id: motionAtlas.kernel-density-spread.useWhen
  message: Expose smoothing assumptions without presenting intensity as observed counts.
prompt:
  id: motionAtlas.kernel-density-spread.prompt
  message:
    960x600 React/SVG with shared palette, deterministic 180 frames at 30fps.
    Reveal at frames 0-12. Frames 13-55 raise a small cone over each point. Frames
    56-105 add cone heights into a sampled grid intensity. Frames 106-139 widen or
    narrow every cone to the second radius and recompute the grid while point markers
    stay fixed. Hold the resolved state at 140-165; fade to the same opaque ground at
    166-179. Reset is editorial.
creativeDirection:
  id: motionAtlas.kernel-density-spread.creativeDirection
  message:
    960x600 React/SVG with shared palette, deterministic 180 frames at 30fps.
