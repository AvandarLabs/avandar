notFor:
  - id: motionAtlas.kernel-density-spread.zeroQualifier
    message: Zero modeled intensity does not establish zero population.
  - id: motionAtlas.kernel-density-spread.notFor.0
    message:
      This specified cone kernel is an instructional design, not a claim about a
      mapping library kernel.
  - id: motionAtlas.kernel-density-spread.notFor.1
    message:
      Intensity is neither case count, population, probability nor risk. Grid cell
      intensities do not sum to point count.
  - id: motionAtlas.kernel-density-spread.notFor.2
    message:
      A smooth field does not fill gaps in actual observations or establish
      conditions between points.
  - id: motionAtlas.kernel-density-spread.notFor.3
    message:
      No external requests, URLs, JSX or functions in props. Supplied examples are
      fictional.
  - id: motionAtlas.kernel-density-spread.notFor.4
    message:
      Authored prose remains the author’s responsibility. Runtime validation
      preserves supplied text without classifying its language or factual claims.
motionBeats:
  - startFrame: 0
    endFrame: 12
    description:
      id: motionAtlas.kernel-density-spread.beat.0
      message: Reveal fixed observations and legend.
  - startFrame: 13
    endFrame: 55
    description:
      id: motionAtlas.kernel-density-spread.beat.1
      message: Raise one cone per supplied weighted point.
  - startFrame: 56
    endFrame: 105
    description:
      id: motionAtlas.kernel-density-spread.beat.2
      message: Add cone contributions into cell-center samples.
  - startFrame: 106
    endFrame: 139
    description:
      id: motionAtlas.kernel-density-spread.beat.3
      message: Change radius and recompute without moving points.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.kernel-density-spread.beat.4
      message: Hold the resolved study.
  - startFrame: 166
    endFrame: 179
    description:
      id: motionAtlas.kernel-density-spread.beat.5
      message: The enclosing StockGraphic fades to opaque ground.
