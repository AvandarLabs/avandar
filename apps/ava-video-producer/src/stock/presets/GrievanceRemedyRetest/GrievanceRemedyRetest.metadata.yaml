name:
  id: motionAtlas.grievance-remedy-retest.name
  message: Let the person test the remedy
description:
  id: motionAtlas.grievance-remedy-retest.description
  message: A participant reports a specific unusable object and tests it again after an
    authored repair. The repair action and the participant's acceptance remain separate
    events.
category:
  id: motionAtlas.grievance-remedy-retest.category
  message: Object repair and user verification
useWhen:
  id: motionAtlas.grievance-remedy-retest.useWhen
  message: Show that a reported repair is checked by the person who raised the problem.
prompt:
  id: motionAtlas.grievance-remedy-retest.prompt
  message: Show a participant trying a locker latch that will not close, then placing a
    complaint marker beside it. A worker replaces the latch while the participant stays
    present. The participant, rather than the worker, operates the latch again; it
    closes only in the supplied functioning outcome. Hold the tested object and the
    participant's separately supplied accepted, not-accepted or pending response. Keep a
    non-functioning or unaccepted remedy visibly open.
creativeDirection:
  id: motionAtlas.grievance-remedy-retest.creativeDirection
  message: Show a participant trying a locker latch that will not close, then placing a
    complaint marker beside it. A worker replaces the latch while the participant stays
    present. The participant, rather than the worker, operates the latch again; it
    closes only in the supplied functioning outcome. Hold the tested object and the
    participant's separately supplied accepted, not-accepted or pending response. Keep a
    non-functioning or unaccepted remedy visibly open.
intent:
  id: motionAtlas.grievance-remedy-retest.intent
  message: Show that a reported repair is checked by the person who raised the problem.
distinction:
  id: motionAtlas.grievance-remedy-retest.distinction
  message: A material object is repaired and then physically operated by the affected
    person, with acceptance independent of the worker's action. Unlike
    feedback-refinement, the exchange does not edit a draft; unlike status-cycle,
    closure cannot be inferred merely from the repair step.
