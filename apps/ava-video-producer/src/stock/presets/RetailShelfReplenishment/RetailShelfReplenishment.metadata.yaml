name:
  id: motionAtlas.retail-shelf-replenishment.name
  message: Keep the shelf supplied
description:
  id: motionAtlas.retail-shelf-replenishment.description
  message:
    A retailer notices empty shelf spaces, receives a small replenishment, and
    makes the goods available for a shopper to choose. Physical inventory changes
    connect retail supply to usable assistance.
category:
  id: motionAtlas.retail-shelf-replenishment.category
  message: Retail availability
useWhen:
  id: motionAtlas.retail-shelf-replenishment.useWhen
  message: Show that purchasing choice depends on goods reaching and remaining on the shelf.
intent:
  id: motionAtlas.retail-shelf-replenishment.intent
  message: Show that purchasing choice depends on goods reaching and remaining on the shelf.
creativeDirection:
  id: motionAtlas.retail-shelf-replenishment.creativeDirection
  message:
    Over six seconds, reveal the supplied opening stock as individual objects on a
    cutaway shelf. The retailer points to the empty spaces and places an order slip on
    the counter; a small delivery trolley arrives with exactly the incoming objects,
    which the retailer places into those spaces. A shopper then selects the authored
    purchase quantity while the remaining stock stays visible. Hold the final shelf and
    basket, with opening plus incoming minus selected quantities conserved, then fade to
    the opaque ground.
distinction:
  id: motionAtlas.retail-shelf-replenishment.distinction
  message:
    Unlike data-pipeline, quantities physically leave a vehicle, occupy shelf
    slots, and move into a customer basket. Unlike household-market-choice, the main
    action is restoring availability before the purchase, with explicit conservation of
    inventory.
prompt:
  id: motionAtlas.retail-shelf-replenishment.prompt
  message:
    Keep the shelf supplied. Show that purchasing choice depends on goods reaching
    and remaining on the shelf.
