notFor:
  - id: motionAtlas.retail-shelf-replenishment.notFor.0
    message:
      Every visible product object corresponds to one authored example unit; no real
      stock, sales, price, or availability data is represented.
  - id: motionAtlas.retail-shelf-replenishment.notFor.1
    message:
      This animation illustrates an authored sequence, not a demand forecast,
      inventory optimization system, or guarantee against shortages.
  - id: motionAtlas.retail-shelf-replenishment.notFor.2
    message:
      Incoming supply and shopper choice are configured separately and validated for
      feasible quantities; no goods are silently invented.
  - id: motionAtlas.retail-shelf-replenishment.notFor.3
    message:
      The process is inspired by the relationship between retail supply and cash
      assistance, without copying agency assets or asserting any measured result.
