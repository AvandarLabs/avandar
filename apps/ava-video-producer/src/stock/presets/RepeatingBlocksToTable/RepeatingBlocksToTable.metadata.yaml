goodFor:
  - id: motionAtlas.repeating-blocks-to-table.goodFor.0
    message: Explain turning repeated labeled sections into a table
  - id: motionAtlas.repeating-blocks-to-table.goodFor.1
    message: Preserve absent fields during document extraction
domains:
  - id: motionAtlas.repeating-blocks-to-table.domains.0
    message: Repeated structure extraction
aliases:
  - id: motionAtlas.repeating-blocks-to-table.aliases.0
    message: PDF blocks
  - id: motionAtlas.repeating-blocks-to-table.aliases.1
    message: run-in labels
  - id: motionAtlas.repeating-blocks-to-table.aliases.2
