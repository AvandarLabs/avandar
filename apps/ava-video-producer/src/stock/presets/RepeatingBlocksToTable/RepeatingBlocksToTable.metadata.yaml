notFor:
  - id: motionAtlas.repeating-blocks-to-table.notFor.0
    message: Authored, exact field alignment only; no inference from headings.
  - id: motionAtlas.repeating-blocks-to-table.notFor.1
    message: Does not imply that the original document contained a printed table.
  - id: motionAtlas.repeating-blocks-to-table.notFor.2
    message: Multicolumn reading-order ambiguity is excluded from this compact example.
  - id: motionAtlas.repeating-blocks-to-table.notFor.3
    message: No JSX, functions, URLs or external fetch in props. The animation is an
      authored explanation, not actual document extraction or product evidence.
  - id: motionAtlas.repeating-blocks-to-table.notFor.4
    message: Fields and blocks each have unique exact IDs, including at most one empty ID.
      Block IDs and field IDs have maximum length 12, no minimum. Every block has
      exactly one cell for each existing field ID, independent of cell array order. Null
      means missing and never zero. Output columns follow fields array order, rows
      follow blocks array order. Duplicate headings remain distinct by ID.
  - id: motionAtlas.repeating-blocks-to-table.notFor.5
    message: Prose meaning is an author responsibility. Runtime validation enforces
      structural bounds, exact references and numeric/geometric rules.
motionBeats:
  - startFrame: 0
    endFrame: 12
    description:
      id: motionAtlas.repeating-blocks-to-table.motionBeats.0
      message: Reveal the context.
  - startFrame: 13
    endFrame: 55
    description:
      id: motionAtlas.repeating-blocks-to-table.motionBeats.1
      message: Establish repeated heading blocks and their run-in field labels.
  - startFrame: 56
    endFrame: 105
    description:
      id: motionAtlas.repeating-blocks-to-table.motionBeats.2
      message: Reorient field-value strips from vertical block stacks into horizontal table
        rows.
  - startFrame: 106
    endFrame: 165
    description:
      id: motionAtlas.repeating-blocks-to-table.motionBeats.3
      message: Hold each original block identity beside its row and retain explicit missing
        cells. The outer renderer fades at 166..179.
