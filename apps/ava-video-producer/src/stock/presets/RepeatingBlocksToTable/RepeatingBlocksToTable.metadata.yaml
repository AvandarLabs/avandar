name:
  id: motionAtlas.repeating-blocks-to-table.name
  message: Read the same fields across repeated sections
description:
  id: motionAtlas.repeating-blocks-to-table.description
  message: Repeated labeled paragraphs unfold into rows of one table. Shared run-in labels
    become columns, and an absent section stays missing instead of shifting neighboring
    text into its place.
category:
  id: motionAtlas.repeating-blocks-to-table.category
  message: Repeated structure extraction
useWhen:
  id: motionAtlas.repeating-blocks-to-table.useWhen
  message: Expose tabular structure inside repeated prose sections.
prompt:
  id: motionAtlas.repeating-blocks-to-table.prompt
  message: Use Motion Atlas "Read the same fields across repeated sections"
    (repeating-blocks-to-table) as an authored conceptual explanation. Expose tabular
    structure inside repeated prose sections. Supply approved content before making
    product claims.
creativeDirection:
  id: motionAtlas.repeating-blocks-to-table.creativeDirection
  message: 960x600 React/SVG, shared palette, frame-driven 180 frames at 30fps. Frames
    0-12 reveal the scene. Frames 13-55 reveal repeated heading blocks with their field
    labels. Frames 56-105 line up equal labels vertically and rotate the block
    organization into a compact row-based table. Frames 106-139 hold each block beside
    its row with an explicit missing cell. Hold the resolved relationship at frames
    140-165, then fade to the same opaque ground at 166-179. Reset is editorial.
intent:
  id: motionAtlas.repeating-blocks-to-table.intent
  message: Expose tabular structure inside repeated prose sections.
distinction:
  id: motionAtlas.repeating-blocks-to-table.distinction
  message: Unlike schema-mapping, the field labels already match. The animation reveals a
    tabular structure concealed by repeated prose layout and preserves absent cells.
tags:
  - id: motionAtlas.repeating-blocks-to-table.tags.0
    message: PDF blocks
  - id: motionAtlas.repeating-blocks-to-table.tags.1
