name:
  id: motionAtlas.boundary-regrouping-effect.name
  message: Change the boundary, keep the people
description:
  id: motionAtlas.boundary-regrouping-effect.description
  message:
    The same small geographic cells regroup under two supplied zoning schemes. Zone
    totals and population-normalized values change while every underlying cell and the
    overall denominator stay fixed.
category:
  id: motionAtlas.boundary-regrouping-effect.category
  message: spatial aggregation sensitivity
useWhen:
  id: motionAtlas.boundary-regrouping-effect.useWhen
  message: Show that a geographic summary can change when only the grouping boundaries change.
prompt:
  id: motionAtlas.boundary-regrouping-effect.prompt
  message:
    Show the supplied fixed cells and the first grouping boundary. Lift only the
    outer grouping seams, redraw them in the second arrangement, and gather each zone's
    arithmetic along the new outline. Hold the unchanged underlying cell values and
    unchanged overall total beneath the new summaries.
creativeDirection:
  id: motionAtlas.boundary-regrouping-effect.creativeDirection
  message:
    Show the supplied fixed cells and the first grouping boundary. Lift only the
    outer grouping seams, redraw them in the second arrangement, and gather each zone's
    arithmetic along the new outline. Hold the unchanged underlying cell values and
    unchanged overall total beneath the new summaries.
intent:
  id: motionAtlas.boundary-regrouping-effect.intent
  message: Show that a geographic summary can change when only the grouping boundaries change.
distinction:
  id: motionAtlas.boundary-regrouping-effect.distinction
  message:
    Only aggregation seams move; stable atomic cells produce different zone
    summaries. Unlike nested-drilldown-window, this replaces one complete partition with
    another rather than selecting a smaller subset.
