  - id: motionAtlas.boundary-regrouping-effect.goodFor.2
    message: Introduce the modifiable areal unit problem
notFor:
  - id: motionAtlas.boundary-regrouping-effect.notFor.0
    message: Square cells are schematic accounting units, not real neighborhoods.
  - id: motionAtlas.boundary-regrouping-effect.notFor.1
    message:
      Overall numerator and denominator must be identical across both groupings; no
      resident moves and no record is created.
  - id: motionAtlas.boundary-regrouping-effect.notFor.2
    message:
      The scene explains aggregation sensitivity, not individual risk, a preferred
      zoning plan, or a causal explanation for inequality.
