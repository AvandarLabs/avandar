notFor:
  - id: motionAtlas.chart-focus-edit.notFor.0
    message: All default counts are fictional.
  - id: motionAtlas.chart-focus-edit.notFor.1
    message: Bar lengths, category order, zero baseline, and axisMaximum remain fixed.
  - id: motionAtlas.chart-focus-edit.notFor.2
    message: Emphasis is an editorial selection, not statistical significance or detected
      importance.
  - id: motionAtlas.chart-focus-edit.notFor.3
    message: Grid removal must retain a readable zero baseline and scale endpoints.
motionBeats:
  - startFrame: 12
    endFrame: 40
    description:
      id: motionAtlas.chart-focus-edit.motionBeats.0
      message: Show complete bars, labels and the common plotting scale.
  - startFrame: 40
    endFrame: 112
    description:
      id: motionAtlas.chart-focus-edit.motionBeats.1
      message: Recede minor grid lines and apply selected label and focus treatments without
        changing values.
  - startFrame: 112
    endFrame: 166
    description:
      id: motionAtlas.chart-focus-edit.motionBeats.2
      message: Hold refined presentation on the unchanged zero-based scale.
