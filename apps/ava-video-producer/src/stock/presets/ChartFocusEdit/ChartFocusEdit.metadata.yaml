name:
  id: motionAtlas.chart-focus-edit.name
  message: Refine a chart for reading
description:
  id: motionAtlas.chart-focus-edit.description
  message: An already complete chart sheds visual clutter and brings a selected category
    into focus while every supplied value and the common scale remain unchanged.
category:
  id: motionAtlas.chart-focus-edit.category
  message: Editorial attention
useWhen:
  id: motionAtlas.chart-focus-edit.useWhen
  message: Show that visual emphasis can improve reading while preserving the data.
creativeDirection:
  id: motionAtlas.chart-focus-edit.creativeDirection
  message: Frames 12-40 show the complete bars, labels, and a light plotting grid. Between
    frames 40-112, minor grid lines recede, label tabs move to direct reading positions
    when requested, and nonfocused marks soften without changing length. A small context
    heading settles beside the selected mark. Hold the cleaner chart through frame 166
    before the standard exit.
intent:
  id: motionAtlas.chart-focus-edit.intent
  message: Show that visual emphasis can improve reading while preserving the data.
distinction:
  id: motionAtlas.chart-focus-edit.distinction
  message: Unlike bar-race and line-trace, the data is fully present at the start and
    never grows, ranks, or changes. The transformation is the chart presentation itself.
prompt:
  id: motionAtlas.chart-focus-edit.prompt
  message: Use Motion Atlas "Refine a chart for reading" (chart-focus-edit) as a
    conceptual graphic. Show that visual emphasis can improve reading while preserving
    the data. Replace fictional sample content with approved authored content before
    making product claims.
