name:
  id: motionAtlas.equal-count-unequal-volume.name
  message: The same count can hold different amounts
description:
  id: motionAtlas.equal-count-unequal-volume.description
  message: Two equal-count collections begin with matching item marks. Each item unfolds
    into a strip proportional to its supplied byte size, revealing different total data
    volumes on one common ruler without changing the item count.
category:
  id: motionAtlas.equal-count-unequal-volume.category
  message: Measurement and proxies
useWhen:
  id: motionAtlas.equal-count-unequal-volume.useWhen
  message: Expose what an item count does not tell us about the amount of data.
creativeDirection:
  id: motionAtlas.equal-count-unequal-volume.creativeDirection
  message: Frames 0-11 reveal two labeled shelves containing the same number of authored
    items. Frames 12-48 align their count marks one for one. Frames 49-110 unfold each
    item horizontally into an adjacent byte-length strip while retaining its small
    identity tab; both shelves share one fixed zero and scale. Frames 111-145 show the
    derived collection totals beneath the unchanged count marks. Hold through frame 167
    with the supplied measurement basis and proxy note, then fade to the shared opaque
    ground through frame 179. Use the same palette, 960x600 React/SVG canvas,
    deterministic 180-frame timing, and 30fps.
intent:
  id: motionAtlas.equal-count-unequal-volume.intent
  message: Expose what an item count does not tell us about the amount of data.
distinction:
  id: motionAtlas.equal-count-unequal-volume.distinction
  message: Unlike capability-matrix, this changes the represented measure from a discrete
    count to item-weighted size. Unlike bar-race, no rank changes over time and no data
    values evolve. Unlike population-normalized-map, no denominator division or
    geographic fill is used; the animation opens each counted object to expose its
    unequal weight.
prompt:
  id: motionAtlas.equal-count-unequal-volume.prompt
  message: Use Motion Atlas "The same count can hold different amounts"
    (equal-count-unequal-volume) as a conceptual graphic. Expose what an item count does
    not tell us about the amount of data. Replace fictional examples with approved
    authored content before making product claims.
