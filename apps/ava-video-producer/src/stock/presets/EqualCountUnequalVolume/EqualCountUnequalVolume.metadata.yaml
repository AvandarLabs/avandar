goodFor:
  - id: motionAtlas.equal-count-unequal-volume.goodFor.0
    message: Explain why dataset count is an imperfect storage proxy
  - id: motionAtlas.equal-count-unequal-volume.goodFor.1
    message: Show why the same number of rows can occupy different byte sizes
  - id: motionAtlas.equal-count-unequal-volume.goodFor.2
    message: Separate a simple allowance metric from a measured resource quantity
domains:
  - id: motionAtlas.equal-count-unequal-volume.domains.0
