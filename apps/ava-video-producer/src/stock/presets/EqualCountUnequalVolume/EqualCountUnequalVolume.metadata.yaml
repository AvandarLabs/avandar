notFor:
  - id: motionAtlas.equal-count-unequal-volume.notFor.0
    message: Exactly two equal-count groups and at most three items per group. Quantities
      are fictional measurement examples, not actual compression, transfer, memory, or
      storage benchmarks.
  - id: motionAtlas.equal-count-unequal-volume.notFor.1
    message: Every displayed total equals the sum of item bytes. Item count and byte volume
      remain distinct units; no conversion from count to bytes is inferred.
  - id: motionAtlas.equal-count-unequal-volume.notFor.2
    message: Both shelves use one zero, one scale, and one measurement basis. An empty-byte
      item keeps its count mark even though its size strip has zero length.
  - id: motionAtlas.equal-count-unequal-volume.notFor.3
    message: The selected datasets or rows grain applies to all items. A dataset and a row
      must never count as interchangeable units.
  - id: motionAtlas.equal-count-unequal-volume.notFor.4
    message: This does not assess whether a pricing policy is fair or predict actual costs.
      It illustrates a limitation of a proxy named in the strategy.
  - id: motionAtlas.equal-count-unequal-volume.notFor.5
    message: Supplied prose meaning, fictional status and agreement with structured choices
      are authoring responsibilities. Runtime validation enforces structure, numeric
      bounds, identities and references.
motionBeats:
