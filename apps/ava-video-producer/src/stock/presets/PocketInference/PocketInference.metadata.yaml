    quality or speed.
prompt:
  id: motionAtlas.pocket-inference.prompt
  message: Use Motion Atlas "A Model Inside the Device" (pocket-inference) as an
    illustrative conceptual graphic. Make the location of the illustrated computation
    clear without claiming model quality or speed. Bind complete authored inputs and
    preserve the stated limits.
creativeDirection:
  id: motionAtlas.pocket-inference.creativeDirection
  message:
    Open on a fixed device cutaway with an empty cartridge socket. Seat a compact
    labeled model cartridge in the socket, then let a narrow fold of input text enter
    the device's internal writing area. A single restrained ripple crosses the cartridge
    face and the supplied response unfurls beneath the input, entirely inside the
    casing. Hold the device, model, and result together with a supplied boundary
    caption; fade out through the six-second opaque envelope.
goodFor:
  - id: motionAtlas.pocket-inference.goodFor.0
    message: Introduce an on-device language-model task
  - id: motionAtlas.pocket-inference.goodFor.1
    message: Explain a portable assistant that uses an installed model
  - id: motionAtlas.pocket-inference.goodFor.2
    message: Illustrate computation taking place within a defined local boundary
  - id: motionAtlas.pocket-inference.goodFor.3
    message: Explain a locally installed SQL assistant
  - id: motionAtlas.pocket-inference.goodFor.4
    message: Show inference inside the device boundary
