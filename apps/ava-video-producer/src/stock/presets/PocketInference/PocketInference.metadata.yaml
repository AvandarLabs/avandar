notFor:
  - id: motionAtlas.pocket-inference.notFor.0
    message:
      The response is authored illustrative copy, not model output or evidence of
      correctness, safety, or measured accuracy.
  - id: motionAtlas.pocket-inference.notFor.1
    message:
      Cartridge size is metaphorical and must not stand in for actual weights, memory
      usage, energy use, or latency.
  - id: motionAtlas.pocket-inference.notFor.2
    message:
      Keeping the illustrated task inside the outline does not establish system-wide
      privacy, absence of telemetry, or offline support for unrelated operations.
  - id: motionAtlas.pocket-inference.notFor.3
    message:
      Model installation may need a prior network download and sufficient device
      resources. Local inference for this task does not establish parity with every
      online tool.
distinction:
  id: motionAtlas.pocket-inference.distinction
  message:
    The hero action seats a persistent computational object inside a bounded device
    and produces a response there. It is not terminal typing or a general processing
    pipeline, and it does not draw a local-versus-cloud comparison.
