name:
  id: motionAtlas.pocket-inference.name
  message: A Model Inside the Device
description:
  id: motionAtlas.pocket-inference.description
  message:
    A small model cartridge seats inside a device and transforms supplied input
    into an authored response without crossing the device outline. The casing remains
    the explicit boundary of the illustrated computation.
