name:
  id: motionAtlas.protected-work-boundary.name
  message: Keep protected time inside a finite schedule
description:
  id: motionAtlas.protected-work-boundary.description
  message: A worker declines to squeeze a new request into a protected time block. The
    request moves to a visible deferred tray, or to an explicitly available work block,
    while the schedule retains its original size.
category:
  id: motionAtlas.protected-work-boundary.category
  message: Work and wellbeing
useWhen:
  id: motionAtlas.protected-work-boundary.useWhen
  message: Make a work boundary concrete without claiming a productivity or health effect.
intent:
  id: motionAtlas.protected-work-boundary.intent
  message: Make a work boundary concrete without claiming a productivity or health effect.
creativeDirection:
  id: motionAtlas.protected-work-boundary.creativeDirection
  message: Frames 12..38 reveal one fixed strip of equal time blocks containing existing
    commitments and protected rest, learning or community time. Frames 39..76 bring a
    new request toward its named protected block. The worker lifts the request away
    before it covers that block. Frames 77..130 place it in the deferred tray or the
    supplied empty work slot. Frames 131..167 hold the unchanged protected blocks,
    retained commitments and visible request disposition. Never stretch the strip or
    accelerate existing work to create room. Use deterministic frame-driven React/SVG at
    960x600, 180 frames and 30 fps, with the shared palette. Reveal during frames 0..11
    and fade to the common opaque ground during frames 168..179.
distinction:
  id: motionAtlas.protected-work-boundary.distinction
  message: Unlike schedule-buffer, no interruption consumes reserve time. Unlike
    person-led-support-calendar, the central decision can leave work deliberately
    unscheduled, preserving a finite workload boundary instead of finding a new
    appointment.
prompt:
  id: motionAtlas.protected-work-boundary.prompt
  message: A worker declines to squeeze a new request into a protected time block. The
    request moves to a visible deferred tray, or to an explicitly available work block,
    while the schedule retains its original size.
