notFor:
  - id: motionAtlas.protected-work-boundary.notFor.0
    message: This is an authored scheduling decision, not a clinical burnout model or a
      claim about productivity.
  - id: motionAtlas.protected-work-boundary.notFor.1
    message: Rest, learning and community time are illustrative categories. The animation
      does not reproduce any company leave or working-hours policy.
  - id: motionAtlas.protected-work-boundary.notFor.2
    message: A deferred request remains outstanding. Deferral does not assign it to someone
      else or invent future capacity.
  - id: motionAtlas.protected-work-boundary.notFor.3
    message: Free prose is author supplied; only structural, reference, numeric and
      documented lexical constraints are runtime-validated.
motionBeats:
  - startFrame: 0
    endFrame: 11
    description:
      id: motionAtlas.protected-work-boundary.beats.0
      message: Reveal the authored scene.
  - startFrame: 12
    endFrame: 38
    description:
      id: motionAtlas.protected-work-boundary.beats.1
      message: Reveal the fixed strip and its existing commitments.
  - startFrame: 39
    endFrame: 76
    description:
      id: motionAtlas.protected-work-boundary.beats.2
      message: The worker lifts the incoming request clear of protected time.
  - startFrame: 77
    endFrame: 130
    description:
      id: motionAtlas.protected-work-boundary.beats.3
      message: Move the request to the deferred tray or supplied empty work block.
  - startFrame: 131
    endFrame: 167
    description:
      id: motionAtlas.protected-work-boundary.beats.4
      message: Hold unchanged commitments and the visible outstanding request.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.protected-work-boundary.beats.5
      message: Return to the common opaque ground.
