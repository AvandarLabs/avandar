notFor:
  - id: motionAtlas.dose-cohort-return-paths.notFor.0
    message:
      The fixed baseline denominator is participants.length. Each per-visit recorded
      numerator counts participant records with that visit marked recorded; no
      population coverage or protection percentage is inferred.
  - id: motionAtlas.dose-cohort-return-paths.notFor.1
    message:
      Missing, missed, and not-yet-due are different supplied states. They are never
      auto-converted into clinical noncompliance or a recommendation.
  - id: motionAtlas.dose-cohort-return-paths.notFor.2
    message:
      Visit order is ordinal only. No elapsed time, vaccine name, interval, dose
      schedule, eligibility, or catch-up dosing advice is supplied.
  - id: motionAtlas.dose-cohort-return-paths.notFor.3
    message:
      Each participant occupies one lane throughout; a returning participant is not a
      newly added person. Arrays, not independent totals, own all counts.
