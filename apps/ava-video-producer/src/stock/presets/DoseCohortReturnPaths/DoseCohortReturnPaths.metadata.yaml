name:
  id: motionAtlas.dose-cohort-return-paths.name
  message: The same cohort returns
description:
  id: motionAtlas.dose-cohort-return-paths.description
  message:
    Keep the same people visible as a fictional multi-dose cohort returns for
    successive recorded visits. Missed and unobserved visits leave visible gaps instead
    of removing people from the denominator.
category:
  id: motionAtlas.dose-cohort-return-paths.category
  message: People over repeated visits
useWhen:
  id: motionAtlas.dose-cohort-return-paths.useWhen
  message:
    Show who returned across visits without silently changing the population being
    compared.
intent:
  id: motionAtlas.dose-cohort-return-paths.intent
  message:
    Show who returned across visits without silently changing the population being
    compared.
creativeDirection:
  id: motionAtlas.dose-cohort-return-paths.creativeDirection
  message:
    "Introduce the supplied cohort at the first visit arch. Slide later visit
    arches across the same identity lanes: a person enters an arch only when that visit
    is recorded, while missed, not-yet-due and unknown marks remain distinct. Hold the
    attendance fabric with separate visit numerators over one fixed cohort denominator
    before the opaque exit."
distinction:
  id: motionAtlas.dose-cohort-return-paths.distinction
  message:
    Unlike dot-matrix or status-cycle, each person retains identity across multiple
    visit gates, and missing observations stay spatially visible. Unlike
    missed-visit-reconnect, this compares the entire baseline cohort rather than the
    work of following up an already missed group.
prompt:
  id: motionAtlas.dose-cohort-return-paths.prompt
  message:
    Use The same cohort returns (dose-cohort-return-paths) for a fictional or
    approved authored example. Show who returned across visits without silently changing
    the population being compared.
