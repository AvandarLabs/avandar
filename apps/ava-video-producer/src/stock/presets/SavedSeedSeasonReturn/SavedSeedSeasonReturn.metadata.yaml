name:
  id: motionAtlas.saved-seed-season-return.name
  message: Save seed for the next planting
description:
  id: motionAtlas.saved-seed-season-return.description
  message: A household or cooperative chooses how much of its supplied harvest to retain
    as seed. The same seed lot crosses a fallow interval and returns to the same plot
    for sowing, with current use, recorded storage loss, and remaining seed kept
    visible.
category:
  id: motionAtlas.saved-seed-season-return.category
  message: Seasonal livelihood continuity
useWhen:
  id: motionAtlas.saved-seed-season-return.useWhen
  message: Explain how retaining part of a harvest connects one season's work to the next
    planting without promising a future yield.
prompt:
  id: motionAtlas.saved-seed-season-return.prompt
  message: Frames 0-11 reveal a schematic plot, harvested crop on a mat, and its named
    cultivator. Frames 12-48 show the cultivator sliding a chosen portion into a seed
    jar while the current-use portion stays on the mat. Frames 49-100 first close the
    jar as the backdrop changes to fallow ground. Only nonzero supplied storage loss
    briefly reopens it for extraction into the visible tray; the full loss portion
    clears before a smooth reclosure completed before frame 101. With zero loss, the
    storage jar stays closed after its initial closure. Frames 101-144 reopen the same
    jar as the cultivator draws a furrow in the same plot and sows the supplied amount.
    Frames 145-167 hold the sown furrow, remaining seed, current-use portion, and loss
    tray together. No sprouts or next harvest appear. Frames 168-179 fade to the common
    opaque ground for the six-second seam.
creativeDirection:
  id: motionAtlas.saved-seed-season-return.creativeDirection
  message: Frames 0-11 reveal a schematic plot, harvested crop on a mat, and its named
