motionBeats:
  - startFrame: 0
    endFrame: 11
    description:
      id: motionAtlas.saved-seed-season-return.beat.0
      message: Reveal the plot, harvest mat and cultivator.
  - startFrame: 12
    endFrame: 48
    description:
      id: motionAtlas.saved-seed-season-return.beat.1
      message: Move the reserved portion into the open jar with the cultivator hand.
  - startFrame: 49
    endFrame: 100
    description:
      id: motionAtlas.saved-seed-season-return.beat.2
      message: Close the jar for storage. Only nonzero supplied loss briefly opens it for
        extraction, with full clearance and smooth reclosure before planting at frame
        101. Zero-loss storage stays closed.
  - startFrame: 101
    endFrame: 144
    description:
      id: motionAtlas.saved-seed-season-return.beat.3
      message: Reopen the same jar and sow the supplied amount into the same plot.
  - startFrame: 145
    endFrame: 167
    description:
      id: motionAtlas.saved-seed-season-return.beat.4
      message: Hold current use, loss, sown seed and remaining seed.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.saved-seed-season-return.beat.5
      message: Fade to the common opaque ground without germination or a new harvest.
