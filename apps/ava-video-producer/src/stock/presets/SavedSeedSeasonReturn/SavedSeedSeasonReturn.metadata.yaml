goodFor:
  - id: motionAtlas.saved-seed-season-return.goodFor.0
    message: Explain a household's choice to retain seed from its own harvest
  - id: motionAtlas.saved-seed-season-return.goodFor.1
    message: Show how a cooperative carries a seed lot between agricultural seasons
  - id: motionAtlas.saved-seed-season-return.goodFor.2
    message: Distinguish seed reserved, seed actually sown, and seed remaining
notFor:
  - id: motionAtlas.saved-seed-season-return.notFor.0
    message: One crop, one decision maker, one schematic plot, and one harvest-to-planting
      interval. No real geography, household demographics, or cooperative membership
      count is inferred.
  - id: motionAtlas.saved-seed-season-return.notFor.1
    message: All material quantities are supplied or exact balance differences. The final
      balance is harvest = current use + storage loss + sown seed + remaining seed.
      Reservation is an intermediate subtotal, not an extra destination.
  - id: motionAtlas.saved-seed-season-return.notFor.2
    message: The seed glyphs illustrate the material and are not individual seeds, yield
      units, or counts of plants. Material bands use one common mass scale across the
      mat, jar, tray, and furrow; labels provide precise quantities.
  - id: motionAtlas.saved-seed-season-return.notFor.3
    message: Zero reservation leaves the jar empty and suppresses sowing. Zero storage loss
      leaves a labeled empty loss tray. Zero sowing keeps usable seed in storage. These
      cases never receive invented motion suggesting use.
  - id: motionAtlas.saved-seed-season-return.notFor.4
    message: This is neither seed-storage advice nor a germination, food-security, income,
      or efficacy claim. Storage practices, viability, weather, harvest costs, and the
      next yield are outside the scene. The supplied storage loss is recorded, never
      estimated from duration.
  - id: motionAtlas.saved-seed-season-return.notFor.5
    message: Sowing concludes the narrative. The editorial loop fades out before returning
      to the earlier harvest and does not imply that the sown seed immediately produced
      that harvest. All visible text comes from the supplied inputs or formatted
      quantities.
