intent:
  id: motionAtlas.saved-seed-season-return.intent
  message: Explain how retaining part of a harvest connects one season's work to the next
    planting without promising a future yield.
distinction:
  id: motionAtlas.saved-seed-season-return.distinction
  message: The same cultivator sets aside part of its own harvest and returns that
    physical seed to the same plot after a visible fallow interval. Its defining action
    is seasonal reuse as planting material, not donor allocation, replenishing retail
    shelves, a service handoff, or movement through pipeline boxes. Unlike
    battery-dispatch-balance, the material is placed into cultivated soil and the scene
    deliberately leaves biological outcomes unshown. No delivery, purchase, or new
    external stock restores the jar.
