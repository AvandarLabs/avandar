intent:
  id: motionAtlas.street-shade-installation.intent
  message: Connect an implementation choice to a clearly bounded change in shade coverage.
distinction:
  id: motionAtlas.street-shade-installation.distinction
  message:
    Canopies unfold into visible ground footprints and preserve uncovered area.
    This is a spatial intervention, not a chart of temperatures or a relabeled card
    collection.
