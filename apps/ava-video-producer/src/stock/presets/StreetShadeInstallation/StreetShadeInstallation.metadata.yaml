notFor:
  - id: motionAtlas.street-shade-installation.notFor.0
    message:
      Total ground area stays constant. Final shade = existing shade + supplied
      nonoverlapping additions; unshaded area = total ground - final shade.
  - id: motionAtlas.street-shade-installation.notFor.1
    message:
      The plan is schematic. Footprint tiling communicates area totals rather than
      real street geometry or a solar calculation.
  - id: motionAtlas.street-shade-installation.notFor.2
    message:
      Tree-canopy dimensions are authored for the named condition, not instantaneous
      tree growth. No temperature, exposure, health or measured efficacy claim is
      derived.
