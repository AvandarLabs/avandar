name:
  id: motionAtlas.street-shade-installation.name
  message: Place shade where people wait
description:
  id: motionAtlas.street-shade-installation.description
  message:
    Authored shade footprints unfold over a schematic street after a selected
    installation decision. The scene measures added shaded area at one stated sun
    condition without implying a temperature or health outcome.
category:
  id: motionAtlas.street-shade-installation.category
  message: Schematic plan with unfolding shade footprints
useWhen:
  id: motionAtlas.street-shade-installation.useWhen
  message: Connect an implementation choice to a clearly bounded change in shade coverage.
prompt:
  id: motionAtlas.street-shade-installation.prompt
  message:
    Reveal the supplied street zones with their existing shade footprints. At the
    installation cue, extend awnings or open canopy footprints over the authored
    nonoverlapping additions. Hold total shaded area against the complete zone area at
    the supplied reference condition, retaining the unshaded ground, then fade without
    implying a measured temperature reduction.
creativeDirection:
  id: motionAtlas.street-shade-installation.creativeDirection
  message:
    Reveal the supplied street zones with their existing shade footprints. At the
