notFor:
  - id: motionAtlas.specimen-aliquot-balance.notFor.0
    message: Exactly one source specimen is represented. Child-tube count is
      aliquots.length; total shown tube count is 1 + aliquots.length, regardless of
      whether the parent remainder is zero.
  - id: motionAtlas.specimen-aliquot-balance.notFor.1
    message:
      sum(aliquots.volume) must be <= parent.volume. Parent remainder is derived by
      subtraction, so source volume equals child volume plus remainder; no loss or
      separate remainder input exists.
  - id: motionAtlas.specimen-aliquot-balance.notFor.2
    message:
      Volume units are fictional schematic units. Tube geometry is illustrative, not
      a calibrated laboratory instrument or a practical aliquoting procedure.
  - id: motionAtlas.specimen-aliquot-balance.notFor.3
    message:
      This shows lineage and bookkeeping only. No assay, sample suitability,
      diagnostic result, laboratory method, or clinical recommendation is implied.
