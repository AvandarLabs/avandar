name:
  id: motionAtlas.specimen-aliquot-balance.name
  message: One sample, several aliquots
description:
  id: motionAtlas.specimen-aliquot-balance.description
  message:
    A parent specimen divides into labeled aliquot tubes while the parent identity
    stays visible. The remaining parent volume and the aliquot volumes reconcile
    exactly.
category:
  id: motionAtlas.specimen-aliquot-balance.category
  message: Material division and lineage
useWhen:
  id: motionAtlas.specimen-aliquot-balance.useWhen
  message:
    Show that splitting a specimen increases container count without creating more
    source specimens or volume.
intent:
  id: motionAtlas.specimen-aliquot-balance.intent
  message:
    Show that splitting a specimen increases container count without creating more
    source specimens or volume.
creativeDirection:
  id: motionAtlas.specimen-aliquot-balance.creativeDirection
  message:
    Reveal the parent sample tube with its supplied volume. Move only the authored
    aliquot volumes into their child tubes while identity tethers retain the parent
    relationship; the parent level falls by the transferred amount. Hold the remaining
    parent volume plus all child volumes beside a derived equality and a separate
    specimen-family count, then fade.
distinction:
  id: motionAtlas.specimen-aliquot-balance.distinction
  message:
    Unlike source-merge or network-graph, matter visibly divides rather than
    information merely branching, and the parent liquid level changes to preserve
    volume. Unlike specimen-custody-seal, this explicitly creates child containers while
    preserving one source identity.
prompt:
  id: motionAtlas.specimen-aliquot-balance.prompt
  message:
    Use One sample, several aliquots (specimen-aliquot-balance) for a fictional or
    approved authored example. Show that splitting a specimen increases container count
    without creating more source specimens or volume.
