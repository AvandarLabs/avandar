name:
  id: motionAtlas.atomic-outbox-commit.name
  message: Save the change and its delivery obligation together
description:
  id: motionAtlas.atomic-outbox-commit.description
  message: A local edit and its matching outbound journal entry sit under one transaction
    latch. Both become durable together, or neither does, so an accepted edit cannot
    lose the obligation to synchronize it.
category:
  id: motionAtlas.atomic-outbox-commit.category
  message: Atomic transaction boundary
useWhen:
  id: motionAtlas.atomic-outbox-commit.useWhen
  message: Bind a durable local change to its durable synchronization obligation.
prompt:
  id: motionAtlas.atomic-outbox-commit.prompt
  message: Bind a durable local change to its durable synchronization obligation.
creativeDirection:
  id: motionAtlas.atomic-outbox-commit.creativeDirection
  message: 960x600 React/SVG, shared palette, deterministic 180 frames at 30fps. Frames
    0-12 reveal the scene. Frames 13-55 write a local change and matching journal ticket
    on two halves of one sheet. Frames 56-110 close one shared commit latch. Frames
    111-139 stamp both halves when committed, or withdraw both provisional halves when
    aborted. Hold the resolved meaning during frames 140-165. Frames 166-179 return to
    the same opaque ground for a six-second loop; reset is editorial.
intent:
  id: motionAtlas.atomic-outbox-commit.intent
  message: Bind a durable local change to its durable synchronization obligation.
distinction:
  id: motionAtlas.atomic-outbox-commit.distinction
  message: Journal-receipts starts with an existing outbox and closes obligations after
    acknowledgment. This explains how the obligation is created atomically with the
    source mutation before any network activity.
