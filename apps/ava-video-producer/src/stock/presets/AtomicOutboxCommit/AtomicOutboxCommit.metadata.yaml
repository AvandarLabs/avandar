    message: Editorial illustration
aliases:
  - id: motionAtlas.atomic-outbox-commit.aliases.0
    message: atomic outbox commit
notFor:
  - id: motionAtlas.atomic-outbox-commit.notFor.0
    message: The shared transaction boundary is an authored protocol assumption.
  - id: motionAtlas.atomic-outbox-commit.notFor.1
    message: Atomic local commit does not imply exactly-once remote delivery.
  - id: motionAtlas.atomic-outbox-commit.notFor.2
    message: No network success is depicted. The committed journal entry remains pending.
  - id: motionAtlas.atomic-outbox-commit.notFor.3
    message: No real product screen, external fetch, supplied code execution, or measured
      performance claim. All text is authored; no JSX, functions or URLs in props.
  - id: motionAtlas.atomic-outbox-commit.notFor.4
    message: Supplied prose is preserved. Fictional framing, evidence and agreement between
      wording and selected states are authoring responsibilities. Runtime validation
      enforces structural bounds and explicit cross-field rules.
motionBeats:
  - startFrame: 13
    endFrame: 55
    description:
      id: motionAtlas.atomic-outbox-commit.motionBeats.0
      message: Write the local proposal and matching journal proposal.
  - startFrame: 56
    endFrame: 110
    description:
      id: motionAtlas.atomic-outbox-commit.motionBeats.1
      message: Close one latch around both provisional halves.
  - startFrame: 111
    endFrame: 139
    description:
      id: motionAtlas.atomic-outbox-commit.motionBeats.2
      message: Stamp both durable halves or withdraw both proposals.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.atomic-outbox-commit.motionBeats.3
      message: Hold the resolved relationship.
