notFor:
  - id: motionAtlas.nested-drilldown-window.notFor.literal-whitespace
    message:
      "Exact data uses amber underlined marks for whitespace: spaces, tabs, line
      breaks and other whitespace remain distinct from authored marker glyphs. Input,
      accessible text and equality preserve the original values."
  - id: motionAtlas.nested-drilldown-window.notFor.0
    message: All default records and group names are fictional.
  - id: motionAtlas.nested-drilldown-window.notFor.1
    message:
      Every slip denotes one supplied record; visible totals, if shown, must derive
      from records and exact-prefix matching.
  - id: motionAtlas.nested-drilldown-window.notFor.2
    message: No geographical shape or location precision is implied by area names.
  - id: motionAtlas.nested-drilldown-window.notFor.3
    message: At most two selection levels fit the six-second cycle.
  - id: motionAtlas.nested-drilldown-window.notFor.4
    message:
      Record text is re-laid out at a fixed font size rather than enlarged with a
      camera scale.
motionBeats:
  - startFrame: 12
    endFrame: 40
    description:
      id: motionAtlas.nested-drilldown-window.motionBeats.0
      message: Establish first-dimension groups.
  - startFrame: 40
    endFrame: 74
    description:
      id: motionAtlas.nested-drilldown-window.motionBeats.1
      message: Outline the selected parent and retain its context.
  - startFrame: 74
    endFrame: 118
    description:
      id: motionAtlas.nested-drilldown-window.motionBeats.2
      message: For two-level paths, open subgroups and select details.
  - startFrame: 118
    endFrame: 166
    description:
      id: motionAtlas.nested-drilldown-window.motionBeats.3
      message: Hold exactly the supplied breadcrumb and selected records.
