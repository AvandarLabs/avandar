name:
  id: motionAtlas.nested-drilldown-window.name
  message: Drill into a selected group
description:
  id: motionAtlas.nested-drilldown-window.description
  message:
    Nested selection windows isolate a group and then a subgroup while retaining
    the parent context. The remaining record tiles expand into readable detail without
    changing membership.
category:
  id: motionAtlas.nested-drilldown-window.category
  message: Nested focus
useWhen:
  id: motionAtlas.nested-drilldown-window.useWhen
  message: Show how a specific answer is reached by narrowing an explicit set of records.
creativeDirection:
  id: motionAtlas.nested-drilldown-window.creativeDirection
  message:
    Frames 12-40 show record slips organized by the first supplied dimension. A
    window outlines the first selected group, and other groups recede into a parent
    strip. For a two-element selectionPath, frames 74-118 open second-dimension
    compartments and isolate the supplied subgroup. For a one-element path, omit that
    second selection and move the first group directly into the detail region. Retain
    exactly the supplied selections in the breadcrumb, hold through frame 166, then use
    the shared opaque exit.
intent:
  id: motionAtlas.nested-drilldown-window.intent
  message: Show how a specific answer is reached by narrowing an explicit set of records.
distinction:
  id: motionAtlas.nested-drilldown-window.distinction
  message:
    Unlike dot-matrix, units do not arrive to illustrate a proportion. Existing
    named records retain identity while hierarchical membership determines which records
    occupy the detail view.
prompt:
  id: motionAtlas.nested-drilldown-window.prompt
  message:
    Use Motion Atlas "Drill into a selected group" (nested-drilldown-window) as a
    conceptual graphic. Show how a specific answer is reached by narrowing an explicit
    set of records. Replace fictional sample content with approved authored content
    before making product claims.
