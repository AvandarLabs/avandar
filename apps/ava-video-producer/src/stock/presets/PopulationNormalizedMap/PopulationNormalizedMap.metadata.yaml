    message: Prevent a large population from being mistaken for a high rate
notFor:
  - id: motionAtlas.population-normalized-map.notFor.0
    message:
      This displays arithmetic for supplied unique records, not disease incidence,
      individual risk, standardized rates, or causal inequity findings.
  - id: motionAtlas.population-normalized-map.notFor.1
    message:
      Population denominators must refer to the same geography, period and record
      universe. No uncertainty correction is inferred.
  - id: motionAtlas.population-normalized-map.notFor.2
    message: Separate labeled legends are mandatory because the two views use different units.
