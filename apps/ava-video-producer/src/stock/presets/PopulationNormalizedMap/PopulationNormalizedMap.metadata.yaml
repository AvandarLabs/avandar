name:
  id: motionAtlas.population-normalized-map.name
  message: Put the denominator on the map
description:
  id: motionAtlas.population-normalized-map.description
  message:
    A fictional zone map changes from record counts to records per supplied
    population. Each zone exposes its numerator and denominator before its fill changes
    under the new labeled legend.
category:
  id: motionAtlas.population-normalized-map.category
  message: geographic denominator reveal
useWhen:
  id: motionAtlas.population-normalized-map.useWhen
  message: Show how population size changes the meaning of a mapped count.
prompt:
  id: motionAtlas.population-normalized-map.prompt
  message:
    Begin with count-colored polygons. Lift each polygon like a shallow lid to
    reveal a numerator-over-denominator fraction, then settle it with the recalculated
    population-normalized shade. Replace the legend explicitly and hold both raw
    fractions so the change remains accountable.
creativeDirection:
  id: motionAtlas.population-normalized-map.creativeDirection
  message:
    Begin with count-colored polygons. Lift each polygon like a shallow lid to
    reveal a numerator-over-denominator fraction, then settle it with the recalculated
    population-normalized shade. Replace the legend explicitly and hold both raw
    fractions so the change remains accountable.
intent:
  id: motionAtlas.population-normalized-map.intent
  message: Show how population size changes the meaning of a mapped count.
distinction:
  id: motionAtlas.population-normalized-map.distinction
  message:
    The polygon physically exposes its denominator before changing the mapped
    measure. Unlike chart-focus-edit, the numeric measure changes; unlike bar-race, no
    items reorder and both numerator and denominator remain inspectable.
