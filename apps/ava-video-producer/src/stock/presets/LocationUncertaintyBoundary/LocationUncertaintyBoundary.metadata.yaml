goodFor:
  - id: motionAtlas.location-uncertainty-boundary.goodFor.0
    message: Explain geocoding precision
  - id: motionAtlas.location-uncertainty-boundary.goodFor.1
    message: Show boundary-sensitive location assignment
  - id: motionAtlas.location-uncertainty-boundary.goodFor.2
    message: Keep ambiguous records out of false geographic certainty
notFor:
  - id: motionAtlas.location-uncertainty-boundary.notFor.0
    message: A definite assignment requires the entire footprint strictly inside one
      district. Boundary-touching, crossing, or outside-district footprints remain
      unresolved.
  - id: motionAtlas.location-uncertainty-boundary.notFor.1
    message: No confidence level, probability, population exposure, or epidemiological
      relationship is inferred from a radius.
  - id: motionAtlas.location-uncertainty-boundary.notFor.2
    message: Definite plus unresolved records equal the location array length; ambiguous
      records are never counted once in each possible district.
