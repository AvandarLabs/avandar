motionBeats:
  - startFrame: 0
    endFrame: 35
    description:
      id: motionAtlas.location-uncertainty-boundary.beat.0
      message: Show nominal pins, district boundaries and keyed record/district callouts.
  - startFrame: 36
    endFrame: 107
    description:
      id: motionAtlas.location-uncertainty-boundary.beat.1
      message: Expand full uncertainty disks by frame 84, lift possible district labels, and
        shift unresolved accounting brackets.
  - startFrame: 108
    endFrame: 179
    description:
      id: motionAtlas.location-uncertainty-boundary.beat.2
      message: Hold strict full-disk assignments over every supplied location, including
        hidden nonfocused footprints.
