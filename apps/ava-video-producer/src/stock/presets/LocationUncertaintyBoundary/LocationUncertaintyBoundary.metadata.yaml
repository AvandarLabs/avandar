name:
  id: motionAtlas.location-uncertainty-boundary.name
  message: A pin can straddle a boundary
description:
  id: motionAtlas.location-uncertainty-boundary.description
  message: A schematic location pin unfolds into its supplied positional-uncertainty
    footprint. A footprint spanning two districts remains unresolved for district
    assignment rather than being forced into the district under its center.
category:
  id: motionAtlas.location-uncertainty-boundary.category
  message: spatial uncertainty propagation
useWhen:
  id: motionAtlas.location-uncertainty-boundary.useWhen
  message: Show how uncertain position limits an otherwise simple geographic classification.
prompt:
  id: motionAtlas.location-uncertainty-boundary.prompt
  message: Begin with district outlines and nominal location pins. Expand the focused pin
    into a translucent circle, letting its edge visibly cross the boundary. Lift the two
    possible district labels beside that footprint and move its accounting marker into
    an unresolved bracket. Hold definite and unresolved counts over all supplied
    records.
creativeDirection:
  id: motionAtlas.location-uncertainty-boundary.creativeDirection
  message: Begin with district outlines and nominal location pins. Expand the focused pin
    into a translucent circle, letting its edge visibly cross the boundary. Lift the two
    possible district labels beside that footprint and move its accounting marker into
    an unresolved bracket. Hold definite and unresolved counts over all supplied
    records.
intent:
  id: motionAtlas.location-uncertainty-boundary.intent
  message: Show how uncertain position limits an otherwise simple geographic classification.
distinction:
  id: motionAtlas.location-uncertainty-boundary.distinction
  message: A point expands into a bounded possible-position area, changing the certainty
    of spatial membership. Unlike environmental-observation-gaps, evidence is present
    but imprecisely located; unlike a scope aperture, the uncertainty belongs to the
    record itself.
