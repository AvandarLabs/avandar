name:
  id: motionAtlas.pooled-donor-allocation.name
  message: Pool support, preserve its purpose
description:
  id: motionAtlas.pooled-donor-allocation.description
  message:
    Contributor-marked demo credits gather in a transparent shared tray before
    being allocated to named funding requests. Earmarked credits keep their destination
    restriction, flexible credits can support different requests, and every unit remains
    attributable.
category:
  id: motionAtlas.pooled-donor-allocation.category
  message: Participatory resource allocation
useWhen:
  id: motionAtlas.pooled-donor-allocation.useWhen
  message: Show that pooling resources can preserve both donor attribution and
    restrictions on their use.
intent:
  id: motionAtlas.pooled-donor-allocation.intent
  message: Show that pooling resources can preserve both donor attribution and
    restrictions on their use.
creativeDirection:
  id: motionAtlas.pooled-donor-allocation.creativeDirection
  message:
    Over six seconds, contributors tip small stacks of individually marked
    demo-credit tokens into a transparent shared tray. Earmarked tokens retain their
    destination ribbon; flexible tokens retain a distinct flexible marker. A community
    coordinator slides the configured tokens into labeled funding-request envelopes,
    preserving donor marks and respecting every earmark, while any unallocated tokens
    stay in the tray. Set each funded envelope upright with contributor marks visible
    above its edge, and hold the allocation totals alongside the remaining pool without
    transforming money into goods before the shared opaque exit fade. No token changes
    value, duplicates, or loses attribution.
distinction:
  id: motionAtlas.pooled-donor-allocation.distinction
  message:
    Unlike source-merge, pooling is followed by a constrained physical allocation
    into separate funding requests, and contributor identity survives the entire
    sequence. The hero action is sorting and retaining attributed, restricted units, not
    convergence toward one destination or a fundraising counter.
prompt:
  id: motionAtlas.pooled-donor-allocation.prompt
  message:
    Pool support, preserve its purpose. Show that pooling resources can preserve
    both donor attribution and restrictions on their use.
