    description:
      id: motionAtlas.pooled-donor-allocation.motionBeats.2
      message:
        The coordinator slides each configured request batch on a clear scoop,
        withdraws the support and sets the envelopes upright.
  - startFrame: 133
    endFrame: 167
    description:
      id: motionAtlas.pooled-donor-allocation.motionBeats.3
      message: Hold all donor marks, earmarks, allocation totals and residual credits.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.pooled-donor-allocation.motionBeats.4
      message: Return to the opaque ground through the shared envelope.
