notFor:
  - id: motionAtlas.pooled-donor-allocation.notFor.0
    message:
      Every token is exactly one fictional demo credit; total contributions equal
      total allocations plus the visibly retained pool. Totals and residuals are
      derived, never separately authored.
  - id: motionAtlas.pooled-donor-allocation.notFor.1
    message:
      Earmarked credits cannot move to another request. Flexible credits may be split
      only as explicitly configured, and donor marks remain visible throughout.
  - id: motionAtlas.pooled-donor-allocation.notFor.2
    message:
      Funding envelopes represent planned spending allocations only. No conversion
      into goods, people served, delivery completion, or impact is implied.
  - id: motionAtlas.pooled-donor-allocation.notFor.3
    message:
      The scene is a small authored example, not accounting software, a fundraising
      transaction, a financial recommendation, or real donor reporting.
  - id: motionAtlas.pooled-donor-allocation.notFor.4
    message:
      Literal donor whitespace is shown with styled whitespace marks; original input
      remains exact.
motionBeats:
