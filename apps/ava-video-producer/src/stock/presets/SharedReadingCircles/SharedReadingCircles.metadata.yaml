intent:
  id: motionAtlas.shared-reading-circles.intent
  message:
    Make a specific book-sharing arrangement concrete while preserving the material
    inventory.
distinction:
  id: motionAtlas.shared-reading-circles.distinction
  message:
    Physical seats reorganize around a conserved set of open books and a shared
    page turn. This explains simultaneous access to one object, unlike shelf
    replenishment, source merging, or relabeling a collection of cards.
