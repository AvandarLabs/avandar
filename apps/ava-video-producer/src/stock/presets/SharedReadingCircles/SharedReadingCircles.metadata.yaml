notFor:
  - id: motionAtlas.shared-reading-circles.notFor.0
    message:
      One books entry is one physical copy. A page turn never creates another copy,
      and the inventory is constant across the animation.
  - id: motionAtlas.shared-reading-circles.notFor.1
    message:
      Each learner belongs to one shown reading group. The default group count is 3
      of 6 represented learners per book, while the class inventory is 2 books for 6
      learners.
  - id: motionAtlas.shared-reading-circles.notFor.2
    message:
      Grouping does not establish that all learners can see, read, or benefit from
      the material. The arrangement is not an adequacy threshold or an access-impact
      claim.
  - id: motionAtlas.shared-reading-circles.notFor.3
    message: All books, passages, and learners are fictional schematic examples.
motionBeats:
  - startFrame: 0
    endFrame: 23
    description:
      id: motionAtlas.shared-reading-circles.motionBeats.0
      message:
        Reveal the conserved books on the chosen shelf and the full roster at separate
        seats.
  - startFrame: 24
    endFrame: 43
    description:
      id: motionAtlas.shared-reading-circles.motionBeats.1
      message:
        Front-shelf readers approach vertically from separate group seats. Side-shelf
        readers reach their copies in top-to-bottom order.
  - startFrame: 44
    endFrame: 103
    description:
      id: motionAtlas.shared-reading-circles.motionBeats.2
      message:
        Carry front-shelf books together. Side-shelf carriers lift and carry copies
        through a shared upper lane in staggered turns, keeping reader keys distinct.
  - startFrame: 104
    endFrame: 115
    description:
      id: motionAtlas.shared-reading-circles.motionBeats.3
      message:
        Both shelf arrangements finish chair pivots by 108. Side-shelf books continue
        opening to 118, when their group counts appear.
  - startFrame: 116
    endFrame: 141
    description:
      id: motionAtlas.shared-reading-circles.motionBeats.4
      message:
        "Each copy turns one page: front-shelf books from 116 to 132 and side-shelf
        books from 126 to 142. Inventory stays fixed."
  - startFrame: 142
    endFrame: 179
    description:
      id: motionAtlas.shared-reading-circles.motionBeats.5
      message: Hold group membership and optional array-derived counts through the shared fade.
