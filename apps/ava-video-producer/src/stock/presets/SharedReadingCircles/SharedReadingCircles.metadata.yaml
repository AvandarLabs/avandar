name:
  id: motionAtlas.shared-reading-circles.name
  message: Bring the readers around the books
description:
  id: motionAtlas.shared-reading-circles.description
  message:
    A fixed set of books moves from a classroom shelf to small reading circles.
    Learners gather around the same open pages, making the sharing arrangement visible
    without creating additional copies.
category:
  id: motionAtlas.shared-reading-circles.category
  message: Shared classroom resources
useWhen:
  id: motionAtlas.shared-reading-circles.useWhen
  message:
    Make a specific book-sharing arrangement concrete while preserving the material
    inventory.
prompt:
  id: motionAtlas.shared-reading-circles.prompt
  message:
    Reveal the supplied books on a shelf and the learners at separate seats. Carry
    each book to its assigned shared table as seats pivot into the authored reading
    circles, preserving every learner identity. Open the books and turn one page within
    each circle. Hold reader counts against the class roster with the book inventory
    unchanged, then fade.
creativeDirection:
  id: motionAtlas.shared-reading-circles.creativeDirection
  message:
    Reveal the supplied books on a shelf and the learners at separate seats. Carry
