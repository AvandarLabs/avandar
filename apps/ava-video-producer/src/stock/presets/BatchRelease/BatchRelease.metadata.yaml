notFor:
  - id: motionAtlas.batch-release.notFor.0
    message:
      Default groups and items are fictional; every token is one supplied item and
      every envelope is one supplied batch.
  - id: motionAtlas.batch-release.notFor.1
    message:
      The authored membership defines completion; no scheduler, elapsed-time rule,
      transaction guarantee, or automatic grouping algorithm is implied.
  - id: motionAtlas.batch-release.notFor.2
    message: No processing-efficiency or cost improvement is quantified by the animation.
motionBeats:
  - startFrame: 18
    endFrame: 68
    description:
      id: motionAtlas.batch-release.motionBeats.0
      message: Collect every member before closing the first envelope.
  - startFrame: 82
    endFrame: 112
    description:
      id: motionAtlas.batch-release.motionBeats.1
      message: Move the complete envelope across dispatch.
  - startFrame: 94
