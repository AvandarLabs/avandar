name:
  id: motionAtlas.batch-release.name
  message: Collect, then release a batch
description:
  id: motionAtlas.batch-release.description
  message:
    Individual items wait together inside a forming batch boundary. Once every item
    in the supplied group arrives, the boundary closes and the group crosses the
    dispatch boundary as one unit.
category:
  id: motionAtlas.batch-release.category
  message: Work grouping
useWhen:
  id: motionAtlas.batch-release.useWhen
  message: Show why individual arrivals are held and then handled together.
prompt:
  id: motionAtlas.batch-release.prompt
  message: Show why individual arrivals are held and then handled together.
creativeDirection:
  id: motionAtlas.batch-release.creativeDirection
  message:
    After the entrance, item tokens arrive separately at a shallow loading cradle
    during 18..62. A bracket grows around the supplied group but remains open while any
    member is missing. At 68, the final item docks, the bracket closes into an envelope,
    and the supplied release caption appears. During 82..112, the envelope crosses one
    dispatch line with its member tokens still visible inside. If a second batch is
    supplied, its shorter arrival and release sequence occupies 94..146 in a second
    cradle. Hold the released envelopes and their exact contents through 168, then fade
    to ground. The transformation is many arrivals becoming one handled bundle without
    combining their contents.
intent:
  id: motionAtlas.batch-release.intent
  message: Show why individual arrivals are held and then handled together.
distinction:
  id: motionAtlas.batch-release.distinction
  message:
    Source-merge converges inputs into a shared destination; this preserves
    separate items inside a new handling boundary and explains the wait before one
    dispatch. The batch envelope, not a relabeled row of cards, is the hero
    transformation.
