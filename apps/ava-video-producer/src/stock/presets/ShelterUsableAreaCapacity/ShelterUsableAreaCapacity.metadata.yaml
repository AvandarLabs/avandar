goodFor:
  - id: motionAtlas.shelter-usable-area-capacity.goodFor.0
    message: Explain gross versus usable shelter area
  - id: motionAtlas.shelter-usable-area-capacity.goodFor.1
    message: Make an area-only capacity assumption visible
  - id: motionAtlas.shelter-usable-area-capacity.goodFor.2
    message: Discuss displaced-population shelter planning without implying a safety standard
notFor:
  - id: motionAtlas.shelter-usable-area-capacity.notFor.0
    message: The floor plan is schematic and all default figures are fictional. The divisor
      is not a humanitarian, legal, health, or safety recommendation.
  - id: motionAtlas.shelter-usable-area-capacity.notFor.1
    message: Sleeping, circulation, storage and closed areas must sum to gross area. Only
      sleeping tiles contribute to the illustrated numerator.
  - id: motionAtlas.shelter-usable-area-capacity.notFor.2
    message: Area-only place equivalents are not operational shelter capacity; layout,
      safeguarding, access, household composition and other constraints are not modeled.
