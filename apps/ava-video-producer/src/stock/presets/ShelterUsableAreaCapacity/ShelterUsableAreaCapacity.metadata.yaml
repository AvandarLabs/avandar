name:
  id: motionAtlas.shelter-usable-area-capacity.name
  message: Capacity starts with usable floor area
description:
  id: motionAtlas.shelter-usable-area-capacity.description
  message: A fictional shelter floor plan separates sleeping area from circulation,
    storage and closed space. Only the remaining area enters an explicitly authored
    area-per-place calculation, which is compared with registered people.
category:
  id: motionAtlas.shelter-usable-area-capacity.category
  message: usable-space accounting
useWhen:
  id: motionAtlas.shelter-usable-area-capacity.useWhen
  message: Expose the space exclusions and assumed denominator behind an illustrative
    capacity figure.
prompt:
  id: motionAtlas.shelter-usable-area-capacity.prompt
  message: Begin with one gross floor outline. Raise the non-sleeping tiles into shallow
    labeled cutaways, revealing the smaller sleeping-area footprint beneath. Unroll only
    that usable area into a measured strip, divide it by the supplied illustration
    benchmark, and hold the resulting place equivalents beside registered people and any
    shortfall.
creativeDirection:
  id: motionAtlas.shelter-usable-area-capacity.creativeDirection
  message: Begin with one gross floor outline. Raise the non-sleeping tiles into shallow
    labeled cutaways, revealing the smaller sleeping-area footprint beneath. Unroll only
    that usable area into a measured strip, divide it by the supplied illustration
    benchmark, and hold the resulting place equivalents beside registered people and any
    shortfall.
intent:
  id: motionAtlas.shelter-usable-area-capacity.intent
  message: Expose the space exclusions and assumed denominator behind an illustrative
    capacity figure.
distinction:
  id: motionAtlas.shelter-usable-area-capacity.distinction
  message: The hero action subtracts unusable floor geometry before dividing the remaining
    area by an explicit assumption. Unlike compute-capacity-consolidation, nothing is
    packed or migrated; unlike queue-relief, no service slots open or waiting people
    move.
