notFor:
  - id: motionAtlas.reject-and-replace.notFor.0
    message: Exactly one rejection and one replacement are shown.
  - id: motionAtlas.reject-and-replace.notFor.1
    message:
      Selection is authored, not calculated from the wording or treated as a
      universal recommendation.
  - id: motionAtlas.reject-and-replace.notFor.2
    message: Rejection styling must not make the rejected option or rationale unreadable.
distinction:
  id: motionAtlas.reject-and-replace.distinction
  message:
    Unlike status-cycle, two distinct alternatives exchange one selection role and
    retain a visible reason for rejection. The hero action is the replacement of an
    option, not progress through states.
