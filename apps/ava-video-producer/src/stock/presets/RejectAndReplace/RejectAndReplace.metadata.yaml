  - id: motionAtlas.reject-and-replace.tags.7
    message: switch approach
useWhen:
  id: motionAtlas.reject-and-replace.useWhen
  message: Explain a deliberate replacement through a clear selection criterion.
prompt:
  id: motionAtlas.reject-and-replace.prompt
  message:
    Use Motion Atlas "Choose the replacement" (reject-and-replace) as a conceptual
    graphic. Explain a deliberate replacement through a clear selection criterion. Keep
    the restrained motion and readable labels; replace sample content with approved
    facts before making product claims.
creativeDirection:
  id: motionAtlas.reject-and-replace.creativeDirection
  message:
    A proposed label settles into a central selection slot beneath a criterion. A
    small strike crosses its selection marker, then the option slides into a left-side
    rejected position as its reason appears. The replacement enters the vacated slot
    from the right, receives a selection bracket, and holds with its rationale and the
    original choice still readable before the shared fade.
goodFor:
  - id: motionAtlas.reject-and-replace.goodFor.0
    message: Explain why an initial approach was discarded
  - id: motionAtlas.reject-and-replace.goodFor.1
    message: Introduce a replacement tool or technique
  - id: motionAtlas.reject-and-replace.goodFor.2
    message: Show a choice changing when a constraint becomes explicit
intent:
  id: motionAtlas.reject-and-replace.intent
  message: Explain a deliberate replacement through a clear selection criterion.
