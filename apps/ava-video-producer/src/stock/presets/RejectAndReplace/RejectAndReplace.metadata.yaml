name:
  id: motionAtlas.reject-and-replace.name
  message: Choose the replacement
description:
  id: motionAtlas.reject-and-replace.description
  message:
    An initially proposed option fails a stated criterion, moves aside, and hands
    the same position to a selected replacement. The rejected option stays visible with
    its authored reason.
category:
  id: motionAtlas.reject-and-replace.category
  message: Choice and revision
