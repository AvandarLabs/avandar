notFor:
  - id: motionAtlas.aquifer-allocation-balance.notFor.0
    message: Initial storage + recharge = final storage + natural outflow + approved
      withdrawal. Unallocated requests are quantities of demand, not water stored
      elsewhere.
  - id: motionAtlas.aquifer-allocation-balance.notFor.1
    message: The diagram treats only listed boundary flows and a single accounting period.
      Water level, pressure, quality, ecological needs and lateral flow are not
      simulated.
  - id: motionAtlas.aquifer-allocation-balance.notFor.2
    message: Neither final storage nor a reduced request proves sustainable use, legal
      compliance or equity. Defaults and the cutaway are fictional.
