name:
  id: motionAtlas.aquifer-allocation-balance.name
  message: Budget the water below ground
description:
  id: motionAtlas.aquifer-allocation-balance.description
  message: A subsurface water store changes as recharge and approved withdrawals cross its
    boundary. A planner reduces an authored request to an approved allocation while the
    final storage and remaining request stay explicit.
category:
  id: motionAtlas.aquifer-allocation-balance.category
  message: Subsurface reservoir and allocation valve
useWhen:
  id: motionAtlas.aquifer-allocation-balance.useWhen
  message: Make the storage consequence of a human allocation decision visible.
prompt:
  id: motionAtlas.aquifer-allocation-balance.prompt
  message: Use Budget the water below ground (aquifer-allocation-balance) with complete
    authored inputs and preserve the stated limits.
creativeDirection:
  id: motionAtlas.aquifer-allocation-balance.creativeDirection
  message: Reveal a schematic aquifer at its supplied initial storage and the requested
    withdrawal beside it. A planner sets the authored approved withdrawal; show recharge
    entering while pumping and natural outflow leave through distinct paths. Hold the
    derived remaining storage and any unmet portion of the request, then fade without
    refilling the aquifer.
intent:
  id: motionAtlas.aquifer-allocation-balance.intent
  message: Make the storage consequence of a human allocation decision visible.
distinction:
  id: motionAtlas.aquifer-allocation-balance.distinction
  message: The visible store changes because of bounded inflow and outflow, and a hollow
    unfulfilled request is deliberately excluded from physical water. This is an
    allocation-and-stock explanation rather than a generic flow chart.
