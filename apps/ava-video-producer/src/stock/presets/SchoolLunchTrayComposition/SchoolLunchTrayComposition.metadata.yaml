name:
  id: motionAtlas.school-lunch-tray-composition.name
  message: What reaches the lunch table
description:
  id: motionAtlas.school-lunch-tray-composition.description
  message: School lunch trays are assembled from an explicit list of planned components,
    with an unfilled component kept visible. The scene distinguishes a tray being served
    from a tray matching the stated plan.
category:
  id: motionAtlas.school-lunch-tray-composition.category
  message: Meal assembly at a learning setting
useWhen:
  id: motionAtlas.school-lunch-tray-composition.useWhen
  message: Make the contents and omissions of a stated school meal plan visible.
prompt:
  id: motionAtlas.school-lunch-tray-composition.prompt
  message: Reveal the supplied learners at a lunch table with their outlined planned
    trays. Serving utensils place only the authored components into the matching
    compartments; missing planned components retain their outlines. Bring trays to their
    places and hold the complete-plan numerator against every planned tray without
    marking a learner as deficient. Fade through the shared opaque ground.
creativeDirection:
  id: motionAtlas.school-lunch-tray-composition.creativeDirection
  message: Reveal the supplied learners at a lunch table with their outlined planned
    trays. Serving utensils place only the authored components into the matching
    compartments; missing planned components retain their outlines. Bring trays to their
    places and hold the complete-plan numerator against every planned tray without
    marking a learner as deficient. Fade through the shared opaque ground.
intent:
  id: motionAtlas.school-lunch-tray-composition.intent
  message: Make the contents and omissions of a stated school meal plan visible.
distinction:
  id: motionAtlas.school-lunch-tray-composition.distinction
  message: The hero action assembles physical meal components into separate tray
    compartments and preserves a planned-but-unfilled compartment. It is not a generic
    delivery handoff, shopping basket choice, or a population counter.
