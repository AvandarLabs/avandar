notFor:
  - id: motionAtlas.school-lunch-tray-composition.notFor.0
    message: The complete-plan numerator counts trays containing every supplied planned
      component. Its denominator is all trays, which is also the learner array length in
      this single meal occasion.
  - id: motionAtlas.school-lunch-tray-composition.notFor.1
    message: A component symbol means the component is listed as present. Its area does not
      encode calories, portion size, nutrient content, or actual consumption.
  - id: motionAtlas.school-lunch-tray-composition.notFor.2
    message: Matching the list does not establish a balanced diet, nutritional sufficiency,
      health improvement, or learning impact. Missing a component does not describe a
      learner's health.
  - id: motionAtlas.school-lunch-tray-composition.notFor.3
    message: The example covers one fictional meal occasion and cannot represent repeated
      meals or unique reach across days.
motionBeats:
  - startFrame: 0
    endFrame: 35
    description:
      id: motionAtlas.SchoolLunchTrayComposition.beat.0
      message: Reveal the full learner roster, outlined planned trays and named component
        legend.
  - startFrame: 36
    endFrame: 85
    description:
      id: motionAtlas.SchoolLunchTrayComposition.beat.1
      message: Serving spoons place each authored component into its compartment in four
        bounded twelve-frame turns. Empty subsets receive no food.
  - startFrame: 88
    endFrame: 107
    description:
      id: motionAtlas.SchoolLunchTrayComposition.beat.2
      message: "Slide every tray 24 diagram pixels into its table place, retaining learner
        identity. When enabled, unfilled compartments receive one neutral outline-width
        pulse: rise from 1 to 2 pixels during frames 88-92, hold through 100, then
        return to 1 pixel by 104."
  - startFrame: 108
    endFrame: 179
    description:
      id: motionAtlas.SchoolLunchTrayComposition.beat.3
      message: Hold the complete-plan numerator over all planned trays through the shared fade.
