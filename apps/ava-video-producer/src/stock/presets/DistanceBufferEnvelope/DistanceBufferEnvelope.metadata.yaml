notFor:
  - id: motionAtlas.distance-buffer-envelope.notFor.0
    message: No real ground-distance projection or travel network is used.
  - id: motionAtlas.distance-buffer-envelope.notFor.1
    message: Inside a distance buffer does not imply access, safety, capacity or service
      coverage.
  - id: motionAtlas.distance-buffer-envelope.notFor.2
    message: Only the supplied locations form the denominator.
  - id: motionAtlas.distance-buffer-envelope.notFor.3
    message: No external requests, URLs, JSX or functions in props. Supplied examples are
      fictional.
  - id: motionAtlas.distance-buffer-envelope.notFor.4
    message: Authored prose remains the author’s responsibility. Runtime validation
      preserves supplied text without classifying its language or factual claims.
