name:
  id: motionAtlas.distance-buffer-envelope.name
  message: A buffer is a distance rule
description:
  id: motionAtlas.distance-buffer-envelope.description
  message: A schematic point emits an equal-distance envelope. Nearby supplied locations
    are classified by the explicit straight-line radius, while a distance ruler shows
    that the envelope is not a travel-time boundary.
category:
  id: motionAtlas.distance-buffer-envelope.category
  message: Geometric distance buffering
useWhen:
  id: motionAtlas.distance-buffer-envelope.useWhen
  message: Define straight-line spatial inclusion without implying travel access.
prompt:
  id: motionAtlas.distance-buffer-envelope.prompt
  message: 960x600 React/SVG with shared palette, deterministic 180 frames at 30fps.
    Reveal at frames 0-12. Frames 13-50 anchor the center and radius ruler. Frames
    51-105 sweep a compass arm to draw the distance circle. Frames 106-139 compare each
    location distance with the radius and collect only qualifying IDs in a separate
    ledger. Hold the resolved state at 140-165; fade to the same opaque ground at
    166-179. Reset is editorial.
creativeDirection:
  id: motionAtlas.distance-buffer-envelope.creativeDirection
  message: 960x600 React/SVG with shared palette, deterministic 180 frames at 30fps.
    Reveal at frames 0-12. Frames 13-50 anchor the center and radius ruler. Frames
    51-105 sweep a compass arm to draw the distance circle. Frames 106-139 compare each
    location distance with the radius and collect only qualifying IDs in a separate
    ledger. Hold the resolved state at 140-165; fade to the same opaque ground at
    166-179. Reset is editorial.
intent:
  id: motionAtlas.distance-buffer-envelope.intent
  message: Define straight-line spatial inclusion without implying travel access.
distinction:
  id: motionAtlas.distance-buffer-envelope.distinction
  message: Catchment-union-gaps combines supplied coverage polygons. This derives a buffer
    from a distance rule and classifies points without inferring service use or routes.
