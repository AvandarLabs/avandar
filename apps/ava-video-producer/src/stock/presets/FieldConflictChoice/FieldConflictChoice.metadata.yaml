notFor:
  - id: motionAtlas.field-conflict-choice.notFor.literal-whitespace
    message:
      "Exact data uses amber underlined marks for whitespace: spaces, tabs, line
      breaks and other whitespace remain distinct from authored marker glyphs. Input,
      accessible text and equality preserve the original values."
  - id: motionAtlas.field-conflict-choice.notFor.0
    message: All default values and choices are fictional.
  - id: motionAtlas.field-conflict-choice.notFor.1
    message:
      The supplied choice is an editorial decision, not a recommendation, confidence
      score, or automatic truth finding.
  - id: motionAtlas.field-conflict-choice.notFor.2
    message: The animation neither edits source records nor discards alternatives.
  - id: motionAtlas.field-conflict-choice.notFor.3
    message: No timestamp priority or source authority is inferred.
