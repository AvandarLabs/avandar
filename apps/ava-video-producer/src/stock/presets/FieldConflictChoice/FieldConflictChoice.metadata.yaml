name:
  id: motionAtlas.field-conflict-choice.name
  message: Reconcile conflicting values
description:
  id: motionAtlas.field-conflict-choice.description
  message:
    Alternative values for the same record remain visible while explicit per-field
    choices build a reconciled result. Unresolved fields stay open instead of receiving
    an automatic answer.
category:
  id: motionAtlas.field-conflict-choice.category
  message: Decision comparison
useWhen:
  id: motionAtlas.field-conflict-choice.useWhen
  message:
    Show that combining records can require explicit decisions rather than silent
    overwrites.
creativeDirection:
  id: motionAtlas.field-conflict-choice.creativeDirection
  message:
    Frames 12-42 show one record with parallel source columns. Between frames
    42-112, authored choice rails move toward the selected source for each resolved
    field, lifting that value into the result column. An unresolved field keeps both
    alternatives separated by a review bracket. Rejected alternatives remain in a
    quieter side ledger when enabled. Hold resolved and unresolved fields together
    through frame 166 before exiting.
intent:
  id: motionAtlas.field-conflict-choice.intent
  message:
    Show that combining records can require explicit decisions rather than silent
    overwrites.
distinction:
  id: motionAtlas.field-conflict-choice.distinction
  message:
    Unlike source-merge and schema-mapping, this centers disagreement and explicit
    per-field choices. It never turns multiple inputs into an unexplained single answer.
prompt:
  id: motionAtlas.field-conflict-choice.prompt
  message:
    Use Motion Atlas "Reconcile conflicting values" (field-conflict-choice) as a
    conceptual graphic. Show that combining records can require explicit decisions
    rather than silent overwrites. Replace fictional sample content with approved
    authored content before making product claims.
