name:
  id: motionAtlas.custody-transfer.name
  message: Release After Acceptance
description:
  id: motionAtlas.custody-transfer.description
  message: A work object remains supported by its current holder until the next holder
    visibly accepts it. Acknowledgment changes responsibility before the first support
    withdraws.
category:
  id: motionAtlas.custody-transfer.category
  message: Custody and responsibility
useWhen:
  id: motionAtlas.custody-transfer.useWhen
  message: Show that responsibility transfers only after the receiving party accepts the
    handoff.
prompt:
  id: motionAtlas.custody-transfer.prompt
  message: Show that responsibility transfers only after the receiving party accepts the
    handoff.
creativeDirection:
  id: motionAtlas.custody-transfer.creativeDirection
  message: Reveal one labeled object held by the sender's bracket. The receiving bracket
    approaches from the opposite side and makes contact while the sender still supports
    the object. In the accepted outcome, the recipient's acknowledgment seal lands, the
    responsibility marker crosses the shared contact zone, and only then does the sender
    withdraw. In the waiting outcome, retain sender support and hold at the contact zone
    without an ownership change. Finish on an unambiguous owner state within the
    six-second envelope.
intent:
  id: motionAtlas.custody-transfer.intent
  message: Show that responsibility transfers only after the receiving party accepts the
    handoff.
distinction:
  id: motionAtlas.custody-transfer.distinction
  message: The key action is overlapping physical support with delayed release, not a task
    passing through pipeline stages. Unlike journal-receipts, there is one
    responsibility marker and custody changes only after acceptance.
