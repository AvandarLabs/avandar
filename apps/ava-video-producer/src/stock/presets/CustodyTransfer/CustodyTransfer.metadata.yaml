notFor:
  - id: motionAtlas.custody-transfer.notFor.0
    message: Exactly one object and two holders are depicted. Temporary double support does
      not mean duplicate ownership.
  - id: motionAtlas.custody-transfer.notFor.1
    message: Acceptance is authored data, not a verified signature, legal transfer, or live
      confirmation.
  - id: motionAtlas.custody-transfer.notFor.2
    message: This scene does not prescribe a legal chain-of-custody process or imply
      real-world compliance.
  - id: motionAtlas.custody-transfer.notFor.3
    message: Acceptance of responsibility does not prove that documentation, skills, access,
      funding, or a maintainable codebase are sufficient. A continuity story may need
      separate evidence for those prerequisites.
