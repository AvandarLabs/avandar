name:
  id: motionAtlas.resumable-byte-transfer.name
  message: Continue after the acknowledged byte
description:
  id: motionAtlas.resumable-byte-transfer.description
  message:
    A bounded file strip crosses in chunks. After an interruption, the sender
    resumes at the stored acknowledgment offset while the already confirmed prefix stays
    in place.
category:
  id: motionAtlas.resumable-byte-transfer.category
  message: Resumable transport
useWhen:
  id: motionAtlas.resumable-byte-transfer.useWhen
  message: Distinguish confirmed progress from work that must be retransmitted.
prompt:
  id: motionAtlas.resumable-byte-transfer.prompt
  message: Distinguish confirmed progress from work that must be retransmitted.
creativeDirection:
  id: motionAtlas.resumable-byte-transfer.creativeDirection
  message:
    960x600 React/SVG, shared palette, deterministic 180 frames at 30fps. Frames
    0-12 reveal the scene. Frames 13-55 transfer chunks to the acknowledged boundary.
    Frames 56-90 interrupt one unacknowledged segment without adding it to confirmed
    progress. Frames 91-139 restart at the confirmed offset and append the remaining
    chunks. Hold the resolved meaning during frames 140-165. Frames 166-179 return to
    the same opaque ground for a six-second loop; reset is editorial.
intent:
  id: motionAtlas.resumable-byte-transfer.intent
  message: Distinguish confirmed progress from work that must be retransmitted.
distinction:
  id: motionAtlas.resumable-byte-transfer.distinction
  message:
    Retry-backoff repeats whole attempts. This retains a confirmed prefix and
    resumes by byte offset, so interruption does not restart the entire file.
