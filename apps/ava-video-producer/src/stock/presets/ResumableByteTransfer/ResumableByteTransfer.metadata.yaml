notFor:
  - id: motionAtlas.resumable-byte-transfer.notFor.0
    message:
      Confirmed means acknowledged in this authored protocol, not independently
      verified integrity.
  - id: motionAtlas.resumable-byte-transfer.notFor.1
    message: No compression ratio, transfer speed or duration is measured.
  - id: motionAtlas.resumable-byte-transfer.notFor.2
    message: Final short chunk uses exact remaining bytes.
  - id: motionAtlas.resumable-byte-transfer.notFor.3
    message:
      No real product screen, external fetch, supplied code execution, or measured
      performance claim. All text is authored; no JSX, functions or URLs in props.
  - id: motionAtlas.resumable-byte-transfer.notFor.4
    message:
      Supplied prose is preserved. Fictional framing, evidence and agreement between
      wording and selected states are authoring responsibilities. Runtime validation
      enforces structural bounds and explicit cross-field rules.
motionBeats:
  - startFrame: 13
    endFrame: 55
    description:
      id: motionAtlas.resumable-byte-transfer.motionBeats.0
      message: Transfer the exact acknowledged prefix.
  - startFrame: 56
    endFrame: 90
    description:
      id: motionAtlas.resumable-byte-transfer.motionBeats.1
      message: Interrupt an unacknowledged chunk without confirming it.
  - startFrame: 91
    endFrame: 139
    description:
      id: motionAtlas.resumable-byte-transfer.motionBeats.2
      message: Resume from the stored boundary and append exact chunks.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.resumable-byte-transfer.motionBeats.3
      message: Hold the resolved relationship.
