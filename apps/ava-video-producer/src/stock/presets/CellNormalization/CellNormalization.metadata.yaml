name:
  id: motionAtlas.cell-normalization.name
  message: Clean values in place
description:
  id: motionAtlas.cell-normalization.description
  message: A stable table exposes small inconsistencies, then replaces only the authored
    changed characters. Original values remain available as a compact comparison rail.
category:
  id: motionAtlas.cell-normalization.category
  message: In-place transformation
useWhen:
  id: motionAtlas.cell-normalization.useWhen
  message: Make small, explicit data corrections understandable and reviewable.
creativeDirection:
  id: motionAtlas.cell-normalization.creativeDirection
  message: Frames 12-40 reveal the table with before values and optional visible
    whitespace marks. During frames 40-112, changed cells receive narrow edit brackets;
    extra-space marks contract and changed glyphs crossfade into their supplied
    replacements without moving the rows. A thin original-value rail unfolds alongside
    the cleaned column. Hold both states through frame 166, then fade to the opaque
    ground.
intent:
  id: motionAtlas.cell-normalization.intent
  message: Make small, explicit data corrections understandable and reviewable.
distinction:
  id: motionAtlas.cell-normalization.distinction
  message: Unlike schema-mapping, field identity never changes and no
    source-to-destination connectors appear. The explanatory action occurs inside
    characters of the same cells.
prompt:
  id: motionAtlas.cell-normalization.prompt
  message: Use Motion Atlas "Clean values in place" (cell-normalization) as a conceptual
    graphic. Make small, explicit data corrections understandable and reviewable.
    Replace fictional sample content with approved authored content before making
    product claims.
