notFor:
  - id: motionAtlas.cell-normalization.notFor.0
    message: All default rows are fictional.
  - id: motionAtlas.cell-normalization.notFor.1
    message: Before and after strings are authored examples; the animation performs no
      inferred cleanup.
  - id: motionAtlas.cell-normalization.notFor.2
    message: An unchanged pair stays unchanged and receives no correction flourish.
  - id: motionAtlas.cell-normalization.notFor.3
    message: Replacement does not establish factual correctness or validate any record.
  - id: motionAtlas.cell-normalization.notFor.4
    message: Parentheses after a number may be a second measure rather than a negative sign.
  - id: motionAtlas.cell-normalization.notFor.5
    message: Removing a percent sign must retain a percent-unit label and does not imply
      division by 100.
motionBeats:
  - startFrame: 12
    endFrame: 40
    description:
      id: motionAtlas.cell-normalization.motionBeats.0
      message: Reveal original values and optional whitespace marks.
  - startFrame: 40
    endFrame: 112
    description:
      id: motionAtlas.cell-normalization.motionBeats.1
      message: Bracket changed cells and crossfade only authored replacements. Unfold the
        original-value rail.
  - startFrame: 112
    endFrame: 166
    description:
      id: motionAtlas.cell-normalization.motionBeats.2
      message: Hold supplied results and retained original values in aligned rows.
