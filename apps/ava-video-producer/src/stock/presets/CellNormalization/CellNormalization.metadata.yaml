goodFor:
  - id: motionAtlas.cell-normalization.goodFor.0
    message: Explain trimming and standardizing imported values
  - id: motionAtlas.cell-normalization.goodFor.1
    message: Show controlled cleanup with an inspectable before state
  - id: motionAtlas.cell-normalization.goodFor.2
    message: Distinguish data formatting changes from changing the underlying record
  - id: motionAtlas.cell-normalization.goodFor.3
    message: Explain Unicode-minus and thousands-separator cleanup
  - id: motionAtlas.cell-normalization.goodFor.4
    message: Show percent-scale preservation during import
