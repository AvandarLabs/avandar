notFor:
  - id: motionAtlas.queue-relief.notFor.0
    message: The default is a fictional five-request example; each token represents exactly
      one supplied item.
  - id: motionAtlas.queue-relief.notFor.1
    message: Timing demonstrates the authored sequence, not a measured arrival rate,
      throughput increase, or staffing forecast.
  - id: motionAtlas.queue-relief.notFor.2
    message: All work is homogeneous and completes within the scene; priorities, varying
      task durations, and continuous arrivals are outside this proposal.
motionBeats:
  - startFrame: 0
    endFrame: 12
    description:
      id: motionAtlas.queue-relief.motionBeats.0
      message: Reveal queue and service bays.
  - startFrame: 12
    endFrame: 54
    description:
      id: motionAtlas.queue-relief.motionBeats.1
      message: Accumulate supplied work behind initial capacity.
  - startFrame: 54
    endFrame: 90
    description:
      id: motionAtlas.queue-relief.motionBeats.2
      message: Unfold additional capacity while preserving waiting work.
  - startFrame: 90
    endFrame: 138
    description:
      id: motionAtlas.queue-relief.motionBeats.3
      message: Release work in original order and collect every completion.
  - startFrame: 138
    endFrame: 168
    description:
      id: motionAtlas.queue-relief.motionBeats.4
      message: Hold the empty queue and conserved completed inventory.
