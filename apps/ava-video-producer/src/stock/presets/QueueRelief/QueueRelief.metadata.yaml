name:
  id: motionAtlas.queue-relief.name
  message: Relieve the bottleneck
description:
  id: motionAtlas.queue-relief.description
  message: A visible queue builds behind limited service capacity. Additional service
    slots open and the same waiting items clear through them.
category:
  id: motionAtlas.queue-relief.category
  message: Capacity and queues
useWhen:
  id: motionAtlas.queue-relief.useWhen
  message: Show that opening more service capacity allows an existing backlog to move.
creativeDirection:
  id: motionAtlas.queue-relief.creativeDirection
  message: Frames 0..12 reveal a queue corridor and named service slots. During 12..54,
    every supplied item arrives and only initially open slots accept work, making the
    waiting line visible. Keep initial service items occupied until the capacity
    expansion beat so a backlog remains visible. During 54..90, the additional slots
    unfold from closed outlines into usable bays. During 90..138, waiting items enter
    those bays without changing their original order and emerge into a completed tray.
    Hold the emptied queue and all completed items through frame 168, then fade to the
    opaque ground by 179. The hero action is the release of accumulated work after
    capacity changes.
intent:
  id: motionAtlas.queue-relief.intent
  message: Show that opening more service capacity allows an existing backlog to move.
distinction:
  id: motionAtlas.queue-relief.distinction
  message: Unlike packet-stream, movement is initially constrained and the waiting
    inventory matters. Unlike status-cycle, the central change is service capacity
    across several work items, not the status of one task.
prompt:
  id: motionAtlas.queue-relief.prompt
  message: Use Motion Atlas "Relieve the bottleneck" (queue-relief) as a conceptual
    graphic. Show that opening more service capacity allows an existing backlog to move.
    Replace fictional sample content with approved authored content before making
    product claims.
