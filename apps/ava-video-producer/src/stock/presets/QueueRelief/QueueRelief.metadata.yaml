goodFor:
  - id: motionAtlas.queue-relief.goodFor.0
    message: Explaining why a backlog forms around limited service capacity
  - id: motionAtlas.queue-relief.goodFor.1
    message: Introducing additional processing slots or staffed counters
  - id: motionAtlas.queue-relief.goodFor.2
    message: Distinguishing waiting work from work being serviced
domains:
  - id: motionAtlas.queue-relief.domains.0
    message: Capacity and queues
aliases:
  - id: motionAtlas.queue-relief.aliases.0
    message: queue
  - id: motionAtlas.queue-relief.aliases.1
    message: bottleneck
  - id: motionAtlas.queue-relief.aliases.2
