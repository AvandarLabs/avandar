name:
  id: motionAtlas.classroom-access-rearrangement.name
  message: Make space in the same classroom
description:
  id: motionAtlas.classroom-access-rearrangement.description
  message:
    A classroom rearranges its furniture and shared teaching surface so named
    learners can approach and participate in the same group. The room changes while the
    people remain themselves.
category:
  id: motionAtlas.classroom-access-rearrangement.category
  message: Classroom spatial transformation
useWhen:
  id: motionAtlas.classroom-access-rearrangement.useWhen
  message:
    Show that changing the learning environment can address a stated participation
    barrier.
prompt:
  id: motionAtlas.classroom-access-rearrangement.prompt
  message:
    Reveal a crowded row arrangement with the same learners waiting at its edge.
    Pull desks apart to make a clear schematic approach, rotate the shared table toward
    the group, and reveal the selected teaching-surface adaptations. Move every learner
    into the common activity space; retain the selected access cues during the hold. Do
    not transform bodies or separate one learner into a distant special zone. Fade out.
creativeDirection:
  id: motionAtlas.classroom-access-rearrangement.creativeDirection
  message:
    Reveal a crowded row arrangement with the same learners waiting at its edge.
    Pull desks apart to make a clear schematic approach, rotate the shared table toward
