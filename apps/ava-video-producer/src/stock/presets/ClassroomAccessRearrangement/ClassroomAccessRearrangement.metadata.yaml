notFor:
  - id: motionAtlas.classroom-access-rearrangement.notFor.0
    message:
      The learner array is the complete represented group. All are shown at the final
      activity; this is an authored staging choice, not an enrollment or inclusion rate.
  - id: motionAtlas.classroom-access-rearrangement.notFor.1
    message:
      No dimensions, turning-radius compliance, visual-acuity threshold, building
      standard, or universal accessibility claim is encoded.
  - id: motionAtlas.classroom-access-rearrangement.notFor.2
    message:
      A wheeled icon does not imply a diagnosis, dependence, or inability to learn.
      Adaptations alter the environment rather than a person.
  - id: motionAtlas.classroom-access-rearrangement.notFor.3
    message:
      The fictional schematic cannot establish that the selected changes meet any
      real learner's complete access requirements.
motionBeats:
  - startFrame: 0
    endFrame: 35
    description:
      id: motionAtlas.ClassroomAccessRearrangement.beat.0
      message: Reveal the crowded row of desks and stable walking or wheeled participant icons.
  - startFrame: 36
    endFrame: 75
    description:
      id: motionAtlas.ClassroomAccessRearrangement.beat.1
      message:
        Pull desks apart, rotate the shared table only if selected, and reveal the
        selected larger board text.
  - startFrame: 76
    endFrame: 95
    description:
      id: motionAtlas.ClassroomAccessRearrangement.beat.2
      message:
        Learners enter through cleared side lanes while their keyed roster remains
        readable.
  - startFrame: 96
    endFrame: 107
    description:
      id: motionAtlas.ClassroomAccessRearrangement.beat.3
      message:
        Finish the selected shared-circle or open-horseshoe arrangement inside the same
        common activity.
  - startFrame: 108
    endFrame: 179
    description:
      id: motionAtlas.ClassroomAccessRearrangement.beat.4
      message: Retain every learner and selected adaptation through the shared fade.
