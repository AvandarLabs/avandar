intent:
  id: motionAtlas.classroom-access-rearrangement.intent
  message:
    Show that changing the learning environment can address a stated participation
    barrier.
distinction:
  id: motionAtlas.classroom-access-rearrangement.distinction
  message:
    Furniture and instructional surfaces physically change within one shared
    classroom while learner identities remain constant. Unlike a generic service-access
    gate, the scene explains the geometry and materials of participation rather than
    admission or referral.
