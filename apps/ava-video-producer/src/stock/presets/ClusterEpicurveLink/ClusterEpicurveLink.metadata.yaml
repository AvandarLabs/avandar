name:
  id: motionAtlas.cluster-epicurve-link.name
  message: Locate the cluster in time
description:
  id: motionAtlas.cluster-epicurve-link.description
  message:
    A supplied investigation group on a schematic map is linked to its recorded
    onset bins in an epidemic curve. The same selected case IDs remain highlighted in
    both views, including an explicit unknown-time compartment.
category:
  id: motionAtlas.cluster-epicurve-link.category
  message: linked geographic and temporal views
useWhen:
  id: motionAtlas.cluster-epicurve-link.useWhen
  message: Connect place and recorded time for the same cases without inventing
    transmission links.
prompt:
  id: motionAtlas.cluster-epicurve-link.prompt
  message:
    Begin with all case pins and a complete histogram. An authored group receives a
    map bracket; thin identity guides lift its highlighted tokens into the corresponding
    histogram segments. A chosen time bin then outlines its matching map pins. Hold both
    views with selected and total case counts.
creativeDirection:
  id: motionAtlas.cluster-epicurve-link.creativeDirection
  message:
    Begin with all case pins and a complete histogram. An authored group receives a
    map bracket; thin identity guides lift its highlighted tokens into the corresponding
    histogram segments. A chosen time bin then outlines its matching map pins. Hold both
    views with selected and total case counts.
intent:
  id: motionAtlas.cluster-epicurve-link.intent
  message: Connect place and recorded time for the same cases without inventing
    transmission links.
distinction:
  id: motionAtlas.cluster-epicurve-link.distinction
  message:
    The same case identities drive a geographic selection and a binned epidemic
    curve. Unlike contact-window-overlap, no venue intervals intersect; unlike
    line-trace, the explanation is linked selection between two complete
    representations.
