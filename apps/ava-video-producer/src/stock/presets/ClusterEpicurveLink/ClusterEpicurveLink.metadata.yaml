goodFor:
  - id: motionAtlas.cluster-epicurve-link.goodFor.0
    message: Explain outbreak investigation cross-filtering
  - id: motionAtlas.cluster-epicurve-link.goodFor.1
    message: Relate a spatial case group to recorded onset time
  - id: motionAtlas.cluster-epicurve-link.goodFor.2
    message: Keep unknown onset dates visible during case review
notFor:
  - id: motionAtlas.cluster-epicurve-link.notFor.0
    message:
      The investigation group is supplied, not statistically detected. Proximity and
      timing do not establish a common source or transmission.
  - id: motionAtlas.cluster-epicurve-link.notFor.1
    message:
      Histogram bars plus unknown-time cases equal the entire case array; highlights
      are subsets, not extra cases.
  - id: motionAtlas.cluster-epicurve-link.notFor.2
    message:
      Counts describe supplied case records only. No population denominator, disease
      incidence, or clinical guidance is implied.
