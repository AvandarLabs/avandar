motionBeats:
  - startFrame: 0
    endFrame: 35
    description:
      id: motionAtlas.cluster-epicurve-link.beat.0
      message: Show all case pins and the complete histogram, then bracket the authored group.
  - startFrame: 36
    endFrame: 107
    description:
      id: motionAtlas.cluster-epicurve-link.beat.1
      message:
        Lift selected identity copies to their bins during frames 36–84; focus returns
        to matching map pins during 90–108.
  - startFrame: 108
    endFrame: 179
    description:
      id: motionAtlas.cluster-epicurve-link.beat.2
      message: Hold both selections and all recorded and unknown onset cases.
