motionBeats:
  - startFrame: 0
    endFrame: 35
    description:
      id: motionAtlas.person-led-support-calendar.beat.0
      message: The worker carries the proposal to the initially conflicting cell during frames
        12 through 36.
  - startFrame: 36
    endFrame: 107
    description:
      id: motionAtlas.person-led-support-calendar.beat.1
      message: The participant reaches the proposal, carries it to the agreed free cell during
        frames 52 through 100, then releases it.
  - startFrame: 108
    endFrame: 179
    description:
      id: motionAtlas.person-led-support-calendar.beat.2
      message: The worker reaches the agreement annotation by frame 120 and writes its mark
        through 132. Hold every unchanged commitment, the sole moved appointment and the
        goal.
