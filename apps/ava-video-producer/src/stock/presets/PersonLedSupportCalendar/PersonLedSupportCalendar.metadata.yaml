name:
  id: motionAtlas.person-led-support-calendar.name
  message: Fit support around the person's week
description:
  id: motionAtlas.person-led-support-calendar.description
  message: A participant and caseworker arrange a support appointment around commitments
    the participant has already named. The participant moves the proposed appointment,
    while their existing commitments remain visible.
category:
  id: motionAtlas.person-led-support-calendar.category
  message: Human planning at a shared table
useWhen:
  id: motionAtlas.person-led-support-calendar.useWhen
  message: Show that support is scheduled around the person's stated commitments.
prompt:
  id: motionAtlas.person-led-support-calendar.prompt
  message: Open on a tabletop weekly planner between two people, with existing commitments
    already occupying time cells. The worker places a proposed support appointment
    across an occupied cell; the participant lifts it into the explicitly agreed free
    cell. The worker follows the participant's placement with an agreement mark. Hold
    the unchanged commitments, moved appointment and participant's goal together before
    the shared exit envelope.
creativeDirection:
  id: motionAtlas.person-led-support-calendar.creativeDirection
  message: Open on a tabletop weekly planner between two people, with existing commitments
    already occupying time cells. The worker places a proposed support appointment
    across an occupied cell; the participant lifts it into the explicitly agreed free
    cell. The worker follows the participant's placement with an agreement mark. Hold
    the unchanged commitments, moved appointment and participant's goal together before
    the shared exit envelope.
intent:
  id: motionAtlas.person-led-support-calendar.intent
  message: Show that support is scheduled around the person's stated commitments.
distinction:
  id: motionAtlas.person-led-support-calendar.distinction
  message: The participant physically revises a shared calendar around their existing
    responsibilities. Unlike schedule-buffer, there is no delayed sequence consuming
    reserve time; unlike priority-insertion, this is a negotiated appointment placement
    rather than precedence in a queue.
