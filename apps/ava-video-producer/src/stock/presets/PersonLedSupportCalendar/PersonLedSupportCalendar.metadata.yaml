    message: Explaining a person-led case-planning meeting
  - id: motionAtlas.person-led-support-calendar.goodFor.1
    message: Showing why caregiving commitments affect appointment design
  - id: motionAtlas.person-led-support-calendar.goodFor.2
    message: Introducing an agreed support schedule without claiming attendance
notFor:
  - id: motionAtlas.person-led-support-calendar.notFor.0
    message: All people, commitments and agreements are illustrative; agreement is not
      attendance or an outcome.
  - id: motionAtlas.person-led-support-calendar.notFor.1
    message: Each item occupies exactly one discrete planner cell; this is not a scheduling
      algorithm or a proportional duration chart.
  - id: motionAtlas.person-led-support-calendar.notFor.2
    message: No service is automatically withdrawn when a person proposes a different time.
