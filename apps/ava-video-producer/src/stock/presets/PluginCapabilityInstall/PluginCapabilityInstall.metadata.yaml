notFor:
  - id: motionAtlas.plugin-capability-install.notFor.0
    message:
      One optional utility and one fixed tally operation. No executable code,
      external URLs, marketplace requests, dependency resolution, or security review
      occur.
  - id: motionAtlas.plugin-capability-install.notFor.1
    message:
      The sum of category counts must equal records.length and each record is counted
      exactly once. Installation never adds, removes, or edits source records.
  - id: motionAtlas.plugin-capability-install.notFor.2
    message:
      The default is fictional. This is not evidence of a shipped plugin system,
      one-click installation, compatibility with arbitrary data, or a particular
      installation time.
  - id: motionAtlas.plugin-capability-install.notFor.3
    message:
      The defer outcome produces no result and no installed-state marker. Zero-count
      categories remain visible.
  - id: motionAtlas.plugin-capability-install.notFor.4
    message:
      No medical prediction, automated risk assessment, or clinical decision is
      represented by the utility.
  - id: motionAtlas.plugin-capability-install.notFor.5
    message:
      Supplied prose meaning, fictional status and agreement with structured choices
      are authoring responsibilities. Runtime validation enforces structure, numeric
      bounds, identities and references.
motionBeats:
  - startFrame: 0
    endFrame: 11
    description:
      id: motionAtlas.plugin-capability-install.motionBeats.0
      message: Reveal retained records and empty socket.
  - startFrame: 12
    endFrame: 55
    description:
      id: motionAtlas.plugin-capability-install.motionBeats.1
      message: Present utility and authored choice.
  - startFrame: 56
    endFrame: 90
    description:
      id: motionAtlas.plugin-capability-install.motionBeats.2
      message: Install seats one utility; defer leaves the socket empty.
  - startFrame: 91
    endFrame: 132
    description:
      id: motionAtlas.plugin-capability-install.motionBeats.3
      message: Installed stencil counts every retained record.
  - startFrame: 133
    endFrame: 167
    description:
      id: motionAtlas.plugin-capability-install.motionBeats.4
      message: Hold the chosen outcome.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.plugin-capability-install.motionBeats.5
      message: Shared opaque exit.
