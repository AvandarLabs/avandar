name:
  id: motionAtlas.plugin-capability-install.name
  message: Fit one new tool to existing data
description:
  id: motionAtlas.plugin-capability-install.description
  message:
    An optional utility seats into a workspace only after an authored installation
    choice. Its category-count stencil then reads the retained records and reveals one
    derived tally, making added capability distinct from data replacement.
category:
  id: motionAtlas.plugin-capability-install.category
  message: Modular capability
useWhen:
  id: motionAtlas.plugin-capability-install.useWhen
  message: Show that a chosen extension adds an operation over retained data.
creativeDirection:
  id: motionAtlas.plugin-capability-install.creativeDirection
  message:
    Frames 0-11 reveal a work surface, a bounded record strip, and an empty tool
    socket on the 960x600 canvas. Frames 12-55 bring the named utility beside the socket
    and display the supplied decision. For install, frames 56-90 seat the utility and
    align its counting stencil with the unchanged category field. Frames 91-132 draw one
    tally mark per retained record into its category, resolving compact bars on a common
    integer scale. For defer, the utility stays beside the empty socket and no tally
    appears. Hold the retained records, decision, and resulting capability through frame
    167, then use the shared opaque exit through frame 179. All movement is frame-driven
    React/SVG at 30fps.
intent:
  id: motionAtlas.plugin-capability-install.intent
  message: Show that a chosen extension adds an operation over retained data.
distinction:
  id: motionAtlas.plugin-capability-install.distinction
  message:
    Unlike dashboard-slot-assembly, a new operation becomes available before it
    acts on retained data. Unlike pipeline-step-splice, no processing chain is rewired.
    The socketed stencil visibly derives a result from the existing records rather than
    introducing a renamed card collection.
prompt:
  id: motionAtlas.plugin-capability-install.prompt
  message: Use Motion Atlas "Fit one new tool to existing data"
    (plugin-capability-install) as a conceptual graphic. Show that a chosen extension
    adds an operation over retained data. Replace fictional examples with approved
    authored content before making product claims.
