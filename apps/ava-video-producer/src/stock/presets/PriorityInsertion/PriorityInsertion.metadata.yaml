notFor:
  - id: motionAtlas.priority-insertion.notFor.0
    message: The default tasks and priority are fictional and do not prescribe a
      prioritization policy.
  - id: motionAtlas.priority-insertion.notFor.1
    message: Only waiting items are reordered; there is no interruption of work already in
      progress.
  - id: motionAtlas.priority-insertion.notFor.2
    message: Slot positions encode precedence only, not duration, importance scores,
      fairness, or a delivery commitment.
motionBeats:
  - startFrame: 12
    endFrame: 38
    description:
      id: motionAtlas.priority-insertion.motionBeats.0
      message: Establish the existing numbered queue and service end.
  - startFrame: 38
    endFrame: 64
    description:
      id: motionAtlas.priority-insertion.motionBeats.1
      message: Introduce priority work on the side spur.
  - startFrame: 64
    endFrame: 108
    description:
      id: motionAtlas.priority-insertion.motionBeats.2
      message: Move the selected suffix back by one slot.
  - startFrame: 108
    endFrame: 132
    description:
      id: motionAtlas.priority-insertion.motionBeats.3
      message: Place the incoming item into the opening.
  - startFrame: 132
    endFrame: 168
    description:
      id: motionAtlas.priority-insertion.motionBeats.4
      message: Hold stable existing order around the inserted work.
