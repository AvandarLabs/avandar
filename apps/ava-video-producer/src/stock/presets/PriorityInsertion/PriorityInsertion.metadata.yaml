name:
  id: motionAtlas.priority-insertion.name
  message: Make room for urgent work
description:
  id: motionAtlas.priority-insertion.description
  message: A newly prioritized item enters an existing ordered queue. One slot opens ahead
    of a chosen waiting item while every existing item keeps its relative order.
category:
  id: motionAtlas.priority-insertion.category
  message: Work ordering
useWhen:
  id: motionAtlas.priority-insertion.useWhen
  message: Show exactly which waiting work moves when one new item gains precedence.
prompt:
  id: motionAtlas.priority-insertion.prompt
  message: Use Motion Atlas "Make room for urgent work" (priority-insertion) as a
    conceptual graphic. Show exactly which waiting work moves when one new item gains
    precedence. Replace fictional sample content with approved authored content before
    making product claims.
creativeDirection:
  id: motionAtlas.priority-insertion.creativeDirection
  message: During 12..38, lay an existing queue into numbered track slots, with its
    service end visibly marked. During 38..64, the new item arrives on a small side spur
    carrying the authored priority caption. During 64..108, the chosen insertion slot
    opens and all items from that position onward shift exactly one slot away from
    service as a single movement. During 108..132, the new item travels along the spur
    into the opening. Hold the changed queue and optional faint original-position
    markers through 168, then exit to ground. The new item gains precedence without
    scrambling the order of existing work.
intent:
  id: motionAtlas.priority-insertion.intent
  message: Show exactly which waiting work moves when one new item gains precedence.
distinction:
  id: motionAtlas.priority-insertion.distinction
  message: Bar-race reorders measured rankings; this makes one explicit queue insertion
    without scores or a wholesale sort. Queue-relief changes service capacity, whereas
    this changes precedence while service capacity is absent from the argument.
