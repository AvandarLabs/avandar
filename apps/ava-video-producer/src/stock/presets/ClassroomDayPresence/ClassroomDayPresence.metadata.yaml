notFor:
  - id: motionAtlas.classroom-day-presence.notFor.0
    message: Each silhouette represents one roster member, not a sample weight.
  - id: motionAtlas.classroom-day-presence.notFor.1
    message: Every daily present numerator is divided by the full supplied roster length.
      Absent and unknown counts are shown separately and all three states sum to that
      denominator.
  - id: motionAtlas.classroom-day-presence.notFor.2
    message: Unknown does not mean absent. The animation never infers reasons for absence,
      dropout, retention, or educational impact.
  - id: motionAtlas.classroom-day-presence.notFor.3
    message: The three day changes are editorial beats, not proportional elapsed time. All
      defaults are fictional.
motionBeats:
  - startFrame: 12
    endFrame: 51
    description:
      id: motionAtlas.classroom-day-presence.motionBeats.0
      message: Establish the same roster at named desks on the first day.
  - startFrame: 52
    endFrame: 97
    description:
      id: motionAtlas.classroom-day-presence.motionBeats.1
      message: Change occupancy at the same desks for the second day.
  - startFrame: 98
    endFrame: 167
    description:
      id: motionAtlas.classroom-day-presence.motionBeats.2
      message: Show the third day when supplied, then hold the final room and separate totals.
