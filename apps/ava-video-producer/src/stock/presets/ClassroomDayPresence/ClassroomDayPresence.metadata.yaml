name:
  id: motionAtlas.classroom-day-presence.name
  message: The same classroom, different days
description:
  id: motionAtlas.classroom-day-presence.description
  message: A fixed classroom shows which members of one fictional roster are present
    across several school days. Empty seats and unknown attendance remain visibly
    different.
category:
  id: motionAtlas.classroom-day-presence.category
  message: Classroom occupancy
useWhen:
  id: motionAtlas.classroom-day-presence.useWhen
  message: Distinguish who belongs to a class from who is recorded present on each day.
prompt:
  id: motionAtlas.classroom-day-presence.prompt
  message: Use The same classroom, different days (classroom-day-presence) with complete
    authored inputs and preserve the stated limits.
creativeDirection:
  id: motionAtlas.classroom-day-presence.creativeDirection
  message: Reveal the supplied roster at named desks and a day label. Across the authored
    day changes, the same learner silhouettes occupy or vacate their own desks while
    absent seats keep empty outlines and unknown seats keep question markers. Preserve
    small day impressions beneath each desk instead of sending people through lanes.
    Hold the final room with present, absent, unknown and roster totals before fading.
intent:
  id: motionAtlas.classroom-day-presence.intent
  message: Distinguish who belongs to a class from who is recorded present on each day.
distinction:
  id: motionAtlas.classroom-day-presence.distinction
  message: Uses persistent desks and occupied space across school days, rather than a dot
    matrix or a cohort flowing through dose-return lanes. The explanatory change is
    daily room occupancy, with absent and unknown records retained as separate states.
