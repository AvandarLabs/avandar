goodFor:
  - id: motionAtlas.classroom-day-presence.goodFor.0
    message: Explain daily attendance without confusing repeat visits with new students
  - id: motionAtlas.classroom-day-presence.goodFor.1
    message: Show that an unchanged roster can have changing classroom presence
  - id: motionAtlas.classroom-day-presence.goodFor.2
    message: Make missing attendance records visible
domains:
  - id: motionAtlas.classroom-day-presence.domains.0
    message: Classroom occupancy
aliases:
