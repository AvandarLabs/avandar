name:
  id: motionAtlas.mobile-clinic-relocation.name
  message: Bring the service closer
description:
  id: motionAtlas.mobile-clinic-relocation.description
  message: A mobile clinic relocates between two schematic community sites, carrying a
    finite set of appointment slots. People receive only the explicitly assigned
    bookings, with open slots and unbooked people still visible.
category:
  id: motionAtlas.mobile-clinic-relocation.category
  message: Mobile service and finite allocation
useWhen:
  id: motionAtlas.mobile-clinic-relocation.useWhen
  message: Show a service moving toward a community while keeping finite appointment
    capacity and unbooked people visible.
intent:
  id: motionAtlas.mobile-clinic-relocation.intent
  message: Show a service moving toward a community while keeping finite appointment
    capacity and unbooked people visible.
creativeDirection:
  id: motionAtlas.mobile-clinic-relocation.creativeDirection
  message: Frames 12..40 show a mobile clinic parked at the first site, nearby people, and
    its finite appointment-slot strip. Frames 41..113 fold the clinic awning, drive the
    same vehicle along a schematic road, and reopen it at the second site; assigned
    people connect to distinct slot tabs while unmatched people remain in place. Frames
    114..167 hold both the person-booking ledger and slot-capacity ledger together; fade
    to ground by frame 179.
distinction:
  id: motionAtlas.mobile-clinic-relocation.distinction
  message: Unlike radial-network or packet-stream, a physical service vehicle changes
    location and unfolds into a service point. Unlike outreach-household-revisits, the
    moving object is the service itself and the core constraint is one person per
    supplied slot, not visit activity.
prompt:
  id: motionAtlas.mobile-clinic-relocation.prompt
  message: Use Bring the service closer (mobile-clinic-relocation) for a fictional or
    approved authored example. Show a service moving toward a community while keeping
    finite appointment capacity and unbooked people visible.
