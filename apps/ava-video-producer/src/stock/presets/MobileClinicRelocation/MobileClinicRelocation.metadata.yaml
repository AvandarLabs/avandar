notFor:
  - id: motionAtlas.mobile-clinic-relocation.notFor.0
    message: The people denominator is people.length. Booked people equals the number of
      non-null slotId values, and booked + unbooked equals the people total.
  - id: motionAtlas.mobile-clinic-relocation.notFor.1
    message: Slot capacity is slots.length. Occupied slots is the distinct assigned slotId
      count; occupied + open equals capacity. Each slot can have at most one assigned
      person, and no duplicated glyph creates extra capacity.
  - id: motionAtlas.mobile-clinic-relocation.notFor.2
    message: All assignments are authored. This is not a routing optimizer, access-distance
      model, clinical prioritization rule, eligibility decision, or recommendation for
      service placement.
  - id: motionAtlas.mobile-clinic-relocation.notFor.3
    message: Bookings are administrative plans, not attendance or treatment. The schematic
      map has no real geography, scale, journey time, distance measurement, or implied
      population coverage.
motionBeats:
