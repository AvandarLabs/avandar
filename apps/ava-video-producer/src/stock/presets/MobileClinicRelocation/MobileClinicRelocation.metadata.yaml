goodFor:
  - id: motionAtlas.mobile-clinic-relocation.goodFor.0
    message: Explain a fictional mobile service relocation and bounded booking capacity.
  - id: motionAtlas.mobile-clinic-relocation.goodFor.1
    message: Show that moving a service and booking people are distinct from delivering care.
  - id: motionAtlas.mobile-clinic-relocation.goodFor.2
    message: Introduce community access planning while retaining unmet demand in the picture.
