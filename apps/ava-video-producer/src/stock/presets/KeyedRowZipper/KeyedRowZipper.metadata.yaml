name:
  id: motionAtlas.keyed-row-zipper.name
  message: Join matching records
description:
  id: motionAtlas.keyed-row-zipper.description
  message: Two small tables align on equal keys and zip their matched rows together.
    Unmatched rows remain visibly distinct, making the selected join rule
    understandable.
category:
  id: motionAtlas.keyed-row-zipper.category
  message: Record alignment
useWhen:
  id: motionAtlas.keyed-row-zipper.useWhen
  message: Explain which records combine and what happens when a matching key is absent.
creativeDirection:
  id: motionAtlas.keyed-row-zipper.creativeDirection
  message: Frames 12-42 establish two tables with key columns facing each other. Between
    frames 42-108, equal keys align vertically, their key cells meet at a shared seam,
    and each matched pair closes into one wider row. Rows without a partner move into a
    context tray for an inner join, or retain a labeled empty partner for a left join.
    Hold the derived result and any context tray through frame 166, then exit.
intent:
  id: motionAtlas.keyed-row-zipper.intent
  message: Explain which records combine and what happens when a matching key is absent.
distinction:
  id: motionAtlas.keyed-row-zipper.distinction
  message: Unlike schema-mapping, the relation is between records with equal key values
    rather than corresponding field names. Unlike source-merge, unmatched rows and the
    selected join rule determine the result.
prompt:
  id: motionAtlas.keyed-row-zipper.prompt
  message: Use Motion Atlas "Join matching records" (keyed-row-zipper) as a conceptual
    graphic. Explain which records combine and what happens when a matching key is
    absent. Replace fictional sample content with approved authored content before
    making product claims.
