notFor:
  - id: motionAtlas.keyed-row-zipper.notFor.literal-whitespace
    message: "Exact data uses amber underlined marks for whitespace: spaces, tabs, line
      breaks and other whitespace remain distinct from authored marker glyphs. Input,
      accessible text and equality preserve the original values."
  - id: motionAtlas.keyed-row-zipper.notFor.0
    message: All default rows are fictional.
  - id: motionAtlas.keyed-row-zipper.notFor.1
    message: Keys are unique within each table; many-to-many joins and row multiplication
      are excluded.
  - id: motionAtlas.keyed-row-zipper.notFor.2
    message: Equality is exact and case-sensitive with no inferred normalization.
  - id: motionAtlas.keyed-row-zipper.notFor.3
    message: Result count is derived from the arrays and joinType, never supplied independently.
  - id: motionAtlas.keyed-row-zipper.notFor.4
    message: An empty partner means no matching input row, not proof the real-world value
      does not exist.
  - id: motionAtlas.keyed-row-zipper.notFor.5
    message: Use exact matching in this preset. If normalization is needed, show it
      explicitly in a separate cell-normalization scene before the join.
  - id: motionAtlas.keyed-row-zipper.notFor.6
    message: Missing matches are not zero geographic measures.
motionBeats:
  - startFrame: 12
    endFrame: 42
    description:
      id: motionAtlas.keyed-row-zipper.motionBeats.0
      message: Establish source tables and facing keys.
  - startFrame: 42
    endFrame: 108
    description:
      id: motionAtlas.keyed-row-zipper.motionBeats.1
      message: Align exact matches and close pairs. Separate unmatched context.
  - startFrame: 108
    endFrame: 166
    description:
      id: motionAtlas.keyed-row-zipper.motionBeats.2
      message: Hold derived membership and explicit empty partners.
