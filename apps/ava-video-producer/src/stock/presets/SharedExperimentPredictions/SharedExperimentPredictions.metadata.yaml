name:
  id: motionAtlas.shared-experiment-predictions.name
  message: Predict together, then observe
description:
  id: motionAtlas.shared-experiment-predictions.description
  message: Learners place separate predictions along a shared tabletop track before an
    experiment reveals one authored observation. Their different expectations remain
    visible beside the result.
category:
  id: motionAtlas.shared-experiment-predictions.category
  message: Collaborative tabletop inquiry
useWhen:
  id: motionAtlas.shared-experiment-predictions.useWhen
  message: Separate what participants expect from what is recorded in a shared demonstration.
prompt:
  id: motionAtlas.shared-experiment-predictions.prompt
  message: Reveal a tabletop ramp and a labeled distance track with the supplied learners
    around it. Each learner places a distinct labeled prediction flag before a single
    ball is released. The ball travels to the supplied observation position and stops;
    retain every prediction without scoring or ranking learners. Hold the observed
    marker and predicted positions together, then fade out before resetting.
creativeDirection:
  id: motionAtlas.shared-experiment-predictions.creativeDirection
  message: Reveal a tabletop ramp and a labeled distance track with the supplied learners
    around it. Each learner places a distinct labeled prediction flag before a single
    ball is released. The ball travels to the supplied observation position and stops;
    retain every prediction without scoring or ranking learners. Hold the observed
    marker and predicted positions together, then fade out before resetting.
intent:
  id: motionAtlas.shared-experiment-predictions.intent
  message: Separate what participants expect from what is recorded in a shared demonstration.
distinction:
  id: motionAtlas.shared-experiment-predictions.distinction
  message: Participants physically commit separate predictions before one common test, and
    the final frame preserves disagreement alongside the observation. This differs from
    source merging, network signals, shared-fabric contributions, or a generic feedback
    revision loop.
