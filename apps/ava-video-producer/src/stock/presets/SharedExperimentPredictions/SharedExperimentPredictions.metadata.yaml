notFor:
  - id: motionAtlas.shared-experiment-predictions.notFor.0
    message: Each learner contributes exactly one prediction. The number of predictions
      equals the learner array length and is not a sample of measured scientific
      accuracy.
  - id: motionAtlas.shared-experiment-predictions.notFor.1
    message: Distances use a shared zero and unit. Optional differences are absolute
      distances with the same unit; no denominator or success rate is implied.
  - id: motionAtlas.shared-experiment-predictions.notFor.2
    message: The ball trajectory is illustrative motion toward an authored stopping point.
      It is not a physics simulation, measured experiment, or validation of a real
      hypothesis.
  - id: motionAtlas.shared-experiment-predictions.notFor.3
    message: No learner is ranked or labeled correct by proximity. The fictional scene shows
      participation and comparison, not learning efficacy.
motionBeats:
  - startFrame: 0
    endFrame: 35
    description:
      id: motionAtlas.SharedExperimentPredictions.beat.0
      message: Reveal the track, zero origin, learner roster and unreleased ball.
  - startFrame: 36
    endFrame: 65
    description:
      id: motionAtlas.SharedExperimentPredictions.beat.1
      message: Each participant carries a keyed flag to a distinct label lane at their
        authored prediction distance.
  - startFrame: 66
    endFrame: 75
    description:
      id: motionAtlas.SharedExperimentPredictions.beat.2
      message: Hold all predictions before ball release. Coincident values keep separate
        identities.
  - startFrame: 76
    endFrame: 107
    description:
      id: motionAtlas.SharedExperimentPredictions.beat.3
      message: Release one ball down the ramp, then move it to the supplied observation
        position.
  - startFrame: 108
    endFrame: 179
    description:
      id: motionAtlas.SharedExperimentPredictions.beat.4
      message: Keep every prediction beside the observed stop and optional absolute-distance
        brackets through the shared fade.
