name:
  id: motionAtlas.charge-reference-alignment.name
  message: Match the reference before comparing a charge
description:
  id: motionAtlas.charge-reference-alignment.description
  message:
    A fictional invoice line is laid over a separate price reference. Only matching
    procedure, provider, payer, period, and quantity windows permit the amounts to align
    on one scale; an unmatched context leaves the comparison unresolved.
category:
  id: motionAtlas.charge-reference-alignment.category
  message: Reference reconciliation
useWhen:
  id: motionAtlas.charge-reference-alignment.useWhen
  message:
    Make the context required for a monetary comparison explicit before showing a
    difference.
creativeDirection:
  id: motionAtlas.charge-reference-alignment.creativeDirection
  message:
    Frames 0-11 reveal a short invoice strip and a separate reference sheet on a
    960x600 canvas. Frames 12-70 slide their context windows into vertical registration,
    retaining a visible notch at each mismatched key. When every key and quantity
    agrees, frames 71-125 extend the two total-amount rulers from the same zero and open
    a signed difference bracket. Otherwise the amounts stay separate without a
    difference bracket. Frames 126-167 hold the matched or unresolved context, source
    labels, and review caption. Exit to the shared opaque ground at frames 168-179. The
    six-second React/SVG sequence is deterministic at 30fps.
intent:
  id: motionAtlas.charge-reference-alignment.intent
  message:
    Make the context required for a monetary comparison explicit before showing a
    difference.
distinction:
  id: motionAtlas.charge-reference-alignment.distinction
  message:
    Unlike benefit-shortfall-correction, no payment is corrected and no unpaid
    amount is treated as an entitlement. Unlike paired-contrast, exact context keys
    govern whether a numeric comparison is allowed. Unlike keyed-row-zipper, the records
    remain separate and open an amount ruler rather than becoming a joined dataset.
prompt:
  id: motionAtlas.charge-reference-alignment.prompt
  message: Use Motion Atlas "Match the reference before comparing a charge"
    (charge-reference-alignment) as a conceptual graphic. Make the context required for
    a monetary comparison explicit before showing a difference. Replace fictional
    examples with approved authored content before making product claims.
