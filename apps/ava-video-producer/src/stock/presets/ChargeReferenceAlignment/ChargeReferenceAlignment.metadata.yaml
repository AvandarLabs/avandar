notFor:
  - id: motionAtlas.charge-reference-alignment.notFor.0
    message:
      This is a fictional one-line comparison. It is not a medical billing
      interpretation, legal determination, price guarantee, negotiation result, or
      refund claim.
  - id: motionAtlas.charge-reference-alignment.notFor.1
    message:
      Totals use exact integer arithmetic in the shared smallest unit. The signed
      difference may be negative, positive, or zero; no automatic favorable result is
      implied.
  - id: motionAtlas.charge-reference-alignment.notFor.2
    message:
      A mismatch in any context key or quantity leaves the comparison unresolved.
      Similar text is not treated as a match, and no real CPT or payer taxonomy is
      inferred.
  - id: motionAtlas.charge-reference-alignment.notFor.3
    message:
      The ruler uses a common zero and a domain derived from the larger supplied
      total. For two zero totals use a one-minor-unit display domain without changing
      either value.
  - id: motionAtlas.charge-reference-alignment.notFor.4
    message:
      Currency, quantities, source label, period, and fictional status stay visible
      at the resolved hold. Published reference prices can have qualifications outside
      this bounded example.
  - id: motionAtlas.charge-reference-alignment.notFor.5
    message:
      Supplied prose meaning, fictional status and agreement with structured choices
      are authoring responsibilities. Runtime validation enforces structure, numeric
      bounds, identities and references.
  - id: motionAtlas.charge-reference-alignment.notFor.literal-whitespace
    message:
      Exact context values render whitespace as distinct amber underlined marks.
      Input values, accessible labels and equality remain unchanged.
motionBeats:
  - startFrame: 0
    endFrame: 11
    description:
      id: motionAtlas.charge-reference-alignment.motionBeats.0
      message: Reveal separate billed and reference lines.
  - startFrame: 12
    endFrame: 70
    description:
      id: motionAtlas.charge-reference-alignment.motionBeats.1
      message: Register context windows with visible mismatch notches.
  - startFrame: 71
    endFrame: 125
    description:
      id: motionAtlas.charge-reference-alignment.motionBeats.2
      message: Matching contexts open common-scale rulers and optional difference.
  - startFrame: 126
    endFrame: 167
    description:
      id: motionAtlas.charge-reference-alignment.motionBeats.3
      message: Hold sources and unresolved or matched context.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.charge-reference-alignment.motionBeats.4
      message: Shared opaque exit.
