name:
  id: motionAtlas.sealed-handoff.name
  message: The Contents Stay Covered
description:
  id: motionAtlas.sealed-handoff.description
  message:
    An open brief folds into an opaque envelope, moves to its named recipient, and
    opens only at the authored reveal point. The address remains visible while the
    contents are covered.
category:
  id: motionAtlas.sealed-handoff.category
  message: Concealment and reveal
