notFor:
  - id: motionAtlas.sealed-handoff.notFor.0
    message:
      A sealed-envelope metaphor is not proof of encryption, identity verification,
      authorization, secure deletion, or protection from any particular adversary.
  - id: motionAtlas.sealed-handoff.notFor.1
    message:
      Exterior address and reference are deliberately visible. Do not describe the
      depiction as hiding all metadata.
  - id: motionAtlas.sealed-handoff.notFor.2
    message:
      The brief contains exactly the supplied lines and does not represent a measured
      payload size.
distinction:
  id: motionAtlas.sealed-handoff.distinction
  message:
    This is a fold, opaque enclosure, and recipient-controlled reveal, unlike
    packet-stream's visible abstract packets. It covers the complete payload rather than
    the field subset selection in disclosure-aperture.
