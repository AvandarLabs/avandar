useWhen:
  id: motionAtlas.sealed-handoff.useWhen
  message: Show that routing a package and revealing its contents are separate actions.
prompt:
  id: motionAtlas.sealed-handoff.prompt
  message: Use Motion Atlas "The Contents Stay Covered" (sealed-handoff) as an
    illustrative conceptual graphic. Show that routing a package and revealing its
    contents are separate actions. Bind complete authored inputs and preserve the stated
    limits.
creativeDirection:
  id: motionAtlas.sealed-handoff.creativeDirection
  message:
    Begin with a short open brief resting over an unfolded envelope. Fold the lower
    and side flaps over the brief, then lower the final flap so the contents are fully
    occluded rather than faded. Move the closed envelope along one shallow hand-carried
    arc to a recipient tray. If the configured reveal rule is recipient, peel the flap
    open only after the envelope settles; otherwise hold it sealed. Resolve on the
    authored final state before the seam-safe fade.
goodFor:
  - id: motionAtlas.sealed-handoff.goodFor.0
    message: Distinguish visible routing information from covered contents
  - id: motionAtlas.sealed-handoff.goodFor.1
    message: Explain a confidential briefing metaphor
  - id: motionAtlas.sealed-handoff.goodFor.2
    message:
      Introduce a restricted handoff before separately documenting the actual
      security mechanism
intent:
  id: motionAtlas.sealed-handoff.intent
  message: Show that routing a package and revealing its contents are separate actions.
