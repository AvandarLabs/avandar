useWhen:
  id: motionAtlas.capability-matrix.useWhen
  message: Compare alternatives using the same explicit list of capabilities.
prompt:
  id: motionAtlas.capability-matrix.prompt
  message: Use Motion Atlas "Capability by capability" (capability-matrix) as a conceptual
    graphic. Compare alternatives using the same explicit list of capabilities. Keep the
    restrained motion and readable labels; replace sample content with approved facts
    before making product claims.
creativeDirection:
  id: motionAtlas.capability-matrix.creativeDirection
  message: A table skeleton and option headings settle first. A narrow horizontal rule
    advances through the capability rows, resolving all cells in each row together so
    the audience compares like with like. The final focus opens a bracket around one
    selected column or row while every other cell remains legible, followed by the
    common opaque exit.
goodFor:
  - id: motionAtlas.capability-matrix.goodFor.0
    message: Compare feature support across a small set of alternatives
  - id: motionAtlas.capability-matrix.goodFor.1
    message: Explain what each plan includes
  - id: motionAtlas.capability-matrix.goodFor.2
    message: Separate conditional support from unknown information
  - id: motionAtlas.capability-matrix.goodFor.3
    message: Compare task needs with an explicitly supplied capability set
  - id: motionAtlas.capability-matrix.goodFor.4
    message: Explain fit across affordability, usability, and lifecycle coverage
  - id: motionAtlas.capability-matrix.goodFor.5
    message: Show whether affordability and defined quality requirements are both met in an
      authored example
  - id: motionAtlas.capability-matrix.goodFor.6
    message: Compare local and network-dependent operations
  - id: motionAtlas.capability-matrix.goodFor.7
    message: Show unknown or planned capability support honestly
