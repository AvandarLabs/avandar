notFor:
  - id: motionAtlas.capability-matrix.notFor.0
    message: Cells are categorical statements, not performance scores or quantities.
  - id: motionAtlas.capability-matrix.notFor.1
    message: Unknown must never be rendered as absent, and conditional cells require
      meaningful source qualifications.
  - id: motionAtlas.capability-matrix.notFor.2
    message: At most three options and five rows fit the intended six-second overview.
  - id: motionAtlas.capability-matrix.notFor.3
    message: A capability state is a supplied statement about a specific context and
      version. Do not infer market-wide absence, universal superiority, or current
      competitor support from a strategic comparison.
  - id: motionAtlas.capability-matrix.notFor.4
    message: Qualitative affordability requires a stated audience and context; included
      features are not proof that a plan is affordable to every team.
  - id: motionAtlas.capability-matrix.notFor.5
    message: A quality row needs an explicit criterion and source. Included affordability
      and quality cells do not prove that every organization can afford the tool or that
      it is safe.
  - id: motionAtlas.capability-matrix.notFor.6
    message: Unavailable, conditional and unknown must stay distinct. Planned capability is
      not currently supported.
distinction:
  id: motionAtlas.capability-matrix.distinction
  message: The grid carries a two-dimensional comparison contract and four explicit cell
    meanings. It is neither a cohort dot-matrix nor source-to-destination
    schema-mapping, and its choreography compares each line item across all
    alternatives.
