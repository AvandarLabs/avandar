name:
  id: motionAtlas.query-column-cache-growth.name
  message: Widen the cache without losing rows
description:
  id: motionAtlas.query-column-cache-growth.description
  message: A cached table answers a narrower column request, then grows to include newly
    requested columns. Every original row remains in the same order and only one live
    cache entry remains.
category:
  id: motionAtlas.query-column-cache-growth.category
  message: Column set containment
useWhen:
  id: motionAtlas.query-column-cache-growth.useWhen
  message: Explain exact column coverage and monotone cache growth without changing row grain.
prompt:
  id: motionAtlas.query-column-cache-growth.prompt
  message: Explain exact column coverage and monotone cache growth without changing row grain.
creativeDirection:
  id: motionAtlas.query-column-cache-growth.creativeDirection
  message: 960x600 React/SVG, shared palette, deterministic 180 frames at 30fps. Frames
    0-12 reveal the scene. Frames 13-60 align the first request with the cached columns
    and pass it. Frames 61-105 show the next request exposing the missing column set.
    Frames 106-139 widen the single cached table to the union of old and required
    columns, preserving each row strip. Hold the resolved meaning during frames 140-165.
    Frames 166-179 return to the same opaque ground for a six-second loop; reset is
    editorial.
intent:
  id: motionAtlas.query-column-cache-growth.intent
  message: Explain exact column coverage and monotone cache growth without changing row grain.
distinction:
  id: motionAtlas.query-column-cache-growth.distinction
  message: Cache-reuse compares identical keys. This changes the needed set, tests
    containment, and replaces one narrower relation with a wider relation without
    joining fragments.
tags:
  - id: motionAtlas.query-column-cache-growth.tags.0
    message: column projection
  - id: motionAtlas.query-column-cache-growth.tags.1
    message: cache containment
  - id: motionAtlas.query-column-cache-growth.tags.2
    message: set union
  - id: motionAtlas.query-column-cache-growth.tags.3
    message: query-first loading
  - id: motionAtlas.query-column-cache-growth.tags.4
    message: row preservation
goodFor:
  - id: motionAtlas.query-column-cache-growth.goodFor.0
    message: Explain why a subset cache hit can become a wider-query miss
  - id: motionAtlas.query-column-cache-growth.goodFor.1
    message: Show column projection that preserves duplicate source rows
domains:
  - id: motionAtlas.query-column-cache-growth.domains.0
    message: Editorial illustration
aliases:
  - id: motionAtlas.query-column-cache-growth.aliases.0
    message: query column cache growth
notFor:
  - id: motionAtlas.query-column-cache-growth.notFor.0
    message: Projection removes columns only. Duplicate rows and physical row order must not
      change.
  - id: motionAtlas.query-column-cache-growth.notFor.1
    message: The origin may still deliver every column; drawn cache savings do not imply
      network pushdown.
  - id: motionAtlas.query-column-cache-growth.notFor.2
    message: Freshness, authorization and source version changes are not modeled.
  - id: motionAtlas.query-column-cache-growth.notFor.3
    message: No real product screen, external fetch, supplied code execution, or measured
      performance claim. All text is authored; no JSX, functions or URLs in props.
  - id: motionAtlas.query-column-cache-growth.notFor.4
    message: Supplied prose is preserved. Fictional framing, evidence, and agreement between
      wording and selected states are authoring responsibilities. Runtime validation
      enforces structural bounds and explicit cross-field rules.
  - id: motionAtlas.query-column-cache-growth.notFor.5
    message: Exact local cell whitespace uses distinct visible space, tab and newline marks.
      Repeated rows remain separate occurrences.
motionBeats:
  - startFrame: 13
    endFrame: 60
    description:
      id: motionAtlas.query-column-cache-growth.motionBeats.0
      message: Match the covered request against the cache.
  - startFrame: 61
    endFrame: 105
    description:
      id: motionAtlas.query-column-cache-growth.motionBeats.1
      message: Expose missing columns for the second request.
  - startFrame: 106
    endFrame: 139
    description:
      id: motionAtlas.query-column-cache-growth.motionBeats.2
      message: Widen one cache while preserving every row occurrence.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.query-column-cache-growth.motionBeats.3
      message: Hold the complete union of columns.
