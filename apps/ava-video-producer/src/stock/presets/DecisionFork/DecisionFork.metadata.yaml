useWhen:
  id: motionAtlas.decision-fork.useWhen
  message: Show one chosen path and the condition that selects it.
prompt:
  id: motionAtlas.decision-fork.prompt
  message:
    Use Motion Atlas "Choose one branch" (decision-fork) as a conceptual graphic.
    Show one chosen path and the condition that selects it. Keep the restrained motion
    and readable labels; replace sample content with approved facts before making
    product claims.
creativeDirection:
  id: motionAtlas.decision-fork.creativeDirection
  message:
    The decision prompt enters at the root and two to four equal branches draw
    outward with condition labels. A single marker pauses at the junction while the
    selected condition receives emphasis. The unused branch gates close gently, the
    marker travels down the chosen branch, and its outcome opens into a final hold while
    alternate outcomes remain subdued and labeled.
goodFor:
  - id: motionAtlas.decision-fork.goodFor.0
    message: Explain an if-then choice
  - id: motionAtlas.decision-fork.goodFor.1
    message: Trace one scenario through a decision rule
  - id: motionAtlas.decision-fork.goodFor.2
    message: Show why one of several possible routes is taken
  - id: motionAtlas.decision-fork.goodFor.3
    message: Explain one supplied local-or-remote execution choice
  - id: motionAtlas.decision-fork.goodFor.4
    message: Show how a declared eligibility condition selects an illustrative plan path
  - id: motionAtlas.decision-fork.goodFor.5
    message: Explain a decision constrained by an explicitly stated community concern
  - id: motionAtlas.decision-fork.goodFor.6
    message: Show a principled next action in a bounded scenario
