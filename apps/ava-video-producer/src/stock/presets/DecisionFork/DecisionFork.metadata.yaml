notFor:
  - id: motionAtlas.decision-fork.notFor.0
    message: Only one decision level and one selected branch are supported.
  - id: motionAtlas.decision-fork.notFor.1
    message: The author supplies the choice; conditions are labels rather than executable rules.
  - id: motionAtlas.decision-fork.notFor.2
    message: Branch lengths and angles do not encode probability, duration, or preference.
  - id: motionAtlas.decision-fork.notFor.3
    message:
      An authored branch is not a cost optimizer, legal eligibility assessment, or
      automatic classifier. No sector, intent, affordability, or trustworthiness may be
      inferred from dataset names or descriptive text.
  - id: motionAtlas.decision-fork.notFor.4
    message:
      If illustrating execution placement, retain the stated feasibility and
      data-boundary conditions. Do not imply that every task can run on either side.
  - id: motionAtlas.decision-fork.notFor.5
    message:
      Branch conditions and moral priorities are authored. The animation neither
      determines ethical correctness nor infers absence of harm.
