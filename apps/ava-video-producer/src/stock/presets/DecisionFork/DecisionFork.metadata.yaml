name:
  id: motionAtlas.decision-fork.name
  message: Choose one branch
description:
  id: motionAtlas.decision-fork.description
  message:
    One explicit decision opens into a small number of labeled alternatives. An
    authored choice closes the unused gates and carries one marker to the selected
    outcome.
