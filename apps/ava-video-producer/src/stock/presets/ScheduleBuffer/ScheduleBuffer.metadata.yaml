    message: Explaining planned slack in a schedule
  - id: motionAtlas.schedule-buffer.goodFor.1
    message: Showing a bounded delay absorbed before a deadline
  - id: motionAtlas.schedule-buffer.goodFor.2
    message: Discussing contingency without changing the scope of the planned work
domains:
  - id: motionAtlas.schedule-buffer.domains.0
    message: Editorial explanation
aliases:
  - id: motionAtlas.schedule-buffer.aliases.0
    message: Time allocation
notFor:
  - id: motionAtlas.schedule-buffer.notFor.0
    message: The default schedule is fictional; segment widths exactly encode supplied
      duration units, not evidence of real delivery performance.
  - id: motionAtlas.schedule-buffer.notFor.1
    message: The interruption must fit within the supplied reserve; overruns and moving
      deadlines are intentionally excluded.
  - id: motionAtlas.schedule-buffer.notFor.2
    message: Tasks are sequential, indivisible, and unchanged in duration; parallel work and
      resource calendars are not modeled.
motionBeats:
  - startFrame: 12
    endFrame: 44
    description:
      id: motionAtlas.schedule-buffer.motionBeats.0
      message: Assemble proportional tasks, reserve, and a fixed deadline.
  - startFrame: 44
    endFrame: 74
    description:
      id: motionAtlas.schedule-buffer.motionBeats.1
      message: Reveal the interruption after its named task.
  - startFrame: 74
    endFrame: 118
    description:
      id: motionAtlas.schedule-buffer.motionBeats.2
      message: Translate later tasks and consume exactly the delay width.
  - startFrame: 118
    endFrame: 168
    description:
      id: motionAtlas.schedule-buffer.motionBeats.3
      message: Hold the conserved schedule and remaining reserve.
