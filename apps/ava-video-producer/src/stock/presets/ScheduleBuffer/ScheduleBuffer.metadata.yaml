name:
  id: motionAtlas.schedule-buffer.name
  message: Let the buffer absorb a delay
description:
  id: motionAtlas.schedule-buffer.description
  message: A scheduled sequence leaves a visible reserve before a fixed deadline. An
    interruption shifts later work into that reserve while the deadline stays in place.
category:
  id: motionAtlas.schedule-buffer.category
  message: Time allocation
useWhen:
  id: motionAtlas.schedule-buffer.useWhen
  message: Show how unused schedule capacity can absorb a specific interruption.
prompt:
  id: motionAtlas.schedule-buffer.prompt
  message: Show how unused schedule capacity can absorb a specific interruption.
creativeDirection:
  id: motionAtlas.schedule-buffer.creativeDirection
  message: During 12..44, assemble one horizontal schedule from proportionally sized task
    blocks followed by a hatched reserve segment and a stationary deadline pin. During
    44..74, reveal the supplied interruption block immediately after its named task.
    During 74..118, the remaining task blocks translate together by the interruption's
    width and the reserve shortens by exactly that width. A contour along the schedule
    keeps the total endpoint aligned with the unchanged deadline pin. Hold the inserted
    interruption, shifted tasks, and remaining reserve through 168, then exit to the
    opaque ground. The viewer sees precisely where the delay was absorbed.
intent:
  id: motionAtlas.schedule-buffer.intent
  message: Show how unused schedule capacity can absorb a specific interruption.
distinction:
  id: motionAtlas.schedule-buffer.distinction
  message: This conserves one schedule's total width while reallocating reserve time. It
    is neither a chart of changing rankings nor a pipeline whose stages merely activate
    in order.
