name:
  id: motionAtlas.utterance-to-model-draft.name
  message: Lift a description into a model draft
description:
  id: motionAtlas.utterance-to-model-draft.description
  message: Named phrases lift from a short authored sentence into an explicit
    entity-and-relationship draft. The original wording remains visible beside the
    proposed structure, and an optional human acceptance marker distinguishes a reviewed
    draft from a pending one.
category:
  id: motionAtlas.utterance-to-model-draft.category
  message: Description and conceptual structure
useWhen:
  id: motionAtlas.utterance-to-model-draft.useWhen
  message:
    Make an authored phrase-to-model interpretation inspectable without treating it
    as automatic truth.
intent:
  id: motionAtlas.utterance-to-model-draft.intent
  message:
    Make an authored phrase-to-model interpretation inspectable without treating it
    as automatic truth.
creativeDirection:
  id: motionAtlas.utterance-to-model-draft.creativeDirection
  message:
    Frames 0-11 reveal a short sentence on a 960x600 canvas. Frames 12-48 underline
    the supplied entity and relation tokens while all connector words remain in place.
    Frames 49-105 lift duplicate phrase slips from those exact spans into two entity
    sockets and one relationship hinge; an optional attribute slip docks to its declared
    entity. Frames 106-135 place the supplied review note and, only for accept, a human
    acceptance marker. Frames 136-167 hold the unchanged source sentence beside the
    complete proposed model. Fade to the common opaque palette ground at frames 168-179.
    All React/SVG motion is deterministic at 30fps and no language-model request is
    executed.
distinction:
  id: motionAtlas.utterance-to-model-draft.distinction
  message:
    Unlike schema-mapping, the starting material is a sentence rather than two
    field schemas. Unlike entity-spine-assembly, no source records are materialized and
    no unique-member set is calculated. The hero action preserves the origin of each
    authored concept as language becomes a proposed structure. Unlike
    prose-measurement-ledger, this proposes conceptual entity types and a relationship
    rather than extracting a subject's measurement, unit, reporting period, and
    qualifier. It defines a model, not an observation row.
