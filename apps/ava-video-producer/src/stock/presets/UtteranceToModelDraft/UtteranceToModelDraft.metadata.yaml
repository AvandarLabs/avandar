notFor:
  - id: motionAtlas.utterance-to-model-draft.notFor.0
    message:
      One short sentence, two entities, one relation, and at most one attribute fit
      the six-second loop. More complex domain modeling belongs in a longer explanation.
  - id: motionAtlas.utterance-to-model-draft.notFor.1
    message:
      All mappings and labels are authored inputs, not generated model output. The
      scene does not implement description-logic reasoning, model training,
      natural-language parsing, or arbitrary-domain configuration.
  - id: motionAtlas.utterance-to-model-draft.notFor.2
    message:
      No cardinality, uniqueness, datatype, relationship inference, or business rule
      may be added unless explicitly present in a future separately specified contract.
  - id: motionAtlas.utterance-to-model-draft.notFor.3
    message:
      Pending review remains pending without a success marker. Accepted marks only
      the supplied owner decision, not objective model correctness or a deployed
      workspace.
  - id: motionAtlas.utterance-to-model-draft.notFor.4
    message:
      The stock animation makes no claim that a particular product provides
      natural-language configuration or that a proposed model has been deployed.
  - id: motionAtlas.utterance-to-model-draft.notFor.5
    message:
      Free prose is author supplied; only structural, reference, numeric and
      documented lexical constraints are runtime-validated.
motionBeats:
  - startFrame: 0
    endFrame: 11
    description:
      id: motionAtlas.utterance-to-model-draft.beats.0
      message: Reveal the authored scene.
  - startFrame: 12
    endFrame: 48
    description:
      id: motionAtlas.utterance-to-model-draft.beats.1
      message: Underline authored mapped fragments.
  - startFrame: 49
    endFrame: 105
    description:
      id: motionAtlas.utterance-to-model-draft.beats.2
      message: Lift duplicate phrase slips to their supplied model sockets.
  - startFrame: 106
    endFrame: 135
    description:
      id: motionAtlas.utterance-to-model-draft.beats.3
      message: Reveal the supplied review note and only an authored acceptance.
  - startFrame: 136
    endFrame: 167
    description:
      id: motionAtlas.utterance-to-model-draft.beats.4
      message: Hold the unchanged sentence and complete draft.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.utterance-to-model-draft.beats.5
      message: Return to the common opaque ground.
