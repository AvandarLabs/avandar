notFor:
  - id: motionAtlas.habitat-corridor-reconnection.notFor.0
    message: "Total mapped area is conserved: existing habitat + other land before =
      existing habitat + corridor + other land after. The crossing is part of the
      corridor footprint, not additional habitat area."
  - id: motionAtlas.habitat-corridor-reconnection.notFor.1
    message: Geometry is schematic; footprint area is calculated from supplied rectangular
      dimensions, while visual patch shape is not a geographic measurement.
  - id: motionAtlas.habitat-corridor-reconnection.notFor.2
    message: Designed connectivity does not establish species suitability, movement,
      survival, biodiversity gain or long-term restoration success. Traversal is
      optional and explicitly illustrative; defaults are fictional.
