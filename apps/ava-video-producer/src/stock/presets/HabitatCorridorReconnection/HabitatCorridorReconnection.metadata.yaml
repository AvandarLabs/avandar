name:
  id: motionAtlas.habitat-corridor-reconnection.name
  message: Build a route between habitats
description:
  id: motionAtlas.habitat-corridor-reconnection.description
  message: A planned habitat strip and crossing physically reconnect two separated patches
    on a schematic land-use map. The same mapped area changes use, and an optional
    illustrative traversal shows designed connectivity without asserting ecological
    recovery.
category:
  id: motionAtlas.habitat-corridor-reconnection.category
  message: Schematic land-use map and constructed crossing
useWhen:
  id: motionAtlas.habitat-corridor-reconnection.useWhen
  message: Show the physical land-use change required to connect separated habitat patches.
prompt:
  id: motionAtlas.habitat-corridor-reconnection.prompt
  message: Use Build a route between habitats (habitat-corridor-reconnection) with
    complete authored inputs and preserve the stated limits.
creativeDirection:
  id: motionAtlas.habitat-corridor-reconnection.creativeDirection
  message: Reveal habitat patches separated by working land and a road. At the
    land-management cue, lay the authored corridor footprint across the gap and lift its
    crossing over the road. Transfer that footprint's area from other land to habitat
    within the fixed boundary. Optionally move an explicitly illustrative marker along
    the supplied connection, then hold the conserved land balance.
intent:
  id: motionAtlas.habitat-corridor-reconnection.intent
  message: Show the physical land-use change required to connect separated habitat patches.
distinction:
  id: motionAtlas.habitat-corridor-reconnection.distinction
  message: A physical strip changes land use and bridges a barrier before a route can be
    traversed. Unlike network-graph or node-traversal, the connection requires a visible
    spatial intervention and an area budget.
