name:
  id: motionAtlas.bounded-location-displacement.name
  message: Show displacement as an approximation
description:
  id: motionAtlas.bounded-location-displacement.description
  message: A precise schematic point is replaced in a display copy by an authored offset
    inside a stated radius. The source stays local and the displayed marker is labeled
    approximate, never silently treated as the original location.
category:
  id: motionAtlas.bounded-location-displacement.category
  message: Bounded coordinate disclosure
useWhen:
  id: motionAtlas.bounded-location-displacement.useWhen
  message: Distinguish deliberately displaced display coordinates from source positions.
prompt:
  id: motionAtlas.bounded-location-displacement.prompt
  message: React/SVG 960x600, shared palette, deterministic 180 frames at 30fps. Frames
    0-12 reveal a local analysis inset with all supplied source locations and a
    completely empty display-copy map. Frames 13-70 compute each authored offset inside
    the local inset and show its distance against the bound. Frames 71-139 emit only the
    displaced coordinates onto the display-copy map, labeling every point approximate.
    Never place a source coordinate on the display map, even transiently. Hold all
    displaced points and separated local inset at 140-165, then fade both to the same
    opaque ground at 166-179.
creativeDirection:
  id: motionAtlas.bounded-location-displacement.creativeDirection
  message: React/SVG 960x600, shared palette, deterministic 180 frames at 30fps. Frames
    0-12 reveal a local analysis inset with all supplied source locations and a
    completely empty display-copy map. Frames 13-70 compute each authored offset inside
    the local inset and show its distance against the bound. Frames 71-139 emit only the
    displaced coordinates onto the display-copy map, labeling every point approximate.
    Never place a source coordinate on the display map, even transiently. Hold all
    displaced points and separated local inset at 140-165, then fade both to the same
    opaque ground at 166-179.
intent:
  id: motionAtlas.bounded-location-displacement.intent
  message: Distinguish deliberately displaced display coordinates from source positions.
distinction:
  id: motionAtlas.bounded-location-displacement.distinction
  message: Location-uncertainty-boundary depicts uncertainty already present in evidence.
    This intentionally changes a display copy under a supplied disclosure policy and
    labels the difference.
