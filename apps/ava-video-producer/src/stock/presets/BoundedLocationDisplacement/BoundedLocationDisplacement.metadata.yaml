goodFor:
  - id: motionAtlas.bounded-location-displacement.goodFor.0
    message: Explain a deliberately approximate location display
  - id: motionAtlas.bounded-location-displacement.goodFor.1
    message: Distinguish displacement from measurement uncertainty
domains:
  - id: motionAtlas.bounded-location-displacement.domains.0
    message: Bounded coordinate disclosure
aliases:
  - id: motionAtlas.bounded-location-displacement.aliases.0
    message: point jitter
  - id: motionAtlas.bounded-location-displacement.aliases.1
