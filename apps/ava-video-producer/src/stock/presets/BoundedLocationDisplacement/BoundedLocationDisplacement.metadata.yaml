notFor:
  - id: motionAtlas.bounded-location-displacement.notFor.0
    message: Displacement does not guarantee anonymity, safety, k-anonymity or differential
      privacy.
  - id: motionAtlas.bounded-location-displacement.notFor.1
    message: The bound is displacement from the source, not confidence radius around the
      true position.
  - id: motionAtlas.bounded-location-displacement.notFor.2
    message: No fresh randomness; offsets are supplied and deterministic.
  - id: motionAtlas.bounded-location-displacement.notFor.3
    message: No live geography, online routing, JSX, functions, URLs, private records or
      external requests. Maps are schematic local plans; no real-world inference
      follows.
  - id: motionAtlas.bounded-location-displacement.notFor.4
    message: Authored prose remains the author’s responsibility. Runtime validation
      preserves supplied text without classifying its language or factual claims.
motionBeats:
  - startFrame: 0
    endFrame: 12
    description:
      id: motionAtlas.bounded-location-displacement.beat.0
      message: Reveal local sources and an empty public map.
  - startFrame: 13
    endFrame: 70
    description:
      id: motionAtlas.bounded-location-displacement.beat.1
      message: Compute authored bounded offsets locally.
  - startFrame: 71
    endFrame: 139
    description:
      id: motionAtlas.bounded-location-displacement.beat.2
      message: Disclose only approximate displaced coordinates.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.bounded-location-displacement.beat.3
      message: Hold the resolved study.
  - startFrame: 166
    endFrame: 179
    description:
      id: motionAtlas.bounded-location-displacement.beat.4
      message: The enclosing StockGraphic fades to opaque ground.
