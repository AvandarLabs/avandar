name:
  id: motionAtlas.resident-budget-ballots.name
  message: Count residents' project ballots
description:
  id: motionAtlas.resident-budget-ballots.description
  message: Residents cast fictional project-choice ballots into a shared box. The same
    ballots unfold into an inspectable tally, while abstentions remain separate and no
    funding decision is inferred.
category:
  id: motionAtlas.resident-budget-ballots.category
  message: Physical civic participation
useWhen:
  id: motionAtlas.resident-budget-ballots.useWhen
  message: Show how resident choices become a transparent project-preference tally.
prompt:
  id: motionAtlas.resident-budget-ballots.prompt
  message: Begin with a small row of anonymous residents and a project display. Each
    resident marks one paper behind a short screen, then places it in the ballot box or
    keeps an abstention slip. The box opens and the same papers unfold into stacks under
    their chosen project symbols. Hold every cast ballot, the abstention slips and
    derived totals. Do not transform votes into money or automatically crown a winner.
creativeDirection:
  id: motionAtlas.resident-budget-ballots.creativeDirection
  message: Begin with a small row of anonymous residents and a project display. Each
    resident marks one paper behind a short screen, then places it in the ballot box or
    keeps an abstention slip. The box opens and the same papers unfold into stacks under
    their chosen project symbols. Hold every cast ballot, the abstention slips and
    derived totals. Do not transform votes into money or automatically crown a winner.
intent:
  id: motionAtlas.resident-budget-ballots.intent
  message: Show how resident choices become a transparent project-preference tally.
distinction:
  id: motionAtlas.resident-budget-ballots.distinction
  message: The same privately marked paper ballots move from individual choice through a
    ballot box into an auditable tally. Unlike pooled-donor-allocation, the units are
    votes and never become funds; unlike bar-race, there is no animated rank change or
    automatic winner.
