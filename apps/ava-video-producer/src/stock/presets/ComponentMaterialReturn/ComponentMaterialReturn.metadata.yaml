notFor:
  - id: motionAtlas.component-material-return.notFor.0
    message: Returned mass + replacement input = reassembled mass + recycling-stream mass +
      residue. Reassembled mass includes reuse and repair routes without assuming mass
      loss.
  - id: motionAtlas.component-material-return.notFor.1
    message: Sent to recycling is not the same as recovered secondary material. No recovery
      yield, virgin-material displacement, embodied-carbon saving or infinite
      recyclability is claimed.
  - id: motionAtlas.component-material-return.notFor.2
    message: Repair success and component compatibility are authored assumptions in this
      fictional example. Additional process inputs or losses require extending the
      supplied boundary, not silently discarding mass.
