name:
  id: motionAtlas.component-material-return.name
  message: Recover parts, account for residue
description:
  id: motionAtlas.component-material-return.description
  message: A returned object opens into identifiable components that follow reuse, repair,
    recycling or residue routes. Reassembled output and separate material bins reconcile
    with returned mass plus any replacement inputs.
category:
  id: motionAtlas.component-material-return.category
  message: Exploded assembly and material destinations
useWhen:
  id: motionAtlas.component-material-return.useWhen
  message: Show which material returns to use and which material still leaves the loop.
prompt:
  id: motionAtlas.component-material-return.prompt
  message: Reveal the returned assembly within its stated material boundary. An operator
    separates its labeled parts into their supplied reuse, repair, recycling and residue
    destinations. Separately labeled replacement inputs join the recovered parts in the
    new assembly. Hold the new assembly, recycling and residue with an input-output mass
    equation, then fade.
creativeDirection:
  id: motionAtlas.component-material-return.creativeDirection
  message: Reveal the returned assembly within its stated material boundary. An operator
    separates its labeled parts into their supplied reuse, repair, recycling and residue
    destinations. Separately labeled replacement inputs join the recovered parts in the
    new assembly. Hold the new assembly, recycling and residue with an input-output mass
    equation, then fade.
intent:
  id: motionAtlas.component-material-return.intent
  message: Show which material returns to use and which material still leaves the loop.
distinction:
  id: motionAtlas.component-material-return.distinction
  message: Identifiable parts physically disassemble and some reassemble into a new whole.
    The explicit external input and residue prevent the closed-circle illusion of a
    generic circular arrow.
