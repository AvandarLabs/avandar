  - id: motionAtlas.surveillance-reporting-backfill.goodFor.2
    message: Show why a historical surveillance count was revised
notFor:
  - id: motionAtlas.surveillance-reporting-backfill.notFor.0
    message:
      Only supplied observations are shown. No nowcast, reporting completeness
      estimate, or unseen-event total is inferred.
  - id: motionAtlas.surveillance-reporting-backfill.notFor.1
    message:
      Each record contributes once per snapshot after its first appearance; revised
      minus earlier total equals newly received records.
  - id: motionAtlas.surveillance-reporting-backfill.notFor.2
    message:
      Histogram counts are record totals, not incidence rates. This does not assess
      an outbreak or offer medical guidance.
