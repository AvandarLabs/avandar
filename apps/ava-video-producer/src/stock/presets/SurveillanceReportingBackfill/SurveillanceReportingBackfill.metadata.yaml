name:
  id: motionAtlas.surveillance-reporting-backfill.name
  message: New reports can change earlier days
description:
  id: motionAtlas.surveillance-reporting-backfill.description
  message:
    A fictional surveillance histogram is updated between two reporting snapshots.
    Newly received records land in their earlier event-date bins instead of being added
    to the current day's event count.
category:
  id: motionAtlas.surveillance-reporting-backfill.category
  message: temporal record reassignment
useWhen:
  id: motionAtlas.surveillance-reporting-backfill.useWhen
  message:
    Show that a later report can revise an earlier period without representing a
    new event today.
prompt:
  id: motionAtlas.surveillance-reporting-backfill.prompt
  message:
    Begin with the histogram known at the first reporting snapshot. Advance the
    reporting-date tab while later receipts open above the chart; their tokens drop into
    the supplied earlier event bins. Hold the original bar outlines beneath the revised
    heights and retain both snapshot totals.
creativeDirection:
  id: motionAtlas.surveillance-reporting-backfill.creativeDirection
  message:
    Begin with the histogram known at the first reporting snapshot. Advance the
    reporting-date tab while later receipts open above the chart; their tokens drop into
    the supplied earlier event bins. Hold the original bar outlines beneath the revised
    heights and retain both snapshot totals.
intent:
  id: motionAtlas.surveillance-reporting-backfill.intent
  message:
    Show that a later report can revise an earlier period without representing a
    new event today.
distinction:
  id: motionAtlas.surveillance-reporting-backfill.distinction
  message:
    New records alter historical bins while reporting time advances independently.
    Unlike a trend trace or journal receipt, the hero action is retroactive event-date
    placement, not drawing a trend or acknowledging already stored records.
