goodFor:
  - id: motionAtlas.stratified-spatial-sample.goodFor.0
    message: Explain a spatial sampling plan
  - id: motionAtlas.stratified-spatial-sample.goodFor.1
    message: Show selected versus eligible sites by stratum
  - id: motionAtlas.stratified-spatial-sample.goodFor.2
    message: Introduce field survey allocation without claiming representativeness
notFor:
  - id: motionAtlas.stratified-spatial-sample.notFor.0
    message:
      Selection is authored, not random. No sample weights, confidence intervals, or
      representativeness are calculated.
  - id: motionAtlas.stratified-spatial-sample.notFor.1
    message:
      Each site counts once. Site fractions are not population fractions unless
      supplied through a different, explicit data contract.
  - id: motionAtlas.stratified-spatial-sample.notFor.2
    message:
      Only schematic local geography is supported; boundaries do not describe real
      administrative areas.
