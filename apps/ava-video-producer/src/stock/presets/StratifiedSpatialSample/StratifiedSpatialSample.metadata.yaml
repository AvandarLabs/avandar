name:
  id: motionAtlas.stratified-spatial-sample.name
  message: Choose sites across the whole frame
description:
  id: motionAtlas.stratified-spatial-sample.description
  message:
    A schematic sampling frame separates into named geographic strata. Authored
    sampling sites lift from each stratum while unsampled eligible sites remain visible
    underneath.
category:
  id: motionAtlas.stratified-spatial-sample.category
  message: spatial sample selection
useWhen:
  id: motionAtlas.stratified-spatial-sample.useWhen
  message: Make the supplied selection and its geographic sampling frame visible together.
prompt:
  id: motionAtlas.stratified-spatial-sample.prompt
  message:
    Open on a complete field of eligible site markers. Thin boundaries divide the
    frame into supplied strata, then selected markers rise onto short sampling stems
    without leaving their coordinates. Hold each stratum's selected count over its
    eligible-site denominator.
creativeDirection:
  id: motionAtlas.stratified-spatial-sample.creativeDirection
  message:
    Open on a complete field of eligible site markers. Thin boundaries divide the
    frame into supplied strata, then selected markers rise onto short sampling stems
    without leaving their coordinates. Hold each stratum's selected count over its
    eligible-site denominator.
intent:
  id: motionAtlas.stratified-spatial-sample.intent
  message: Make the supplied selection and its geographic sampling frame visible together.
distinction:
  id: motionAtlas.stratified-spatial-sample.distinction
  message:
    The transformation is an explicit sample drawn from a retained, partitioned
    eligible frame. Unlike environmental-observation-gaps, it explains selection before
    observation and never adds measurements or fills missing geography.
