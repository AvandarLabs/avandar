motionBeats:
  - startFrame: 0
    endFrame: 35
    description:
      id: motionAtlas.stratified-spatial-sample.beat.0
      message: Show all eligible sites and draw the supplied strata during frames 18–36.
  - startFrame: 36
    endFrame: 107
    description:
      id: motionAtlas.stratified-spatial-sample.beat.1
      message: Raise selected markers onto stems while their coordinate anchors remain fixed.
  - startFrame: 108
    endFrame: 179
    description:
      id: motionAtlas.stratified-spatial-sample.beat.2
      message: Hold every stratum denominator, including any stratum with zero selected sites.
