name:
  id: motionAtlas.readiness-latch.name
  message: Wait for every required branch
description:
  id: motionAtlas.readiness-latch.description
  message: Independent work ribbons reach a shared readiness latch. Completed branches
    release their own pins, but the common result can pass only after every required
    branch is ready.
category:
  id: motionAtlas.readiness-latch.category
  message: Coordination constraints
useWhen:
  id: motionAtlas.readiness-latch.useWhen
  message: Explain a shared action that waits for every named participant's readiness.
prompt:
  id: motionAtlas.readiness-latch.prompt
  message: Explain a shared action that waits for every named participant's readiness.
creativeDirection:
  id: motionAtlas.readiness-latch.creativeDirection
  message: Reveal two to five work ribbons ending at a shared latch. Their progress
    advances with authored relative work units during frames 24..112; ready participants
    withdraw their pins as they finish, while unready participants retain theirs. At
    frame 122, the latch opens only if every pin is withdrawn, releasing the labeled
    result by frame 146. Otherwise hold the blocked gate and identify the waiting
    branch. Preserve completed ribbons during the final reading hold, then fade to the
    common ground.
intent:
  id: motionAtlas.readiness-latch.intent
  message: Explain a shared action that waits for every named participant's readiness.
distinction:
  id: motionAtlas.readiness-latch.distinction
  message: Combines a parallel-completion barrier and a readiness gate. Unlike
    status-cycle, the action depends on all independent branch states and may remain
    blocked; an early completion cannot release it.
