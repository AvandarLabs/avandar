    message: Coordination constraints
notFor:
  - id: motionAtlas.readiness-latch.notFor.0
    message: The condition is all supplied participants, not a majority, weighted vote, or
      consensus algorithm.
  - id: motionAtlas.readiness-latch.notFor.1
    message: Readiness and ordering are authored. The small latch test and reveal are
      illustrative timing, not measured coordination latency.
  - id: motionAtlas.readiness-latch.notFor.2
    message: A blocked final state is valid. Waiting must not be styled as a participant's
      fault or as proof of a failure outside the example.
  - id: motionAtlas.readiness-latch.notFor.3
    message: The default branches and work quantities are fictional.
  - id: motionAtlas.readiness-latch.notFor.4
    message: Work units establish relative authored timing only; the six-second playback is
      not a duration forecast.
  - id: motionAtlas.readiness-latch.notFor.5
    message: Every branch is required. An unready branch remains incomplete and keeps the
      latch closed. Quorum and optional checks require another scene.
  - id: motionAtlas.readiness-latch.notFor.6
    message: A cached dependency list does not establish that every other product capability
      works offline.
motionBeats:
  - startFrame: 12
    endFrame: 24
    description:
      id: motionAtlas.readiness-latch.motionBeats.0
      message: Reveal stable ribbon order and the common latch.
  - startFrame: 24
    endFrame: 112
    description:
      id: motionAtlas.readiness-latch.motionBeats.1
      message: Relative work completes ready ribbons while unready pins remain.
  - startFrame: 122
    endFrame: 146
    description:
      id: motionAtlas.readiness-latch.motionBeats.2
      message: Open only when all pins have withdrawn and release the result.
  - startFrame: 146
    endFrame: 166
    description:
      id: motionAtlas.readiness-latch.motionBeats.3
      message: Hold the completed ribbons and released or blocked gate.
