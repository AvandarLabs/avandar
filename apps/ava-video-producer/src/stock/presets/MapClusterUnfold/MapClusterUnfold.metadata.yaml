name:
  id: motionAtlas.map-cluster-unfold.name
  message: A cluster is the same points grouped
description:
  id: motionAtlas.map-cluster-unfold.description
  message:
    Several fixed point records gather into authored map clusters at one zoom
    state. The clusters unfold into their original members when the view changes,
    preserving every identity and the total count.
category:
  id: motionAtlas.map-cluster-unfold.category
  message: Map clustering
useWhen:
  id: motionAtlas.map-cluster-unfold.useWhen
  message: Preserve point identities and counts through display grouping.
prompt:
  id: motionAtlas.map-cluster-unfold.prompt
  message:
    Use Motion Atlas A cluster is the same points grouped (map-cluster-unfold) to
    preserve point identities and counts through display grouping. Supply approved
    authored content before making claims.
creativeDirection:
  id: motionAtlas.map-cluster-unfold.creativeDirection
  message:
    React/SVG 960x600 canvas, shared palette, deterministic 180 frames at 30fps.
    This is schematic local geography with no real basemap. Frames 0-12 reveal. Frames
    13-52 draw all points on a schematic map. Frames 53-82 contract members into their
    supplied cluster centers with derived count labels. Frames 82-99 hold the exact
    grouped positions and visible counts. Stationary coincident locations retain count
    badges throughout movement. Frames 99-139 expand the same identities back to their
    original points while a total ledger stays fixed. Hold at frames 140-165; fade to
    the same opaque ground at frames 166-179 for an editorial loop.
intent:
  id: motionAtlas.map-cluster-unfold.intent
  message: Preserve point identities and counts through display grouping.
distinction:
  id: motionAtlas.map-cluster-unfold.distinction
  message:
    Unlike plexus-field or radial-network, cluster membership is explicit,
    count-conserving and reversible. These are grouped observations, not connections or
    epidemiological clusters.
