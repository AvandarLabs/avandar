  - id: motionAtlas.map-cluster-unfold.domains.0
    message: Map clustering
aliases:
  - id: motionAtlas.map-cluster-unfold.aliases.0
    message: map clustering
  - id: motionAtlas.map-cluster-unfold.aliases.1
    message: zoom grouping
  - id: motionAtlas.map-cluster-unfold.aliases.2
