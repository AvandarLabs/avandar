notFor:
  - id: motionAtlas.map-cluster-unfold.notFor.0
    message:
      Cluster assignments are authored, not a spatial clustering algorithm or a
      detection claim.
  - id: motionAtlas.map-cluster-unfold.notFor.1
    message:
      Screen grouping is not geographic proximity evidence, incidence, exposure or
      common cause.
  - id: motionAtlas.map-cluster-unfold.notFor.2
    message: No records disappear when clusters collapse.
  - id: motionAtlas.map-cluster-unfold.notFor.3
    message:
      No live geography, online routing, JSX, functions, URLs, private records or
      external requests. Maps are schematic local plans; no real-world inference
      follows.
  - id: motionAtlas.map-cluster-unfold.notFor.4
    message:
      Authored prose and schematic context are the author's responsibility. Runtime
      validation checks structural bounds and numeric, reference and geometry
      constraints, without classifying natural-language claims.
  - id: motionAtlas.map-cluster-unfold.notFor.5
    message:
      Point and cluster IDs allow empty strings and are bounded to 12 characters.
      Coincident authored points and cluster centers share an aggregate location count,
      with separate keyed ledgers retaining every identity. Literal ID whitespace uses
      distinct visible marks when IDs are enabled.
motionBeats:
  - startFrame: 0
    endFrame: 12
    description:
      id: motionAtlas.map-cluster-unfold.motionBeats.0
      message: Reveal the schematic scene.
  - startFrame: 13
    endFrame: 52
    description:
      id: motionAtlas.map-cluster-unfold.motionBeats.1
      message: Draw every source point at its authored coordinates.
  - startFrame: 53
    endFrame: 82
    description:
      id: motionAtlas.map-cluster-unfold.motionBeats.2
      message: Contract the same points into supplied cluster centers with derived counts.
  - startFrame: 82
    endFrame: 99
    description:
      id: motionAtlas.map-cluster-unfold.motionBeats.groupedHold
      message: Hold exact grouped coordinates with visible derived map counts.
  - startFrame: 99
    endFrame: 139
    description:
      id: motionAtlas.map-cluster-unfold.motionBeats.3
      message: Expand the same identities back to their original coordinates.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.map-cluster-unfold.motionBeats.4
      message: Hold the complete resolved relationship.
  - startFrame: 166
    endFrame: 179
    description:
      id: motionAtlas.map-cluster-unfold.motionBeats.5
      message: The outer stock envelope fades to the same opaque ground.
