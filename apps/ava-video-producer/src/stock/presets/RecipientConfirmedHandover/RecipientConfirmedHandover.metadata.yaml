notFor:
  - id: motionAtlas.recipient-confirmed-handover.notFor.0
    message:
      Each drawn object is one fictional unit; offeredUnits equals selectedUnits plus
      retainedUnits for every good, with retainedUnits derived rather than separately
      configured.
  - id: motionAtlas.recipient-confirmed-handover.notFor.1
    message:
      Selected quantities are authored household choices, not a recommended package,
      nutritional target, eligibility entitlement, or real preference measurement.
  - id: motionAtlas.recipient-confirmed-handover.notFor.2
    message:
      The example assumes the offered goods may be selected individually; it does not
      claim that any real aid program permits substitutions or partial collection.
  - id: motionAtlas.recipient-confirmed-handover.notFor.3
    message:
      The receipt is a fictional acknowledgement of quantities, not legal proof,
      identity verification, satisfaction, or measured impact. Avoid real names,
      signatures, and identifiers.
motionBeats:
  - startFrame: 12
    endFrame: 29
    description:
      id: motionAtlas.recipient-confirmed-handover.motionBeats.0
      message: Reveal the offered goods, counting mat and household basket.
  - startFrame: 30
    endFrame: 100
    description:
      id: motionAtlas.recipient-confirmed-handover.motionBeats.1
      message:
        Reach for and pull each selected unit across the mat, filling receipt
        quantities only after arrival.
  - startFrame: 101
    endFrame: 126
    description:
      id: motionAtlas.recipient-confirmed-handover.motionBeats.2
      message: Hold the counted list, then acknowledge it with the selected mark.
  - startFrame: 127
    endFrame: 167
    description:
      id: motionAtlas.recipient-confirmed-handover.motionBeats.3
      message: Keep the basket, retained goods and recipient receipt visible together.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.recipient-confirmed-handover.motionBeats.4
      message: Return to the opaque ground through the shared envelope.
