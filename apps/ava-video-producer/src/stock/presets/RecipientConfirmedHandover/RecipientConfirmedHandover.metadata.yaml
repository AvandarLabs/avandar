name:
  id: motionAtlas.recipient-confirmed-handover.name
  message: Choose and count the handover
description:
  id: motionAtlas.recipient-confirmed-handover.description
  message:
    A household representative selects and physically counts the goods they want
    from an offered delivery. Only the chosen quantities move into their basket, while
    unselected goods remain with the delivery team.
category:
  id: motionAtlas.recipient-confirmed-handover.category
  message: Participatory handover
useWhen:
  id: motionAtlas.recipient-confirmed-handover.useWhen
  message: Show the household controlling and checking which quantities it receives.
intent:
  id: motionAtlas.recipient-confirmed-handover.intent
  message: Show the household controlling and checking which quantities it receives.
creativeDirection:
  id: motionAtlas.recipient-confirmed-handover.creativeDirection
  message:
    Within six seconds, reveal offered goods on a delivery table and the household
    representative indicating their configured selections. They pull exactly the
    selected units across a counting mat into their basket, one visible object per unit;
    untouched quantities stay on the delivery side. The chosen-quantity rows on a
    receipt fill from those actual movements, then the recipient acknowledges that
    specific list and keeps one copy. Hold the counted basket, retained goods, and
    receipt together before the shared opaque exit fade. The physical choice and
    counting occupy most of the shot; acknowledgement is only the final beat.
distinction:
  id: motionAtlas.recipient-confirmed-handover.distinction
  message:
    The hero action is recipient-directed selection and physical counting from a
    larger offered set, with selected and retained quantities conserved. This differs
    from a generic custody acknowledgement or status-cycle, because acknowledgement
    follows a visible material choice rather than merely unlocking a transfer.
prompt:
  id: motionAtlas.recipient-confirmed-handover.prompt
  message:
    Choose and count the handover. Show the household controlling and checking
    which quantities it receives.
