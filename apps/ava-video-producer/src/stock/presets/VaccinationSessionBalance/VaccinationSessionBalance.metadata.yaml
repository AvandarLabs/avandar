notFor:
  - id: motionAtlas.vaccination-session-balance.notFor.0
    message:
      units.length is the opening dose-unit denominator. Final administered +
      remaining + discarded always equals this denominator; no independent total input
      is allowed.
  - id: motionAtlas.vaccination-session-balance.notFor.1
    message:
      The people denominator is the number of unique non-null recipientId values
      among administered units. Multiple units may refer to one recipient, so doses and
      people are never interchangeable.
  - id: motionAtlas.vaccination-session-balance.notFor.2
    message:
      This is a bookkeeping metaphor with no injection demonstration, dose size,
      product, eligibility rule, or disposal procedure.
  - id: motionAtlas.vaccination-session-balance.notFor.3
    message:
      Loss is an authored accounting outcome. The animation does not determine
      whether a product should be discarded or reused.
