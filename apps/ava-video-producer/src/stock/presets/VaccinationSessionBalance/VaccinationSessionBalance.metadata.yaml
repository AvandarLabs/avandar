name:
  id: motionAtlas.vaccination-session-balance.name
  message: Session dose balance
description:
  id: motionAtlas.vaccination-session-balance.description
  message:
    "An opened supply carrier empties into three visible destinations: documented
    use, remaining stock, and recorded loss. Every represented dose unit is accounted
    for at the end."
category:
  id: motionAtlas.vaccination-session-balance.category
  message: Physical stock reconciliation
useWhen:
  id: motionAtlas.vaccination-session-balance.useWhen
  message: Make every dose unit visible in exactly one final accounting category.
intent:
  id: motionAtlas.vaccination-session-balance.intent
  message: Make every dose unit visible in exactly one final accounting category.
creativeDirection:
  id: motionAtlas.vaccination-session-balance.creativeDirection
  message:
    Open a carrier containing the supplied discrete dose tokens. Move each token
    exactly once to the authored used, remaining or recorded-loss destination; only used
    tokens settle beside recipient silhouettes. Hold every destination simultaneously
    with a derived conservation equation and a separate people total, then fade to the
    unchanged ground.
distinction:
  id: motionAtlas.vaccination-session-balance.distinction
  message:
    Unlike metric-counter, dot-matrix, or data-pipeline, the same physical stock
    units leave a carrier and partition into mutually exclusive destinations, with
    conservation remaining visible throughout.
prompt:
  id: motionAtlas.vaccination-session-balance.prompt
  message:
    Use Session dose balance (vaccination-session-balance) for a fictional or
    approved authored example. Make every dose unit visible in exactly one final
    accounting category.
