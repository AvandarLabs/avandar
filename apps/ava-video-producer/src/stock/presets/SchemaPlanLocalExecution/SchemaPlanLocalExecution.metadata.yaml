name:
  id: motionAtlas.schema-plan-local-execution.name
  message: Send the structure, run the question locally
description:
  id: motionAtlas.schema-plan-local-execution.description
  message:
    A table keeps its row records inside a device while its column names and an
    authored question travel to a remote planner. A query plan returns and selects a
    result inside the original device.
category:
  id: motionAtlas.schema-plan-local-execution.category
  message: Separated planning and execution
useWhen:
  id: motionAtlas.schema-plan-local-execution.useWhen
  message: Separate remote query planning from the location of raw-data execution.
prompt:
  id: motionAtlas.schema-plan-local-execution.prompt
  message: Separate remote query planning from the location of raw-data execution.
creativeDirection:
  id: motionAtlas.schema-plan-local-execution.creativeDirection
  message:
    960x600 React/SVG, shared palette, deterministic 180 frames at 30fps. Frames
    0-12 reveal the scene. Frames 13-55 lift a copy of the header strip and the authored
    question card from the device and send both across a clearly labeled boundary to the
    remote planner, while every row record stays inside the device. Frames 56-100 unfold
    the returned operation strip inside the device. Frames 101-139 apply its explicit
    predicate and sum to the local rows; the result stays beside the table. Hold the
    resolved meaning during frames 140-165. Frames 166-179 return to the same opaque
    ground for a six-second loop; reset is editorial.
intent:
  id: motionAtlas.schema-plan-local-execution.intent
  message: Separate remote query planning from the location of raw-data execution.
distinction:
  id: motionAtlas.schema-plan-local-execution.distinction
  message:
    Unlike pocket-inference, the model is remote. Unlike disclosure-aperture, the
    shared header is a schema, a plan returns, and computation visibly occurs over
    retained rows.
tags:
  - id: motionAtlas.schema-plan-local-execution.tags.0
    message: schema-only AI
  - id: motionAtlas.schema-plan-local-execution.tags.1
    message: local execution
  - id: motionAtlas.schema-plan-local-execution.tags.2
    message: remote planning
  - id: motionAtlas.schema-plan-local-execution.tags.3
    message: data minimization
  - id: motionAtlas.schema-plan-local-execution.tags.4
    message: query generation
goodFor:
  - id: motionAtlas.schema-plan-local-execution.goodFor.0
    message: Explain AI query generation without uploading raw row records
  - id: motionAtlas.schema-plan-local-execution.goodFor.1
    message: Show the difference between remote planning and local execution
domains:
  - id: motionAtlas.schema-plan-local-execution.domains.0
    message: Editorial illustration
aliases:
  - id: motionAtlas.schema-plan-local-execution.aliases.0
    message: schema plan local execution
notFor:
  - id: motionAtlas.schema-plan-local-execution.notFor.0
    message:
      This illustrates one metadata-only query mode, not a claim that all AI traffic
      excludes row data. Questions, schema labels and returned SQL may themselves be
      sensitive.
  - id: motionAtlas.schema-plan-local-execution.notFor.1
    message:
      Optional value discovery, pasted text, samples and PDF model assistance are
      separate boundary crossings and are deliberately absent from this mode.
  - id: motionAtlas.schema-plan-local-execution.notFor.2
    message:
      The plan is authored, not inferred by an LLM. Selected membership and sum are
      calculated from the supplied rows.
  - id: motionAtlas.schema-plan-local-execution.notFor.3
    message:
      No real product screen, external fetch, supplied code execution, or measured
      performance claim. All text is authored; no JSX, functions or URLs in props.
  - id: motionAtlas.schema-plan-local-execution.notFor.4
    message:
      Supplied prose is preserved. Fictional framing, evidence, and agreement between
      wording and selected states are authoring responsibilities. Runtime validation
      enforces structural bounds and explicit cross-field rules.
  - id: motionAtlas.schema-plan-local-execution.notFor.5
    message:
      Exact local cell whitespace uses distinct visible space, tab and newline marks.
      Repeated rows remain separate occurrences.
motionBeats:
  - startFrame: 13
    endFrame: 55
    description:
      id: motionAtlas.schema-plan-local-execution.motionBeats.0
      message: Send only the supplied question and schema.
  - startFrame: 56
    endFrame: 100
    description:
      id: motionAtlas.schema-plan-local-execution.motionBeats.1
      message: Return the authored operation strip to the device.
  - startFrame: 101
    endFrame: 139
    description:
      id: motionAtlas.schema-plan-local-execution.motionBeats.2
      message: Filter and sum local row values inside the device.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.schema-plan-local-execution.motionBeats.3
      message: Hold the local result and retained rows.
