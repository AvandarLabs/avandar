notFor:
  - id: motionAtlas.term-limited-revenue-share.notFor.0
    message:
      This is an illustrative arithmetic model, not financial advice, investment
      terms, a valuation, a profit statement, or a solvency projection. It uses no
      company financial figures.
  - id: motionAtlas.term-limited-revenue-share.notFor.1
    message:
      Each period reconciles receipts = operating outflow + active distribution +
      retained period cash. The second retained amount exceeds the first by the first
      distribution, with all other inputs fixed.
  - id: motionAtlas.term-limited-revenue-share.notFor.2
    message:
      Compute the active distribution using integer basis-point arithmetic. Reject
      fractional minor-unit distributions or negative retained amounts.
  - id: motionAtlas.term-limited-revenue-share.notFor.3
    message:
      Both periods are separate flows over equal durations. Do not carry the first
      remainder into the second tray or display their sum as a company balance.
  - id: motionAtlas.term-limited-revenue-share.notFor.4
    message:
      Operating outflow is a supplied composite. Taxes, financing transactions,
      accruals, other liabilities, ownership, and legal treatment are outside the model.
      No claim about employee compensation or investor rights follows from the
      illustration.
  - id: motionAtlas.term-limited-revenue-share.notFor.5
    message:
      Free prose is author supplied; only structural, reference, numeric and
      documented lexical constraints are runtime-validated.
