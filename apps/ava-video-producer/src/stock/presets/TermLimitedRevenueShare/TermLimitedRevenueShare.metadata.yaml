name:
  id: motionAtlas.term-limited-revenue-share.name
  message: When a temporary share ends
description:
  id: motionAtlas.term-limited-revenue-share.description
  message:
    Two equal-length fictional receipt periods expose the same operating outflow
    and a temporary distribution. After the authored term boundary, that distribution no
    longer leaves and the retained period cash increases by the exact amount, without
    forecasting growth or solvency.
category:
  id: motionAtlas.term-limited-revenue-share.category
  message: Time-bounded resource accounting
useWhen:
  id: motionAtlas.term-limited-revenue-share.useWhen
  message:
    Make the effect of ending one temporary cash distribution inspectable while
    other quantities remain fixed.
intent:
  id: motionAtlas.term-limited-revenue-share.intent
  message:
    Make the effect of ending one temporary cash distribution inspectable while
    other quantities remain fixed.
creativeDirection:
  id: motionAtlas.term-limited-revenue-share.creativeDirection
  message:
    "Frames 0-11 reveal two equal-sized period trays and one common monetary ruler
    on the 960x600 canvas. Frames 12-65 partition the first receipt strip into operating
    outflow, temporary distribution, and retained cash. Frames 66-95 turn the authored
    term marker between the trays and close only the temporary-distribution outlet.
    Frames 96-140 lay the second identical receipt strip into the second tray: operating
    outflow stays the same and the formerly distributed portion remains in retained
    cash. Frames 141-167 hold both periods and their exact reconciliation side by side.
    Exit to shared opaque ground at frames 168-179. Use frame-driven React/SVG at 30fps
    and no stochastic timing."
distinction:
  id: motionAtlas.term-limited-revenue-share.distinction
  message: Unlike pooled-donor-allocation, the explanation compares two separate
    time-bounded receipt flows after a term changes. Unlike expiring-lease, no exclusive
    permission token returns to neutral custody. The expired outlet changes one
    conserved cash partition while equal receipts and operating outflow expose its exact
    effect.
prompt:
  id: motionAtlas.term-limited-revenue-share.prompt
  message:
    Two equal-length fictional receipt periods expose the same operating outflow
