notFor:
  - id: motionAtlas.school-cost-satchel.authoringIdentity
    message: The author assigns one unique ID per distinct cost. Equal label, object and
      amount values do not imply duplicate identity. Underlying real-world duplicate
      costs cannot be detected from these fields.
  - id: motionAtlas.school-cost-satchel.notFor.0
    message: The total is the sum of the expense amounts. In the default, workbook cost is 3
      of 6 example credits, not 3 of 6 learners.
  - id: motionAtlas.school-cost-satchel.notFor.1
    message: The bag and objects are semantic illustrations. Their sizes do not encode
      price, weight, deprivation, or a household income share.
  - id: motionAtlas.school-cost-satchel.notFor.2
    message: The open doorway does not imply enrollment is conditional on payment. No
      admission, dropout, affordability, or causal impact is inferred.
  - id: motionAtlas.school-cost-satchel.notFor.3
    message: Amounts require a common period and unit. The animation does not annualize
      one-off costs or estimate missing expenses. Defaults are fictional.
