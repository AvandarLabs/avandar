name:
  id: motionAtlas.school-cost-satchel.name
  message: Unpack the cost of attending
description:
  id: motionAtlas.school-cost-satchel.description
  message: A school satchel opens to reveal the different expenses a fictional household
    is asked to plan for over one stated period. The costs stay attached to recognizable
    school objects.
category:
  id: motionAtlas.school-cost-satchel.category
  message: School object unpacking
useWhen:
  id: motionAtlas.school-cost-satchel.useWhen
  message: Make the components of an attendance-related expense visible without claiming
    affordability or exclusion.
prompt:
  id: motionAtlas.school-cost-satchel.prompt
  message: Begin with a learner beside an open school doorway carrying a closed satchel.
    Open the bag and unfold exactly the object kinds supplied in the expense array,
    ordered by unpackOrder onto a small ground cloth. Each object reveals its authored
    amount; a bracket gathers their amounts into a clearly labeled total for the stated
    period. Hold the objects, period, and total together, then close the scene through
    the shared exit envelope.
creativeDirection:
  id: motionAtlas.school-cost-satchel.creativeDirection
  message: Begin with a learner beside an open school doorway carrying a closed satchel.
    Open the bag and unfold exactly the object kinds supplied in the expense array,
    ordered by unpackOrder onto a small ground cloth. Each object reveals its authored
    amount; a bracket gathers their amounts into a clearly labeled total for the stated
    period. Hold the objects, period, and total together, then close the scene through
    the shared exit envelope.
intent:
  id: motionAtlas.school-cost-satchel.intent
  message: Make the components of an attendance-related expense visible without claiming
    affordability or exclusion.
distinction:
  id: motionAtlas.school-cost-satchel.distinction
  message: The satchel physically reveals the objects behind a school-cost total. It does
    not show a purchasing choice, generic bar comparison, money gate, or an access
    intervention automatically succeeding.
