name:
  id: motionAtlas.support-request-response.name
  message: Ask for help without losing ownership
description:
  id: motionAtlas.support-request-response.description
  message:
    A team member makes a concrete request for support. A colleague gives an
    authored response and joins the same work surface only when the response accepts,
    while the requester keeps ownership of the task.
category:
  id: motionAtlas.support-request-response.category
  message: Learning and collaboration
useWhen:
  id: motionAtlas.support-request-response.useWhen
  message: Show a respectful request and response while preserving both people's agency.
prompt:
  id: motionAtlas.support-request-response.prompt
  message: Show a respectful request and response while preserving both people's agency.
creativeDirection:
  id: motionAtlas.support-request-response.creativeDirection
  message:
    Frames 12..42 show the requester with one unfinished work object and a short
    help request. Frames 43..88 let the colleague turn toward the requester, pause to
    acknowledge them and display the supplied response. Frames 89..130 bring a second
    chair to the same worktable only for joins. For later or declines, the colleague
    remains at their position and the task stays visibly open. Frames 131..167 hold the
    requester, unchanged work object and explicit response. Do not replace the request
    with a completed or emotionally resolved state. Use deterministic frame-driven
    React/SVG at 960x600, 180 frames and 30 fps, with the shared palette. Reveal during
    frames 0..11 and fade to the common opaque ground during frames 168..179.
intent:
  id: motionAtlas.support-request-response.intent
  message: Show a respectful request and response while preserving both people's agency.
distinction:
  id: motionAtlas.support-request-response.distinction
  message:
    Unlike custody-transfer, responsibility does not move to a successor. Unlike
    grievance-remedy-retest, there is no complaint, repair or acceptance test; the
    explanatory action is requesting support and joining ongoing work.
