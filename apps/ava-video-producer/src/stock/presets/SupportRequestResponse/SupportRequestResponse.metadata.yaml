    message: Show a concrete support request
  - id: motionAtlas.support-request-response.goodFor.1
    message: Distinguish hearing a concern from agreeing to help now
  - id: motionAtlas.support-request-response.goodFor.2
    message: Depict collaboration without an ownership handoff
domains:
  - id: motionAtlas.support-request-response.domains.0
    message: Editorial illustration
aliases:
  - id: motionAtlas.support-request-response.aliases.0
    message: support request response
notFor:
  - id: motionAtlas.support-request-response.notFor.0
    message:
      One supportive exchange does not establish psychological safety or a lasting
      level of trust.
  - id: motionAtlas.support-request-response.notFor.1
    message: A respectful decline or later response remains a valid visible outcome.
  - id: motionAtlas.support-request-response.notFor.2
    message:
      Do not imply that support automatically resolves distress, improves performance
      or completes the task.
  - id: motionAtlas.support-request-response.notFor.3
    message:
      Supplied prose is preserved. Fictional framing, evidence and agreement between
      wording and selected states are authoring responsibilities. Runtime validation
      enforces structural bounds and explicit cross-field rules.
motionBeats:
  - startFrame: 12
    endFrame: 42
    description:
      id: motionAtlas.support-request-response.motionBeats.0
      message: Reveal the requester, unfinished task and request.
  - startFrame: 43
    endFrame: 88
    description:
      id: motionAtlas.support-request-response.motionBeats.1
      message: The colleague turns and displays the exact response.
  - startFrame: 89
    endFrame: 130
    description:
      id: motionAtlas.support-request-response.motionBeats.2
      message: Only joins brings a second chair and a shared-work gesture.
  - startFrame: 131
    endFrame: 167
    description:
      id: motionAtlas.support-request-response.motionBeats.3
      message: Hold the original owner, open task and explicit response.
