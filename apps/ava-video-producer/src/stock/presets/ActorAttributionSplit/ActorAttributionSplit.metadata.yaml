notFor:
  - id: motionAtlas.actor-attribution-split.notFor.0
    message:
      Account attribution is one illustrative collaboration benefit. This scene does
      not claim a particular product implementation or prescribe punitive
      account-sharing restrictions.
  - id: motionAtlas.actor-attribution-split.notFor.1
    message:
      An account label is not proof of a real person, consent, authorization, legal
      signature, or secure identity. No credential or permission mechanism is modeled.
  - id: motionAtlas.actor-attribution-split.notFor.2
    message:
      The source authors of the fictional choreography are known to the animation,
      but the shared-account ledger retains only the shared identity. Do not add
      individual attribution to earlier entries.
  - id: motionAtlas.actor-attribution-split.notFor.3
    message:
      Four authored events are the entire illustrated history. No hidden total,
      productivity comparison, or financial conversion is inferred.
  - id: motionAtlas.actor-attribution-split.notFor.4
    message:
      The decision to separate accounts is authored and voluntary; the animation does
      not lock collaborators out or claim all collaboration problems are solved.
  - id: motionAtlas.actor-attribution-split.notFor.5
    message:
      Free prose is author supplied; only structural, reference, numeric and
      documented lexical constraints are runtime-validated.
motionBeats:
