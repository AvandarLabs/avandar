name:
  id: motionAtlas.actor-attribution-split.name
  message: Separate accounts preserve separate attribution
description:
  id: motionAtlas.actor-attribution-split.description
  message:
    Two fictional collaborators first stamp events with one shared account label.
    After choosing distinct accounts, their later events receive distinct account stamps
    while the historical shared-account events retain their limited attribution.
category:
  id: motionAtlas.actor-attribution-split.category
  message: Identity and recorded evidence
useWhen:
  id: motionAtlas.actor-attribution-split.useWhen
  message: Show what separate account identities make distinguishable in future records.
intent:
  id: motionAtlas.actor-attribution-split.intent
  message: Show what separate account identities make distinguishable in future records.
creativeDirection:
  id: motionAtlas.actor-attribution-split.creativeDirection
  message:
    Frames 0-11 reveal two collaborators, one shared stamp, and an empty event
    ledger. Frames 12-60 let each collaborator stamp one authored historical event with
    that same account mark. Frames 61-95 move the shared stamp aside and place the
    supplied distinct account stamps beside the collaborators. Frames 96-140 stamp the
    later events with their assigned accounts. Frames 141-167 hold the older
    shared-account entries above the individually attributed later entries, retaining
    the limitation caption. Fade to the common opaque ground at frames 168-179. Use
    deterministic React/SVG on 960x600 at 30fps; no credential entry or real
    authentication occurs.
distinction:
  id: motionAtlas.actor-attribution-split.distinction
  message:
    Unlike contribution-weave, this explicitly contrasts indistinguishable recorded
    accounts with distinguishable later accounts and retains the historical limitation.
    Unlike journal-receipts, the changing information is account attribution rather than
    receipt status. No old event is assigned a newly inferred human author.
prompt:
  id: motionAtlas.actor-attribution-split.prompt
  message:
    Two fictional collaborators first stamp events with one shared account label.
