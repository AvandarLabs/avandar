notFor:
  - id: motionAtlas.convoy-route-detour.notFor.0
    message: Routes are schematic and supplied by the author; the scene performs no routing,
      safety assessment, or access negotiation.
  - id: motionAtlas.convoy-route-detour.notFor.1
    message: One vehicle represents one illustrative trip, never a fleet total or a delivery
      capacity.
  - id: motionAtlas.convoy-route-detour.notFor.2
    message: Travel distance, speed, and elapsed animation time have no geographic or
      operational scale.
  - id: motionAtlas.convoy-route-detour.notFor.3
    message: An open receiving gate denotes the authored arrival, not proof of permission,
      safety, or completed distribution.
  - id: motionAtlas.convoy-route-detour.notFor.4
    message: Repeated authored waypoints hold stationary; a zero-length closed segment
      retains its visible closure annotation.
