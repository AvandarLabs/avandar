name:
  id: motionAtlas.convoy-route-detour.name
  message: Keep the delivery moving
description:
  id: motionAtlas.convoy-route-detour.description
  message: A delivery vehicle encounters a marked obstruction and takes an authored
    alternative road through a schematic local map. The destination remains the same
    while the route visibly changes.
category:
  id: motionAtlas.convoy-route-detour.category
  message: Ground transport and access
useWhen:
  id: motionAtlas.convoy-route-detour.useWhen
  message: Make an adaptation to a blocked route visible while preserving the original
    delivery purpose.
intent:
  id: motionAtlas.convoy-route-detour.intent
  message: Make an adaptation to a blocked route visible while preserving the original
    delivery purpose.
creativeDirection:
  id: motionAtlas.convoy-route-detour.creativeDirection
  message: Reveal a depot, destination, and two roads within six seconds. The vehicle
    rolls toward the blocked segment, brakes before the barrier, then pivots at the
    preceding junction as the alternative route gains emphasis. The vehicle follows that
    authored detour to the destination, where the receiving team opens the gate; hold
    both the still-blocked road and the arrived vehicle before the shared opaque exit
    fade. Do not erase the obstruction or imply that a route was automatically verified.
distinction:
  id: motionAtlas.convoy-route-detour.distinction
  message: The physical braking, turn, obstacle persistence, and gate arrival explain
    adaptation. node-traversal only traces a fixed connection, while this scene replaces
    an unusable physical journey with a supplied detour.
prompt:
  id: motionAtlas.convoy-route-detour.prompt
  message: Keep the delivery moving. Make an adaptation to a blocked route visible while
    preserving the original delivery purpose.
