notFor:
  - id: motionAtlas.environmental-observation-gaps.notFor.0
    message:
      Observed area + missing area = number of cells times cellAreaHa. Field checks
      have point support and contribute no hectares to coverage totals.
  - id: motionAtlas.environmental-observation-gaps.notFor.1
    message:
      The globe is recognizable context only; the tile is explicitly schematic. No
      real region, live sensor, remote basemap, satellite accuracy or environmental
      trend is implied.
  - id: motionAtlas.environmental-observation-gaps.notFor.2
    message:
      Values are fictional and share one variable, unit and authored observation
      period. The graphic cannot establish measurement comparability or field validation
      accuracy.
