name:
  id: motionAtlas.linked-parameter-rehearsal.name
  message: Try a change, then return
description:
  id: motionAtlas.linked-parameter-rehearsal.description
  message:
    One source control moves to a trial value while explicitly coupled output
    scales respond. Returning the source restores every dependent value and leaves the
    independent example unchanged.
category:
  id: motionAtlas.linked-parameter-rehearsal.category
  message: Dependency mechanics
useWhen:
  id: motionAtlas.linked-parameter-rehearsal.useWhen
  message:
    Show the precise scope of a reversible change without implying every nearby
    quantity is affected.
prompt:
  id: motionAtlas.linked-parameter-rehearsal.prompt
  message:
    Use Motion Atlas "Try a change, then return" (linked-parameter-rehearsal) as a
    conceptual graphic. Show the precise scope of a reversible change without implying
    every nearby quantity is affected. Replace fictional sample content with approved
    authored content before making product claims.
creativeDirection:
  id: motionAtlas.linked-parameter-rehearsal.creativeDirection
  message:
    A source slider and two to four output rulers appear at their baseline
    positions. Visible mechanical couplings connect only outputs with nonzero
    multipliers. Over the middle two seconds the source slides to its trial setting and
    coupled pointers move simultaneously according to their supplied affine rules, with
    optional hollow baseline markers left behind. After a brief trial hold, the source
    slides back and every coupled pointer returns to its exact baseline. An uncoupled
    output stays still throughout. Hold the restored state with its authored caption,
    then fade to the same opaque ground within six seconds.
intent:
  id: motionAtlas.linked-parameter-rehearsal.intent
  message:
    Show the precise scope of a reversible change without implying every nearby
    quantity is affected.
distinction:
  id: motionAtlas.linked-parameter-rehearsal.distinction
  message:
    Unlike node-traversal or event-bus, no signal tours a graph. Physically coupled
    pointers move together under explicit equations, then reverse. Revision-restore
    replaces a saved document; this restores one source assumption and recomputes only
    its declared numeric dependents. Cell-normalization corrects values once, whereas
    these values remain linked throughout an intentional trial and return.
