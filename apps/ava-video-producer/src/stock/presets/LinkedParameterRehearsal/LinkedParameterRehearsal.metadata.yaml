notFor:
  - id: motionAtlas.linked-parameter-rehearsal.notFor.0
    message:
      Only one source and direct affine dependencies are supported. No arbitrary
      graphs, cycles, chained expressions or inferred causal links.
  - id: motionAtlas.linked-parameter-rehearsal.notFor.1
    message:
      Each output uses its own labeled fixed scale. Equal visual travel across rulers
      does not imply equal numerical change or comparable units.
  - id: motionAtlas.linked-parameter-rehearsal.notFor.2
    message:
      Pointer positions always use multiplier times the current source plus offset,
      including intermediate frames. Fractions during movement are interpolation, not
      discrete operations performed.
  - id: motionAtlas.linked-parameter-rehearsal.notFor.3
    message:
      Returning the parameter represents reversible arithmetic only. It does not
      claim that real-world impacts or external side effects can be undone.
  - id: motionAtlas.linked-parameter-rehearsal.notFor.4
    message:
      Use the existing affine contract only. Tier cliffs, nonlinear growth, churn,
      caps, payment fees, and compounding require a separately specified model and must
      not be approximated silently.
  - id: motionAtlas.linked-parameter-rehearsal.notFor.5
    message:
      A trial value is an authored scenario, not measured demand, market validation,
      or a prediction of financial performance. Use fictional values and explicit units
      and periods.
  - id: motionAtlas.linked-parameter-rehearsal.notFor.6
    message:
      Affine calculations use IEEE-754 arithmetic. Overflowing products use
      half-scaled cancellation where the resulting value remains finite. Displayed and
      exported input values are not clamped.
motionBeats:
