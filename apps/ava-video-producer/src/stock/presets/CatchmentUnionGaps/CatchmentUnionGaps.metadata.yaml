notFor:
  - id: motionAtlas.catchment-union-gaps.notFor.0
    message:
      Catchments are authored schematic footprints, not inferred travel-time areas or
      proof of actual service use.
  - id: motionAtlas.catchment-union-gaps.notFor.1
    message:
      Covered plus uncovered equals the complete supplied denominator. Empty map
      space is not evidence of absent population.
  - id: motionAtlas.catchment-union-gaps.notFor.2
    message:
      No facility capacity, service quality, physical accessibility, or health
      outcome is inferred.
