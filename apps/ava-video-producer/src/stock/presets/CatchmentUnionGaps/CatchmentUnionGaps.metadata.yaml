name:
  id: motionAtlas.catchment-union-gaps.name
  message: Coverage without counting twice
description:
  id: motionAtlas.catchment-union-gaps.description
  message:
    Authored service catchments join into one footprint around a fixed set of
    households. Overlap loses its duplicate shading while households outside every
    catchment remain visible as gaps.
category:
  id: motionAtlas.catchment-union-gaps.category
  message: service footprint accounting
useWhen:
  id: motionAtlas.catchment-union-gaps.useWhen
  message: Explain why overlapping service areas do not create additional people served.
prompt:
  id: motionAtlas.catchment-union-gaps.prompt
  message:
    Draw the separate catchment outlines around stationary homes. Where catchments
    overlap, peel away the second tint and fuse the outer boundary. Finish with covered
    homes enclosed and uncovered homes ringed, alongside one unique covered share.
creativeDirection:
  id: motionAtlas.catchment-union-gaps.creativeDirection
  message:
    Draw the separate catchment outlines around stationary homes. Where catchments
    overlap, peel away the second tint and fuse the outer boundary. Finish with covered
    homes enclosed and uncovered homes ringed, alongside one unique covered share.
intent:
  id: motionAtlas.catchment-union-gaps.intent
  message: Explain why overlapping service areas do not create additional people served.
distinction:
  id: motionAtlas.catchment-union-gaps.distinction
  message:
    A geometric union removes overlapping coverage while preserving uncovered
    locations. Unlike household revisits, the duplicate comes from simultaneous polygon
    membership; unlike mobile-clinic relocation, no service or person travels.
