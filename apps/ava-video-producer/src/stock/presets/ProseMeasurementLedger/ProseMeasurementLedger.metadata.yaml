name:
  id: motionAtlas.prose-measurement-ledger.name
  message: Carry the unit and qualifier with the number
description:
  id: motionAtlas.prose-measurement-ledger.description
  message: An authored sentence separates into subject, metric, value, unit and period
    strips that assemble into an observation row. Uncertainty qualifiers remain attached
    to the value.
category:
  id: motionAtlas.prose-measurement-ledger.category
  message: Observation extraction
useWhen:
  id: motionAtlas.prose-measurement-ledger.useWhen
  message: Preserve the context that gives a number meaning.
prompt:
  id: motionAtlas.prose-measurement-ledger.prompt
  message: Use Motion Atlas "Carry the unit and qualifier with the number"
    (prose-measurement-ledger) as an authored conceptual explanation. Preserve the
    context that gives a number meaning. Supply approved content before making product
    claims.
creativeDirection:
  id: motionAtlas.prose-measurement-ledger.creativeDirection
  message: 960x600 React/SVG, shared palette, frame-driven 180 frames at 30fps. Frames
    0-12 reveal the scene. Frames 13-55 underline the supplied sentence fragments with
    distinct patterns. Frames 56-110 move copies of those exact fragments into labeled
    observation slots. Frames 111-139 hold the original sentence above the structured
    row and keep the qualifier visible. Hold the resolved relationship at frames
    140-165, then fade to the same opaque ground at 166-179. Reset is editorial.
intent:
  id: motionAtlas.prose-measurement-ledger.intent
  message: Preserve the context that gives a number meaning.
distinction:
  id: motionAtlas.prose-measurement-ledger.distinction
  message: Unlike word-reveal, the action changes a sentence into an observation schema
    with explicit semantic roles, not merely typography. Value and unit cannot detach
    from period or qualifier.
tags:
  - id: motionAtlas.prose-measurement-ledger.tags.0
    message: prose extraction
  - id: motionAtlas.prose-measurement-ledger.tags.1
    message: observations
  - id: motionAtlas.prose-measurement-ledger.tags.2
    message: units
  - id: motionAtlas.prose-measurement-ledger.tags.3
    message: qualifiers
  - id: motionAtlas.prose-measurement-ledger.tags.4
    message: structured data
goodFor:
  - id: motionAtlas.prose-measurement-ledger.goodFor.0
    message: Explain extracting structured observations from prose
  - id: motionAtlas.prose-measurement-ledger.goodFor.1
    message: Preserve units, reporting periods and approximation qualifiers
domains:
  - id: motionAtlas.prose-measurement-ledger.domains.0
    message: Observation extraction
aliases:
  - id: motionAtlas.prose-measurement-ledger.aliases.0
    message: prose extraction
  - id: motionAtlas.prose-measurement-ledger.aliases.1
    message: observations
  - id: motionAtlas.prose-measurement-ledger.aliases.2
    message: units
notFor:
  - id: motionAtlas.prose-measurement-ledger.notFor.0
    message: No automatic language understanding or verified factual extraction is performed.
  - id: motionAtlas.prose-measurement-ledger.notFor.1
    message: One sentence and one observation only; multi-clause ambiguities require a
      longer scene.
  - id: motionAtlas.prose-measurement-ledger.notFor.2
    message: Method and confidence are separate. A model-produced row is not inherently correct.
  - id: motionAtlas.prose-measurement-ledger.notFor.3
    message: No JSX, functions, URLs or external fetch in props. The animation is an
      authored explanation, not actual document extraction or product evidence.
  - id: motionAtlas.prose-measurement-ledger.notFor.4
    message: Every output field derives only from its corresponding role fragment by the
      specified substring and whitespace trim. Preserve casing; numeric value alone
      converts the exact selected plain-decimal substring with Number. No independent
      normalized-row prop may contradict the source.
  - id: motionAtlas.prose-measurement-ledger.notFor.5
    message: All IDs are unique and exactly one of each semantic role occurs. Concatenated
      UTF-16 text length <=110. Semantic offsets are integers with
      0<=start<end<=fragment.text.length and trimmed selections are 1..20 UTF-16 units.
      Connectors have start=end=0. The value selection is a finite plain decimal,
      optional minus, no exponent or separators. Method and review state remain
      independent. Source and every output value derive from exact authored fragments,
      never independent output props.
  - id: motionAtlas.prose-measurement-ledger.notFor.6
    message: Prose meaning is an author responsibility. Runtime validation enforces
      structural bounds, exact references and numeric/geometric rules.
motionBeats:
  - startFrame: 0
    endFrame: 12
    description:
      id: motionAtlas.prose-measurement-ledger.motionBeats.0
      message: Reveal the original authored sentence.
  - startFrame: 13
    endFrame: 55
    description:
      id: motionAtlas.prose-measurement-ledger.motionBeats.1
      message: Underline exact authored UTF-16 spans with distinct patterns.
  - startFrame: 56
    endFrame: 110
    description:
      id: motionAtlas.prose-measurement-ledger.motionBeats.2
      message: Move selected semantic fragment copies into labeled observation slots.
  - startFrame: 111
    endFrame: 165
    description:
      id: motionAtlas.prose-measurement-ledger.motionBeats.3
      message: Hold the original sentence, all extracted fields, qualifier and independent
        method/review status. The outer renderer fades at 166..179.
