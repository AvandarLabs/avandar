notFor:
  - id: motionAtlas.referral-return-acknowledgement.notFor.0
    message:
      The denominator is referrals.length, one referral for one distinct person in
      this example. Waiting + attended without return + returned acknowledgement equals
      the total.
  - id: motionAtlas.referral-return-acknowledgement.notFor.1
    message:
      acknowledged=true requires attended=true. Derived attendance counts and
      returned-acknowledgement counts are labeled separately and may overlap; they must
      not be summed as exclusive categories.
  - id: motionAtlas.referral-return-acknowledgement.notFor.2
    message:
      An acknowledgement is communication evidence only. It does not establish
      diagnosis, treatment completion, recovery, clinical quality, or an appropriate
      referral.
  - id: motionAtlas.referral-return-acknowledgement.notFor.3
    message:
      No emergency priorities, treatment choices, clinical referral criteria, travel
      durations, or personal medical information are depicted.
motionBeats:
  - startFrame: 12
    endFrame: 40
    description:
      id: motionAtlas.referral-return-acknowledgement.motionBeats.0
      message: Reveal the supplied setting and identities.
  - startFrame: 41
    endFrame: 113
    description:
      id: motionAtlas.referral-return-acknowledgement.motionBeats.1
      message:
        Frames 12..40 reveal the referring clinic with three people and three matching
        referral slips. Frames 41..113 let only attended people cross to the receiving
        service, then send a returned acknowledgement slip back for only the supplied
        completed loop. Frames 114..167 hold one returned loop, one
        attended-but-unacknowledged case, and one waiting case in their physical
        locations; fade to ground by frame 179.
  - startFrame: 114
    endFrame: 167
    description:
      id: motionAtlas.referral-return-acknowledgement.motionBeats.2
      message: Hold the supplied final records and separate derived quantities.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.referral-return-acknowledgement.motionBeats.3
      message: Return to the opaque ground through the shared envelope.
