goodFor:
  - id: motionAtlas.referral-return-acknowledgement.goodFor.0
    message: Explain referral tracking across separate care teams.
  - id: motionAtlas.referral-return-acknowledgement.goodFor.1
    message:
      Distinguish attendance at another service from confirmation returned to the
      referring team.
  - id: motionAtlas.referral-return-acknowledgement.goodFor.2
    message: Show an unresolved handoff without implying treatment failure.
domains:
