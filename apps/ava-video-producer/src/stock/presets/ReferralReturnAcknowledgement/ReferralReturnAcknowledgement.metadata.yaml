name:
  id: motionAtlas.referral-return-acknowledgement.name
  message: Close the referral loop
description:
  id: motionAtlas.referral-return-acknowledgement.description
  message: People move from a referring clinic to a receiving service, while an
    acknowledgement travels back independently. Attendance and a closed communication
    loop remain visibly distinct.
category:
  id: motionAtlas.referral-return-acknowledgement.category
  message: People and return communication
useWhen:
  id: motionAtlas.referral-return-acknowledgement.useWhen
  message: Show that a referral is not fully communicated merely because the person attended.
intent:
  id: motionAtlas.referral-return-acknowledgement.intent
  message: Show that a referral is not fully communicated merely because the person attended.
creativeDirection:
  id: motionAtlas.referral-return-acknowledgement.creativeDirection
  message:
    Frames 12..40 reveal the referring clinic with three people and three matching
    referral slips. Frames 41..113 let only attended people cross to the receiving
    service, then send a returned acknowledgement slip back for only the supplied
    completed loop. Frames 114..167 hold one returned loop, one
    attended-but-unacknowledged case, and one waiting case in their physical locations;
    fade to ground by frame 179.
distinction:
  id: motionAtlas.referral-return-acknowledgement.distinction
  message:
    Unlike node-traversal or data-pipeline, person movement and document return are
    independent motions traveling in opposite directions. The resolved view can contain
    attendance without a returned acknowledgement.
prompt:
  id: motionAtlas.referral-return-acknowledgement.prompt
  message:
    Use Close the referral loop (referral-return-acknowledgement) for a fictional
    or approved authored example. Show that a referral is not fully communicated merely
    because the person attended.
