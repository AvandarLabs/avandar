useWhen:
  id: motionAtlas.tradeoff-pivot.useWhen
  message: Keep a chosen approach's benefit and concession visible together.
prompt:
  id: motionAtlas.tradeoff-pivot.prompt
  message: Use Motion Atlas "A choice has two sides" (tradeoff-pivot) as a conceptual
    graphic. Keep a chosen approach's benefit and concession visible together. Keep the
    restrained motion and readable labels; replace sample content with approved facts
    before making product claims.
creativeDirection:
  id: motionAtlas.tradeoff-pivot.creativeDirection
  message: A slim vertical hinge appears beneath the approach label. Its left leaf unfolds
    to show the gained qualities, then the hinge pivots just enough to reveal the right
    leaf with the concessions. Both settle open at equal readable size, and a short
    priority statement locks beneath the hinge as the final hold. The angle is fixed
    editorial motion rather than a numeric balance.
goodFor:
  - id: motionAtlas.tradeoff-pivot.goodFor.0
    message: Explain a choice that gains one property at another's expense
  - id: motionAtlas.tradeoff-pivot.goodFor.1
    message: State the downside alongside an advantage
  - id: motionAtlas.tradeoff-pivot.goodFor.2
    message: Make a design rationale honest about its constraints
  - id: motionAtlas.tradeoff-pivot.goodFor.3
    message: Explain a relationship-intensive service choice with its time requirement
  - id: motionAtlas.tradeoff-pivot.goodFor.4
    message: Keep a mission constraint visible alongside a growth opportunity
