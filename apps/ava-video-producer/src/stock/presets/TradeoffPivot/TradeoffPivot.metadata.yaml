notFor:
  - id: motionAtlas.tradeoff-pivot.notFor.0
    message: The number of listed points is not a score and cannot establish which side
      outweighs the other.
  - id: motionAtlas.tradeoff-pivot.notFor.1
    message: Leaf sizes and hinge angles carry no quantitative meaning.
  - id: motionAtlas.tradeoff-pivot.notFor.2
    message: No conclusion is calculated; the priority statement must be authored and
      qualified for its context.
  - id: motionAtlas.tradeoff-pivot.notFor.3
    message: A stated strategic preference does not establish investor duties, future
      behavior, customer conversion, financial return, or moral superiority. Keep the
      authored context and concession visible.
distinction:
  id: motionAtlas.tradeoff-pivot.distinction
  message: A single hinged argument exposes an inseparable benefit and concession. It does
    not rank alternatives like bar-race or merely reveal a sibling collection like
    stagger-cards.
