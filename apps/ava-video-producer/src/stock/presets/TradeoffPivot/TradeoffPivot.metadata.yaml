name:
  id: motionAtlas.tradeoff-pivot.name
  message: A choice has two sides
description:
  id: motionAtlas.tradeoff-pivot.description
  message: A selected approach rotates into view with a benefit on one face and a
    concession on the other. Both faces open into a single hinge so the final choice
    retains its tradeoff.
