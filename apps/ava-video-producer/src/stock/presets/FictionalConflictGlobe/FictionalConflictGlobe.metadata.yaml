notFor:
  - id: motionAtlas.fictional-conflict-globe.notFor.0
    message: The land outline is real geographic context; every conflict location and label
      is invented and must be marked as such.
  - id: motionAtlas.fictional-conflict-globe.notFor.1
    message: X markers denote separate authored situations, not incident totals, severity,
      casualty counts, territorial control, or live intelligence.
  - id: motionAtlas.fictional-conflict-globe.notFor.2
    message: No country borders or ownership claims are drawn. Marker visibility follows the
      chosen view and is not a statement that hidden regions lack need.
  - id: motionAtlas.fictional-conflict-globe.notFor.3
    message: Six seconds supports orientation only; this is not a navigable map or an
      incident monitoring system.
