name:
  id: motionAtlas.fictional-conflict-globe.name
  message: A world of separate crises
description:
  id: motionAtlas.fictional-conflict-globe.description
  message: A slowly turning globe reveals fictional conflict X markers on recognizable
    world land outlines. Separate callouts stay distinct so a global overview does not
    collapse different situations into one story.
category:
  id: motionAtlas.fictional-conflict-globe.category
  message: Geographic orientation
useWhen:
  id: motionAtlas.fictional-conflict-globe.useWhen
  message: Show the geographic separation of several hypothetical response contexts
    without suggesting that one action resolves them.
intent:
  id: motionAtlas.fictional-conflict-globe.intent
  message: Show the geographic separation of several hypothetical response contexts
    without suggesting that one action resolves them.
creativeDirection:
  id: motionAtlas.fictional-conflict-globe.creativeDirection
  message: Over six seconds, reveal an orthographic globe with simplified but recognizable
    continental outlines. Rotate through the supplied longitude interval, revealing each
    X only while its surface location faces the viewer; leader lines connect it to a
    fixed outside label slot. Ease the rotation to a stop, hold the visible markers and
    their scenario labels, then fade all scene elements to the opaque ground using the
    shared entrance and exit envelope. Keep the fictional-scenario caption visible with
    the globe, and never animate explosions, spreading red territory, or a conflict
    disappearing.
distinction:
  id: motionAtlas.fictional-conflict-globe.distinction
  message: Unlike orbital-system, the central object is recognizable geographic land with
    front/back occlusion and surface-anchored incident markers. Unlike network-graph, no
    edges imply relationships among the incidents.
prompt:
  id: motionAtlas.fictional-conflict-globe.prompt
  message: Use A world of separate crises (fictional-conflict-globe) for a fictional or
    approved authored example. Show the geographic separation of several hypothetical
    response contexts without suggesting that one action resolves them.
