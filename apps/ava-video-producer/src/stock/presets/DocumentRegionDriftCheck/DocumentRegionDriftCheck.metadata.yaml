name:
  id: motionAtlas.document-region-drift-check.name
  message: Check that the saved region still points to the same content
description:
  id: motionAtlas.document-region-drift-check.description
  message: A saved page region reopens at the same geometry, while its header and content
    fingerprint are compared with the new document. A mismatch holds the replacement for
    review rather than silently repointing by table number.
category:
  id: motionAtlas.document-region-drift-check.category
  message: Source identity validation
useWhen:
  id: motionAtlas.document-region-drift-check.useWhen
  message: Detect changed source content without relying on unstable ordinal labels.
prompt:
  id: motionAtlas.document-region-drift-check.prompt
  message: Use Motion Atlas "Check that the saved region still points to the same content"
    (document-region-drift-check) as an authored conceptual explanation. Detect changed
    source content without relying on unstable ordinal labels. Supply approved content
    before making product claims.
creativeDirection:
  id: motionAtlas.document-region-drift-check.creativeDirection
  message: 960x600 React/SVG, shared palette, frame-driven 180 frames at 30fps. Frames
    0-12 reveal the scene. Frames 13-50 align saved and current page outlines at the
    same region coordinates. Frames 51-100 compare the header and fingerprint tags
    independently. Frames 101-139 either register a match or close a review latch when
    either tag differs. Hold the resolved relationship at frames 140-165, then fade to
    the same opaque ground at 166-179. Reset is editorial.
intent:
  id: motionAtlas.document-region-drift-check.intent
  message: Detect changed source content without relying on unstable ordinal labels.
distinction:
  id: motionAtlas.document-region-drift-check.distinction
  message: Unlike revision-restore, nothing rolls back. The saved geometric locator stays
    fixed while a content-identity test detects drift that table numbering alone cannot
    detect.
tags:
  - id: motionAtlas.document-region-drift-check.tags.0
    message: source drift
  - id: motionAtlas.document-region-drift-check.tags.1
    message: fingerprint
  - id: motionAtlas.document-region-drift-check.tags.2
    message: PDF provenance
  - id: motionAtlas.document-region-drift-check.tags.3
    message: stable locator
goodFor:
  - id: motionAtlas.document-region-drift-check.goodFor.0
    message: Explain why PDF table ordinal numbers are unstable identifiers
  - id: motionAtlas.document-region-drift-check.goodFor.1
    message: Show a saved region fingerprint detecting source drift
domains:
  - id: motionAtlas.document-region-drift-check.domains.0
    message: Source identity validation
aliases:
  - id: motionAtlas.document-region-drift-check.aliases.0
    message: source drift
  - id: motionAtlas.document-region-drift-check.aliases.1
    message: fingerprint
  - id: motionAtlas.document-region-drift-check.aliases.2
    message: PDF provenance
notFor:
  - id: motionAtlas.document-region-drift-check.notFor.0
    message: Fingerprints are supplied opaque labels, not real cryptographic hashes
      generated by the renderer.
  - id: motionAtlas.document-region-drift-check.notFor.1
    message: A matching fingerprint is only the illustrative comparator result, not
      authenticity or tamper-proofing.
  - id: motionAtlas.document-region-drift-check.notFor.2
    message: Changing page layout may invalidate geometry and requires a separate review.
  - id: motionAtlas.document-region-drift-check.notFor.3
    message: No JSX, functions, URLs or external fetch in props. The animation is an
      authored explanation, not actual document extraction or product evidence.
  - id: motionAtlas.document-region-drift-check.notFor.4
    message: Saved box has exactly four numbers [left,top,right,bottom] with
      0<=left<right<=100 and 0<=top<bottom<=100. There is no minimum positive extent.
      Header and fingerprint comparisons use exact unnormalized strings. Both must match
      to pass. Detector ordinal never changes saved geometry or outcome.
  - id: motionAtlas.document-region-drift-check.notFor.5
    message: Prose meaning is an author responsibility. Runtime validation enforces
      structural bounds, exact references and numeric/geometric rules.
  - id: motionAtlas.document-region-drift-check.notFor.literal-whitespace
    message: Exact header and fingerprint captions use amber underlined whitespace marks.
      Original values and equality remain unchanged; captions are outside the saved
      geometric region.
motionBeats:
  - startFrame: 0
    endFrame: 12
    description:
      id: motionAtlas.document-region-drift-check.motionBeats.0
      message: Reveal saved and current document context.
  - startFrame: 13
    endFrame: 50
    description:
      id: motionAtlas.document-region-drift-check.motionBeats.1
      message: Align page outlines using the same exact saved region coordinates.
  - startFrame: 51
    endFrame: 100
    description:
      id: motionAtlas.document-region-drift-check.motionBeats.2
      message: Compare header and fingerprint independently using exact authored strings.
  - startFrame: 101
    endFrame: 165
    description:
      id: motionAtlas.document-region-drift-check.motionBeats.3
      message: Register matching identity or close the review latch when either comparison
        differs. Detector ordinal never selects geometry. The outer renderer fades at
        166..179.
