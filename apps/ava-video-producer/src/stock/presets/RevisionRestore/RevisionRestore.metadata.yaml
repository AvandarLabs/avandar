goodFor:
  - id: motionAtlas.revision-restore.goodFor.0
    message: Explaining restoration from saved revisions
  - id: motionAtlas.revision-restore.goodFor.1
    message: Showing that earlier content remains recoverable
  - id: motionAtlas.revision-restore.goodFor.2
    message: Introducing a non-destructive version-history workflow
  - id: motionAtlas.revision-restore.goodFor.3
    message: Explain restoring a local checkpoint
  - id: motionAtlas.revision-restore.goodFor.4
    message: Show a rehearsal state returning to a known version
  - id: motionAtlas.revision-restore.goodFor.5
    message: Illustrate the distinction between saved content and later unsaved edits
domains:
  - id: motionAtlas.revision-restore.domains.0
    message: Editorial explanation
aliases:
  - id: motionAtlas.revision-restore.aliases.0
    message: History and recovery
notFor:
  - id: motionAtlas.revision-restore.notFor.0
    message:
      The default document and revisions are fictional and use short text impressions
      rather than a full editor.
  - id: motionAtlas.revision-restore.notFor.1
    message:
      The scene shows restored content, not a claim about how a product records a
      restoration, resolves conflicts, or persists it.
  - id: motionAtlas.revision-restore.notFor.2
    message:
      There is one linear revision history and one restoration; branches, merges, and
      simultaneous edits are excluded.
  - id: motionAtlas.revision-restore.notFor.3
    message:
      Only the listed fields are represented. Do not imply restoration of an entire
      device, database, or application unless supported separately.
  - id: motionAtlas.revision-restore.notFor.4
    message:
      Later values are deliberately replaced in the final state. The scene must not
      imply that unsaved edits are also recovered.
  - id: motionAtlas.revision-restore.notFor.5
    message:
      The checkpoint is an authored example, not evidence of an actual backup, tested
      recovery process, version history, or guaranteed data durability.
motionBeats:
  - startFrame: 12
    endFrame: 60
    description:
      id: motionAtlas.revision-restore.motionBeats.0
      message: Reveal current contents and the complete saved history.
  - startFrame: 60
    endFrame: 78
    description:
      id: motionAtlas.revision-restore.motionBeats.1
      message: Lift the selected stored impression toward the artifact.
  - startFrame: 78
    endFrame: 126
    description:
      id: motionAtlas.revision-restore.motionBeats.2
      message: Replace changed lines in place and clear their notches.
  - startFrame: 126
    endFrame: 167
    description:
      id: motionAtlas.revision-restore.motionBeats.3
      message: Hold restored contents with every snapshot retained.
