name:
  id: motionAtlas.revision-restore.name
  message: Restore a saved version
description:
  id: motionAtlas.revision-restore.description
  message:
    A chosen earlier version returns as an aligned impression over the current
    document. Current content changes while every saved version remains visible on the
    history rail.
category:
  id: motionAtlas.revision-restore.category
  message: History and recovery
useWhen:
  id: motionAtlas.revision-restore.useWhen
  message: Show that a saved earlier state can become current without erasing the history.
prompt:
  id: motionAtlas.revision-restore.prompt
  message: Show that a saved earlier state can become current without erasing the history.
creativeDirection:
  id: motionAtlas.revision-restore.creativeDirection
  message:
    Reveal the current artifact and two to four labeled saved impressions. Select
    the authored earlier revision, lift its impression from the optional local drawer,
    and align it over the current document without moving historical snapshots. Between
    frames 78..126 replace changed lines in place and clear their change notches. Hold
    the restored document and complete history through frame 167, then fade to ground.
intent:
  id: motionAtlas.revision-restore.intent
  message: Show that a saved earlier state can become current without erasing the history.
distinction:
  id: motionAtlas.revision-restore.distinction
  message:
    One restoration preset combines a local checkpoint impression with a selectable
    history. Unlike status-cycle, content is reverted; unlike a destructive rewind,
    later saved versions stay on the rail.
