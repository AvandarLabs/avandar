notFor:
  - id: motionAtlas.practice-to-work-sample.notFor.0
    message:
      One learner performs two authored attempts. Two artifacts are not two
      graduates, two skills certifications, or two employment outcomes.
  - id: motionAtlas.practice-to-work-sample.notFor.1
    message:
      The numeric label is an illustrative target measurement. SVG length is a
      normalized diagram representation, not a usable real-world measuring instrument.
  - id: motionAtlas.practice-to-work-sample.notFor.2
    message:
      Repeating a gesture does not prove competence, retention, successful transfer,
      workplace readiness, or a job placement.
  - id: motionAtlas.practice-to-work-sample.notFor.3
    message:
      This bounded motif supports measuring and marking only. Participants,
      materials, and setting names are fictional defaults.
motionBeats:
  - startFrame: 0
    endFrame: 23
    description:
      id: motionAtlas.PracticeToWorkSample.beat.0
      message: Reveal one learner, the practice sheet and the authored target measurement.
  - startFrame: 24
    endFrame: 53
    description:
      id: motionAtlas.PracticeToWorkSample.beat.1
      message: Place a ruler and mark the same authored value on the practice sheet.
  - startFrame: 56
    endFrame: 81
    description:
      id: motionAtlas.PracticeToWorkSample.beat.2
      message:
        Slide classroom furniture and the first artifact aside as the learner enters
        the workshop arrangement.
  - startFrame: 82
    endFrame: 111
    description:
      id: motionAtlas.PracticeToWorkSample.beat.3
      message:
        Repeat ruler placement and pencil marking on the selected material with the
        identical value and unit.
  - startFrame: 112
    endFrame: 179
    description:
      id: motionAtlas.PracticeToWorkSample.beat.4
      message:
        Hold the measured work sample and optional first artifact through the shared
        fade.
