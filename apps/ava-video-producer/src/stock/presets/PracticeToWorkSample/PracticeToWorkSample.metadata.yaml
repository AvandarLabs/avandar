name:
  id: motionAtlas.practice-to-work-sample.name
  message: Try the learned action in a new setting
description:
  id: motionAtlas.practice-to-work-sample.description
  message:
    A learner repeats an authored measuring-and-marking action first on a practice
    sheet and then on a workshop material. Both artifacts remain visible so the
    connection is concrete without implying a job outcome.
category:
  id: motionAtlas.practice-to-work-sample.category
  message: Repeated action across learning environments
useWhen:
  id: motionAtlas.practice-to-work-sample.useWhen
  message:
    Connect a specific practiced action to an application in a different physical
    setting.
prompt:
  id: motionAtlas.practice-to-work-sample.prompt
  message:
    Show one learner using a ruler to place a labeled measurement on a practice
    sheet at a classroom desk. Slide the surrounding furniture into a simple workshop
    arrangement while retaining the learner and the first marked sheet at the side.
    Repeat the same ruler placement and marking gesture on the chosen work material,
    then hold the two measured artifacts together. Fade to the shared background.
creativeDirection:
  id: motionAtlas.practice-to-work-sample.creativeDirection
  message:
    Show one learner using a ruler to place a labeled measurement on a practice
    sheet at a classroom desk. Slide the surrounding furniture into a simple workshop
    arrangement while retaining the learner and the first marked sheet at the side.
    Repeat the same ruler placement and marking gesture on the chosen work material,
    then hold the two measured artifacts together. Fade to the shared background.
intent:
  id: motionAtlas.practice-to-work-sample.intent
  message:
    Connect a specific practiced action to an application in a different physical
    setting.
distinction:
  id: motionAtlas.practice-to-work-sample.distinction
  message: The same physical gesture is performed on different materials as the
    surrounding learning environment changes. Unlike field mapping or a sequence of
    workflow stages, the connection is demonstrated through tool use and preserved
    artifacts.
