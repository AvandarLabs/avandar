name:
  id: motionAtlas.shared-foundation.name
  message: Find the common ground
description:
  id: motionAtlas.shared-foundation.description
  message:
    Two different approaches lift to reveal one explicitly shared foundation. Their
    distinguishing traits remain attached, so commonality does not erase their
    differences.
category:
  id: motionAtlas.shared-foundation.category
  message: Editorial connectors
useWhen:
  id: motionAtlas.shared-foundation.useWhen
  message: Reveal the shared principle beneath two distinct approaches.
prompt:
  id: motionAtlas.shared-foundation.prompt
  message:
    Use Motion Atlas "Find the common ground" (shared-foundation) as a conceptual
    graphic. Reveal the shared principle beneath two distinct approaches. Replace
    fictional sample content with approved authored content before making product
    claims.
creativeDirection:
  id: motionAtlas.shared-foundation.creativeDirection
  message:
    Two labeled structures stand apart with their distinct traits underneath. Their
    lower edges rise in parallel, exposing matching fragments of a shared foundation
    phrase. The fragments join into one continuous base spanning both structures, then
    short supports reconnect each approach to it. The final hold reads as two approaches
    resting on the same principle before the shared exit.
intent:
  id: motionAtlas.shared-foundation.intent
  message: Reveal the shared principle beneath two distinct approaches.
distinction:
  id: motionAtlas.shared-foundation.distinction
  message:
    Unlike source-merge, the two approaches never collapse into a single output.
    Unlike a comparison panel, the hero action uncovers and connects one common base
    while preserving the two distinct identities.
