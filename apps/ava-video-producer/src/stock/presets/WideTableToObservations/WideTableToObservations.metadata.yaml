name:
  id: motionAtlas.wide-table-to-observations.name
  message: Turn each measurement into a row
description:
  id: motionAtlas.wide-table-to-observations.description
  message:
    A wide table unfolds each measure column into its own observation row while
    repeating the correct subject and preserving the measurement name and unit.
category:
  id: motionAtlas.wide-table-to-observations.category
  message: Wide-to-long reshaping
useWhen:
  id: motionAtlas.wide-table-to-observations.useWhen
  message: Explain a change in measurement grain while preserving values.
prompt:
  id: motionAtlas.wide-table-to-observations.prompt
  message: Use Motion Atlas "Turn each measurement into a row"
    (wide-table-to-observations) as an authored conceptual explanation. Explain a change
    in measurement grain while preserving values. Supply approved content before making
    product claims.
creativeDirection:
  id: motionAtlas.wide-table-to-observations.creativeDirection
  message:
    960x600 React/SVG, shared palette, frame-driven 180 frames at 30fps. Frames
    0-12 reveal the scene. Frames 13-50 reveal a two-measure wide table. Frames 51-110
    peel the measure columns into vertical strips, carrying a subject-key copy with each
    cell. Frames 111-139 stack the strips as a long observation ledger with explicit
    measure and unit columns. Hold the resolved relationship at frames 140-165, then
    fade to the same opaque ground at 166-179. Reset is editorial.
intent:
  id: motionAtlas.wide-table-to-observations.intent
  message: Explain a change in measurement grain while preserving values.
distinction:
  id: motionAtlas.wide-table-to-observations.distinction
  message:
    Unlike source-merge, no datasets converge and no values are combined. Output
    grain changes from one row per subject to one row per subject-measure pair.
tags:
  - id: motionAtlas.wide-table-to-observations.tags.0
    message: unpivot
  - id: motionAtlas.wide-table-to-observations.tags.1
    message: wide to long
  - id: motionAtlas.wide-table-to-observations.tags.2
    message: tidy observations
  - id: motionAtlas.wide-table-to-observations.tags.3
    message: data grain
goodFor:
  - id: motionAtlas.wide-table-to-observations.goodFor.0
    message: Explain unpivoting wide measurements to a long table
  - id: motionAtlas.wide-table-to-observations.goodFor.1
    message: Show how reshaping changes grain without creating measurements
domains:
  - id: motionAtlas.wide-table-to-observations.domains.0
    message: Wide-to-long reshaping
aliases:
  - id: motionAtlas.wide-table-to-observations.aliases.0
    message: unpivot
  - id: motionAtlas.wide-table-to-observations.aliases.1
    message: wide to long
  - id: motionAtlas.wide-table-to-observations.aliases.2
    message: tidy observations
notFor:
  - id: motionAtlas.wide-table-to-observations.notFor.0
    message: A reshape is not a new observation or a recalculation.
  - id: motionAtlas.wide-table-to-observations.notFor.1
    message: Units may differ across measures and therefore must travel per row.
  - id: motionAtlas.wide-table-to-observations.notFor.2
    message: Duplicate subject labels remain distinct by ID.
  - id: motionAtlas.wide-table-to-observations.notFor.3
    message:
      No JSX, functions, URLs or external fetch in props. The animation is an
      authored explanation, not actual document extraction or product evidence.
  - id: motionAtlas.wide-table-to-observations.notFor.4
    message:
      "Conservation counts only measurement cells: subjects.length*measures.length
      equals output measurement rows plus explicitly omitted missing measurement cells.
      Subject labels, headers and identifiers are not measurement cells."
  - id: motionAtlas.wide-table-to-observations.notFor.5
    message:
      Measure IDs and subject IDs are unique exact strings of maximum length 12 with
      no minimum. Each of exactly two subjects has exactly one value for each of exactly
      two existing measure IDs, independent of value-array order. Measurement pairs are
      unique. Measurement-cell count 4 = output rows + omitted null cells. Null never
      converts to zero. Units travel with the referenced measure.
  - id: motionAtlas.wide-table-to-observations.notFor.6
    message:
      Prose meaning is an author responsibility. Runtime validation enforces
      structural bounds, exact references and numeric/geometric rules.
motionBeats:
  - startFrame: 0
    endFrame: 12
    description:
      id: motionAtlas.wide-table-to-observations.motionBeats.0
      message: Reveal the context.
  - startFrame: 13
    endFrame: 50
    description:
      id: motionAtlas.wide-table-to-observations.motionBeats.1
      message: Establish a two-measure wide table.
  - startFrame: 51
    endFrame: 110
    description:
      id: motionAtlas.wide-table-to-observations.motionBeats.2
      message:
        Peel measure strips into disjoint vertical lanes, then carry subject copies
        horizontally into one long ledger.
  - startFrame: 111
    endFrame: 165
    description:
      id: motionAtlas.wide-table-to-observations.motionBeats.3
      message:
        Hold explicit subject, measure, value and unit columns, optional source-cell
        keys and the omission ledger including zero-output cases. The outer renderer
        fades at 166..179.
