name:
  id: motionAtlas.referral-consent-withdrawal.name
  message: Stop the next contact when consent changes
description:
  id: motionAtlas.referral-consent-withdrawal.description
  message:
    A participant withdraws permission for one planned referral contact. The worker
    sets that outgoing contact aside while an earlier sharing record remains visibly
    intact.
category:
  id: motionAtlas.referral-consent-withdrawal.category
  message: Participant-directed contact preparation
useWhen:
  id: motionAtlas.referral-consent-withdrawal.useWhen
  message:
    Show that a changed permission stops the specified future contact without
    rewriting the past.
prompt:
  id: motionAtlas.referral-consent-withdrawal.prompt
  message: Show the participant beside a worker's desk with the supplied
    destination-specific permission slips and prepared contact cards. The participant
    turns the withdrawn slips to their withdrawn faces. For each affected contact, the
    worker stops before reaching the phone and sets the card in a held tray. Any
    still-permitted contacts remain ready. Hold the changed permission scopes and, when
    supplied, dated prior-sharing receipts. Earlier records never reverse or disappear;
    omit the history region when none are supplied.
creativeDirection:
  id: motionAtlas.referral-consent-withdrawal.creativeDirection
  message: Show the participant beside a worker's desk with the supplied
    destination-specific permission slips and prepared contact cards. The participant
    turns the withdrawn slips to their withdrawn faces. For each affected contact, the
    worker stops before reaching the phone and sets the card in a held tray. Any
    still-permitted contacts remain ready. Hold the changed permission scopes and, when
    supplied, dated prior-sharing receipts. Earlier records never reverse or disappear;
    omit the history region when none are supplied.
intent:
  id: motionAtlas.referral-consent-withdrawal.intent
  message:
    Show that a changed permission stops the specified future contact without
    rewriting the past.
distinction:
  id: motionAtlas.referral-consent-withdrawal.distinction
  message:
    The person actively changes a recipient-specific instruction while a worker
    interrupts a prepared real-world contact. Unlike expiring-lease, permission does not
    end because a timer runs out; unlike disclosure-aperture, this governs a future
    action after a prior disclosure has already occurred.
