notFor:
  - id: motionAtlas.pipeline-step-splice.notFor.0
    message: All default operations and values are fictional.
  - id: motionAtlas.pipeline-step-splice.notFor.1
    message: This supports a single middle insertion, not branching, arbitrary execution, or
      reorder validation.
  - id: motionAtlas.pipeline-step-splice.notFor.2
    message: Preview strings are supplied; the animation does not execute operations.
  - id: motionAtlas.pipeline-step-splice.notFor.3
    message: The final step array owns both order and count.
motionBeats:
  - startFrame: 12
    endFrame: 38
    description:
      id: motionAtlas.pipeline-step-splice.motionBeats.0
      message: Establish existing operations with the inserted module parked above its gap.
  - startFrame: 38
    endFrame: 98
    description:
      id: motionAtlas.pipeline-step-splice.motionBeats.1
      message: Separate the strip and lower the sole inserted module into its final ordered gap.
  - startFrame: 98
    endFrame: 132
    description:
      id: motionAtlas.pipeline-step-splice.motionBeats.2
      message: Close the joints and unfold the authored before/after preview.
  - startFrame: 132
    endFrame: 166
    description:
      id: motionAtlas.pipeline-step-splice.motionBeats.3
      message: Hold the recomposed sequence and optional preview.
