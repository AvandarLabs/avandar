name:
  id: motionAtlas.pipeline-step-splice.name
  message: Insert a processing step
description:
  id: motionAtlas.pipeline-step-splice.description
  message: A new operation is fitted into the middle of an existing processing sequence.
    The sequence physically makes room, reconnects, and presents an authored
    input/output example.
category:
  id: motionAtlas.pipeline-step-splice.category
  message: Mechanical composition
useWhen:
  id: motionAtlas.pipeline-step-splice.useWhen
  message: Show that a process can be changed by inserting one explicit operation.
creativeDirection:
  id: motionAtlas.pipeline-step-splice.creativeDirection
  message: Frames 12-38 establish the existing strip of operations with the new module
    parked above its future position. During frames 38-98, the strip separates at that
    position, later modules move aside, and the inserted module slides down into the
    open gap. End joints close across the new module. A small before/after preview opens
    below the insertion during frames 98-132 and holds with the recomposed strip until
    the exit envelope.
intent:
  id: motionAtlas.pipeline-step-splice.intent
  message: Show that a process can be changed by inserting one explicit operation.
distinction:
  id: motionAtlas.pipeline-step-splice.distinction
  message: Unlike data-pipeline, no packet walks through a fixed process. The process
    topology itself changes through an observable insertion, with one new operation
    taking a precise place.
prompt:
  id: motionAtlas.pipeline-step-splice.prompt
  message: Use Motion Atlas "Insert a processing step" (pipeline-step-splice) as a
    conceptual graphic. Show that a process can be changed by inserting one explicit
    operation. Replace fictional sample content with approved authored content before
    making product claims.
