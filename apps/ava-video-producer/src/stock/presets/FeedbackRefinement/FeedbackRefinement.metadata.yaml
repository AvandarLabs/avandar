name:
  id: motionAtlas.feedback-refinement.name
  message: Revise through feedback
description:
  id: motionAtlas.feedback-refinement.description
  message:
    A short draft travels to a reviewer and returns with an attached note. The
    author changes the draft in response and sends the revised version back for the
    supplied closing outcome.
category:
  id: motionAtlas.feedback-refinement.category
  message: Iterative work
useWhen:
  id: motionAtlas.feedback-refinement.useWhen
  message: Connect a concrete piece of feedback to an authored revision.
prompt:
  id: motionAtlas.feedback-refinement.prompt
  message: Use Motion Atlas "Revise through feedback" (feedback-refinement) as a
    conceptual graphic. Connect a concrete piece of feedback to an authored revision.
    Replace fictional sample content with approved authored content before making
    product claims.
creativeDirection:
  id: motionAtlas.feedback-refinement.creativeDirection
  message:
    Frames 12..32 establish an author station, a reviewer station, and one readable
    draft between them. During 32..62, the draft crosses to the reviewer and an authored
    feedback tab attaches to its edge. During 62..94, it returns with that tab visibly
    tethered to the draft, and the draft text wipes into the supplied revised wording.
    During 94..132, the revised draft crosses back along the same route; the feedback
    tab detaches into a small review trail and the closing outcome settles beside the
    draft. For two supplied rounds, divide frames 32..144 evenly between their paired
    return trips. Hold the final draft through 168, then exit. The object changes
    between trips rather than merely retrying the same operation.
intent:
  id: motionAtlas.feedback-refinement.intent
  message: Connect a concrete piece of feedback to an authored revision.
distinction:
  id: motionAtlas.feedback-refinement.distinction
  message:
    Retry-backoff repeats an unchanged operation; this makes feedback alter the
    artifact before it returns. Data cleanup transforms records according to a rule,
    whereas this shows an authored human review exchange with its note retained.
