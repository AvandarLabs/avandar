notFor:
  - id: motionAtlas.feedback-refinement.notFor.0
    message: The default exchange and outcome are fictional.
  - id: motionAtlas.feedback-refinement.notFor.1
    message:
      The renderer displays supplied revisions and does not generate, evaluate, or
      infer improvements.
  - id: motionAtlas.feedback-refinement.notFor.2
    message: Short text snippets stand for the artifact; simultaneous reviewers,
      contradictory notes, approvals with legal effect, and full document editing are
      outside this scene.
  - id: motionAtlas.feedback-refinement.notFor.3
    message:
      The depicted revision must follow the supplied note and closing outcome. A
      contribution does not imply automatic upstream acceptance, deployment, broad
      representativeness, or improved social outcomes.
  - id: motionAtlas.feedback-refinement.notFor.4
    message:
      A submitted comment does not prove consent, adoption, representation of the
      whole community or that every concern has been resolved. The closing label must
      reflect the authored outcome.
motionBeats:
  - startFrame: 12
    endFrame: 32
    description:
      id: motionAtlas.feedback-refinement.motionBeats.0
      message: Establish the author, reviewer and current draft.
  - startFrame: 32
    endFrame: 144
    description:
      id: motionAtlas.feedback-refinement.motionBeats.1
      message:
        Carry feedback back with each draft and wipe into the supplied revision. Two
        rounds divide this span equally.
  - startFrame: 144
    endFrame: 168
    description:
      id: motionAtlas.feedback-refinement.motionBeats.2
      message: Hold the final authored revision, outcome and optional note trail.
