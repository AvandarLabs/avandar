notFor:
  - id: motionAtlas.travel-time-network-frontier.notFor.0
    message: This graph illustrates minimum cumulative edge costs; it is not a
      polygon-routing engine or a real routing-service result.
  - id: motionAtlas.travel-time-network-frontier.notFor.1
    message:
      Does not infer roads, safety, accessibility, facility capacity or actual travel
      times.
  - id: motionAtlas.travel-time-network-frontier.notFor.2
    message:
      No polygons are invented from nodes; only represented network destinations are
      classified.
  - id: motionAtlas.travel-time-network-frontier.notFor.3
    message:
      No live geography, online routing, JSX, functions, URLs, private records or
      external requests. Maps are schematic local plans; no real-world inference
      follows.
  - id: motionAtlas.travel-time-network-frontier.notFor.4
    message:
      Shortest paths use nonnegative edge costs. On equal cumulative cost, keep the
      first discovered predecessor using node input order for queue ties and road input
      order for neighbor traversal. No random tie resolution.
  - id: motionAtlas.travel-time-network-frontier.notFor.5
    message:
      Authored prose remains the author’s responsibility. Runtime validation
      preserves supplied text without classifying its language or factual claims.
