name:
  id: motionAtlas.travel-time-network-frontier.name
  message: Travel time follows the network
description:
  id: motionAtlas.travel-time-network-frontier.description
  message:
    A time budget expands through a small weighted road network from one origin. A
    farther-looking destination can be reached before a nearer-looking one because only
    supplied edge travel times determine access.
category:
  id: motionAtlas.travel-time-network-frontier.category
  message: Travel-time accessibility
useWhen:
  id: motionAtlas.travel-time-network-frontier.useWhen
  message: Explain accessibility through cumulative network cost.
prompt:
  id: motionAtlas.travel-time-network-frontier.prompt
  message:
    React/SVG 960x600 canvas, shared palette, deterministic 180 frames at 30fps.
    This is schematic local geography with no real basemap. Frames 0-12 reveal. Frames
    13-45 reveal schematic roads and their minute costs. Frames 46-110 propagate a
    frontier along minimum cumulative travel time, filling reachable nodes and holding
    beyond-budget nodes outside. Frames 111-139 hold each destination cost beside the
    stated budget. Hold at frames 140-165; fade to the same opaque ground at frames
    166-179 for an editorial loop.
creativeDirection:
  id: motionAtlas.travel-time-network-frontier.creativeDirection
  message:
