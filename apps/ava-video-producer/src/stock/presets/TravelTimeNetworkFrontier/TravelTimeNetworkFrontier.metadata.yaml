intent:
  id: motionAtlas.travel-time-network-frontier.intent
  message: Explain accessibility through cumulative network cost.
distinction:
  id: motionAtlas.travel-time-network-frontier.distinction
  message:
    Catchment-union-gaps starts from supplied polygons. This derives reachability
    from weighted network cost, showing why a travel-time catchment is not a distance
    circle.
