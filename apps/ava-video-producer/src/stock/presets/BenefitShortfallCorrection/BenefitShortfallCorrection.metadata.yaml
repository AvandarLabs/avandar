name:
  id: motionAtlas.benefit-shortfall-correction.name
  message: Count and correct a missing payment
description:
  id: motionAtlas.benefit-shortfall-correction.description
  message:
    A participant compares an assistance statement with the units actually
    received. A supplied correction fills some or all of the visible shortfall while any
    remainder stays open.
category:
  id: motionAtlas.benefit-shortfall-correction.category
  message: Physical receipt and payment reconciliation
useWhen:
  id: motionAtlas.benefit-shortfall-correction.useWhen
  message: Show how a participant identifies and verifies a payment shortfall.
prompt:
  id: motionAtlas.benefit-shortfall-correction.prompt
  message:
    Open an assistance statement next to the participant's receiving tray. Outline
    tokens show the stated amount; actual received tokens settle into matching
    positions, leaving empty outlines. The participant points to the gap and the worker
    adds only the authored correction tokens from a separate correction envelope. Hold
    the original payment, correction and still-empty positions with distinct patterns so
    the accounting remains inspectable.
creativeDirection:
  id: motionAtlas.benefit-shortfall-correction.creativeDirection
  message:
    Open an assistance statement next to the participant's receiving tray. Outline
    tokens show the stated amount; actual received tokens settle into matching
    positions, leaving empty outlines. The participant points to the gap and the worker
    adds only the authored correction tokens from a separate correction envelope. Hold
    the original payment, correction and still-empty positions with distinct patterns so
    the accounting remains inspectable.
intent:
  id: motionAtlas.benefit-shortfall-correction.intent
  message: Show how a participant identifies and verifies a payment shortfall.
distinction:
  id: motionAtlas.benefit-shortfall-correction.distinction
  message:
    The participant aligns real received units against a separate statement and
    checks an additive correction, preserving the unpaid remainder. Unlike
    metric-counter, the argument is a physical reconciliation; unlike
    household-market-choice, there is no purchase or basket selection; unlike
    field-conflict-choice, neither amount is chosen as the single true value.
