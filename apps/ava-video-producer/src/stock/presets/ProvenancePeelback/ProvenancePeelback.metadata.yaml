notFor:
  - id: motionAtlas.provenance-peelback.notFor.0
    message: All default documents and statements are fictional.
  - id: motionAtlas.provenance-peelback.notFor.1
    message: A citation indicates supplied attribution, not independent verification or
      factual truth.
  - id: motionAtlas.provenance-peelback.notFor.2
    message: One focal source is inspected per cycle; the remaining sheets supply context.
  - id: motionAtlas.provenance-peelback.notFor.3
    message: Source locators are literal labels, not live document links or page lookup
      instructions.
  - id: motionAtlas.provenance-peelback.notFor.4
    message: An exposed decision record makes reasoning inspectable. It does not prove that
      the decision was correct or publicly accepted.
  - id: motionAtlas.provenance-peelback.notFor.5
    message: A source locator documents attribution, not proof that extraction or
      interpretation is correct.
motionBeats:
  - startFrame: 12
    endFrame: 40
    description:
      id: motionAtlas.provenance-peelback.motionBeats.0
      message: Hold the summary over its source sheets.
  - startFrame: 40
    endFrame: 104
    description:
      id: motionAtlas.provenance-peelback.motionBeats.1
      message: Lift the summary, open the source sheets and align the selected passage with
        its citation tab.
  - startFrame: 104
    endFrame: 166
    description:
      id: motionAtlas.provenance-peelback.motionBeats.2
      message: Hold the statement beside its exact selected excerpt and optional locator.
