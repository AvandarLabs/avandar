name:
  id: motionAtlas.provenance-peelback.name
  message: Reveal the source behind a claim
description:
  id: motionAtlas.provenance-peelback.description
  message: A summary statement lifts like a transparent sheet to expose the source
    excerpts beneath it. One cited passage is aligned with the statement so its origin
    can be inspected without a network diagram.
category:
  id: motionAtlas.provenance-peelback.category
  message: Layered evidence
useWhen:
  id: motionAtlas.provenance-peelback.useWhen
  message: Connect a summary to an inspectable source passage.
creativeDirection:
  id: motionAtlas.provenance-peelback.creativeDirection
  message: Frames 12-40 hold a summary strip resting over a short stack of source sheets.
    During frames 40-104, the summary lifts in place and the source sheets fan out with
    their text kept upright. The selected source rises, its excerpt receives a narrow
    underline, and a citation tab aligns with the summary edge. Hold the statement and
    source passage side by side through frame 166, then return to the opaque ground.
intent:
  id: motionAtlas.provenance-peelback.intent
  message: Connect a summary to an inspectable source passage.
distinction:
  id: motionAtlas.provenance-peelback.distinction
  message: Unlike node-traversal or network-graph, lineage is conveyed by physical layers,
    citation alignment, and readable excerpts. Unlike scan-lines, the focal action is
    exposing an already identified source.
prompt:
  id: motionAtlas.provenance-peelback.prompt
  message: Use Motion Atlas "Reveal the source behind a claim" (provenance-peelback) as a
    conceptual graphic. Connect a summary to an inspectable source passage. Replace
    fictional sample content with approved authored content before making product
    claims.
