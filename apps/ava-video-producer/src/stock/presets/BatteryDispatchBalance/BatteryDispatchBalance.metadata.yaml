notFor:
  - id: motionAtlas.battery-dispatch-balance.notFor.0
    message:
      Initial stored energy + charge input = final stored energy + delivered energy +
      charge loss + discharge loss. All values are energy, never power.
  - id: motionAtlas.battery-dispatch-balance.notFor.1
    message:
      The six-second animation does not model charge rates, degradation, battery
      chemistry, grid constraints, costs or emissions. No round-trip efficiency is
      claimed beyond the supplied cycle arithmetic.
  - id: motionAtlas.battery-dispatch-balance.notFor.2
    message: Source and load labels are configurable, but electricity origin and
      environmental benefit require separate evidence. Defaults are fictional.
