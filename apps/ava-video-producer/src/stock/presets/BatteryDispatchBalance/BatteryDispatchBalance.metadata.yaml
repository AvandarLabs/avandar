name:
  id: motionAtlas.battery-dispatch-balance.name
  message: Store energy, deliver less
description:
  id: motionAtlas.battery-dispatch-balance.description
  message:
    A battery cutaway connects a charging window to a later dispatch window while
    retaining explicit conversion losses. A human dispatch instruction determines when
    the stored energy is released.
category:
  id: motionAtlas.battery-dispatch-balance.category
  message: Energy vessel and two-window dispatch
useWhen:
  id: motionAtlas.battery-dispatch-balance.useWhen
  message:
    Explain how a dispatch decision moves usable energy between time windows with
    losses accounted for.
prompt:
  id: motionAtlas.battery-dispatch-balance.prompt
  message:
    Use Store energy, deliver less (battery-dispatch-balance) with complete
    authored inputs and preserve the stated limits.
creativeDirection:
  id: motionAtlas.battery-dispatch-balance.creativeDirection
  message:
    Reveal the battery between authored charging and delivery windows. Charging
    input enters the boundary, a distinct loss channel peels away, and the remaining
    energy fills storage. At the dispatch cue, delivered energy reaches the later load
    while discharge losses enter their own channel. Hold input, delivery, losses and
    final storage together with a conserved-energy equation before fading.
intent:
  id: motionAtlas.battery-dispatch-balance.intent
  message:
    Explain how a dispatch decision moves usable energy between time windows with
    losses accounted for.
distinction:
  id: motionAtlas.battery-dispatch-balance.distinction
  message:
    A finite physical store fills and empties across distinct time windows while
    loss branches remain visible. Unlike metric-counter or line-trace, the explanation
    rests on conserved energy and dispatch timing.
