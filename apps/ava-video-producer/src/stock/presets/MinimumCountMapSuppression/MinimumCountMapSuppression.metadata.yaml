notFor:
  - id: motionAtlas.minimum-count-map-suppression.notFor.0
    message:
      A minimum-count threshold is one release rule, not a complete privacy guarantee
      or anonymization proof.
  - id: motionAtlas.minimum-count-map-suppression.notFor.1
    message: Do not show grand totals from which hidden cells can be recovered by subtraction.
  - id: motionAtlas.minimum-count-map-suppression.notFor.2
    message:
      Illustrative policy releases reported zero separately; real policies may also
      suppress zeros.
  - id: motionAtlas.minimum-count-map-suppression.notFor.3
    message:
      No live geography, online routing, JSX, functions, URLs, private records or
      external requests. Maps are schematic local plans; no real-world inference
      follows.
  - id: motionAtlas.minimum-count-map-suppression.notFor.4
    message:
      Authored prose must identify schematic geography and accurately describe the
      selected example. Runtime validation preserves supplied prose and checks explicit
      structural and numeric rules without natural-language classification.
motionBeats:
  - startFrame: 0
    endFrame: 12
    description:
      id: motionAtlas.minimum-count-map-suppression.beat.0
      message: Reveal the schematic study.
  - startFrame: 13
    endFrame: 50
    description:
      id: motionAtlas.minimum-count-map-suppression.beat.1
      message: Show aggregate cells within the local analysis boundary.
  - startFrame: 51
    endFrame: 105
    description:
      id: motionAtlas.minimum-count-map-suppression.beat.2
      message: Apply threshold shutters to positive small-count cells.
  - startFrame: 106
    endFrame: 139
    description:
      id: motionAtlas.minimum-count-map-suppression.beat.3
      message:
        Copy only released counts and zero to the public map, preserving suppression
        and missing symbols.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.minimum-count-map-suppression.beat.4
      message: Hold without public grand totals.
  - startFrame: 166
    endFrame: 179
    description:
      id: motionAtlas.minimum-count-map-suppression.beat.5
      message: The enclosing StockGraphic returns to opaque ground.
