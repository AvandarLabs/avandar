intent:
  id: motionAtlas.minimum-count-map-suppression.intent
  message: Keep release thresholds distinct from zero and missing observations.
distinction:
  id: motionAtlas.minimum-count-map-suppression.distinction
  message:
    Unlike disclosure-aperture, an explicit numerical release rule is applied to
    aggregate cells, with zero, suppression and no data distinct. No source point or
    location is ever exposed.
