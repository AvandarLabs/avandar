name:
  id: motionAtlas.minimum-count-map-suppression.name
  message: Keep small-cell counts undisclosed
description:
  id: motionAtlas.minimum-count-map-suppression.description
  message:
    A derived cell-count map applies a minimum-release threshold. Cells below it
    receive a distinct suppressed pattern and no public numeric label, while zeros,
    missing cells and released counts retain separate meanings.
category:
  id: motionAtlas.minimum-count-map-suppression.category
  message: Thresholded aggregate release
useWhen:
  id: motionAtlas.minimum-count-map-suppression.useWhen
  message: Keep release thresholds distinct from zero and missing observations.
prompt:
  id: motionAtlas.minimum-count-map-suppression.prompt
  message:
    React/SVG 960x600 canvas, shared palette, deterministic 180 frames at 30fps.
    This is schematic local geography with no real basemap. Frames 0-12 reveal. Frames
    13-50 show only the aggregate-count sheet inside a local analysis boundary, with no
    individual points. Frames 51-105 apply a threshold shutter cell by cell. Frames
    106-139 copy only permitted count labels to a public map and use distinct symbols
    for suppressed, zero and missing states. Hold at frames 140-165; fade to the same
    opaque ground at frames 166-179 for an editorial loop.
creativeDirection:
  id: motionAtlas.minimum-count-map-suppression.creativeDirection
  message:
    React/SVG 960x600 canvas, shared palette, deterministic 180 frames at 30fps.
