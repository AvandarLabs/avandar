name:
  id: motionAtlas.interpreted-case-dialogue.name
  message: Keep the participant at the center of interpretation
description:
  id: motionAtlas.interpreted-case-dialogue.description
  message:
    A participant and worker exchange short statements through an interpreter while
    continuing to face each other. Each translated statement remains visibly attributed
    to its original speaker.
category:
  id: motionAtlas.interpreted-case-dialogue.category
  message: Attributed human dialogue
useWhen:
  id: motionAtlas.interpreted-case-dialogue.useWhen
  message: Show interpretation enabling a direct conversation with the participant.
prompt:
  id: motionAtlas.interpreted-case-dialogue.prompt
  message:
    Place the participant and worker across a small table, with the interpreter
    seated to one side. The first speaker's original bubble appears above them; the
    interpreter's corresponding supplied wording forms a smaller adjacent echo while the
    original speaker attribution stays anchored. Repeat once in the opposite direction,
    with a pause between turns. Hold both paired statements and direct
    participant-worker sightlines so the interpreter supports the conversation without
    replacing the participant's voice.
