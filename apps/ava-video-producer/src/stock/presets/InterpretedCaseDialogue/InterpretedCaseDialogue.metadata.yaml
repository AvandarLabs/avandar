intent:
  id: motionAtlas.interpreted-case-dialogue.intent
  message: Show interpretation enabling a direct conversation with the participant.
distinction:
  id: motionAtlas.interpreted-case-dialogue.distinction
  message:
    The scene maintains two-way human turn-taking, original-speaker attribution and
    direct participant-worker orientation while an interpreter adds a second wording.
    Unlike packet-stream or a data-pipeline, messages do not pass through anonymous
    processing stages; unlike word-reveal, the explanatory action is who speaks, who
    interprets and who is addressed.
