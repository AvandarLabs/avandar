notFor:
  - id: motionAtlas.interpreted-case-dialogue.notFor.0
    message:
      The animation does not translate text or certify the accuracy, confidentiality
      or quality of interpretation.
  - id: motionAtlas.interpreted-case-dialogue.notFor.1
    message:
      All supplied utterances must be brief enough for a six-second illustration;
      longer dialogue belongs in a longer scene.
  - id: motionAtlas.interpreted-case-dialogue.notFor.2
    message:
      The default English copies under fictional language labels demonstrate bindings
      only and must not be presented as an actual bilingual exchange.
