notFor:
  - id: motionAtlas.private-case-conversation.notFor.0
    message:
      A room boundary illustrates an arrangement, not soundproofing, data security or
      legal confidentiality.
  - id: motionAtlas.private-case-conversation.notFor.1
    message:
      The supporter leaves by agreement; do not portray family or supporters as
      inherently unsafe.
  - id: motionAtlas.private-case-conversation.notFor.2
    message:
      The scene does not assert that a private conversation automatically produces
      disclosure or resolves a case.
