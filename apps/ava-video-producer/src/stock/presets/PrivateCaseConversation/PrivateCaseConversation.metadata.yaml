name:
  id: motionAtlas.private-case-conversation.name
  message: Make room for a private conversation
description:
  id: motionAtlas.private-case-conversation.description
  message:
    A participant asks to continue part of a case meeting without a supporter
    present. The supporter steps into a waiting area, and the worker continues speaking
    directly with the participant.
category:
  id: motionAtlas.private-case-conversation.category
  message: Human room choreography
useWhen:
  id: motionAtlas.private-case-conversation.useWhen
  message: Show that the participant can choose who is present for a conversation.
prompt:
  id: motionAtlas.private-case-conversation.prompt
  message:
    Begin with three people seated around one small consultation table. The
    participant displays the authored privacy request; the supporter acknowledges,
    stands and walks to a separate waiting seat. A door or screen closes between the two
    spaces while the participant and worker remain at the original table. Hold the
    participant's empty adjacent chair and the supporter's waiting position, without
    portraying abandonment or a completed assessment.
creativeDirection:
  id: motionAtlas.private-case-conversation.creativeDirection
  message:
    Begin with three people seated around one small consultation table. The
    participant displays the authored privacy request; the supporter acknowledges,
    stands and walks to a separate waiting seat. A door or screen closes between the two
    spaces while the participant and worker remain at the original table. Hold the
    participant's empty adjacent chair and the supporter's waiting position, without
    portraying abandonment or a completed assessment.
intent:
  id: motionAtlas.private-case-conversation.intent
  message: Show that the participant can choose who is present for a conversation.
distinction:
  id: motionAtlas.private-case-conversation.distinction
  message:
    The explanatory change is a participant-requested alteration of who is
    physically present during an ongoing conversation. Unlike chosen-service-access, no
    barrier is removed to admit someone to a service; unlike scope-aperture, actual
    participants change rooms and the meeting continues.
