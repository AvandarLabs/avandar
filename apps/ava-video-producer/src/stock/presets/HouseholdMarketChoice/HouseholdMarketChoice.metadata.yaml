    description:
      id: motionAtlas.household-market-choice.motionBeats.0
      message: Reveal the shelf options, shopper and authored tender.
  - startFrame: 30
    endFrame: 107
    description:
      id: motionAtlas.household-market-choice.motionBeats.1
      message: Carry only chosen products from the shelf into the household basket.
  - startFrame: 108
    endFrame: 126
    description:
      id: motionAtlas.household-market-choice.motionBeats.2
      message: Move the chosen tender to the retailer and retain the exact remaining balance
        with the household.
  - startFrame: 127
    endFrame: 167
    description:
      id: motionAtlas.household-market-choice.motionBeats.3
      message: Hold the selected basket, unchanged shelf options and payment result.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.household-market-choice.motionBeats.4
      message: Return to the opaque ground through the shared envelope.
