notFor:
  - id: motionAtlas.household-market-choice.notFor.0
    message: All prices and balances are small fictional values in demo credits, never real
      currency or current market information.
  - id: motionAtlas.household-market-choice.notFor.1
    message: No nutritional, financial, or program eligibility recommendation is implied by
      the selected basket.
  - id: motionAtlas.household-market-choice.notFor.2
    message: The scene assumes the authored goods are available and the authored tender is
      accepted; it does not establish real program rules.
  - id: motionAtlas.household-market-choice.notFor.3
    message: One shopper represents the example household role, not household size or a
      reported beneficiary count.
motionBeats:
  - startFrame: 12
