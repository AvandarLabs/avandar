name:
  id: motionAtlas.household-market-choice.name
  message: A household chooses its basket
description:
  id: motionAtlas.household-market-choice.description
  message: A household shopper chooses goods from a small market shelf and pays with
    fictional cash assistance or a voucher. The scene connects assistance to an authored
    choice instead of prescribing the same package for everyone.
category:
  id: motionAtlas.household-market-choice.category
  message: Everyday purchasing decisions
useWhen:
  id: motionAtlas.household-market-choice.useWhen
  message: Show that assistance can support a household making its own purchase choices.
intent:
  id: motionAtlas.household-market-choice.intent
  message: Show that assistance can support a household making its own purchase choices.
creativeDirection:
  id: motionAtlas.household-market-choice.creativeDirection
  message: Reveal a shelf of configurable products and a shopper holding the chosen tender
    within six seconds. The shopper considers the shelf, reaches only for products
    marked chosen, and places those items into their own basket while the other options
    stay available. At the counter, move the cash or voucher to the retailer and show
    the exact selected-price sum, with any remaining demo credits retained by the
    shopper. Hold the chosen basket, then use the shared opaque exit fade.
distinction:
  id: motionAtlas.household-market-choice.distinction
  message: The distinguishing action is an actor choosing among physical shelf goods and
    completing a purchase. This is neither source-merge nor metric-counter; the
    arithmetic supports the visible choice and does not become the hero motion.
prompt:
  id: motionAtlas.household-market-choice.prompt
  message: A household chooses its basket. Show that assistance can support a household
    making its own purchase choices.
