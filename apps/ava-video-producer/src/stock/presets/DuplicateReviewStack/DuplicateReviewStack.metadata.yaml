name:
  id: motionAtlas.duplicate-review-stack.name
  message: Review duplicate candidates
description:
  id: motionAtlas.duplicate-review-stack.description
  message: Records already designated as possible duplicates align on a comparison field,
    then fold behind an explicitly retained record. Candidate groups without a choice
    stay fanned open for review.
category:
  id: motionAtlas.duplicate-review-stack.category
  message: Identity consolidation
useWhen:
  id: motionAtlas.duplicate-review-stack.useWhen
  message: Show duplicate review as a visible grouping and selection decision.
creativeDirection:
  id: motionAtlas.duplicate-review-stack.creativeDirection
  message: Frames 12-42 show candidate slips separated within authored group brackets.
    During frames 42-100, each group aligns its comparison values along one shared
    ruler, making the repeated detail visible. Where a retained record is supplied, the
    other slips fold into an offset stack behind it while their ID tabs remain
    available; an unresolved group stays open. Hold the retained record and unresolved
    group through frame 166, then exit.
intent:
  id: motionAtlas.duplicate-review-stack.intent
  message: Show duplicate review as a visible grouping and selection decision.
distinction:
  id: motionAtlas.duplicate-review-stack.distinction
  message: Unlike stagger-cards, the content aligns around a shared comparison value and
    then consolidates through an explicit selection. Unlike field-conflict-choice, this
    chooses a record identity rather than separate values for individual fields.
prompt:
  id: motionAtlas.duplicate-review-stack.prompt
  message: Use Motion Atlas "Review duplicate candidates" (duplicate-review-stack) as a
    conceptual graphic. Show duplicate review as a visible grouping and selection
    decision. Replace fictional sample content with approved authored content before
    making product claims.
