notFor:
  - id: motionAtlas.duplicate-review-stack.notFor.literal-whitespace
    message: "Exact data uses amber underlined marks for whitespace: spaces, tabs, line
      breaks and other whitespace remain distinct from authored marker glyphs. Input,
      accessible text and equality preserve the original values."
  - id: motionAtlas.duplicate-review-stack.notFor.0
    message: All default records and candidate groups are fictional.
  - id: motionAtlas.duplicate-review-stack.notFor.1
    message: Groups are supplied by the author; no duplicate-detection algorithm, similarity
      score, or match accuracy is implied.
  - id: motionAtlas.duplicate-review-stack.notFor.2
    message: Matching comparison values alone do not establish that records describe the
      same real entity.
  - id: motionAtlas.duplicate-review-stack.notFor.3
    message: A retainedId demonstrates an authored selection, not actual deletion or merging
      of data.
  - id: motionAtlas.duplicate-review-stack.notFor.4
    message: Record and group counts come only from the nested arrays.
motionBeats:
  - startFrame: 12
    endFrame: 42
    description:
      id: motionAtlas.duplicate-review-stack.motionBeats.0
      message: Establish authored candidate groups.
  - startFrame: 42
    endFrame: 100
    description:
      id: motionAtlas.duplicate-review-stack.motionBeats.1
      message: Align comparison values and fold explicitly resolved groups.
  - startFrame: 100
    endFrame: 166
    description:
      id: motionAtlas.duplicate-review-stack.motionBeats.2
      message: Hold retained identities and open unresolved candidates.
