goodFor:
  - id: motionAtlas.carbon-storage-accounting.goodFor.0
    message: Explain why gross capture differs from net removal accounting
  - id: motionAtlas.carbon-storage-accounting.goodFor.1
    message: Introduce a supplied capture-to-storage balance
  - id: motionAtlas.carbon-storage-accounting.goodFor.2
    message: Make operating emissions and a reporting boundary visible
domains:
  - id: motionAtlas.carbon-storage-accounting.domains.0
    message: Subsurface cutaway and accounting bracket
aliases:
  - id: motionAtlas.carbon-storage-accounting.aliases.0
    message: carbon capture
  - id: motionAtlas.carbon-storage-accounting.aliases.1
    message: direct air capture
  - id: motionAtlas.carbon-storage-accounting.aliases.2
    message: carbon storage
notFor:
  - id: motionAtlas.carbon-storage-accounting.notFor.0
    message: Retained CO2 = captured CO2 - released CO2. Net result = retained CO2 expressed
      as CO2e - summed operating emissions. CO2 has a conversion factor of one here; no
      other captured gas is modeled.
  - id: motionAtlas.carbon-storage-accounting.notFor.1
    message: Storage beyond the named reporting period, additionality, displacement and
      verification are not inferred. A positive balance is not a durability certificate.
  - id: motionAtlas.carbon-storage-accounting.notFor.2
    message: All defaults are fictional. The six-second motion compresses one supplied
      reporting period and is not a capture-rate simulation.
motionBeats:
  - startFrame: 12
    endFrame: 43
    description:
      id: motionAtlas.carbon-storage-accounting.motionBeats.0
      message: Reveal the air boundary, capture unit and storage vessel.
  - startFrame: 44
    endFrame: 59
    description:
      id: motionAtlas.carbon-storage-accounting.motionBeats.1
      message: Operator signals the storage transfer.
  - startFrame: 60
    endFrame: 108
    description:
      id: motionAtlas.carbon-storage-accounting.motionBeats.2
      message: Separate retained and released CO2 streams and the operating CO2e lane.
  - startFrame: 109
    endFrame: 167
    description:
      id: motionAtlas.carbon-storage-accounting.motionBeats.3
      message: Hold retained mass, boundary and optional signed net subtraction.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.carbon-storage-accounting.motionBeats.4
      message: Return to the opaque ground through the shared envelope.
