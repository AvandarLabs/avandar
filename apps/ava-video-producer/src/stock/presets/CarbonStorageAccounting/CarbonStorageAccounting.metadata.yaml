name:
  id: motionAtlas.carbon-storage-accounting.name
  message: Account for captured carbon
description:
  id: motionAtlas.carbon-storage-accounting.description
  message: A cutaway follows atmospheric CO2 into storage while separately accounting for
    releases and operating emissions. The retained mass and the net accounting result
    remain visibly different quantities.
category:
  id: motionAtlas.carbon-storage-accounting.category
  message: Subsurface cutaway and accounting bracket
useWhen:
  id: motionAtlas.carbon-storage-accounting.useWhen
  message: Show exactly what is counted before presenting a carbon removal total.
intent:
  id: motionAtlas.carbon-storage-accounting.intent
  message: Show exactly what is counted before presenting a carbon removal total.
creativeDirection:
  id: motionAtlas.carbon-storage-accounting.creativeDirection
  message: Reveal an air boundary, capture unit and underground vessel. At the operator
    cue, divide the supplied captured-carbon ribbon into retained and released portions
    while a separate operating-emissions ribbon enters the accounting bracket. Hold the
    explicit retained-minus-operating-emissions calculation, including a negative result
    when supplied, then fade to the shared opaque ground without emptying the store on
    screen.
distinction:
  id: motionAtlas.carbon-storage-accounting.distinction
  message: Uses a split physical mass stream, a visible storage boundary and a separate
    emissions subtraction. It is neither a renamed data pipeline nor a standalone metric
    counter.
prompt:
  id: motionAtlas.carbon-storage-accounting.prompt
  message: Account for captured carbon. Show exactly what is counted before presenting a
    carbon removal total.
