notFor:
  - id: motionAtlas.stormwater-storage-spill.notFor.0
    message:
      The basin begins empty. Incoming = infiltrated + controlled discharge + final
      detention + overflow; no water is deleted or counted in two destinations.
  - id: motionAtlas.stormwater-storage-spill.notFor.1
    message:
      Inputs describe aggregate event volumes, not simultaneous flow rates. Terrain,
      drainage capacity, soil and downstream risk are not simulated.
  - id: motionAtlas.stormwater-storage-spill.notFor.2
    message:
      The scene does not claim flood prevention or predict a real flood extent.
      Defaults and local geography are fictional.
