name:
  id: motionAtlas.stormwater-storage-spill.name
  message: Hold water, show the spill
description:
  id: motionAtlas.stormwater-storage-spill.description
  message:
    A local cutaway routes a bounded stormwater volume through infiltration,
    controlled discharge and finite detention. Any remaining water visibly spills
    instead of disappearing.
category:
  id: motionAtlas.stormwater-storage-spill.category
  message: Terrain cutaway with overflow crest
useWhen:
  id: motionAtlas.stormwater-storage-spill.useWhen
  message: Make the limit of an adaptation measure visible alongside the water it manages.
prompt:
  id: motionAtlas.stormwater-storage-spill.prompt
  message:
    Reveal a schematic street and basin with a marked storage lip. At the operator
    cue, the supplied inflow divides into infiltration, controlled outflow and detention
    compartments. Once detention reaches its capacity, the remaining water crosses a
    distinct overflow crest. Hold all destinations with an explicit conserved-volume
    equation before fading.
