notFor:
  - id: motionAtlas.contour-sediment-retention.notFor.0
    message:
      Mobilized sediment = retained sediment + exported sediment. The water carrying
      it is illustrative and unquantified; do not equate water-particle counts with
      sediment kilograms.
  - id: motionAtlas.contour-sediment-retention.notFor.1
    message:
      The retained mass is supplied content, never inferred from barrier type, slope
      angle or vegetation. No before/after efficacy comparison is manufactured.
  - id: motionAtlas.contour-sediment-retention.notFor.2
    message:
      No soil formation rate, crop yield, water quality outcome or ecological
      recovery is predicted. Defaults are fictional.
