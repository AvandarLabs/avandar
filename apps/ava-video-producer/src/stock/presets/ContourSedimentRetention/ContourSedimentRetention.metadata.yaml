  message: Show where supplied sediment ends up after a particular land-management intervention.
distinction:
  id: motionAtlas.contour-sediment-retention.distinction
  message:
    Particles settle into a persistent landform while the remainder crosses a
    boundary. It demonstrates selective deposition, not simple packet movement through
    stages.
