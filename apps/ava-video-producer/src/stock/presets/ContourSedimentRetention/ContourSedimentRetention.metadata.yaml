name:
  id: motionAtlas.contour-sediment-retention.name
  message: Keep sediment within the slope
description:
  id: motionAtlas.contour-sediment-retention.description
  message:
    A hillside cross-section shows a supplied sediment load encountering an
    installed contour barrier. Retained soil settles visibly upstream while exported
    sediment crosses the catchment boundary.
category:
  id: motionAtlas.contour-sediment-retention.category
  message: Hillslope cutaway and settling particles
useWhen:
  id: motionAtlas.contour-sediment-retention.useWhen
  message: Show where supplied sediment ends up after a particular land-management intervention.
prompt:
  id: motionAtlas.contour-sediment-retention.prompt
  message:
    Reveal a bare schematic slope and its outlet boundary. A land steward places
    the selected contour treatment, then the supplied sediment ribbon moves downslope
    and separates into retained material behind the strip and export beyond the
    boundary. Hold both destinations against their common incoming mass, then fade
    rather than reversing erosion.
creativeDirection:
