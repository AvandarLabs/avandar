notFor:
  - id: motionAtlas.predicate-pushdown-boundary.notFor.0
    message:
      The source is assumed to support this predicate; source capabilities must be
      established before presenting a real implementation claim.
  - id: motionAtlas.predicate-pushdown-boundary.notFor.1
    message: "Rows are not bytes: fewer rows does not establish a measured bandwidth reduction."
  - id: motionAtlas.predicate-pushdown-boundary.notFor.2
    message: Predicate correctness and source capability are supplied assumptions.
  - id: motionAtlas.predicate-pushdown-boundary.notFor.3
    message:
      No JSX, functions, URLs or external fetch in props. The animation is an
      authored explanation, not actual document extraction or product evidence.
  - id: motionAtlas.predicate-pushdown-boundary.notFor.4
    message:
      Authored prose and schematic context are the author's responsibility. Runtime
      validation checks structural bounds and numeric, reference and geometry
      constraints, without classifying natural-language claims.
  - id: motionAtlas.predicate-pushdown-boundary.notFor.5
    message:
      Source IDs preserve exact authored characters, including empty strings.
      Whitespace uses distinct literal-data marks.
motionBeats:
  - startFrame: 0
    endFrame: 12
    description:
      id: motionAtlas.predicate-pushdown-boundary.motionBeats.0
      message: Reveal the schematic scene.
  - startFrame: 13
    endFrame: 50
    description:
      id: motionAtlas.predicate-pushdown-boundary.motionBeats.1
      message:
        A source table applies one explicit row predicate before selected record copies
        cross a transfer boundary. Excluded rows stay at the source and the destination
        displays exactly the transferred subset.
  - startFrame: 51
    endFrame: 95
    description:
      id: motionAtlas.predicate-pushdown-boundary.motionBeats.2
      message: Close source gates for nonmatching rows.
  - startFrame: 96
    endFrame: 139
    description:
      id: motionAtlas.predicate-pushdown-boundary.motionBeats.3
      message: Move only matching row copies across the boundary while retaining all originals.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.predicate-pushdown-boundary.motionBeats.4
      message: Hold the complete resolved relationship.
  - startFrame: 166
    endFrame: 179
    description:
      id: motionAtlas.predicate-pushdown-boundary.motionBeats.5
      message: The outer stock envelope fades to the same opaque ground.
