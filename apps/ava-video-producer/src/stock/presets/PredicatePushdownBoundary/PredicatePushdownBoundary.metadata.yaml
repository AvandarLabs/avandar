name:
  id: motionAtlas.predicate-pushdown-boundary.name
  message: Apply the row condition before transfer
description:
  id: motionAtlas.predicate-pushdown-boundary.description
  message:
    A source table applies one explicit row predicate before selected record copies
    cross a transfer boundary. Excluded rows stay at the source and the destination
    displays exactly the transferred subset.
category:
  id: motionAtlas.predicate-pushdown-boundary.category
  message: Source-side filtering
useWhen:
  id: motionAtlas.predicate-pushdown-boundary.useWhen
  message: Make the location of filtering relative to a transfer boundary explicit.
prompt:
  id: motionAtlas.predicate-pushdown-boundary.prompt
  message: Use Motion Atlas Apply the row condition before transfer
    (predicate-pushdown-boundary) to make the location of filtering relative to a
    transfer boundary explicit. Supply approved authored content before making claims.
creativeDirection:
  id: motionAtlas.predicate-pushdown-boundary.creativeDirection
  message:
    960x600 React/SVG, shared palette, frame-driven 180 frames at 30fps. Frames
    0-12 reveal the scene. Frames 13-50 show a query predicate arriving at the source.
    Frames 51-95 close source gates for nonmatching rows. Frames 96-139 move only
    matching row copies across the boundary while the full source remains intact. Hold
    the resolved relationship at frames 140-165, then fade to the same opaque ground at
    166-179. Reset is editorial.
intent:
  id: motionAtlas.predicate-pushdown-boundary.intent
  message: Make the location of filtering relative to a transfer boundary explicit.
distinction:
  id: motionAtlas.predicate-pushdown-boundary.distinction
  message:
    Unlike a generic data-pipeline, selection occurs before the boundary and only
    the matching rows are transferred. It differs from column-cache growth, which
    retains every row.
