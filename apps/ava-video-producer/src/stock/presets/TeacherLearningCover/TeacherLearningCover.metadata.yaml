name:
  id: motionAtlas.teacher-learning-cover.name
  message: Make room for teacher learning
description:
  id: motionAtlas.teacher-learning-cover.description
  message: A colleague covers a fictional class while its teacher works with a mentor
    nearby, then the teacher returns. The classroom remains visibly attended throughout
    the handoff.
category:
  id: motionAtlas.teacher-learning-cover.category
  message: Staff movement between learning spaces
useWhen:
  id: motionAtlas.teacher-learning-cover.useWhen
  message: Show that a teacher support session requires an explicit classroom cover arrangement.
prompt:
  id: motionAtlas.teacher-learning-cover.prompt
  message: Open on one teacher and a fixed group of learners in a classroom with a small
    adjacent planning alcove. A covering colleague arrives before the teacher moves to
    the mentor; the two adults rehearse a prompt with a small teaching board while the
    colleague stays with the class. Return the teacher before the colleague leaves. Hold
    the class and the retained prompt together, then fade out.
creativeDirection:
  id: motionAtlas.teacher-learning-cover.creativeDirection
  message: Open on one teacher and a fixed group of learners in a classroom with a small
    adjacent planning alcove. A covering colleague arrives before the teacher moves to
    the mentor; the two adults rehearse a prompt with a small teaching board while the
    colleague stays with the class. Return the teacher before the colleague leaves. Hold
    the class and the retained prompt together, then fade out.
intent:
  id: motionAtlas.teacher-learning-cover.intent
  message: Show that a teacher support session requires an explicit classroom cover arrangement.
distinction:
  id: motionAtlas.teacher-learning-cover.distinction
  message: The explanatory motion is adult coverage across two real learning spaces, with
    overlap at both handoffs. It is not a generic custody transfer, approval gate, or
    claim that a coaching session produces an educational improvement.
