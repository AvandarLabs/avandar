notFor:
  - id: motionAtlas.teacher-learning-cover.notFor.0
    message: Learner count is the learners array length; the three staff roles are separate
      adults and are never part of that denominator.
  - id: motionAtlas.teacher-learning-cover.notFor.1
    message: This is a staged staffing arrangement, not a recommended supervision ratio, a
      timetable optimizer, or evidence of professional-development impact.
  - id: motionAtlas.teacher-learning-cover.notFor.2
    message: The nearby alcove is schematic. Distance and transition duration do not claim
      physical proximity or actual session length.
  - id: motionAtlas.teacher-learning-cover.notFor.3
    message: Default participants, activity, and class are fictional.
