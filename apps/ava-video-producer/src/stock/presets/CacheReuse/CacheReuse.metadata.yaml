notFor:
  - id: motionAtlas.cache-reuse.notFor.0
    message: The default key, result, and participants are fictional.
  - id: motionAtlas.cache-reuse.notFor.1
    message: Route length communicates fewer depicted steps, not a measured latency
      improvement or a guaranteed speedup.
  - id: motionAtlas.cache-reuse.notFor.2
    message: The entry remains valid for both requests; expiry, invalidation, eviction,
      freshness, and privacy guarantees are not represented.
  - id: motionAtlas.cache-reuse.notFor.3
    message: A cache hit does not establish source freshness or current authorization; those
      require separate checks.
  - id: motionAtlas.cache-reuse.notFor.4
    message: Exact keys and values retain raw whitespace. Amber underlined presentation
      marks distinguish spaces, tabs, and line breaks at a fixed 12px.
motionBeats:
