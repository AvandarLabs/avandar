name:
  id: motionAtlas.cache-reuse.name
  message: Reuse the stored result
description:
  id: motionAtlas.cache-reuse.description
  message: A first lookup finds an empty cache and retrieves a result from its origin. A
    repeated lookup with the same key is answered by the stored copy.
category:
  id: motionAtlas.cache-reuse.category
  message: Reuse and storage
useWhen:
  id: motionAtlas.cache-reuse.useWhen
  message: Show how storing one result changes the path of a repeated lookup.
prompt:
  id: motionAtlas.cache-reuse.prompt
  message: Show how storing one result changes the path of a repeated lookup.
creativeDirection:
  id: motionAtlas.cache-reuse.creativeDirection
  message: Reveal a requester, a small empty cache shelf, and a distant origin after frame
    12. During 24..68, a key token probes the empty shelf, continues along the longer
    origin route, and returns carrying the supplied result. During 68..92, an identical
    result impression settles on the shelf while the requester receives its response.
    During 102..138, the same key token returns, matches the visible shelf key, and
    receives the stored result along the short local route without activating the
    origin. Hold both the keyed cache entry and returned response through 168, then
    exit. The second lookup visibly uses what the first lookup stored.
intent:
  id: motionAtlas.cache-reuse.intent
  message: Show how storing one result changes the path of a repeated lookup.
distinction:
  id: motionAtlas.cache-reuse.distinction
  message: The first trip changes persistent local state and the second trip uses it.
    Packet-stream and node-traversal show movement through routes without explaining a
    miss-to-hit transition for one identical key.
