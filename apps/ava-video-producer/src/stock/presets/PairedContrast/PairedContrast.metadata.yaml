name:
  id: motionAtlas.paired-contrast.name
  message: Two approaches, one question
description:
  id: motionAtlas.paired-contrast.description
  message:
    Two alternatives align around the same question, then matched attributes
    connect across a center divider. One authored difference receives a final underline
    without declaring an automatic winner.
