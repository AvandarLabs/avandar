notFor:
  - id: motionAtlas.paired-contrast.notFor.0
    message:
      Exactly two alternatives and at most three criteria keep both sides readable in
      six seconds.
  - id: motionAtlas.paired-contrast.notFor.1
    message:
      Equal panel areas express equal editorial attention, not equal effectiveness,
      cost, or prevalence.
  - id: motionAtlas.paired-contrast.notFor.2
    message: The nominated contrast is supplied by the author and is not inferred from the text.
  - id: motionAtlas.paired-contrast.notFor.3
    message:
      Free access to source code is not zero operating cost. Comparison labels must
      account for the supplied hosting and maintenance responsibilities without
      inventing monetary amounts.
  - id: motionAtlas.paired-contrast.notFor.4
    message:
      Moving computation to a user device changes the resource owner. It does not
      establish zero total cost, zero energy, or that one option is universally cheaper.
distinction:
  id: motionAtlas.paired-contrast.distinction
  message:
    Unlike stagger-cards, the action is the synchronized alignment and expansion of
    matched differences. Unlike bar-race, it compares supplied qualitative attributes
    without ranking or invented numeric scores.
