useWhen:
  id: motionAtlas.paired-contrast.useWhen
  message: Make the difference between two alternatives easy to see on equal terms.
prompt:
  id: motionAtlas.paired-contrast.prompt
  message:
    Use Motion Atlas "Two approaches, one question" (paired-contrast) as a
    conceptual graphic. Make the difference between two alternatives easy to see on
    equal terms. Keep the restrained motion and readable labels; replace sample content
    with approved facts before making product claims.
creativeDirection:
  id: motionAtlas.paired-contrast.creativeDirection
  message:
    Within six seconds, two labeled halves slide apart to reveal a shared question
    in the center. Matching attribute pairs enter on the same horizontal baselines,
    their center brackets draw simultaneously, and the nominated contrast expands into a
    single readable comparison band. Both alternatives remain visible during the
    resolved hold before the shared exit envelope.
goodFor:
  - id: motionAtlas.paired-contrast.goodFor.0
    message: Compare two approaches against the same criteria
  - id: motionAtlas.paired-contrast.goodFor.1
    message: Explain centralized versus distributed responsibility
  - id: motionAtlas.paired-contrast.goodFor.2
    message: Contrast two definitions before choosing terminology
  - id: motionAtlas.paired-contrast.goodFor.3
    message: Compare who supplies operations, maintenance, and hosting for the same software
  - id: motionAtlas.paired-contrast.goodFor.4
    message: Compare vendor-side and device-side responsibility without erasing either side
