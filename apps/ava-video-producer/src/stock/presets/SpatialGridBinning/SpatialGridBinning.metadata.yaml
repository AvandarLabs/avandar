    description:
      id: motionAtlas.spatial-grid-binning.beat.4
      message: Hold the reconciled count display.
  - startFrame: 166
    endFrame: 179
    description:
      id: motionAtlas.spatial-grid-binning.beat.5
      message: The enclosing StockGraphic returns to opaque ground.
