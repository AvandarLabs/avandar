notFor:
  - id: motionAtlas.spatial-grid-binning.notFor.0
    message: Grid size is schematic and has no physical area unit.
  - id: motionAtlas.spatial-grid-binning.notFor.1
    message:
      Count is not density per square kilometre unless real area is explicitly
      provided elsewhere.
  - id: motionAtlas.spatial-grid-binning.notFor.2
    message: Missing observations outside this supplied set are unknown, not zero population.
  - id: motionAtlas.spatial-grid-binning.notFor.3
    message:
      No live geography, online routing, JSX, functions, URLs, private records or
      external requests. Maps are schematic local plans; no real-world inference
      follows.
  - id: motionAtlas.spatial-grid-binning.notFor.4
    message:
      Authored prose must identify schematic geography and accurately describe the
      selected example. Runtime validation preserves supplied prose and checks explicit
      structural and numeric rules without natural-language classification.
motionBeats:
