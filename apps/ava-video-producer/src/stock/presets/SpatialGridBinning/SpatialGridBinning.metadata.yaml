name:
  id: motionAtlas.spatial-grid-binning.name
  message: Count each point in one grid cell
description:
  id: motionAtlas.spatial-grid-binning.description
  message:
    A fixed square grid overlays point records. Each point contributes once to its
    containing cell, leaving empty cells at zero and avoiding any implication that the
    grid measures continuous population density.
category:
  id: motionAtlas.spatial-grid-binning.category
  message: Spatial aggregation
useWhen:
  id: motionAtlas.spatial-grid-binning.useWhen
  message: Assign each supplied observation to exactly one spatial count cell.
prompt:
  id: motionAtlas.spatial-grid-binning.prompt
  message:
    React/SVG 960x600 canvas, shared palette, deterministic 180 frames at 30fps.
    This is schematic local geography with no real basemap. Frames 0-12 reveal. Frames
    13-50 draw the grid over stationary points. Frames 51-110 slide one count token from
    each point into its cell ledger. Frames 111-139 shade cells by derived count while
    retaining faint original positions. Hold at frames 140-165; fade to the same opaque
    ground at frames 166-179 for an editorial loop.
creativeDirection:
  id: motionAtlas.spatial-grid-binning.creativeDirection
  message:
    React/SVG 960x600 canvas, shared palette, deterministic 180 frames at 30fps.
