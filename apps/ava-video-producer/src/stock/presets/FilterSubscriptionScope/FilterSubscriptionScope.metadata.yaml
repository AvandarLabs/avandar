name:
  id: motionAtlas.filter-subscription-scope.name
  message: One filter changes only the subscribed views
description:
  id: motionAtlas.filter-subscription-scope.description
  message:
    A category selection becomes a shared filter strip that reaches some views and
    stops at an unsubscribed view. Each subscribed view recalculates from the same
    retained records while the independent view keeps its full denominator.
category:
  id: motionAtlas.filter-subscription-scope.category
  message: Scoped dashboard filtering
useWhen:
  id: motionAtlas.filter-subscription-scope.useWhen
  message: Show which views inherit a shared row-selection condition.
prompt:
  id: motionAtlas.filter-subscription-scope.prompt
  message: Use Motion Atlas One filter changes only the subscribed views
    (filter-subscription-scope) to show which views inherit a shared row-selection
    condition. Supply approved authored content before making claims.
creativeDirection:
  id: motionAtlas.filter-subscription-scope.creativeDirection
  message:
    960x600 React/SVG, shared palette, frame-driven 180 frames at 30fps. Frames
    0-12 reveal the scene. Frames 13-50 reveal three compact tables with subscription
    connectors. Frames 51-90 place one category filter into its source socket. Frames
    91-139 mask only nonmatching records in subscribed views, recompute their sums and
    retain all records in the unsubscribed view. Hold the resolved relationship at
    frames 140-165, then fade to the same opaque ground at 166-179. Reset is editorial.
intent:
  id: motionAtlas.filter-subscription-scope.intent
  message: Show which views inherit a shared row-selection condition.
distinction:
  id: motionAtlas.filter-subscription-scope.distinction
  message:
    Linked-parameter-rehearsal applies affine equations to quantities. This applies
    an equality predicate to row membership across explicit view subscriptions and
    preserves an independent reference denominator.
tags:
  - id: motionAtlas.filter-subscription-scope.tags.0
    message: cross filtering
  - id: motionAtlas.filter-subscription-scope.tags.1
    message: dashboard subscriptions
  - id: motionAtlas.filter-subscription-scope.tags.2
    message: scope
  - id: motionAtlas.filter-subscription-scope.tags.3
    message: record denominator
goodFor:
  - id: motionAtlas.filter-subscription-scope.goodFor.0
    message: Explain global dashboard filter subscriptions
  - id: motionAtlas.filter-subscription-scope.goodFor.1
    message: Contrast filtered views with an unchanged all-records reference
domains:
  - id: motionAtlas.filter-subscription-scope.domains.0
    message: Scoped dashboard filtering
aliases:
  - id: motionAtlas.filter-subscription-scope.aliases.0
    message: cross filtering
  - id: motionAtlas.filter-subscription-scope.aliases.1
    message: dashboard subscriptions
  - id: motionAtlas.filter-subscription-scope.aliases.2
    message: scope
  - id: motionAtlas.filter-subscription-scope.aliases.3
    message: record denominator
notFor:
  - id: motionAtlas.filter-subscription-scope.notFor.0
    message:
      Only one global equality filter is shown; local filters, complex joins and SQL
      wrapping are outside scope.
  - id: motionAtlas.filter-subscription-scope.notFor.1
    message: Counts are record counts, not unique people unless the author supplies that grain.
  - id: motionAtlas.filter-subscription-scope.notFor.2
    message: No causal change in the underlying records is implied.
  - id: motionAtlas.filter-subscription-scope.notFor.3
    message:
      No JSX, functions, URLs or external fetch in props. The animation is an
      authored explanation, not actual document extraction or product evidence.
  - id: motionAtlas.filter-subscription-scope.notFor.4
    message:
      Every sum uses metric.valueUnit and every row count uses metric.countUnit. The
      same value measure is used in every subscribed and unsubscribed view.
  - id: motionAtlas.filter-subscription-scope.notFor.5
    message:
      Authored prose and schematic context are the author's responsibility. Runtime
      validation checks structural bounds and numeric, reference and geometry
      constraints, without classifying natural-language claims.
  - id: motionAtlas.filter-subscription-scope.notFor.6
    message:
      Category keys preserve exact whitespace. Whitespace is shown using distinct
      literal-data marks. Record and view IDs allow empty strings and are bounded to 12
      characters.
motionBeats:
  - startFrame: 0
    endFrame: 12
    description:
      id: motionAtlas.filter-subscription-scope.motionBeats.0
      message: Reveal the schematic scene.
  - startFrame: 13
    endFrame: 50
    description:
      id: motionAtlas.filter-subscription-scope.motionBeats.1
      message:
        A category selection becomes a shared filter strip that reaches some views and
        stops at an unsubscribed view. Each subscribed view recalculates from the same
        retained records while the independent view keeps its full denominator.
  - startFrame: 51
    endFrame: 90
    description:
      id: motionAtlas.filter-subscription-scope.motionBeats.2
      message: Place the selected category in its source socket.
  - startFrame: 91
    endFrame: 139
    description:
      id: motionAtlas.filter-subscription-scope.motionBeats.3
      message: Mask nonmatching records only in subscribed views and derive their totals.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.filter-subscription-scope.motionBeats.4
      message: Hold the complete resolved relationship.
  - startFrame: 166
    endFrame: 179
    description:
      id: motionAtlas.filter-subscription-scope.motionBeats.5
      message: The outer stock envelope fades to the same opaque ground.
