notFor:
  - id: motionAtlas.choropleth-class-breaks.notFor.0
    message: Thresholds are authored; names do not assert an implemented Jenks, quantile or
      other optimizer.
  - id: motionAtlas.choropleth-class-breaks.notFor.1
    message: A change of color is not a change in conditions or a ranking claim.
  - id: motionAtlas.choropleth-class-breaks.notFor.2
    message: Every legend uses explicit boundaries and a separate missing category.
  - id: motionAtlas.choropleth-class-breaks.notFor.3
    message: No live geography, online routing, JSX, functions, URLs, private records or
      external requests. Maps are schematic local plans; no real-world inference
      follows.
  - id: motionAtlas.choropleth-class-breaks.notFor.4
    message: Authored prose and schematic context are the author's responsibility. Runtime
      validation checks structural bounds and numeric, reference and geometry
      constraints, without classifying natural-language claims.
