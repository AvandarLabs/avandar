name:
  id: motionAtlas.choropleth-class-breaks.name
  message: The breaks change the map
description:
  id: motionAtlas.choropleth-class-breaks.description
  message: The same zone values move between two authored classification schemes. Legend
    thresholds slide while the zones recolor, showing that the visual impression can
    change without any value changing.
category:
  id: motionAtlas.choropleth-class-breaks.category
  message: Thematic classification
useWhen:
  id: motionAtlas.choropleth-class-breaks.useWhen
  message: Expose the cartographic effect of classification choices.
prompt:
  id: motionAtlas.choropleth-class-breaks.prompt
  message: Use Motion Atlas The breaks change the map (choropleth-class-breaks) to expose
    the cartographic effect of classification choices. Supply approved authored content
    before making claims.
creativeDirection:
  id: motionAtlas.choropleth-class-breaks.creativeDirection
  message: React/SVG 960x600 canvas, shared palette, deterministic 180 frames at 30fps.
    This is schematic local geography with no real basemap. Frames 0-12 reveal. Frames
    13-50 align four zone tiles with one common value ruler and initial break markers.
    Frames 51-110 slide markers to the second scheme and recolor each zone only as its
    fixed value crosses a threshold. Frames 111-139 hold both labeled legends and
    unchanged zone numbers. Hold at frames 140-165; fade to the same opaque ground at
    frames 166-179 for an editorial loop.
intent:
  id: motionAtlas.choropleth-class-breaks.intent
  message: Expose the cartographic effect of classification choices.
distinction:
  id: motionAtlas.choropleth-class-breaks.distinction
  message: Population-normalized-map changes the measure by introducing a denominator.
    This keeps all values fixed and changes only classification thresholds, exposing a
    different cartographic choice.
