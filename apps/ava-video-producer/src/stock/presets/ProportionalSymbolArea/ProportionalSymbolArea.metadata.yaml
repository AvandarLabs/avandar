name:
  id: motionAtlas.proportional-symbol-area.name
  message: Make symbol area match the value
description:
  id: motionAtlas.proportional-symbol-area.description
  message:
    Equal unit tiles assemble into circles whose area, rather than radius,
    represents the supplied values. A size legend remains attached so the geometric
    encoding can be checked.
category:
  id: motionAtlas.proportional-symbol-area.category
  message: Area-proportional symbols
useWhen:
  id: motionAtlas.proportional-symbol-area.useWhen
  message: Make quantity proportional to symbol area rather than radius.
prompt:
  id: motionAtlas.proportional-symbol-area.prompt
  message:
    Use Motion Atlas Make symbol area match the value (proportional-symbol-area) to
    make quantity proportional to symbol area rather than radius. Supply approved
    authored content before making claims.
creativeDirection:
  id: motionAtlas.proportional-symbol-area.creativeDirection
  message:
    React/SVG 960x600 canvas, shared palette, deterministic 180 frames at 30fps.
    This is schematic local geography with no real basemap. Frames 0-12 reveal. Frames
    13-50 reveal source values as equal-area tile counts. Frames 51-110 reshape each
    tile bundle into a circle of matching total area. Frames 111-139 overlay a
    reference-radius ruler and keep the area/value legend visible. Hold at frames
    140-165; fade to the same opaque ground at frames 166-179 for an editorial loop.
intent:
  id: motionAtlas.proportional-symbol-area.intent
  message: Make quantity proportional to symbol area rather than radius.
distinction:
  id: motionAtlas.proportional-symbol-area.distinction
  message:
    Unlike bar-race, quantity is encoded by area without reordering. Unlike point
    sizing by radius, the square-root relationship is the explanatory action.
