notFor:
  - id: motionAtlas.proportional-symbol-area.notFor.0
    message: Not geographic area or physical footprint.
  - id: motionAtlas.proportional-symbol-area.notFor.1
    message: No zero or negative values in this preset.
  - id: motionAtlas.proportional-symbol-area.notFor.2
    message: The rendered symbol must not imply uncertainty radius or service catchment.
  - id: motionAtlas.proportional-symbol-area.notFor.3
    message:
      No live geography, online routing, JSX, functions, URLs, private records or
      external requests. Maps are schematic local plans; no real-world inference
      follows.
  - id: motionAtlas.proportional-symbol-area.notFor.4
    message:
      The fixed plot is 400x400 rendered pixels. Map normalized centers to (x*4,y*4).
      For each radius sqrt(value*areaPerUnit/pi), require r<=x*4<=400-r and
      r<=y*4<=400-r. Every center separation must be >=r_i+r_j+12 rendered pixels.
      Reject clipping and overlaps.
  - id: motionAtlas.proportional-symbol-area.notFor.5
    message:
      Authored prose and schematic context are the author's responsibility. Runtime
      validation checks structural bounds and numeric, reference and geometry
      constraints, without classifying natural-language claims.
motionBeats:
  - startFrame: 0
    endFrame: 12
    description:
