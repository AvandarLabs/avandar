        destination.
  - startFrame: 44
    endFrame: 100
    description:
      id: motionAtlas.community-coordination-table.motionBeats.1
      message: The moving team lifts, carries and places its own marker.
  - startFrame: 101
    endFrame: 120
    description:
      id: motionAtlas.community-coordination-table.motionBeats.2
      message: Turn request tags face-up with the agreed assignments.
  - startFrame: 121
    endFrame: 167
    description:
      id: motionAtlas.community-coordination-table.motionBeats.3
      message: Hold the full plan and every remaining request.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.community-coordination-table.motionBeats.4
      message: Return to the opaque ground through the shared envelope.
