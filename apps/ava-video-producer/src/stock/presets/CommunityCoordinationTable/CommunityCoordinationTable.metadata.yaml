name:
  id: motionAtlas.community-coordination-table.name
  message: Rebalance a shared response
description:
  id: motionAtlas.community-coordination-table.description
  message:
    Community representatives and response teams rearrange physical service markers
    on a shared schematic tabletop map. An overlapping assignment moves to a requested
    location so the final plan reflects an explicit community priority.
category:
  id: motionAtlas.community-coordination-table.category
  message: Participatory spatial planning
useWhen:
  id: motionAtlas.community-coordination-table.useWhen
  message:
    Show a community request changing a shared plan while preserving visibility of
    what remains unassigned.
intent:
  id: motionAtlas.community-coordination-table.intent
  message:
    Show a community request changing a shared plan while preserving visibility of
    what remains unassigned.
creativeDirection:
  id: motionAtlas.community-coordination-table.creativeDirection
  message:
    Within six seconds, reveal a tabletop map with authored community requests and
    team markers at their starting assignments. Where two team markers overlap, the
    community representative points to the requested destination; the reassigned team
    lifts its own marker and places it at that destination. Turn the relevant request
    tags face-up to show the configured final assignments, then hold the full plan with
    all remaining requests still visible. Use the shared opaque entrance and exit
    envelope, and avoid turning the whole map green.
distinction:
  id: motionAtlas.community-coordination-table.distinction
  message:
    The main action is a participant lifting and relocating a physical assignment
    in response to a visible community request. Unlike radial-network or schema-mapping,
    no abstract hub distributes signals and the plan is revised rather than merely
    connected.
prompt:
  id: motionAtlas.community-coordination-table.prompt
  message:
    Rebalance a shared response. Show a community request changing a shared plan
    while preserving visibility of what remains unassigned.
