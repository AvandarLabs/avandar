notFor:
  - id: motionAtlas.community-coordination-table.notFor.0
    message:
      Markers represent authored team assignments, not measured coverage, beneficiary
      counts, delivery capacity, or verified access.
  - id: motionAtlas.community-coordination-table.notFor.1
    message:
      The final scene is an agreed illustrative plan, not evidence that a service
      reached a location.
  - id: motionAtlas.community-coordination-table.notFor.2
    message:
      The map is schematic and has no real geography or travel scale; no automatic
      allocation or route calculation is implied.
  - id: motionAtlas.community-coordination-table.notFor.3
    message:
      Service compatibility is an author-validated semantic constraint; the renderer
      cannot infer needs or determine an appropriate humanitarian response.
