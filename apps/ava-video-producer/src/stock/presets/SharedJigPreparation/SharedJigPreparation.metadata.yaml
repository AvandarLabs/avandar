notFor:
  - id: motionAtlas.shared-jig-preparation.notFor.0
    message:
      No elapsed-time comparison, productivity multiplier or quality improvement is
      inferred from the choreography.
  - id: motionAtlas.shared-jig-preparation.notFor.1
    message:
      The physical guide is an authored preparation metaphor, not evidence of a
      particular product workflow or a measured team effect.
  - id: motionAtlas.shared-jig-preparation.notFor.2
    message:
      All workpieces exist at the start. Applying a pattern creates marks, not extra
      material or workers.
  - id: motionAtlas.shared-jig-preparation.notFor.3
    message:
      Supplied prose is preserved. Fictional framing, evidence, and agreement between
      wording and selected states are authoring responsibilities. Runtime validation
      enforces structural bounds and explicit cross-field rules.
motionBeats:
