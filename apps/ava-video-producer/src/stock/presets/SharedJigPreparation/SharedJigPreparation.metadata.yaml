name:
  id: motionAtlas.shared-jig-preparation.name
  message: Prepare one guide that the whole team can reuse
description:
  id: motionAtlas.shared-jig-preparation.description
  message:
    One maker prepares a physical marking guide. The same guide then moves between
    coworkers, who apply its pattern to their own supplied workpieces while keeping the
    reusable guide intact.
category:
  id: motionAtlas.shared-jig-preparation.category
  message: Learning and collaboration
useWhen:
  id: motionAtlas.shared-jig-preparation.useWhen
  message:
    Make the benefit of shared preparation concrete without inventing a performance
    multiplier.
prompt:
  id: motionAtlas.shared-jig-preparation.prompt
  message:
    Make the benefit of shared preparation concrete without inventing a performance
    multiplier.
creativeDirection:
  id: motionAtlas.shared-jig-preparation.creativeDirection
  message:
    Frames 12..48 show a maker forming the authored guide by opening two marking
    holes or a corner notch. Frames 49..130 carry that same guide to each collaborator
    in input order. At each station the collaborator aligns the guide with their
    existing blank workpiece and makes the matching marks, then releases the unchanged
    guide for the next person. Frames 131..167 hold all separate marked workpieces and
    the retained guide together. Do not turn the guide into copies of itself or show a
    numeric acceleration. Use deterministic frame-driven React/SVG at 960x600, 180
    frames and 30 fps, with the shared palette. Reveal during frames 0..11 and fade to
    the common opaque ground during frames 168..179.
intent:
  id: motionAtlas.shared-jig-preparation.intent
  message:
    Make the benefit of shared preparation concrete without inventing a performance
    multiplier.
distinction:
  id: motionAtlas.shared-jig-preparation.distinction
  message:
    Unlike contribution-weave, the team does not combine its outputs into one
    object. Unlike practice-to-work-sample, the reusable artifact itself travels to
    multiple coworkers. Unlike cache-reuse, different workpieces receive a repeatable
    procedure rather than repeated requests receiving a stored answer.
