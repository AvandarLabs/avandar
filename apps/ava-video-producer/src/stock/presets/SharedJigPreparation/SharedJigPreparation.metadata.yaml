    description:
      id: motionAtlas.shared-jig-preparation.motionBeats.1
      message: Apply the same guide to each existing workpiece in order.
  - startFrame: 131
    endFrame: 167
    description:
      id: motionAtlas.shared-jig-preparation.motionBeats.2
      message: Retain all marked workpieces and the unchanged guide.
