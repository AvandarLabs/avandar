name:
  id: motionAtlas.returning-learner-worktable.name
  message: Return with earlier work intact
description:
  id: motionAtlas.returning-learner-worktable.description
  message:
    A learner returns to a classroom with earlier work still visible while a
    teacher adds an explicitly chosen return activity. A break in schooling is shown as
    time away, not as erased knowledge.
category:
  id: motionAtlas.returning-learner-worktable.category
  message: Classroom return and retained artifacts
useWhen:
  id: motionAtlas.returning-learner-worktable.useWhen
  message:
    Present reentry as building from known prior work rather than restarting a
    learner from zero.
prompt:
  id: motionAtlas.returning-learner-worktable.prompt
  message:
    Reveal one learner at a classroom desk with the supplied prior-work samples,
    preserving their authored forms and marks without grading them. Move the learner and
    the same portfolio to a side table while the interruption-period label appears.
    Bring the learner back to the desk, where the teacher places exactly the supplied
    return activities. Link each review activity to its referenced prior work and show
    each new activity without inventing a prior artifact. Hold the original work and
    supplied activities together, then fade out.
creativeDirection:
  id: motionAtlas.returning-learner-worktable.creativeDirection
  message:
    Reveal one learner at a classroom desk with the supplied prior-work samples,
    preserving their authored forms and marks without grading them. Move the learner and
    the same portfolio to a side table while the interruption-period label appears.
    Bring the learner back to the desk, where the teacher places exactly the supplied
    return activities. Link each review activity to its referenced prior work and show
    each new activity without inventing a prior artifact. Hold the original work and
    supplied activities together, then fade out.
intent:
  id: motionAtlas.returning-learner-worktable.intent
  message:
    Present reentry as building from known prior work rather than restarting a
    learner from zero.
distinction:
  id: motionAtlas.returning-learner-worktable.distinction
  message:
    A learner carries tangible prior work through a discontinuity and joins a
    physical teaching session. Unlike missed-visit followup or restoring a software
    checkpoint, nothing is retrieved by an alert and no human knowledge is rolled back
    or automatically recovered.
