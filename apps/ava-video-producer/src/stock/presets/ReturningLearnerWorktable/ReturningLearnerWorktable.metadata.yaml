goodFor:
  - id: motionAtlas.returning-learner-worktable.goodFor.0
    message: Explain a fictional return-to-school support arrangement
  - id: motionAtlas.returning-learner-worktable.goodFor.1
    message: Show that time away and retained prior work are different facts
  - id: motionAtlas.returning-learner-worktable.goodFor.2
    message: Introduce an authored bridge lesson without predicting learning recovery
domains:
  - id: motionAtlas.returning-learner-worktable.domains.0
    message: Classroom return and retained artifacts
aliases:
  - id: motionAtlas.returning-learner-worktable.aliases.0
    message: interrupted schooling
  - id: motionAtlas.returning-learner-worktable.aliases.1
    message: return to school
  - id: motionAtlas.returning-learner-worktable.aliases.2
    message: reentry
notFor:
  - id: motionAtlas.returning-learner-worktable.notFor.0
    message:
      One learner is represented. Work samples count artifacts only, not mastered
      competencies, credits, or school days.
  - id: motionAtlas.returning-learner-worktable.notFor.1
    message:
      The middle beat does not specify why schooling was interrupted, where the
      learner lived, or what learning happened while away.
  - id: motionAtlas.returning-learner-worktable.notFor.2
    message:
      Review and new are authored activity roles, not diagnostic judgments. A return
      scene does not prove reenrollment or learning recovery.
  - id: motionAtlas.returning-learner-worktable.notFor.3
    message:
      All defaults are fictional. Durations are editorial and the loop reset is not
      another interruption.
motionBeats:
  - startFrame: 0
    endFrame: 35
    description:
      id: motionAtlas.returning-learner-worktable.motionBeats.0
      message: Reveal the learner and original portfolio at the classroom desk.
  - startFrame: 36
    endFrame: 71
    description:
      id: motionAtlas.returning-learner-worktable.motionBeats.1
      message: Carry the same portfolio to the side table during the interruption.
  - startFrame: 72
    endFrame: 89
    description:
      id: motionAtlas.returning-learner-worktable.motionBeats.2
      message: Return the learner and intact earlier work to the desk.
  - startFrame: 90
    endFrame: 137
    description:
      id: motionAtlas.returning-learner-worktable.motionBeats.3
      message:
        The teacher picks up and places one to three review or new activities,
        preserving every original artifact.
  - startFrame: 138
    endFrame: 179
    description:
      id: motionAtlas.returning-learner-worktable.motionBeats.4
      message: Hold original work with the supplied activities and use the shared fade.
