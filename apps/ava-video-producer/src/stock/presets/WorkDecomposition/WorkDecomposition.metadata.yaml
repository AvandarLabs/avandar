notFor:
  - id: motionAtlas.work-decomposition.notFor.0
    message: The default undertaking and effort values are fictional.
  - id: motionAtlas.work-decomposition.notFor.1
    message:
      Piece area represents the supplied relative effort allocation, not task
      duration, staffing, cost, or measured productivity unless the caller explicitly
      supplies that meaning and unit.
  - id: motionAtlas.work-decomposition.notFor.2
    message:
      All pieces together exhaust the depicted whole; overlapping work, unallocated
      effort, dependencies, and recursive subtasks are excluded.
  - id: motionAtlas.work-decomposition.notFor.3
    message:
      The original slab contour remains a thin fixed reference. A distinct enclosing
      bracket reserves space for equal-gap translations without resizing any material.
      External label slots identify even the smallest pieces.
motionBeats:
  - startFrame: 12
    endFrame: 38
    description:
      id: motionAtlas.work-decomposition.motionBeats.0
      message: Reveal one continuous slab.
  - startFrame: 38
    endFrame: 86
    description:
      id: motionAtlas.work-decomposition.motionBeats.1
      message: Draw proportional cuts through the whole.
  - startFrame: 86
    endFrame: 124
    description:
      id: motionAtlas.work-decomposition.motionBeats.2
      message: Separate conserved pieces into the enclosing bracket reserve.
  - startFrame: 124
    endFrame: 168
    description:
      id: motionAtlas.work-decomposition.motionBeats.3
      message: Hold every labeled piece and the original contour reference.
