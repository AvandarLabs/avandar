name:
  id: motionAtlas.work-decomposition.name
  message: Break the work into parts
description:
  id: motionAtlas.work-decomposition.description
  message:
    A single block representing an undertaking is cut into a bounded set of labeled
    work packages. The pieces separate into a distinct enclosing reserve while the
    original contour remains fixed, keeping their relationship to the whole visible.
category:
  id: motionAtlas.work-decomposition.category
  message: Work structure
useWhen:
  id: motionAtlas.work-decomposition.useWhen
  message: Make a large undertaking understandable as an explicit set of constituent parts.
prompt:
  id: motionAtlas.work-decomposition.prompt
  message:
    Use Motion Atlas "Break the work into parts" (work-decomposition) as a
    conceptual graphic. Make a large undertaking understandable as an explicit set of
    constituent parts. Replace fictional sample content with approved authored content
    before making product claims.
creativeDirection:
  id: motionAtlas.work-decomposition.creativeDirection
  message:
    "Reveal one continuous filled slab with the parent label during 12..38. During
    38..86, ruled cut lines travel across the slab in the chosen partition layout,
    dividing its area according to the supplied effort weights. During 86..124, the
    resulting pieces separate by a small equal gap and their individual labels settle
    into place. The original contour remains a thin fixed reference at its initial
    bounds. A distinct enclosing bracket reserves space from setup for the pieces to
    separate without resizing, and the parent label moves above it without changing
    size. Hold the complete labeled partition through 168, then fade to ground. No new
    material appears: the original whole is visibly accounted for by its pieces."
intent:
  id: motionAtlas.work-decomposition.intent
  message: Make a large undertaking understandable as an explicit set of constituent parts.
distinction:
  id: motionAtlas.work-decomposition.distinction
  message:
    Stagger-cards introduces separate siblings; this starts with one continuous
    whole and visibly partitions its conserved area. It does not imply a sequential
    pipeline or relationships among independently existing nodes.
