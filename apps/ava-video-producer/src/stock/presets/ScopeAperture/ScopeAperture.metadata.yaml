name:
  id: motionAtlas.scope-aperture.name
  message: Narrow the question
description:
  id: motionAtlas.scope-aperture.description
  message:
    A broad subject remains visible while a movable frame isolates the subset under
    discussion. Excluded topics stay outside the frame with explicit context rather than
    disappearing without explanation.
category:
  id: motionAtlas.scope-aperture.category
  message: Editorial connectors
useWhen:
  id: motionAtlas.scope-aperture.useWhen
  message: Make the boundary of the current explanation explicit.
prompt:
  id: motionAtlas.scope-aperture.prompt
  message:
    Use Motion Atlas "Narrow the question" (scope-aperture) as a conceptual
    graphic. Make the boundary of the current explanation explicit. Replace fictional
    sample content with approved authored content before making product claims.
creativeDirection:
  id: motionAtlas.scope-aperture.creativeDirection
  message:
    A broad heading and a flat field of topic labels appear together. A rectangular
    aperture draws around the full field, then its edges contract and selected labels
    slide together within it while other labels remain outside. The narrowed question
    replaces the broad heading inside the frame. A final outside caption clarifies what
    is deferred before the common exit envelope.
intent:
  id: motionAtlas.scope-aperture.intent
  message: Make the boundary of the current explanation explicit.
distinction:
  id: motionAtlas.scope-aperture.distinction
  message: The explanatory action is a changing semantic boundary with explicit
    membership. Unlike stagger-cards or word-reveal, the labels begin visible and the
    animation changes which topics belong to the current question.
