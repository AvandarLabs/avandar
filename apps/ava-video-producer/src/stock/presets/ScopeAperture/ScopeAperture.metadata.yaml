notFor:
  - id: motionAtlas.scope-aperture.notFor.0
    message: The frame expresses topic membership, not physical geography or measured area.
  - id: motionAtlas.scope-aperture.notFor.1
    message: Included topics are authored; the renderer performs no text classification.
  - id: motionAtlas.scope-aperture.notFor.2
    message: This is a single narrowing step, not an animated camera zoom through a hierarchy.
  - id: motionAtlas.scope-aperture.notFor.3
    message:
      Topics outside the aperture may be future, deferred, unsupported, or simply out
      of this explanation. Supply the correct outside label and do not imply they are
      shipped features.
