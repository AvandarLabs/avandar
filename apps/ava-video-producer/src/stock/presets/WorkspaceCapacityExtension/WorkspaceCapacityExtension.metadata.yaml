notFor:
  - id: motionAtlas.workspace-capacity-extension.notFor.0
    message:
      One workspace, two allowance choices, and at most nine total resources. No
      actual billing, subscription entitlement, import, connection, or checkout is
      performed.
  - id: motionAtlas.workspace-capacity-extension.notFor.1
    message:
      The combined collection lengths determine resource count. Capacity is supplied
      separately and must contain the final count when expansion is selected. Invalid
      combinations are rejected, not silently truncated.
  - id: motionAtlas.workspace-capacity-extension.notFor.2
    message:
      Existing resource identity and content remain unchanged. Pending resources are
      not shown as already imported or connected.
  - id: motionAtlas.workspace-capacity-extension.notFor.3
    message:
      No real plan names, prices, conversion rate, automatic charge, or guaranteed
      growth is illustrated.
  - id: motionAtlas.workspace-capacity-extension.notFor.4
    message:
      A kept allowance is a valid outcome with visible pending demand. No celebratory
      failure mark or forced-upgrade message punishes that choice.
  - id: motionAtlas.workspace-capacity-extension.notFor.5
    message:
      Supplied prose meaning, fictional status and agreement with structured choices
      are authoring responsibilities. Runtime validation enforces structure, numeric
      bounds, identities and references.
motionBeats:
  - startFrame: 0
    endFrame: 11
    description:
      id: motionAtlas.workspace-capacity-extension.motionBeats.0
      message: Reveal exact current allowance and retained resources.
  - startFrame: 12
    endFrame: 50
    description:
      id: motionAtlas.workspace-capacity-extension.motionBeats.1
      message: Bring requests beside the tray.
  - startFrame: 51
    endFrame: 80
    description:
      id: motionAtlas.workspace-capacity-extension.motionBeats.2
      message: Show the authored capacity choice.
  - startFrame: 81
    endFrame: 125
    description:
      id: motionAtlas.workspace-capacity-extension.motionBeats.3
      message: Expand the same tray and seat requests only when authorized.
  - startFrame: 126
    endFrame: 167
    description:
      id: motionAtlas.workspace-capacity-extension.motionBeats.4
      message: Hold allowance and pending or seated requests.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.workspace-capacity-extension.motionBeats.5
      message: Shared opaque exit.
