name:
  id: motionAtlas.workspace-capacity-extension.name
  message: Make room without replacing the work
description:
  id: motionAtlas.workspace-capacity-extension.description
  message:
    A bounded workspace retains its existing resources while additional requests
    wait outside its current allowance. An authored plan choice expands the available
    slots or leaves the requests pending, preserving both user agency and resource
    identity.
category:
  id: motionAtlas.workspace-capacity-extension.category
  message: Bounded workspace growth
useWhen:
  id: motionAtlas.workspace-capacity-extension.useWhen
  message:
    Show that an authorized capacity change creates room while the current work
    stays intact.
creativeDirection:
  id: motionAtlas.workspace-capacity-extension.creativeDirection
  message:
    Frames 0-11 reveal the current workspace as a shallow tray with its exact slot
    allowance on the 960x600 canvas. Frames 12-50 bring requested resource tabs
    alongside the filled tray while the existing tabs stay fixed. Frames 51-80 show the
    supplied choice. For expand, frames 81-125 extend the same tray along a hinged side,
    reveal the additional slots, and seat all requested tabs. For keep, retain the
    original boundary and pending tabs. Frames 126-167 hold the selected allowance,
    existing identities, and any pending requests. Fade to the common opaque ground at
    frames 168-179. Use deterministic frame-driven React/SVG at 30fps.
intent:
  id: motionAtlas.workspace-capacity-extension.intent
  message:
    Show that an authorized capacity change creates room while the current work
    stays intact.
distinction:
  id: motionAtlas.workspace-capacity-extension.distinction
  message:
    Unlike stagger-cards, the explanatory action changes a finite containing
    boundary after an explicit choice. Unlike queue-relief, resources occupy persistent
    workspace slots rather than leaving after service. Unlike dashboard-slot-assembly,
    no layout rearrangement or content reshaping makes the new capacity.
prompt:
  id: motionAtlas.workspace-capacity-extension.prompt
  message: Use Motion Atlas "Make room without replacing the work"
    (workspace-capacity-extension) as a conceptual graphic. Show that an authorized
    capacity change creates room while the current work stays intact. Replace fictional
    examples with approved authored content before making product claims.
