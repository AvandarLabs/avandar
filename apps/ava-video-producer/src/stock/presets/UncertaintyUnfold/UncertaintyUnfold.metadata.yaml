name:
  id: motionAtlas.uncertainty-unfold.name
  message: Show the range behind the estimate
description:
  id: motionAtlas.uncertainty-unfold.description
  message: A point estimate opens into a bounded interval on one fixed scale. An optional
    reference remains visible so the interval's relation to that reference can be read
    without turning uncertainty into certainty.
category:
  id: motionAtlas.uncertainty-unfold.category
  message: Quantitative explanation
useWhen:
  id: motionAtlas.uncertainty-unfold.useWhen
  message: Make the limits around an estimate as visible as the estimate itself.
prompt:
  id: motionAtlas.uncertainty-unfold.prompt
  message: Use Motion Atlas "Show the range behind the estimate" (uncertainty-unfold) as a
    conceptual graphic. Make the limits around an estimate as visible as the estimate
    itself. Replace fictional sample content with approved authored content before
    making product claims.
creativeDirection:
  id: motionAtlas.uncertainty-unfold.creativeDirection
  message: At the entrance, a supplied estimate marker stands on a fixed ruler. Two folded
    sleeves extend from the marker to the supplied lower and upper endpoints, exposing a
    patterned interval and its explicit meaning. An optional reference blade then lowers
    across the ruler, with its position preserved even when it crosses the interval.
    Hold the estimate, both endpoints, interval label and authored interpretation
    together before fading to the opaque ground. All movement fits six seconds and
    reveals supplied values rather than simulating evidence or a time trend.
intent:
  id: motionAtlas.uncertainty-unfold.intent
  message: Make the limits around an estimate as visible as the estimate itself.
distinction:
  id: motionAtlas.uncertainty-unfold.distinction
  message: Unlike line-trace, the scale has no time axis and no observed series is drawn.
    Unlike chart-focus-edit, this reveals the uncertainty contract hidden by a point
    alone. Contact-window-overlap compares recorded visits in time; this unfolds one
    numerical estimate into its explicitly named epistemic bounds.
