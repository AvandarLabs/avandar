notFor:
  - id: motionAtlas.uncertainty-unfold.notFor.0
    message: One estimate and at most one reference. Endpoints are supplied, never
      statistically calculated or narrowed by the animation.
  - id: motionAtlas.uncertainty-unfold.notFor.1
    message: Interval width represents numeric span on a linear scale, not probability
      density, likelihood or sample size.
  - id: motionAtlas.uncertainty-unfold.notFor.2
    message: Confidence intervals, measurement ranges and scenario ranges are different
      meanings. The selected kind and label must match the source.
  - id: motionAtlas.uncertainty-unfold.notFor.3
    message: Crossing or not crossing a reference is not automatically a significance test,
      recommendation or certainty claim. No automatic success or failure color is
      applied.
  - id: motionAtlas.uncertainty-unfold.notFor.4
    message: A conservative adjustment or downside scenario is not a confidence interval, a
      validated error margin, or a representative population estimate. Match
      interval.kind and its visible label to the actual evidence.
  - id: motionAtlas.uncertainty-unfold.notFor.5
    message: No endpoints, probabilities, sample precision, or validation status are
      inferred from a business plan or the width of the displayed band.
  - id: motionAtlas.uncertainty-unfold.notFor.6
    message: Endpoint values use external slots and leader lines so coincident point and
      endpoint positions remain readable. Finite extreme spans use stable normalization
      without changing the axis.
motionBeats:
  - startFrame: 12
    endFrame: 38
    description:
      id: motionAtlas.uncertainty-unfold.motionBeats.0
      message: Establish the estimate on the fixed ruler.
  - startFrame: 38
    endFrame: 86
    description:
      id: motionAtlas.uncertainty-unfold.motionBeats.1
      message: Unfold the two interval sleeves to their supplied endpoints.
  - startFrame: 90
    endFrame: 114
    description:
      id: motionAtlas.uncertainty-unfold.motionBeats.2
      message: Lower the optional reference at its fixed value.
  - startFrame: 114
    endFrame: 168
    description:
      id: motionAtlas.uncertainty-unfold.motionBeats.3
      message: Hold the bounds, point and authored interpretation.
