goodFor:
  - id: motionAtlas.uncertainty-unfold.goodFor.0
    message: Explain why a single planning estimate has a range
  - id: motionAtlas.uncertainty-unfold.goodFor.1
    message: Introduce a supplied confidence interval alongside its point estimate
  - id: motionAtlas.uncertainty-unfold.goodFor.2
    message: Show that a reference value lies within or outside authored bounds
  - id: motionAtlas.uncertainty-unfold.goodFor.3
    message: Label a supplied scenario range separately from statistical uncertainty
  - id: motionAtlas.uncertainty-unfold.goodFor.4
    message: Keep an untested operating assumption visible beside a point estimate
