notFor:
  - id: motionAtlas.missed-visit-reconnect.notFor.0
    message: "The denominator is cases.length: the authored missed-visit group, not the
      whole service population. Each person has one exclusive final state, so state
      subtotals sum to the group total."
  - id: motionAtlas.missed-visit-reconnect.notFor.1
    message: Attempts are contact events and may exceed unique people. A contact or booking
      does not imply attendance, vaccination, eligibility, or health benefit.
  - id: motionAtlas.missed-visit-reconnect.notFor.2
    message: The sequence depicts recorded administrative outcomes and supplies no follow-up
      timing, clinical priority, or dosing advice.
  - id: motionAtlas.missed-visit-reconnect.notFor.3
    message: Identities are fictional. Household and phone graphics must not imply a
      particular reason for the missed visit.
motionBeats:
  - startFrame: 12
    endFrame: 35
    description:
      id: motionAtlas.missed-visit-reconnect.motionBeats.0
      message: Establish the supplied identities and setting.
  - startFrame: 36
    endFrame: 115
    description:
      id: motionAtlas.missed-visit-reconnect.motionBeats.1
      message: Frames 12..38 show four silhouettes with empty appointment marks beside their
        homes. Frames 39..114 animate one worker making the authored phone or doorstep
        contacts; a booking tab folds onto a calendar for one person, while only a
        documented attendee walks back through the clinic door. Frames 115..167 hold
        everyone in a distinct final state with the original group total; fade to ground
        by frame 179.
  - startFrame: 116
    endFrame: 167
    description:
      id: motionAtlas.missed-visit-reconnect.motionBeats.2
      message: Hold the authored final records and derived quantities.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.missed-visit-reconnect.motionBeats.3
      message: Return to the opaque ground through the shared envelope.
