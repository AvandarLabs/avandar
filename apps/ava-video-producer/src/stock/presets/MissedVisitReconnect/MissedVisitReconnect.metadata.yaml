name:
  id: motionAtlas.missed-visit-reconnect.name
  message: Reconnect after a missed visit
description:
  id: motionAtlas.missed-visit-reconnect.description
  message: A field worker follows up a small, explicitly defined group whose visits were
    missed. A conversation, a booking, and an attended return resolve into separate
    outcomes.
category:
  id: motionAtlas.missed-visit-reconnect.category
  message: Human outreach and return
useWhen:
  id: motionAtlas.missed-visit-reconnect.useWhen
  message: Show that reaching someone, booking a visit, and recording attendance are
    different achievements.
intent:
  id: motionAtlas.missed-visit-reconnect.intent
  message: Show that reaching someone, booking a visit, and recording attendance are
    different achievements.
creativeDirection:
  id: motionAtlas.missed-visit-reconnect.creativeDirection
  message: Frames 12..38 show four silhouettes with empty appointment marks beside their
    homes. Frames 39..114 animate one worker making the authored phone or doorstep
    contacts; a booking tab folds onto a calendar for one person, while only a
    documented attendee walks back through the clinic door. Frames 115..167 hold
    everyone in a distinct final state with the original group total; fade to ground by
    frame 179.
distinction:
  id: motionAtlas.missed-visit-reconnect.distinction
  message: Unlike status-cycle or node-traversal, this shows a worker contacting people in
    their physical setting and an actual return through a clinic doorway only for
    attended records. Unlike dose-cohort-return-paths, its denominator is a preselected
    missed-visit group and its action is reconnection.
prompt:
  id: motionAtlas.missed-visit-reconnect.prompt
  message: Use Reconnect after a missed visit (missed-visit-reconnect) for a fictional or
    approved authored example. Show that reaching someone, booking a visit, and
    recording attendance are different achievements.
