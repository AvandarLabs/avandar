  - id: motionAtlas.missed-visit-reconnect.tags.7
    message: care continuity
goodFor:
  - id: motionAtlas.missed-visit-reconnect.goodFor.0
    message: Explain the operational work after missed appointments.
  - id: motionAtlas.missed-visit-reconnect.goodFor.1
    message: Distinguish successful contact from a booked or completed return.
  - id: motionAtlas.missed-visit-reconnect.goodFor.2
    message: Show unresolved follow-up honestly in a fictional public health story.
domains:
  - id: motionAtlas.missed-visit-reconnect.domains.0
    message: Human outreach and return
aliases:
  - id: motionAtlas.missed-visit-reconnect.aliases.0
