notFor:
  - id: motionAtlas.contact-window-overlap.notFor.0
    message:
      The denominator is records.length, one record per distinct person in this
      bounded example. Overlap + no overlap + unknown equals that denominator; counts
      are derived from interval intersection.
  - id: motionAtlas.contact-window-overlap.notFor.1
    message:
      Intervals and the supplied investigation window use half-open bounds
      [start,end), so touching endpoints alone do not count as overlap. Unknown means
      both bounds are null.
  - id: motionAtlas.contact-window-overlap.notFor.2
    message:
      Any overlap is only recorded co-presence under the supplied window. It is not a
      case definition, exposure determination, disease-specific contact rule, causal
      link, or medical recommendation.
  - id: motionAtlas.contact-window-overlap.notFor.3
    message:
      The time axis is a fictional relative scale, not an epidemiological duration.
      No transmission arrows or infection probabilities may be added.
