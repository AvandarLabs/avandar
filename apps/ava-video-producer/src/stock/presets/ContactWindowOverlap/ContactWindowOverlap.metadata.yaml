name:
  id: motionAtlas.contact-window-overlap.name
  message: Shared place, overlapping time
description:
  id: motionAtlas.contact-window-overlap.description
  message:
    Place-time strips reveal which recorded visits overlap a supplied investigation
    window. Unknown times remain unresolved, and overlap never becomes an inferred
    transmission link.
category:
  id: motionAtlas.contact-window-overlap.category
  message: Time and place intersection
useWhen:
  id: motionAtlas.contact-window-overlap.useWhen
  message:
    Explain the difference between sharing a place and being recorded there during
    the same defined window.
intent:
  id: motionAtlas.contact-window-overlap.intent
  message:
    Explain the difference between sharing a place and being recorded there during
    the same defined window.
creativeDirection:
  id: motionAtlas.contact-window-overlap.creativeDirection
  message:
    Reveal the shared place above the supplied person-specific time ribbons.
    Position the authored intervals on one axis and lower the investigation-window
    stencil over them; outline only actual interval intersections. Hold overlapping,
    nonoverlapping and unknown records alongside the same people, then fade. The
    intersection represents a review candidate, not a confirmed transmission.
distinction:
  id: motionAtlas.contact-window-overlap.distinction
  message:
    Unlike network-graph, node-traversal, or line-trace, the hero action is a
    window stencil intersecting interval lengths attached to people and a physical
    venue. No traveling signal implies transmission.
prompt:
  id: motionAtlas.contact-window-overlap.prompt
  message:
    Use Shared place, overlapping time (contact-window-overlap) for a fictional or
    approved authored example. Explain the difference between sharing a place and being
    recorded there during the same defined window.
