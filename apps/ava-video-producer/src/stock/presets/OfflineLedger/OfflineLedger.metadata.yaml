useWhen:
  id: motionAtlas.offline-ledger.useWhen
  message: Show that losing a connection does not have to interrupt the work already
    supported on a device.
prompt:
  id: motionAtlas.offline-ledger.prompt
  message: Use Motion Atlas "Work Keeps Its Place" (offline-ledger) as an illustrative
    conceptual graphic. Show that losing a connection does not have to interrupt the
    work already supported on a device. Bind complete authored inputs and preserve the
    stated limits.
creativeDirection:
  id: motionAtlas.offline-ledger.creativeDirection
  message: Within the six-second envelope, reveal a notebook held inside a device outline.
    At the first entry, the small connection arc gently collapses and the supplied
    offline caption appears; the writing strokes continue at the same cadence. Each
    entry presses a matching impression into a shallow local drawer directly beneath the
    page. Hold on the completed page and its retained impressions with the connection
    still unavailable, then fade both to the opaque ground without depicting data loss.
goodFor:
  - id: motionAtlas.offline-ledger.goodFor.0
    message: Explain writing notes during a connectivity interruption
  - id: motionAtlas.offline-ledger.goodFor.1
    message: Introduce local-first capture before a verified product demonstration
  - id: motionAtlas.offline-ledger.goodFor.2
    message: Illustrate a field notebook or rehearsal log that remains useful away from a
      shared office
  - id: motionAtlas.offline-ledger.goodFor.3
    message: Explain a bounded local collection task in an intermittent-connectivity setting
  - id: motionAtlas.offline-ledger.goodFor.4
    message: Explain keeping the original document beside extracted data
  - id: motionAtlas.offline-ledger.goodFor.5
    message: Show local-only document storage
intent:
  id: motionAtlas.offline-ledger.intent
  message: Show that losing a connection does not have to interrupt the work already
