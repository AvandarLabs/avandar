name:
  id: motionAtlas.offline-ledger.name
  message: Work Keeps Its Place
description:
  id: motionAtlas.offline-ledger.description
  message: A local notebook continues accepting entries while its connection indicator
    goes quiet. Every new entry leaves a retained impression in the device's storage
    drawer.
