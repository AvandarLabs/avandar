notFor:
  - id: motionAtlas.offline-ledger.notFor.0
    message: The number of impressions equals entries.length and is an authored example
      count, not storage capacity or throughput.
  - id: motionAtlas.offline-ledger.notFor.1
    message: This scene does not imply that every product action works offline, that data is
      encrypted, or that remote synchronization has occurred.
  - id: motionAtlas.offline-ledger.notFor.2
    message: No duration on screen represents actual outage duration or save latency.
      Notebook casing is a metaphor and should not be described as proof of digital
      persistence.
  - id: motionAtlas.offline-ledger.notFor.3
    message: Show only the illustrated local operation. Do not imply that authentication,
      sharing, remote queries, or every product capability continues without a
      connection.
  - id: motionAtlas.offline-ledger.notFor.4
    message: A stored impression does not establish backup, encryption, eviction resistance,
      unlimited storage, synchronization, or zero device energy and maintenance cost.
  - id: motionAtlas.offline-ledger.notFor.5
    message: A derived table cannot reconstruct the original PDF page. Local retention is
      distinct from remote backup.
distinction:
  id: motionAtlas.offline-ledger.distinction
  message: Unlike status-cycle, the useful operation visibly continues after a dependency
    disappears. The page-to-drawer impressions depict local retention without a
    connection graph, packet stream, or new row of cards.
