name:
  id: motionAtlas.entity-spine-assembly.name
  message: Keep one record per entity
description:
  id: motionAtlas.entity-spine-assembly.description
  message:
    A fixed list of unique entity keys forms a central record spine. Repeated
    source observations feed values into those records while unmatched fields remain
    missing and source rows never multiply the entity count.
category:
  id: motionAtlas.entity-spine-assembly.category
  message: Entity grain preservation
useWhen:
  id: motionAtlas.entity-spine-assembly.useWhen
  message: Preserve entity membership while deriving fields from repeated observations.
prompt:
  id: motionAtlas.entity-spine-assembly.prompt
  message: Preserve entity membership while deriving fields from repeated observations.
creativeDirection:
  id: motionAtlas.entity-spine-assembly.creativeDirection
  message:
    960x600 React/SVG, shared palette, deterministic 180 frames at 30fps. Frames
    0-12 reveal the scene. Frames 13-48 align a unique key spine down the center. Frames
    49-105 stack repeated observations beside their key and collapse their numeric
    values by sum. Frames 106-139 attach the derived value to each spine row, leaving a
    labeled missing field where no observations match. Hold the resolved meaning during
    frames 140-165. Frames 166-179 return to the same opaque ground for a six-second
    loop; reset is editorial.
intent:
  id: motionAtlas.entity-spine-assembly.intent
  message: Preserve entity membership while deriving fields from repeated observations.
distinction:
  id: motionAtlas.entity-spine-assembly.distinction
  message:
    Unlike keyed-row-zipper, this is not a two-table row join. A unique spine fixes
    output grain before repeated observations are aggregated, avoiding join fan-out.
tags:
  - id: motionAtlas.entity-spine-assembly.tags.0
    message: case management
  - id: motionAtlas.entity-spine-assembly.tags.1
    message: ontology-based access
  - id: motionAtlas.entity-spine-assembly.tags.2
    message: entity spine
  - id: motionAtlas.entity-spine-assembly.tags.3
    message: one record per entity
  - id: motionAtlas.entity-spine-assembly.tags.4
    message: virtual fields
goodFor:
  - id: motionAtlas.entity-spine-assembly.goodFor.0
    message: Explain case records assembled from repeated observations
  - id: motionAtlas.entity-spine-assembly.goodFor.1
    message: Prevent one-to-many source rows from multiplying entity counts
domains:
  - id: motionAtlas.entity-spine-assembly.domains.0
    message: Editorial illustration
aliases:
  - id: motionAtlas.entity-spine-assembly.aliases.0
    message: entity spine assembly
notFor:
  - id: motionAtlas.entity-spine-assembly.notFor.0
    message: No identity matching is inferred; key equality is explicit.
  - id: motionAtlas.entity-spine-assembly.notFor.1
    message:
      Stored entity membership and computed attribute values are separate, and the
      animation makes no permanent-value storage claim.
  - id: motionAtlas.entity-spine-assembly.notFor.2
    message:
      Sum is the only calculation in this preset; use grouped-value-picker to explain
      alternatives.
  - id: motionAtlas.entity-spine-assembly.notFor.3
    message:
      No real product screen, external fetch, supplied code execution, or measured
      performance claim. All text is authored; no JSX, functions or URLs in props.
  - id: motionAtlas.entity-spine-assembly.notFor.4
    message:
      Supplied prose is preserved. Fictional framing, source completeness and
      agreement between labels and structured state are author responsibilities. Runtime
      validation enforces structural bounds and exact cross-field rules.
  - id: motionAtlas.entity-spine-assembly.notFor.5
    message:
      Literal IDs and row values preserve exact whitespace using visible whitespace
      marks at a fixed readable size.
motionBeats:
  - startFrame: 13
    endFrame: 48
    description:
      id: motionAtlas.entity-spine-assembly.motionBeats.0
      message: Align a fixed unique entity spine.
  - startFrame: 49
    endFrame: 105
    description:
      id: motionAtlas.entity-spine-assembly.motionBeats.1
      message: Stack and sum observations beside their exact entity key.
  - startFrame: 106
    endFrame: 139
    description:
      id: motionAtlas.entity-spine-assembly.motionBeats.2
      message: Attach one derived value or a missing field to every entity.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.entity-spine-assembly.motionBeats.3
      message: Hold the resolved meaning.
