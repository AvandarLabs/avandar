name:
  id: motionAtlas.shared-workshop-booking.name
  message: Agree who uses the shared machine when
description:
  id: motionAtlas.shared-workshop-booking.description
  message:
    Two or three livelihood participants resolve a supplied overlap in requests for
    one shared machine. Their agreed bookings become separate usage windows while the
    machine itself remains a single finite resource.
category:
  id: motionAtlas.shared-workshop-booking.category
  message: Finite equipment and negotiated time
useWhen:
  id: motionAtlas.shared-workshop-booking.useWhen
  message: Show how people share one productive asset by agreeing distinct times.
prompt:
  id: motionAtlas.shared-workshop-booking.prompt
  message:
    Show one sewing machine beside a compact time ruler, with the supplied
    participant request strips overlapping above it. The participants slide only the
    authored changed strips into their agreed non-overlapping windows and place
    agreement tabs. A short physical turn at the same machine is shown for each booked
    participant in order, with the others' named strips remaining visible. Hold the one
    machine and the agreed schedule; unresolved requests stay above the ruler rather
    than masquerading as bookings.
creativeDirection:
  id: motionAtlas.shared-workshop-booking.creativeDirection
  message:
    Show one sewing machine beside a compact time ruler, with the supplied
    participant request strips overlapping above it. The participants slide only the
    authored changed strips into their agreed non-overlapping windows and place
    agreement tabs. A short physical turn at the same machine is shown for each booked
    participant in order, with the others' named strips remaining visible. Hold the one
    machine and the agreed schedule; unresolved requests stay above the ruler rather
