intent:
  id: motionAtlas.shared-workshop-booking.intent
  message: Show how people share one productive asset by agreeing distinct times.
distinction:
  id: motionAtlas.shared-workshop-booking.distinction
  message:
    The participants negotiate contention over a physical machine that remains
    single, then occupy it at separate authored times. Unlike queue-relief, capacity
    never increases; unlike schedule-buffer, no deadline reserve absorbs a delay; unlike
    priority-insertion, the change is a mutually agreed reservation rather than imposed
    precedence.
