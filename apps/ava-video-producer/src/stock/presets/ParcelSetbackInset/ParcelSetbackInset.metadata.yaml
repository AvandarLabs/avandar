name:
  id: motionAtlas.parcel-setback-inset.name
  message: Leave room around the site
description:
  id: motionAtlas.parcel-setback-inset.description
  message: Schematic parcels shrink inward by a supplied clearance distance to reveal
    their buildable envelopes. A chosen public-service structure seats inside one
    envelope with its surrounding space still visible.
category:
  id: motionAtlas.parcel-setback-inset.category
  message: geometric site feasibility
useWhen:
  id: motionAtlas.parcel-setback-inset.useWhen
  message: Show why the whole structure and its clearance must fit inside a site.
prompt:
  id: motionAtlas.parcel-setback-inset.prompt
  message: Start with parcel edges and dimension ticks. Slide an inner edge inward equally
    on every side, leaving the setback as a hatched perimeter band. Lower the authored
    structure footprint into the remaining envelope and hold the original parcel,
    clearance band and occupied footprint together.
creativeDirection:
  id: motionAtlas.parcel-setback-inset.creativeDirection
  message: Start with parcel edges and dimension ticks. Slide an inner edge inward equally
    on every side, leaving the setback as a hatched perimeter band. Lower the authored
    structure footprint into the remaining envelope and hold the original parcel,
    clearance band and occupied footprint together.
intent:
  id: motionAtlas.parcel-setback-inset.intent
  message: Show why the whole structure and its clearance must fit inside a site.
distinction:
  id: motionAtlas.parcel-setback-inset.distinction
  message: The hero motion erodes parcel edges by a measured inset and fits an entire
    footprint. It neither relocates a service along a route nor exchanges rejected
    options; unlike layer intersection, the second geometry is derived from clearance
    rather than an independent map layer.
