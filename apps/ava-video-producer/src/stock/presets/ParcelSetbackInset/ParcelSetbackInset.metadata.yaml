notFor:
  - id: motionAtlas.parcel-setback-inset.notFor.0
    message: This is rectangular schematic geometry, not a legal setback, construction
      recommendation, or optimized site choice.
  - id: motionAtlas.parcel-setback-inset.notFor.1
    message: Clearance is an authored illustration. Accessibility, utilities, terrain and
      operating capacity require separate evidence.
  - id: motionAtlas.parcel-setback-inset.notFor.2
    message: All dimensions share one coordinate unit; there is no implied geographic scale
