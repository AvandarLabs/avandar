name:
  id: motionAtlas.schema-column-evolution.name
  message: Add a field without inventing the past
description:
  id: motionAtlas.schema-column-evolution.description
  message: A small table gains one new field while every earlier record keeps its identity
    and its uncollected value. A later record supplies a value under the expanded
    schema, leaving the older gaps visible.
category:
  id: motionAtlas.schema-column-evolution.category
  message: Schema change and retained evidence
useWhen:
  id: motionAtlas.schema-column-evolution.useWhen
  message: Separate the addition of a field from the collection of a value for that field.
creativeDirection:
  id: motionAtlas.schema-column-evolution.creativeDirection
  message: On a 960x600 React/SVG canvas, frames 0-11 reveal a compact table of earlier
    records. Frames 12-48 slide the existing columns left and unfold one new column from
    the header seam. Frames 49-92 place an explicit not-collected mark in that column
    for each earlier record without changing any original value. Frames 93-132 seat one
    later record in the same table, with its authored new-field value or missing mark.
    Frames 133-167 hold both generations under the new header and optional version
    captions. Frames 168-179 fade to the shared opaque palette ground, giving a
    deterministic six-second loop at 30fps.
intent:
  id: motionAtlas.schema-column-evolution.intent
  message: Separate the addition of a field from the collection of a value for that field.
distinction:
  id: motionAtlas.schema-column-evolution.distinction
  message: Unlike cell-normalization, this changes the available field structure without
    correcting existing values. Unlike schema-mapping, no fields are paired across two
    schemas. Unlike state-preserving-source-refresh, the visible change is a new
    collection question and its historical absence, not refreshing values from an
    existing source.
prompt:
  id: motionAtlas.schema-column-evolution.prompt
  message: Use Motion Atlas "Add a field without inventing the past"
    (schema-column-evolution) as a conceptual graphic. Separate the addition of a field
    from the collection of a value for that field. Replace fictional examples with
    approved authored content before making product claims.
