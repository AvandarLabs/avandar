goodFor:
  - id: motionAtlas.schema-column-evolution.goodFor.0
    message: Explain an evolving collection form during a changing field program
  - id: motionAtlas.schema-column-evolution.goodFor.1
    message: Show why adding a question does not supply historical answers
  - id: motionAtlas.schema-column-evolution.goodFor.2
    message: Introduce a schema extension before discussing any backfill process
domains:
  - id: motionAtlas.schema-column-evolution.domains.0
    message: Schema change and retained evidence
aliases:
  - id: motionAtlas.schema-column-evolution.aliases.0
    message: schema evolution
  - id: motionAtlas.schema-column-evolution.aliases.1
    message: new field
  - id: motionAtlas.schema-column-evolution.aliases.2
    message: missing values
  - id: motionAtlas.schema-column-evolution.aliases.3
    message: historical records
notFor:
  - id: motionAtlas.schema-column-evolution.notFor.0
    message: One retained field, one added field, one later row, and at most three earlier
      rows fit the six-second explanation.
  - id: motionAtlas.schema-column-evolution.notFor.1
    message: The ending record count is earlierRecords.length + 1. A new column does not
      create or remove earlier records.
  - id: motionAtlas.schema-column-evolution.notFor.2
    message: The earlier records always retain missing marks in the added column. No
      default, imputation, migration, enrichment, or retrospectively inferred answer is
      shown.
  - id: motionAtlas.schema-column-evolution.notFor.3
    message: The sequence is a conceptual collection example. It makes no claim about a
      particular database migration system or any shipped form-editing feature.
  - id: motionAtlas.schema-column-evolution.notFor.4
    message: The editorial fade resets the illustration, not the stored records. All labels
      are supplied inputs.
  - id: motionAtlas.schema-column-evolution.notFor.5
    message: Supplied prose meaning, fictional status and agreement with structured choices
      are authoring responsibilities. Runtime validation enforces structure, numeric
      bounds, identities and references.
motionBeats:
  - startFrame: 0
    endFrame: 11
    description:
      id: motionAtlas.schema-column-evolution.motionBeats.0
      message: Reveal earlier rows.
  - startFrame: 12
    endFrame: 48
    description:
      id: motionAtlas.schema-column-evolution.motionBeats.1
      message: Unfold the added header from its seam.
  - startFrame: 49
    endFrame: 92
    description:
      id: motionAtlas.schema-column-evolution.motionBeats.2
      message: Mark historical values as not collected.
  - startFrame: 93
    endFrame: 132
    description:
      id: motionAtlas.schema-column-evolution.motionBeats.3
      message: Seat the supplied later record.
  - startFrame: 133
    endFrame: 167
    description:
      id: motionAtlas.schema-column-evolution.motionBeats.4
      message: Hold both generations.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.schema-column-evolution.motionBeats.5
      message: Shared opaque exit.
