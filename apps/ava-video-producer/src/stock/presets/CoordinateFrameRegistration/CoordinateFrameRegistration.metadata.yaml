name:
  id: motionAtlas.coordinate-frame-registration.name
  message: Transform coordinates before combining layers
description:
  id: motionAtlas.coordinate-frame-registration.description
  message:
    Two schematic layers describe the same landmarks using different coordinate
    frames. A supplied affine transformation moves one layer into the other frame so
    matching landmarks register without changing their identities.
category:
  id: motionAtlas.coordinate-frame-registration.category
  message: Coordinate reference transformation
useWhen:
  id: motionAtlas.coordinate-frame-registration.useWhen
  message: Align spatial coordinate frames without implying physical movement.
prompt:
  id: motionAtlas.coordinate-frame-registration.prompt
  message:
    React/SVG 960x600 canvas, shared palette, deterministic 180 frames at 30fps.
    This is schematic local geography with no real basemap. Frames 0-12 reveal. Frames
    13-52 show two labeled coordinate grids with corresponding landmarks offset. Frames
    53-110 transform every source point using the same affine coefficients while axes
    remain labeled. Frames 111-139 align matched IDs and show their target coordinates.
    Hold at frames 140-165; fade to the same opaque ground at frames 166-179 for an
    editorial loop.
creativeDirection:
  id: motionAtlas.coordinate-frame-registration.creativeDirection
  message:
    React/SVG 960x600 canvas, shared palette, deterministic 180 frames at 30fps.
