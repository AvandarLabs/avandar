intent:
  id: motionAtlas.coordinate-frame-registration.intent
  message: Align spatial coordinate frames without implying physical movement.
distinction:
  id: motionAtlas.coordinate-frame-registration.distinction
  message:
    Unlike GIS layer intersection, the action aligns coordinate systems before
    overlay. Identity is stable even though coordinate numbers change.
