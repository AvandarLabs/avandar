notFor:
  - id: motionAtlas.coordinate-frame-registration.notFor.0
    message:
      This is an affine teaching analogy, not a real geodetic projection or
      Earth-curvature calculation.
  - id: motionAtlas.coordinate-frame-registration.notFor.1
    message: No inference of the correct CRS or transform from point positions.
  - id: motionAtlas.coordinate-frame-registration.notFor.2
    message: Spatial transformation must not be confused with moving the physical landmarks.
  - id: motionAtlas.coordinate-frame-registration.notFor.3
    message:
      No live geography, online routing, JSX, functions, URLs, private records or
      external requests. Maps are schematic local plans; no real-world inference
      follows.
  - id: motionAtlas.coordinate-frame-registration.notFor.4
    message:
      Authored prose must identify schematic geography and accurately describe the
      selected example. Runtime validation preserves supplied prose and checks explicit
      structural and numeric rules without natural-language classification.
motionBeats:
  - startFrame: 0
    endFrame: 12
    description:
      id: motionAtlas.coordinate-frame-registration.beat.0
      message: Reveal the schematic study.
  - startFrame: 13
    endFrame: 52
    description:
      id: motionAtlas.coordinate-frame-registration.beat.1
      message: Show labeled source and target coordinate grids with corresponding landmarks.
  - startFrame: 53
    endFrame: 110
    description:
      id: motionAtlas.coordinate-frame-registration.beat.2
      message: Transform each source representation using the same affine coefficients.
  - startFrame: 111
    endFrame: 139
    description:
      id: motionAtlas.coordinate-frame-registration.beat.3
      message: Register matching identities and target coordinate pairs.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.coordinate-frame-registration.beat.4
      message: Hold both frame labels and units.
  - startFrame: 166
    endFrame: 179
    description:
      id: motionAtlas.coordinate-frame-registration.beat.5
      message: The enclosing StockGraphic returns to opaque ground.
