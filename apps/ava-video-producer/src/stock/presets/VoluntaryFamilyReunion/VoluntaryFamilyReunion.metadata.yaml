notFor:
  - id: motionAtlas.voluntary-family-reunion.notFor.0
    message: This portrays an already arranged fictional meeting, not tracing operations,
      identity verification, legal reunification, or safeguarding assessment.
  - id: motionAtlas.voluntary-family-reunion.notFor.1
    message: Group membership and silhouette counts come only from the supplied arrays and
      are illustrative, not statistics about displaced families.
  - id: motionAtlas.voluntary-family-reunion.notFor.2
    message: The setting has no geographic scale, real addresses, border crossings, or
      recommendations for travel.
  - id: motionAtlas.voluntary-family-reunion.notFor.3
