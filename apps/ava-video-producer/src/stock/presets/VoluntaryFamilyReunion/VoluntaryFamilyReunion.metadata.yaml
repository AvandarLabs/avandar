name:
  id: motionAtlas.voluntary-family-reunion.name
  message: Meet by mutual agreement
description:
  id: motionAtlas.voluntary-family-reunion.description
  message: Two fictional family groups independently accept an arranged meeting and travel
    toward a shared meeting place. The scene centers their decisions and reunion rather
    than surveillance or automatic identity matching.
category:
  id: motionAtlas.voluntary-family-reunion.category
  message: Human connection and movement
useWhen:
  id: motionAtlas.voluntary-family-reunion.useWhen
  message: Show a reunion as a mutually chosen meeting between people, not a system
    matching records.
intent:
  id: motionAtlas.voluntary-family-reunion.intent
  message: Show a reunion as a mutually chosen meeting between people, not a system
    matching records.
creativeDirection:
  id: motionAtlas.voluntary-family-reunion.creativeDirection
  message: Over six seconds, reveal the two groups on opposite sides of a schematic local
    setting, each holding their own invitation. Each group actively marks its invitation
    accepted; only after both marks appear do the groups begin walking toward the chosen
    meeting place. They arrive, turn toward each other, and make the configured greeting
    gesture without merging their silhouettes. Hold the gathering and the two accepted
    invitations, then fade with the standard opaque envelope.
distinction:
  id: motionAtlas.voluntary-family-reunion.distinction
  message: Two independent acts of agreement precede self-directed physical movement and a
    human greeting. Unlike source-merge, the people remain individuals; unlike
    schema-mapping, there is no inferred identity match.
prompt:
  id: motionAtlas.voluntary-family-reunion.prompt
  message: Meet by mutual agreement. Show a reunion as a mutually chosen meeting between
    people, not a system matching records.
