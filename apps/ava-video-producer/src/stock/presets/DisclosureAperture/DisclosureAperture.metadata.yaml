name:
  id: motionAtlas.disclosure-aperture.name
  message: Only the Chosen Fields Leave
description:
  id: motionAtlas.disclosure-aperture.description
  message:
    A local document stays intact behind a boundary while copies of explicitly
    selected fields pass through a narrow opening. Retained fields remain visible on the
    original sheet.
