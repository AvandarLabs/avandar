useWhen:
  id: motionAtlas.disclosure-aperture.useWhen
  message:
    Show that a handoff can carry a declared subset while the source remains local
    and complete.
prompt:
  id: motionAtlas.disclosure-aperture.prompt
  message:
    Use Motion Atlas "Only the Chosen Fields Leave" (disclosure-aperture) as an
    illustrative conceptual graphic. Show that a handoff can carry a declared subset
    while the source remains local and complete. Bind complete authored inputs and
    preserve the stated limits.
creativeDirection:
  id: motionAtlas.disclosure-aperture.creativeDirection
  message:
    Reveal one local document behind a tall boundary panel and an empty disclosure
    envelope outside it. Each authored share field briefly lifts as a duplicate while
    the original stays printed; a precisely sized aperture opens only opposite that
    field and lets its duplicate pass into the envelope. Retained fields never lift or
    leave. Close the aperture and hold the complete original beside the selected
    disclosure contents, then return to the opaque loop ground.
