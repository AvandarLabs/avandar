notFor:
  - id: motionAtlas.disclosure-aperture.notFor.0
    message:
      Shared quantity is the number of fields marked share. Retained quantity is the
      number marked retain. Neither is a percentage of an unshown larger dataset.
  - id: motionAtlas.disclosure-aperture.notFor.1
    message:
      All-retain and all-share inputs are valid but communicate no disclosure and
      complete disclosure respectively.
  - id: motionAtlas.disclosure-aperture.notFor.2
    message:
      The animation does not perform redaction, access control, privacy review, or
      secure transport. It shows only an authored policy for the depicted fields.
  - id: motionAtlas.disclosure-aperture.notFor.3
    message:
      A published summary field must already be approved and supplied. This preset
      neither computes safe aggregation nor proves anonymity, privacy, consent, or
      correct access control.
  - id: motionAtlas.disclosure-aperture.notFor.4
    message:
      Public visibility of selected fields does not grant access to the underlying
      records or establish a customer-acquisition result.
  - id: motionAtlas.disclosure-aperture.notFor.5
    message: Do not claim that clean detector output means the content is safe or anonymous.
  - id: motionAtlas.disclosure-aperture.notFor.6
    message:
      All-retain represents declining the transfer; selected fields may include
      sensitive values.
  - id: motionAtlas.disclosure-aperture.notFor.7
    message:
      Keeping file bytes local does not mean the remote system knows nothing about
      the dataset.
distinction:
  id: motionAtlas.disclosure-aperture.distinction
  message:
    Unlike schema-mapping, the purpose is to enforce an explicit disclosure subset
    rather than correspond fields between schemas. The opening and retained originals
    carry the meaning, rather than connectors or a funnel.
