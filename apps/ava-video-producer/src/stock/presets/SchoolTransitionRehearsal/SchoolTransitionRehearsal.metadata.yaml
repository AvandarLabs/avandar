name:
  id: motionAtlas.school-transition-rehearsal.name
  message: Rehearse the new school routine
description:
  id: motionAtlas.school-transition-rehearsal.description
  message: A learner practices a short routine in an unfamiliar school setting with a
    chosen companion. A supplied final step can be tried independently, while the scene
    remains explicitly a rehearsal.
category:
  id: motionAtlas.school-transition-rehearsal.category
  message: Supported rehearsal in a physical setting
useWhen:
  id: motionAtlas.school-transition-rehearsal.useWhen
  message: Show how a learner can practice an unfamiliar school routine before it becomes
    a daily expectation.
prompt:
  id: motionAtlas.school-transition-rehearsal.prompt
  message: Open on a learner and companion beside a simple interior containing a locker
    and a classroom doorway. The learner consults a two-step practice strip, opens the
    named locker, then approaches the named room. The companion either stays alongside
    or deliberately stands back for the final step, according to the supplied choice.
    Hold the learner at the final practice stop with the rehearsal label visible,
    without changing it to enrolled or attended.
creativeDirection:
  id: motionAtlas.school-transition-rehearsal.creativeDirection
  message: Open on a learner and companion beside a simple interior containing a locker
    and a classroom doorway. The learner consults a two-step practice strip, opens the
    named locker, then approaches the named room. The companion either stays alongside
    or deliberately stands back for the final step, according to the supplied choice.
    Hold the learner at the final practice stop with the rehearsal label visible,
    without changing it to enrolled or attended.
intent:
  id: motionAtlas.school-transition-rehearsal.intent
  message: Show how a learner can practice an unfamiliar school routine before it becomes
    a daily expectation.
distinction:
  id: motionAtlas.school-transition-rehearsal.distinction
  message: The learner rehearses concrete object use and a short routine while choosing
    the companion's role. Unlike returning-learner-worktable, no prior learning artifact
    is carried back into a lesson; unlike chosen-service-access, the scene does not
    remove an admission barrier or claim successful service uptake.
