    message: The authored measurement is an illustration, not evidence from a real project
      or an engineering assessment.
  - id: motionAtlas.public-works-measurement-check.notFor.1
    message: One length does not establish overall compliance, workmanship, accessibility or
      safety.
  - id: motionAtlas.public-works-measurement-check.notFor.2
