name:
  id: motionAtlas.public-works-measurement-check.name
  message: Measure the work against the promise
description:
  id: motionAtlas.public-works-measurement-check.description
  message: A community representative checks one supplied physical dimension of a
    public-work example against its published specification. A ruler exposes the
    authored difference without treating a visual inspection as a safety certification.
category:
  id: motionAtlas.public-works-measurement-check.category
  message: On-site measurement illustration
useWhen:
  id: motionAtlas.public-works-measurement-check.useWhen
  message: Make a public-work claim inspectable through one concrete measurement.
prompt:
  id: motionAtlas.public-works-measurement-check.prompt
  message: Show a published specification beside a simple built wall or handrail. Two
    community observers extend a measuring tape along the actual structure, keeping its
    endpoints attached. A lighter promised-length outline remains behind the measured
    object; the tape's end stops at the supplied observed value. Hold the signed
    difference, the measurement source label and the two lengths on one scale.
creativeDirection:
  id: motionAtlas.public-works-measurement-check.creativeDirection
  message: Show a published specification beside a simple built wall or handrail. Two
    community observers extend a measuring tape along the actual structure, keeping its
    endpoints attached. A lighter promised-length outline remains behind the measured
    object; the tape's end stops at the supplied observed value. Hold the signed
    difference, the measurement source label and the two lengths on one scale.
intent:
  id: motionAtlas.public-works-measurement-check.intent
  message: Make a public-work claim inspectable through one concrete measurement.
distinction:
  id: motionAtlas.public-works-measurement-check.distinction
  message: Observers physically stretch a tape along a built object while the promised
    outline remains on the same spatial scale. Unlike capability-matrix or
    paired-contrast, the evidence is a concrete dimension checked through a measuring
    action; unlike chart-focus-edit, a measurement is introduced rather than a chart
    restyled.
