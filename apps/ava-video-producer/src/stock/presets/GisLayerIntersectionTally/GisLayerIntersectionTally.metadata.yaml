name:
  id: motionAtlas.gis-layer-intersection-tally.name
  message: Count where the layers meet
description:
  id: motionAtlas.gis-layer-intersection-tally.description
  message:
    Two schematic geographic layers settle onto the same coordinate plane. Their
    intersection or difference isolates the supplied population records that satisfy the
    chosen spatial rule.
category:
  id: motionAtlas.gis-layer-intersection-tally.category
  message: geographic set operations
useWhen:
  id: motionAtlas.gis-layer-intersection-tally.useWhen
  message:
    Show how an explicit geometric rule selects records without establishing a
    causal relationship.
prompt:
  id: motionAtlas.gis-layer-intersection-tally.prompt
  message:
    Begin with offset translucent map sheets and stationary household markers.
    Register the sheets, hatch the resulting geometry, then lift only qualifying markers
    into a counting bracket while retaining their map positions. Hold the selected
    quantity over the full supplied denominator.
creativeDirection:
  id: motionAtlas.gis-layer-intersection-tally.creativeDirection
  message:
    Begin with offset translucent map sheets and stationary household markers.
    Register the sheets, hatch the resulting geometry, then lift only qualifying markers
    into a counting bracket while retaining their map positions. Hold the selected
    quantity over the full supplied denominator.
intent:
  id: motionAtlas.gis-layer-intersection-tally.intent
  message:
    Show how an explicit geometric rule selects records without establishing a
    causal relationship.
distinction:
  id: motionAtlas.gis-layer-intersection-tally.distinction
  message:
    The hero transformation registers two geometric sheets and computes a spatial
    set before tallying records. It is neither field correspondence, a scope aperture, a
    cloud observation mask, nor a routing animation.
