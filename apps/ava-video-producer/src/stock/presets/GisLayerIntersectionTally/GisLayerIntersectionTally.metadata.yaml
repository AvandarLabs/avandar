      epidemiological evidence.
  - id: motionAtlas.gis-layer-intersection-tally.notFor.1
    message:
      Only supplied point locations are classified; household members share that
      location by explicit input convention.
  - id: motionAtlas.gis-layer-intersection-tally.notFor.2
    message:
