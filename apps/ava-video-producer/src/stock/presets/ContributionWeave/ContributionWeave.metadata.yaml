    description:
      id: motionAtlas.contribution-weave.motionBeats.1
      message: Each horizontal shuttle crosses once in array order.
  - startFrame: 108
    endFrame: 166
    description:
      id: motionAtlas.contribution-weave.motionBeats.2
      message: Hold alternating crossings with traceable contributor ends.
