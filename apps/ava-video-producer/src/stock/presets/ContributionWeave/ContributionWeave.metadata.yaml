    message: Interlocking contributions
notFor:
  - id: motionAtlas.contribution-weave.notFor.0
    message: Band count is the exact number of supplied contributions. Equal band width is
      decorative and does not represent equal effort, value, ownership, or impact.
  - id: motionAtlas.contribution-weave.notFor.1
    message: Over-under order is a weave construction, not a ranking of contributors or a
      chronology of all real work.
  - id: motionAtlas.contribution-weave.notFor.2
    message: The scene is not a dependency graph or proof of conflict-free collaborative
      editing. Suppressing contributor ends reduces attribution clarity.
  - id: motionAtlas.contribution-weave.notFor.3
    message: The weave is a relationship metaphor. Thread widths and crossings do not
      quantify labor, ownership, compensation or social impact.
motionBeats:
