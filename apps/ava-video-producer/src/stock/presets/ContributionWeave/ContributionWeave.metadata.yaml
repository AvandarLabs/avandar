name:
  id: motionAtlas.contribution-weave.name
  message: Distinct Work, Shared Fabric
description:
  id: motionAtlas.contribution-weave.description
  message: Named contributions become a woven surface while keeping their own visible
    thread patterns. Their interdependence is shown by alternating over-and-under
    crossings rather than convergence into a hub.
category:
  id: motionAtlas.contribution-weave.category
  message: Interlocking contributions
useWhen:
  id: motionAtlas.contribution-weave.useWhen
  message: Show that a shared result depends on distinct contributions that remain identifiable.
prompt:
  id: motionAtlas.contribution-weave.prompt
  message: Show that a shared result depends on distinct contributions that remain identifiable.
creativeDirection:
  id: motionAtlas.contribution-weave.creativeDirection
  message: Reveal a small loom frame with two or three vertical bands and the same bounded
    set of horizontal shuttles. Tension the vertical contributions first; sweep each
    horizontal shuttle once through an alternating over-under mask so the crossing
    pattern visibly locks together. Keep a short labeled end of every contributor's band
    outside the frame. Hold the finished fabric with all identities still traceable,
    then fade the complete textile within the six-second envelope.
intent:
  id: motionAtlas.contribution-weave.intent
  message: Show that a shared result depends on distinct contributions that remain identifiable.
distinction:
  id: motionAtlas.contribution-weave.distinction
  message: Source-merge collapses inputs toward a destination. This creates alternating
    physical interlocks, preserves every contribution through the finished structure,
    and uses neither nodes nor connecting paths.
