notFor:
  - id: motionAtlas.cold-chain-custody.notFor.0
    message: One container glyph represents one shipping container, never one dose or one
      vaccinated person. Container count is crates.length and remains constant
      throughout all handoffs.
  - id: motionAtlas.cold-chain-custody.notFor.1
    message: Every crate has exactly one checkpoint per stop. Monitoring categories are
      authored records, not temperature calculations, clinical clearance, or evidence of
      potency.
  - id: motionAtlas.cold-chain-custody.notFor.2
    message: The globe provides general world context only. The route and local map are
      fictional, have no real coordinates or borders, and must carry the configured
      schematic caption.
  - id: motionAtlas.cold-chain-custody.notFor.3
    message: No temperatures, thresholds, vaccine recommendations, handling instructions, or
      real delivery speed are inferred. All delivery motion is editorial compression.
  - id: motionAtlas.cold-chain-custody.notFor.4
    message: A receipt acknowledgement proves only the authored administrative event, not
      specimen suitability, test completion, a result, or diagnostic validity.
  - id: motionAtlas.cold-chain-custody.notFor.5
    message: Transport and packaging are stylized props. This animation gives no clinical
      collection, biosafety, shipping, storage, or chain-of-custody compliance
      instructions.
  - id: motionAtlas.cold-chain-custody.notFor.6
    message: The example has one linear custody sequence and cannot depict pooled specimens,
      aliquots, split ownership, or bulk shipment counts.
  - id: motionAtlas.cold-chain-custody.notFor.7
    message: The legend treats monitoring, custody acknowledgement and seal records as
      distinct. None establishes temperature compliance, specimen validity or clinical
      safety without supplied evidence.
