name:
  id: motionAtlas.cold-chain-custody.name
  message: Track monitored custody
description:
  id: motionAtlas.cold-chain-custody.description
  message: The same vaccine carrier or specimen container passes through authored custody
    stops. Identity, seal state, monitoring records and acknowledgements stay visible
    and distinct throughout the handoffs.
category:
  id: motionAtlas.cold-chain-custody.category
  message: Physical logistics and custody
useWhen:
  id: motionAtlas.cold-chain-custody.useWhen
  message: Show that arriving at the destination does not by itself establish a complete
    condition record.
intent:
  id: motionAtlas.cold-chain-custody.intent
  message: Show that arriving at the destination does not by itself establish a complete
    condition record.
creativeDirection:
  id: motionAtlas.cold-chain-custody.creativeDirection
  message: Establish one to five labeled containers and their persistent identity ribbons.
    Between frames 36..115 carry each container through three custody stops; attach a
    seal marker, monitoring tab and acknowledgement stub at each stop, keeping missing
    records visibly open. The same identifier stays attached through every handoff. Hold
    the received containers beside a checkpoint ledger at frames 116..167 before the
    common exit. A small globe is optional context; the local route is always schematic.
distinction:
  id: motionAtlas.cold-chain-custody.distinction
  message: Merges cold-chain monitoring and specimen identity tracking. Unlike the generic
    custody-transfer gate, this preserves a multi-stop identity/record ledger and may
    show missing evidence after physical receipt.
prompt:
  id: motionAtlas.cold-chain-custody.prompt
  message: Use Track monitored custody (cold-chain-custody) for a fictional or approved
    authored example. Show that arriving at the destination does not by itself establish
    a complete condition record.
