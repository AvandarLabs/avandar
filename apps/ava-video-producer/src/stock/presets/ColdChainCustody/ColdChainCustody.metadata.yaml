        Between frames 36..115 carry each container through three custody stops; attach
        a seal marker, monitoring tab and acknowledgement stub at each stop, keeping
        missing records visibly open. The same identifier stays attached through every
        handoff. Hold the received containers beside a checkpoint ledger at frames
