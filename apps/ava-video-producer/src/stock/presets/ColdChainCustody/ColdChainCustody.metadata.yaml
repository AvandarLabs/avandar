goodFor:
  - id: motionAtlas.cold-chain-custody.goodFor.0
    message: Explain why a shipment needs both custody and condition records.
  - id: motionAtlas.cold-chain-custody.goodFor.1
    message: Introduce a fictional vaccine distribution story before showing sourced
      operational evidence.
  - id: motionAtlas.cold-chain-custody.goodFor.2
    message: Distinguish containers delivered from containers with complete monitoring records.
  - id: motionAtlas.cold-chain-custody.goodFor.3
    message: Introduce specimen traceability without depicting a test result.
  - id: motionAtlas.cold-chain-custody.goodFor.4
    message: Explain a missing custody acknowledgement despite physical receipt.
  - id: motionAtlas.cold-chain-custody.goodFor.5
    message: Distinguish the specimen's identity from its transport packaging.
