notFor:
  - id: motionAtlas.effective-permission-grants.notFor.0
    message:
      Bounded grant composition only. Owner/admin short circuits, public publication
      and extra row-selection policies are outside this simplified algorithm.
  - id: motionAtlas.effective-permission-grants.notFor.1
    message: No permissions are actually granted by this graphic.
  - id: motionAtlas.effective-permission-grants.notFor.2
    message:
      No real product screen, external fetch, supplied code execution, or measured
      performance claim. All text is authored; no JSX, functions or URLs in props.
  - id: motionAtlas.effective-permission-grants.notFor.3
    message:
      This simplified grant calculation excludes independent read-visibility
      policies. Do not infer every operation from one effective-role result.
  - id: motionAtlas.effective-permission-grants.notFor.4
    message:
      Supplied prose is preserved. Fictional framing, evidence and agreement between
      wording and selected states are authoring responsibilities. Runtime validation
      enforces structural bounds and explicit cross-field rules.
motionBeats:
  - startFrame: 13
    endFrame: 52
    description:
      id: motionAtlas.effective-permission-grants.motionBeats.0
      message: Place each candidate on its authored role rank.
  - startFrame: 53
    endFrame: 100
    description:
      id: motionAtlas.effective-permission-grants.motionBeats.1
      message: Close ineligible and restricted app-default gates.
  - startFrame: 101
    endFrame: 139
    description:
      id: motionAtlas.effective-permission-grants.motionBeats.2
      message: Raise the maximum surviving role and compare its requirement.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.effective-permission-grants.motionBeats.3
      message: Hold the resolved relationship.
