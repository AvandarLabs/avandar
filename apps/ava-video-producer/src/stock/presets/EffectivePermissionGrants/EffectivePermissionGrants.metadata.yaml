name:
  id: motionAtlas.effective-permission-grants.name
  message: Combine the grants that actually apply
description:
  id: motionAtlas.effective-permission-grants.description
  message:
    Candidate grants line up on a role ladder. Ineligible grants fold away and the
    highest remaining role determines access; a restricted resource removes the default
    app grant without removing explicit shares.
category:
  id: motionAtlas.effective-permission-grants.category
  message: Permission composition
useWhen:
  id: motionAtlas.effective-permission-grants.useWhen
  message: Resolve eligible grants and compare the result with an action requirement.
prompt:
  id: motionAtlas.effective-permission-grants.prompt
  message: Resolve eligible grants and compare the result with an action requirement.
creativeDirection:
  id: motionAtlas.effective-permission-grants.creativeDirection
  message:
    960x600 React/SVG, shared palette, deterministic 180 frames at 30fps. Frames
    0-12 reveal the scene. Frames 13-52 place each candidate on the none/view/edit/admin
    ladder. Frames 53-100 close gates for disabled conditions and for the app default
    when restriction applies. Frames 101-139 raise a result marker to the maximum
    eligible rank or leave it at none, then compare that marker visibly against a
    separate required-role notch to resolve allowed or denied. Hold the resolved meaning
    during frames 140-165. Frames 166-179 return to the same opaque ground for a
    six-second loop; reset is editorial.
intent:
  id: motionAtlas.effective-permission-grants.intent
  message: Resolve eligible grants and compare the result with an action requirement.
distinction:
  id: motionAtlas.effective-permission-grants.distinction
  message:
    Unlike capability-matrix, this computes a maximum over eligible grants and
    explains why a candidate is excluded. It is neither first-match precedence nor a
    blanket role inheritance ladder.
