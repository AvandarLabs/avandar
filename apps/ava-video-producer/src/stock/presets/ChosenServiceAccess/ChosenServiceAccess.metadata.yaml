notFor:
  - id: motionAtlas.chosen-service-access.notFor.0
    message: The ramp and entrance are conceptual silhouettes, not dimensional design
      guidance or a certification of accessibility.
  - id: motionAtlas.chosen-service-access.notFor.1
    message: Removing one depicted physical barrier does not imply that language,
      eligibility, safety, affordability, or other barriers have been resolved.
  - id: motionAtlas.chosen-service-access.notFor.2
    message: Entry into a shelter desk does not imply a shelter placement, admission
      entitlement, or guaranteed housing.
  - id: motionAtlas.chosen-service-access.notFor.3
    message: The scene shows one fictional participant; it makes no population-level access
      or impact claim.
