name:
  id: motionAtlas.chosen-service-access.name
  message: Open the service someone chooses
description:
  id: motionAtlas.chosen-service-access.description
  message: A participant chooses a named community service and an access barrier is
    visibly addressed at its entrance. The person then approaches and enters by the
    accessible path shown in the example.
category:
  id: motionAtlas.chosen-service-access.category
  message: Access and participation
useWhen:
  id: motionAtlas.chosen-service-access.useWhen
  message: Show that a service becomes usable when a person can choose it and physically
    reach its entrance.
intent:
  id: motionAtlas.chosen-service-access.intent
  message: Show that a service becomes usable when a person can choose it and physically
    reach its entrance.
creativeDirection:
  id: motionAtlas.chosen-service-access.creativeDirection
  message: Within six seconds, reveal two or three modest service entrances and a
    participant considering their labels. The participant points to the configured
    choice. At that entrance, either unfold a ramp over the step or roll a physical
    obstruction clear, according to the supplied access change; the staff member holds
    the door while the participant moves under their own power through it. Keep the
    other service options visible, hold the selected doorway and cleared path, then
    apply the shared opaque exit fade.
distinction:
  id: motionAtlas.chosen-service-access.distinction
  message: The central transformation changes physical access to a doorway, followed by
    participant-directed entry. It is not node-traversal, a generic status transition,
    or merely labels arriving on cards.
prompt:
  id: motionAtlas.chosen-service-access.prompt
  message: Open the service someone chooses. Show that a service becomes usable when a
    person can choose it and physically reach its entrance.
