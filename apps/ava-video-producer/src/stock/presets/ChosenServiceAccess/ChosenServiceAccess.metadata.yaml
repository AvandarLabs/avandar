    description:
      id: motionAtlas.chosen-service-access.motionBeats.3
      message: Hold the usable chosen path with all other options visible.
  - startFrame: 168
    endFrame: 179
    description:
      id: motionAtlas.chosen-service-access.motionBeats.4
      message: Return to the opaque ground through the shared envelope.
