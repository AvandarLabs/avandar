name:
  id: motionAtlas.dashboard-slot-assembly.name
  message: Assemble a dashboard
description:
  id: motionAtlas.dashboard-slot-assembly.description
  message: Loose information panels reshape and dock into a deliberately composed
    dashboard. The motion explains how a chosen layout gives several views a shared
    reading order.
category:
  id: motionAtlas.dashboard-slot-assembly.category
  message: Spatial composition
useWhen:
  id: motionAtlas.dashboard-slot-assembly.useWhen
  message: Show that arranging information changes how easily its parts can be read together.
prompt:
  id: motionAtlas.dashboard-slot-assembly.prompt
  message: Show that arranging information changes how easily its parts can be read together.
creativeDirection:
  id: motionAtlas.dashboard-slot-assembly.creativeDirection
  message: Frames 12-40 establish the supplied widgets as differently sized panels and an
    empty dashboard outline. During frames 40-112, a featured panel docks first, grid
    guides extend from its edges, and the remaining panels resize into the available
    slots while their text keeps a fixed font size. A shared scope strip settles across
    the board, guides withdraw, and the completed composition holds through frame 166
    before the opaque exit.
intent:
  id: motionAtlas.dashboard-slot-assembly.intent
  message: Show that arranging information changes how easily its parts can be read together.
distinction:
  id: motionAtlas.dashboard-slot-assembly.distinction
  message: "Unlike stagger-cards, the hero action is constrained layout assembly: unequal
    panels change geometry, establish alignment, and acquire a shared context. The
    content is already visible before docking."
