aliases:
  - id: motionAtlas.dashboard-slot-assembly.aliases.0
    message: Spatial composition
notFor:
  - id: motionAtlas.dashboard-slot-assembly.notFor.0
    message: All default content is fictional.
  - id: motionAtlas.dashboard-slot-assembly.notFor.1
    message: Panel size expresses authored editorial priority, never numeric magnitude.
  - id: motionAtlas.dashboard-slot-assembly.notFor.2
    message: Value strings are supplied labels rather than counters or calculated metrics.
  - id: motionAtlas.dashboard-slot-assembly.notFor.3
    message: This is a conceptual board builder, not a recording of a supported product feature.
  - id: motionAtlas.dashboard-slot-assembly.notFor.4
    message: Layout assembly does not imply that queries, source data or permissions have
      been independently verified.
motionBeats:
  - startFrame: 12
    endFrame: 40
    description:
      id: motionAtlas.dashboard-slot-assembly.motionBeats.0
      message: Reveal differently sized panels and empty board.
  - startFrame: 40
    endFrame: 64
    description:
      id: motionAtlas.dashboard-slot-assembly.motionBeats.1
      message: Dock the featured panel while supporting panels resize and stage clear of it.
  - startFrame: 64
    endFrame: 112
    description:
      id: motionAtlas.dashboard-slot-assembly.motionBeats.2
      message: Dock supporting panels in staggered order with fixed-size text.
  - startFrame: 112
    endFrame: 130
    description:
      id: motionAtlas.dashboard-slot-assembly.motionBeats.3
      message: Settle shared context and withdraw alignment guides.
  - startFrame: 130
    endFrame: 166
    description:
      id: motionAtlas.dashboard-slot-assembly.motionBeats.4
      message: Hold the completed dashboard.
