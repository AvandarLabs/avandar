goodFor:
  - id: motionAtlas.dashboard-slot-assembly.goodFor.0
    message: Introduce building a dashboard from reusable views
  - id: motionAtlas.dashboard-slot-assembly.goodFor.1
    message: Explain a featured insight with supporting context
  - id: motionAtlas.dashboard-slot-assembly.goodFor.2
    message: Bridge separate analyses into a shared overview
  - id: motionAtlas.dashboard-slot-assembly.goodFor.3
    message: Explain saving an analysis view into a dashboard
  - id: motionAtlas.dashboard-slot-assembly.goodFor.4
