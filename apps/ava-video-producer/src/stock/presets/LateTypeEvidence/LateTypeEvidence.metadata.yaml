notFor:
  - id: motionAtlas.late-type-evidence.notFor.0
    message: The widening rule is illustrative, not a claim that all import engines infer
      types this way.
  - id: motionAtlas.late-type-evidence.notFor.1
    message: Text preservation does not make the column ready for numeric aggregation.
  - id: motionAtlas.late-type-evidence.notFor.2
    message: One column and one contradictory value are shown; general type lattices and
      date inference are outside scope.
  - id: motionAtlas.late-type-evidence.notFor.3
    message: No external requests, URLs, JSX or functions in props. Supplied examples are
      fictional.
  - id: motionAtlas.late-type-evidence.notFor.4
    message: Authored prose remains the author’s responsibility. Runtime validation
      preserves supplied text without classifying its language or factual claims.
motionBeats:
  - startFrame: 0
