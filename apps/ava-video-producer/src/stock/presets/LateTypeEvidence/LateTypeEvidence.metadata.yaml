name:
  id: motionAtlas.late-type-evidence.name
  message: Keep the late value that changes the column
description:
  id: motionAtlas.late-type-evidence.description
  message: A column initially appears numeric. A later text value widens the proposed type
    to text while every original cell stays intact, showing why a short initial sample
    must not silently discard contrary evidence.
category:
  id: motionAtlas.late-type-evidence.category
  message: Schema inference and evidence
useWhen:
  id: motionAtlas.late-type-evidence.useWhen
  message: Preserve contrary late evidence during column-type inference.
prompt:
  id: motionAtlas.late-type-evidence.prompt
  message: 960x600 React/SVG with shared palette, deterministic 180 frames at 30fps.
    Reveal at frames 0-12. Frames 13-55 reveal the initial numeric-looking rows under a
    provisional numeric type label. Frames 56-100 append the authored text row and open
    a type-review bracket. Frames 101-139 widen the column type to text or hold the
    import for review according to policy, preserving all input values. Hold the
    resolved state at 140-165; fade to the same opaque ground at 166-179. Reset is
    editorial.
creativeDirection:
  id: motionAtlas.late-type-evidence.creativeDirection
  message: 960x600 React/SVG with shared palette, deterministic 180 frames at 30fps.
    Reveal at frames 0-12. Frames 13-55 reveal the initial numeric-looking rows under a
    provisional numeric type label. Frames 56-100 append the authored text row and open
    a type-review bracket. Frames 101-139 widen the column type to text or hold the
    import for review according to policy, preserving all input values. Hold the
    resolved state at 140-165; fade to the same opaque ground at 166-179. Reset is
    editorial.
intent:
  id: motionAtlas.late-type-evidence.intent
  message: Preserve contrary late evidence during column-type inference.
distinction:
  id: motionAtlas.late-type-evidence.distinction
  message: Cell-normalization edits explicitly supplied characters. This changes a
    proposed column type in response to late evidence while refusing to change or
    discard any cell.
