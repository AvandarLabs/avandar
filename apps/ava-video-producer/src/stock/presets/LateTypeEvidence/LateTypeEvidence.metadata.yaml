  - startFrame: 101
    endFrame: 139
    description:
      id: motionAtlas.late-type-evidence.beat.3
      message: Widen to text or hold for review without changing cells.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.late-type-evidence.beat.4
      message: Hold the resolved study.
  - startFrame: 166
    endFrame: 179
    description:
      id: motionAtlas.late-type-evidence.beat.5
      message: The enclosing StockGraphic fades to opaque ground.
