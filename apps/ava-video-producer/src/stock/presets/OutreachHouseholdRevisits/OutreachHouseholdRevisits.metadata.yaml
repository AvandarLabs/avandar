name:
  id: motionAtlas.outreach-household-revisits.name
  message: Visits are not unique reach
description:
  id: motionAtlas.outreach-household-revisits.description
  message: An outreach worker walks a schematic neighborhood, visiting some homes more
    than once. A repeated visit adds to the activity count while the unique-household
    count stays unchanged.
category:
  id: motionAtlas.outreach-household-revisits.category
  message: Schematic neighborhood activity
useWhen:
  id: motionAtlas.outreach-household-revisits.useWhen
  message: Separate repeated outreach activity from the number of distinct households
    actually contacted.
intent:
  id: motionAtlas.outreach-household-revisits.intent
  message: Separate repeated outreach activity from the number of distinct households
    actually contacted.
creativeDirection:
  id: motionAtlas.outreach-household-revisits.creativeDirection
  message: Reveal the supplied homes on a schematic neighborhood map. Move a worker
    through the authored visit sequence and leave event stamps at each stop. On repeat
    visits, add an activity stamp without changing the household's unique-reach outline.
    Hold contacted, not-contacted and unvisited households beside distinct event and
    unique-contact totals before fading.
distinction:
  id: motionAtlas.outreach-household-revisits.distinction
  message: Unlike node-traversal or dot-matrix, revisiting the same physical home
    deliberately increments one measure without incrementing another, making
    event-versus-entity semantics the central animation.
prompt:
  id: motionAtlas.outreach-household-revisits.prompt
  message: Use Visits are not unique reach (outreach-household-revisits) for a fictional
    or approved authored example. Separate repeated outreach activity from the number of
    distinct households actually contacted.
