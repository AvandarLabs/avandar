notFor:
  - id: motionAtlas.outreach-household-revisits.notFor.0
    message: The denominator is households.length and represents households, never residents
      or eligible people. Each home glyph is one household, independent of drawn house
      size.
  - id: motionAtlas.outreach-household-revisits.notFor.1
    message: Total visits is visits.length. Unique visited households is the distinct
      householdId count; unique contacted households is the distinct householdId count
      among visits marked contacted. These nested measures must not be added together.
  - id: motionAtlas.outreach-household-revisits.notFor.2
    message: Each household's final exclusive state is contacted if any visit made contact,
      visited-no-contact if visited but never contacted, or unvisited. These three state
      counts sum to the household denominator.
  - id: motionAtlas.outreach-household-revisits.notFor.3
    message: The local map is invented, normalized, and not georeferenced. Contact means
      only the supplied outreach encounter, not consent, service receipt, vaccination,
      health impact, or complete community coverage.
