    description:
      id: motionAtlas.fraction-material-translation.motionBeats.0
      message: Reveal one learner and surface per chosen material, facing the shared prompt.
  - startFrame: 36
    endFrame: 83
    description:
      id: motionAtlas.fraction-material-translation.motionBeats.1
      message:
        Fold equal paper parts, gather equal counters and shade equal board cells using
        the same fraction.
  - startFrame: 84
    endFrame: 125
    description:
      id: motionAtlas.fraction-material-translation.motionBeats.2
      message:
        Briefly align selected part rows and move only the work surfaces into the
        supplied comparison arrangement.
  - startFrame: 126
    endFrame: 179
    description:
      id: motionAtlas.fraction-material-translation.motionBeats.3
      message:
        Hold distinct learners, materials and the common fraction through the shared
        fade.
