    equal parts, counters gather into equal units, and shaded-board cells select their
    authored fraction. Every representation selects the same numerator out of the same
    denominator. Briefly align corresponding selected parts without merging or ranking
    learners. Hold the supplied representations and common fraction, then use the shared
    fade."
intent:
  id: motionAtlas.fraction-material-translation.intent
  message:
    Show that one mathematical idea can be expressed through different physical
    representations.
distinction:
  id: motionAtlas.fraction-material-translation.distinction
  message:
    Each material undergoes a different physical operation that preserves an exact
    mathematical relationship. This is neither relabeled comparison cards nor a
    branching workflow that sorts learners into fixed ability tracks.
