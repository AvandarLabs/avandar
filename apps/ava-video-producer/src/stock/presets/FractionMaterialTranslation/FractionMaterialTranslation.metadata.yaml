notFor:
  - id: motionAtlas.fraction-material-translation.notFor.0
    message:
      Numerator means selected equal parts and denominator means all equal parts of
      that representation. The default is 1 of 2 in each material, not 3 of 6 learners.
  - id: motionAtlas.fraction-material-translation.notFor.1
    message: Counter groups and board partitions are generated from the fraction
      denominator. No independent part-count input can contradict it.
  - id: motionAtlas.fraction-material-translation.notFor.2
    message:
      Representation choices do not diagnose learning styles or prove superior
      learning outcomes. The sequence does not rank learners.
  - id: motionAtlas.fraction-material-translation.notFor.3
    message:
      This bounded preset explains fractions only. Every example classroom, learner,
      and lesson is fictional.
motionBeats:
  - startFrame: 0
