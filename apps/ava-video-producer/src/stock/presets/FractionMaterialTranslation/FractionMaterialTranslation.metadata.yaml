name:
  id: motionAtlas.fraction-material-translation.name
  message: One fraction, several ways to show it
description:
  id: motionAtlas.fraction-material-translation.description
  message:
    Learners demonstrate the same fictional lesson using folded paper, counters,
    and a shaded board. The objects change while the mathematical relationship stays
    constant.
category:
  id: motionAtlas.fraction-material-translation.category
  message: Learning materials transform
useWhen:
  id: motionAtlas.fraction-material-translation.useWhen
  message:
    Show that one mathematical idea can be expressed through different physical
    representations.
prompt:
  id: motionAtlas.fraction-material-translation.prompt
  message:
    "Reveal one learner and work surface per supplied representation facing a
    shared fraction prompt. Animate only the chosen materials: folded paper divides into
    equal parts, counters gather into equal units, and shaded-board cells select their
    authored fraction. Every representation selects the same numerator out of the same
    denominator. Briefly align corresponding selected parts without merging or ranking
    learners. Hold the supplied representations and common fraction, then use the shared
    fade."
creativeDirection:
  id: motionAtlas.fraction-material-translation.creativeDirection
  message:
    "Reveal one learner and work surface per supplied representation facing a
