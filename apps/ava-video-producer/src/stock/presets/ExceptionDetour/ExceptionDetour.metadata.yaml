name:
  id: motionAtlas.exception-detour.name
  message: The rule and its exception
description:
  id: motionAtlas.exception-detour.description
  message: A standard path meets a clearly labeled rule gate, while one named exception
    opens a separate route. The two outcomes stay distinct so the exception never
    silently changes the general rule.
category:
  id: motionAtlas.exception-detour.category
  message: Conditional reasoning
useWhen:
  id: motionAtlas.exception-detour.useWhen
  message: State a general rule while making a specific exception explicit.
prompt:
  id: motionAtlas.exception-detour.prompt
  message: Use Motion Atlas "The rule and its exception" (exception-detour) as a
    conceptual graphic. State a general rule while making a specific exception explicit.
    Replace fictional sample content with approved authored content before making
    product claims.
creativeDirection:
  id: motionAtlas.exception-detour.creativeDirection
  message: The standard rule and straight destination appear first. A single labeled case
    approaches the gate, pauses as its exception condition opens a side latch, and
    follows a curved detour to the exception outcome. The standard path remains intact
    and visible throughout. The final hold brackets the case, condition, and special
    outcome before the shared exit.
intent:
  id: motionAtlas.exception-detour.intent
  message: State a general rule while making a specific exception explicit.
distinction:
  id: motionAtlas.exception-detour.distinction
  message: The semantic structure is a standing rule plus a visibly gated exception, not
    an unqualified pipeline or an arbitrary network path. Only the exceptional case
    moves.
