name:
  id: motionAtlas.expiring-lease.name
  message: Borrowed Permission Returns
description:
  id: motionAtlas.expiring-lease.description
  message: A single permission token temporarily occupies one participant's socket while
    its authored lifetime runs down. When the lease ends, the token returns to neutral
    custody before another participant can hold it.
category:
  id: motionAtlas.expiring-lease.category
  message: Temporary ownership
useWhen:
  id: motionAtlas.expiring-lease.useWhen
  message: Explain that temporary permission can end without transferring directly to
    another holder.
prompt:
  id: motionAtlas.expiring-lease.prompt
  message: Explain that temporary permission can end without transferring directly to
    another holder.
creativeDirection:
  id: motionAtlas.expiring-lease.creativeDirection
  message: Reveal a neutral permission dock and a short arc of participant sockets. Seat
    the one token in the chosen holder's socket while all other sockets remain empty. A
    finite segmented collar around that socket drains in evenly spaced editorial beats;
    when it empties, the socket opens and the token retracts to the neutral dock. Hold
    the unassigned token and the prior holder's empty socket, making expiration
    different from a direct handoff, then fade to the opaque ground.
intent:
  id: motionAtlas.expiring-lease.intent
  message: Explain that temporary permission can end without transferring directly to
    another holder.
distinction:
  id: motionAtlas.expiring-lease.distinction
  message: Custody-transfer moves responsibility after acceptance. This permission expires
    and returns to neutral custody with no successor, while a physically exclusive token
    makes its temporary nature visible. It is not an orbital ecosystem or a generic
    status cycle.
tags:
  - id: motionAtlas.expiring-lease.tags.0
    message: lease
  - id: motionAtlas.expiring-lease.tags.1
