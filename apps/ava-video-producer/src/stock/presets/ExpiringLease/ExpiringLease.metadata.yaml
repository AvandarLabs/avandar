    message: return to pool
goodFor:
  - id: motionAtlas.expiring-lease.goodFor.0
    message: Explain a temporary edit lease
  - id: motionAtlas.expiring-lease.goodFor.1
    message: Illustrate a shared resource checked out for a limited period
  - id: motionAtlas.expiring-lease.goodFor.2
    message: Show permission returning to a pool after an authored expiry
domains:
  - id: motionAtlas.expiring-lease.domains.0
    message: Editorial explanation
aliases:
  - id: motionAtlas.expiring-lease.aliases.0
    message: Temporary ownership
notFor:
  - id: motionAtlas.expiring-lease.notFor.0
    message: There is always exactly one permission token. Socket count comes only from
      participants, and collar segment count comes only from lifetime.value.
  - id: motionAtlas.expiring-lease.notFor.1
    message: The six-second loop compresses the supplied lifetime and must not be
      interpreted as actual elapsed time or server-clock behavior.
  - id: motionAtlas.expiring-lease.notFor.2
    message: This illustrates an authored lease concept, not a verified distributed lock,
      fairness guarantee, race-condition solution, or automatic permission policy.
motionBeats:
  - startFrame: 12
    endFrame: 36
    description:
      id: motionAtlas.expiring-lease.motionBeats.0
      message: Reveal the one held token and neutral dock.
  - startFrame: 36
    endFrame: 108
    description:
      id: motionAtlas.expiring-lease.motionBeats.1
      message: Drain one collar segment per evenly spaced authored beat.
  - startFrame: 108
    endFrame: 136
    description:
      id: motionAtlas.expiring-lease.motionBeats.2
      message: Release the expired socket and retract the token to neutral custody.
  - startFrame: 136
    endFrame: 166
    description:
      id: motionAtlas.expiring-lease.motionBeats.3
      message: Hold the unassigned token and empty previous socket.
