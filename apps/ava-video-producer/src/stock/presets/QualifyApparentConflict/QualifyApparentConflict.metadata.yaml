notFor:
  - id: motionAtlas.qualify-apparent-conflict.notFor.0
    message: The author must provide a valid contextual reconciliation; the renderer cannot
      establish that both claims are true.
  - id: motionAtlas.qualify-apparent-conflict.notFor.1
    message: Exactly two claims are shown, each with one context.
  - id: motionAtlas.qualify-apparent-conflict.notFor.2
    message: The graphic must not be used to hide a genuine unresolved contradiction behind
      decorative separation.
  - id: motionAtlas.qualify-apparent-conflict.notFor.3
    message: Show only supplied policy statements and their distinct objects. The animation
      does not interpret licenses, determine ownership, confer rights, or prove that any
      legal position is correct.
  - id: motionAtlas.qualify-apparent-conflict.notFor.4
    message: A low price, paid plan, or free offer by itself proves neither high nor low
      technical quality.
  - id: motionAtlas.qualify-apparent-conflict.notFor.5
    message: Separate time contexts explain how the authored statements can coexist. They do
      not establish a measured speed improvement or a guarantee of emergency
      performance.
