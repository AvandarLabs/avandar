name:
  id: motionAtlas.qualify-apparent-conflict.name
  message: Both can be true
description:
  id: motionAtlas.qualify-apparent-conflict.description
  message: Two apparently conflicting statements first face each other, then separate into
    explicit contexts that explain how both can apply. The qualifier is supplied by the
    author and stays visible in the final arrangement.
category:
  id: motionAtlas.qualify-apparent-conflict.category
  message: Tradeoffs and qualifications
useWhen:
  id: motionAtlas.qualify-apparent-conflict.useWhen
  message: Explain how two statements can coexist when their contexts differ.
prompt:
  id: motionAtlas.qualify-apparent-conflict.prompt
  message: Use Motion Atlas "Both can be true" (qualify-apparent-conflict) as a conceptual
    graphic. Explain how two statements can coexist when their contexts differ. Replace
    fictional sample content with approved authored content before making product
    claims.
creativeDirection:
  id: motionAtlas.qualify-apparent-conflict.creativeDirection
  message: Two short claims enter on opposing horizontal tracks and stop at a central
    question mark. A context divider unfolds vertically, moving each claim to its own
    labeled region. The question mark resolves into a small joining brace with the
    authored qualifier below it. Both context-claim pairs hold together before the
    shared fade, without rewriting either claim.
intent:
  id: motionAtlas.qualify-apparent-conflict.intent
  message: Explain how two statements can coexist when their contexts differ.
distinction:
  id: motionAtlas.qualify-apparent-conflict.distinction
  message: Unlike paired-contrast, this begins with apparent incompatibility and resolves
    it by revealing distinct scopes of truth. The semantic transformation is
    qualification rather than comparison or choosing a winner.
