name:
  id: motionAtlas.invalid-table-quarantine.name
  message: Keep partial data out of the next read
description:
  id: motionAtlas.invalid-table-quarantine.description
  message:
    A stored table is marked invalid before a mutation starts. If the operation
    fails, a read cannot use the partial contents; a complete replacement restores
    readability.
category:
  id: motionAtlas.invalid-table-quarantine.category
  message: Fail-closed data validity
useWhen:
  id: motionAtlas.invalid-table-quarantine.useWhen
  message: Keep potentially partial state out of later reads.
prompt:
  id: motionAtlas.invalid-table-quarantine.prompt
  message: Keep potentially partial state out of later reads.
creativeDirection:
  id: motionAtlas.invalid-table-quarantine.creativeDirection
  message:
    960x600 React/SVG, shared palette, deterministic 180 frames at 30fps. Frames
    0-12 reveal the scene. Frames 13-45 close a visible read shutter before altering one
    row. Frames 46-95 show the authored mutation outcome with an invalid band still
    covering the table. Frames 96-139 either insert a full replacement sheet and reopen
    the shutter, or retain the closed shutter. Hold the resolved meaning during frames
    140-165. Frames 166-179 return to the same opaque ground for a six-second loop;
    reset is editorial.
intent:
  id: motionAtlas.invalid-table-quarantine.intent
  message: Keep potentially partial state out of later reads.
distinction:
  id: motionAtlas.invalid-table-quarantine.distinction
  message:
    "Unlike revision-restore, the point is refusing reads of potentially partial
    state. It is not a rollback: only a complete reload clears invalidity."
tags:
  - id: motionAtlas.invalid-table-quarantine.tags.0
    message: cache invalidation
  - id: motionAtlas.invalid-table-quarantine.tags.1
    message: quarantine
  - id: motionAtlas.invalid-table-quarantine.tags.2
    message: partial failure
  - id: motionAtlas.invalid-table-quarantine.tags.3
    message: fail closed
goodFor:
  - id: motionAtlas.invalid-table-quarantine.goodFor.0
    message: Explain why failed partial writes must block reads
  - id: motionAtlas.invalid-table-quarantine.goodFor.1
    message: Show invalidation before mutation and complete reload recovery
domains:
  - id: motionAtlas.invalid-table-quarantine.domains.0
    message: Editorial illustration
aliases:
  - id: motionAtlas.invalid-table-quarantine.aliases.0
    message: invalid table quarantine
notFor:
  - id: motionAtlas.invalid-table-quarantine.notFor.0
    message: Reload is authored, not automatic recovery evidence.
  - id: motionAtlas.invalid-table-quarantine.notFor.1
    message: A completed mutation remains invalid until reload under this contract.
  - id: motionAtlas.invalid-table-quarantine.notFor.2
    message: The shutter represents validity, not encryption or deletion.
  - id: motionAtlas.invalid-table-quarantine.notFor.3
    message:
      No real product screen, external fetch, supplied code execution, or measured
      performance claim. All text is authored; no JSX, functions or URLs in props.
  - id: motionAtlas.invalid-table-quarantine.notFor.4
    message:
      Supplied prose is preserved. Fictional framing, source completeness and
      agreement between labels and structured state are author responsibilities. Runtime
      validation enforces structural bounds and exact cross-field rules.
  - id: motionAtlas.invalid-table-quarantine.notFor.5
    message:
      Literal IDs and row values preserve exact whitespace using visible whitespace
      marks at a fixed readable size.
motionBeats:
  - startFrame: 13
    endFrame: 45
    description:
      id: motionAtlas.invalid-table-quarantine.motionBeats.0
      message: Close reads before altering a row.
  - startFrame: 46
    endFrame: 95
    description:
      id: motionAtlas.invalid-table-quarantine.motionBeats.1
      message: Retain invalidity through the authored mutation outcome.
  - startFrame: 96
    endFrame: 139
    description:
      id: motionAtlas.invalid-table-quarantine.motionBeats.2
      message: Replace the complete sheet before reopening, or keep reads blocked.
  - startFrame: 140
    endFrame: 165
    description:
      id: motionAtlas.invalid-table-quarantine.motionBeats.3
      message: Hold the resolved meaning.
