name:
  id: motionAtlas.report-page-bind.name
  message: Bind a shareable report
description:
  id: motionAtlas.report-page-bind.description
  message: Analysis excerpts flow into a paginated document, then gather into a compact
    report at a named handoff destination. The source order stays visible through the
    transformation.
category:
  id: motionAtlas.report-page-bind.category
  message: Document transformation
useWhen:
  id: motionAtlas.report-page-bind.useWhen
  message: Show information becoming a self-contained document someone else can use.
creativeDirection:
  id: motionAtlas.report-page-bind.creativeDirection
  message: Frames 12-38 present two or three source excerpts on a work surface. Between
    frames 38-104, paper margins extend around the excerpts, each excerpt takes its own
    page, and a title strip becomes the first page header. The pages slide into an
    offset bound stack beside a destination tray during frames 104-136. Hold the report
    and destination label through frame 166, then exit to the shared ground.
intent:
  id: motionAtlas.report-page-bind.intent
  message: Show information becoming a self-contained document someone else can use.
distinction:
  id: motionAtlas.report-page-bind.distinction
  message: Unlike scan-lines, this constructs and paginates a document rather than
    examining one. Unlike source-merge, source excerpts retain their page identity and
    become a portable editorial artifact.
prompt:
  id: motionAtlas.report-page-bind.prompt
  message: Use Motion Atlas "Bind a shareable report" (report-page-bind) as a conceptual
    graphic. Show information becoming a self-contained document someone else can use.
    Replace fictional sample content with approved authored content before making
    product claims.
