notFor:
  - id: motionAtlas.report-page-bind.notFor.0
    message: All default content is fictional.
  - id: motionAtlas.report-page-bind.notFor.1
    message: One section equals one page; this is an authored diagram, not a text-layout engine.
  - id: motionAtlas.report-page-bind.notFor.2
    message: Arrival at the destination tray means prepared for handoff, not transmitted or
      read.
  - id: motionAtlas.report-page-bind.notFor.3
    message: No actual PDF generation, network sharing, or product capability is demonstrated.
  - id: motionAtlas.report-page-bind.notFor.4
    message: An exported map needs its units, classification legend, source and limitation
      note; a decorative map image alone is incomplete.
motionBeats:
  - startFrame: 12
    endFrame: 38
    description:
      id: motionAtlas.report-page-bind.motionBeats.0
      message: Establish ordered source excerpts on the work surface.
  - startFrame: 38
    endFrame: 104
    description:
      id: motionAtlas.report-page-bind.motionBeats.1
      message: Extend paper margins and retain each section on its own page.
  - startFrame: 104
    endFrame: 136
    description:
      id: motionAtlas.report-page-bind.motionBeats.2
      message: Bind the pages in their supplied order beside the destination tray.
  - startFrame: 136
    endFrame: 166
    description:
      id: motionAtlas.report-page-bind.motionBeats.3
      message: Hold every report page and the authored destination.
