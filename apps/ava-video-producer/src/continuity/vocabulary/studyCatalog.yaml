- id: stepped-column-wipe
  title: Stepped column wipe
  category: transitions
  kind: scene
  description:
    Hand one shot to the next through vertical columns that rise or drop one after
    another, over a frozen frame or a shot that keeps playing.
  frames: 360
  path: vocabulary/stepped-column-wipe
  family: vocabulary
  sourceFilm: shot-vocabulary
  goodFor:
    Mark a change of act between statements and product stills with a striped,
    deliberate handover that echoes a columned brand mark.
  tags:
    - column wipe
    - stepped reveal
    - shot transition
    - frozen outgoing frame
    - playing outgoing shot
    - outgoing drift
    - act break
  creativeDirection:
    Open on a dark statement, then let eight columns rise left to right half a frame
    apart onto a light field. Drop six columns from the top, right to left, onto a tilted
    Explorer window whose camera starts a slow push. Close with twelve columns staggered a
    frame and a half apart while that push keeps playing underneath, the outgoing shot
    drifting left and blurring as the columns cover it. Each handover is short and crisp,
    and the last one is the slow, layered exception.
  avoid:
    Two shots share a layout that a dissolve or cut would carry better, or the columns
    would slice through text the viewer is still reading.
  controls:
    - path: transition.columns
      label: Column count
      description: Choose how many columns cover the frame; more columns read as a finer stripe.
    - path: transition.staggerFrames
      label: Column stagger
      description:
        Frames between neighbouring columns. Fractions are interpolated, never rounded,
        and the last column must start inside the transition.
    - path: transition.from
      label: Direction
      description: Columns rise from the bottom or drop from the top.
    - path: transition.order
      label: Column order
      description: Sweep the columns left to right or right to left.
    - path: transition.outgoing
      label: Outgoing shot
      description:
        Frozen holds the outgoing shot's last frame. Playing keeps its camera, footage
        or typing moving under the columns.
    - path: transition.outgoingDrift
      label: Outgoing drift
      description:
        Slide the outgoing shot by a fraction of the width with horizontal blur while
        the columns cover it.
    - path: transitionInFrames
      label: Wipe length
      description: The whole handover, including every column's stagger and rise.
- id: field-colour-cut
  title: Field-colour cut
  category: transitions
  kind: scene
  description:
    Change the whole field colour on a hard cut, from a dark field to the accent and on
    to a light field, with a theme on each shot instead of an animated transition.
  frames: 210
  path: vocabulary/field-colour-cut
  family: vocabulary
  sourceFilm: shot-vocabulary
  goodFor:
    Punctuate a short run of statements and figures so each new idea lands on its own
    colour, the way launch films alternate dark, accent and light fields.
  tags:
    - hard cut
    - field colour
    - shot theme
    - accent field
    - light field
    - rhythm
  creativeDirection:
    Cut from a dark field naming the entities, to a single large word on the accent
    field, to a light field where a fictional district count runs up. Every cut is
    instant and each shot starts its own reveal on its first frames, so the colour change
    carries the beat and nothing crossfades.
  avoid:
    The cuts would come faster than the viewer can read each field, or adjacent shots
    need a spatial relationship a cut would break.
  controls:
    - path: theme.ground
      label: Field colour
      description:
        The shot's background. Use a colour or var(--token) naming another token, such
        as var(--brand) for the accent field.
    - path: theme.foreground
      label: Text colour
      description: Set a foreground that stays readable on the shot's field.
    - path: transitionInFrames
      label: Cut
      description: Zero frames makes the hard cut between fields.
    - path: transition.kind
      label: Declared cut
      description:
        cut marks the hard cut as deliberate, so the frame gate accepts the jump in
        field brightness on that frame. It needs transitionInFrames set to 0.
- id: fly-through
  title: Fly-through into colour
  category: transitions
  kind: scene
  description:
    Send the mark's columns toward the camera until they cover the frame in a token
    colour, then cut to a shot painted on that same colour.
  frames: 220
  path: vocabulary/fly-through
  family: vocabulary
  sourceFilm: shot-vocabulary
  goodFor:
    Leave an opening brand lockup and arrive on the first content shot without a visible
    seam, because the exit already fills the frame with the next shot's field.
  tags:
    - fly-through
    - brand lockup exit
    - token colour
    - accent field
    - cut on colour
    - opening sequence
  creativeDirection:
    Build the mark through eight rising columns and wipe the wordmark in beside it. Let
    the wordmark retract, then send the columns surging through the frame with a slight
    turn until the accent colour covers everything. Cut on that colour to a tilted Maps
    window whipping in on an accent field, so the handover reads as one continuous move.
  avoid:
    The next shot is not painted on the exit colour, which turns the covered frame into
    a flash.
  controls:
    - path: props.exit.atFrame
      label: Exit start
      description: When the wordmark retracts; the columns fly a few frames later.
    - path: props.exit.durationInFrames
      label: Flight length
      description: How long the columns take to cover the frame.
    - path: props.exit.color
      label: Cover colour
      description: The theme token the columns spread into. Paint the next shot's field with it.
    - path: theme.ground
      label: Next field
      description: Set the following shot's ground to the same token, for example var(--brand).
- id: whip-exit
  title: Whip exit
  category: transitions
  kind: scene
  description:
    Whip a tilted window off the left edge into a hard cut, or run a longer whip under
    a column wipe while the outgoing shot keeps playing.
  frames: 290
  path: vocabulary/whip-exit
  family: vocabulary
  sourceFilm: shot-vocabulary
  goodFor:
    Move briskly between product stills, letting the outgoing window's direction carry
    the viewer into the next shot.
  tags:
    - whip exit
    - horizontal blur
    - hard cut
    - playing outgoing shot
    - column wipe
    - product stills
  creativeDirection:
    A Cases window whips in, holds, then accelerates off the left edge with growing blur
    while its headline fades in place, and the film cuts on the empty field. A Maps window
    whips in the same way, but its exit starts on its last frame and runs longer, so it
    keeps sliding away under eight columns that rise over the still-playing shot.
  avoid:
    The next shot moves in the opposite direction, or the exit starts so early that the
    empty field holds before the cut.
  controls:
    - path: props.exit.atFrame
      label: Exit start
      description:
        Let the whip finish a frame or two before a hard cut, or start it on the
        shot's last frame when a playing column wipe follows.
    - path: props.exit.durationInFrames
      label: Whip length
      description: Lengthen the whip so it is still moving under the following wipe.
    - path: transition.outgoing
      label: Outgoing shot
      description: Playing keeps the whip moving under the next shot's columns.
    - path: transitionInFrames
      label: Handover
      description: Zero for the hard cut; the longer whip needs the wipe's length.
    - path: transition.kind
      label: Handover kind
      description:
        cut declares the hard cut after a whip; stepped-column-wipe covers the longer
        whip with columns.
- id: causal-signal
  title: Action, signal, consequence
  category: compositing
  description:
    An explanation emerges from a measured control after its action, then returns attention
    to the source.
  frames: 870
  path: explainers/study-causal-signal
  family: vocabulary
  sourceFilm: ontology-composite
  goodFor: Explain a real control or result alongside the dependency that gives it meaning.
  tags:
    - action and consequence
    - causal connector
    - anchored overlay
    - rule selection
    - attribute mapping
    - sum aggregation
    - source spotlight
  creativeDirection:
    Open with the relationship between identity, observations, and fields, then use a
    30-frame wipe into the scripted attribute-mapping interface. Let the keyed case-and-visit detail
    appear first, then time the source signal after the rule action and bring out the sum
    explanation with a longer reading hold. Keep the measured control as the visual origin and
    return attention there as the overlays retract, treating the arithmetic as an illustrative
    explanation of the choice.
  avoid: The connector would claim a data flow or product behavior that has not been established.
  controls:
    - path: beats[].content.source
      label: Source bounds
      description: Anchor the signal to the measured product region being explained.
    - path: beats[].content.signalAt
      label: Signal timing
      description: Start after the action and leave at least 45 frames for the consequence.
    - path: beats[].content.diagrams
      label: Explanatory sequence
      description: Author diagram cues in increasing beat-local time, beginning at zero.
    - path: beats[].content.diagrams[].overlay
      label: Floating explanation
      description: Set departure, return, and a settled rectangle clear of the relevant product controls.
- id: field-grouping
  title: Bracket a field group
  category: compositing
  description: Use a stable rough-notation bracket to group actual configuration controls. Draw once, then hold.
  frames: 870
  path: explainers/study-field-grouping
  family: vocabulary
  sourceFilm: ontology-composite
  goodFor: Group several related configuration controls while preserving their original layout.
  tags:
    - field group
    - bracket annotation
    - related controls
    - configuration teaching
    - anchored diagram
    - keyed join
    - sum rule
  creativeDirection:
    Establish why a field needs a source and a rule, then wipe into the scripted
    mapping form and draw a stable bracket around the measured control group. Show the keyed
    case-and-visit detail briefly before holding the sum explanation below the controls, keeping the
    form at native scale throughout the 24-second composite beat. Use the bracket and brief circle
    annotation as restrained teaching marks that group the controls without drawing a causal
    connector.
  avoid: The controls are unrelated, or a bracket would cover their labels or input values.
  controls:
    - path: beats[].content.source
      label: Group bounds
      description: Measure a rectangle around the exact controls in the group.
    - path: beats[].content.effect
      label: Annotation style
      description: Use bracket to group controls without asserting a data connection.
    - path: beats[].content.annotations
      label: Measured annotations
      description: Choose a seeded mark, measured native rectangle, and draw/hold/retract interval.
    - path: beats[].content.diagrams[].overlay
      label: Floating explanation
      description: Set departure, return, and a settled rectangle clear of the relevant product controls.
