  path: vocabulary/tilted-window
  family: vocabulary
  sourceFilm: shot-vocabulary
  goodFor:
    Show a sequence of product stills as a confident launch-film beat, with one short
    headline carrying the point while the screens change.
  tags:
    - tilted window
    - product stills
    - headline column
    - carousel
    - scroll steps
    - window camera
    - secondary window
  creativeDirection:
    Whip an Import preview in from the right and jump it down the page in two quick
    scroll steps. Slide a Maps still in over it as the headline changes, cut to a second
    map, then push the window-only camera in while the headline stays put. Cut to a light
    field where a Cases list rests in the tall box and a record detail whips in beside it
    in the same plane. Keep the fictional-data footnote visible under every still.
  avoid:
    The window would hold live product UI, which belongs in an unscaled avandar shot, or
    the headline needs more than three short lines.
  controls:
    - path: props.headlines
      label: Headlines
      description:
        One to three short lines per entry. A later entry replaces the earlier one at
        its atFrame.
    - path: props.windows[].swap
      label: Carousel change
      description: Slide brings the next still in on top from the right; cut swaps at once.
    - path: props.windows[].atFrame
      label: Carousel timing
      description: When each later still replaces the current one. The first has none.
    - path: props.windows[].scrollSteps
      label: Scroll steps
      description:
        Jump a still that is taller than its window to each offset, a fraction of its
        height.
    - path: props.camera
      label: Window camera
      description: Zoom keys anchored inside the window. The headline never moves.
    - path: props.secondary
      label: Secondary window
      description: A smaller still in the same plane, placed in canvas fractions, that whips in at its frame.
    - path: props.windowBox
      label: Window box
      description: Default leaves room above and below; tall reaches near the frame edges.
    - path: props.footnote
      label: Footnote
      description: Keep Fictional demonstration data visible under product stills.
- id: racing-pair
  title: Racing pair
  category: compositions
  kind: scene
  description:
    Two tilted windows side by side, each labelled above and timed by a counter below
    that turns the accent colour when it finishes.
  frames: 180
  path: vocabulary/racing-pair
  family: vocabulary
  sourceFilm: shot-vocabulary
  goodFor:
    Compare two steps or two runs at a glance, letting the finishing order of the
    counters make the comparison.
  tags:
    - racing counters
    - side by side
    - pair layout
    - timed comparison
    - mirrored tilt
    - flip-split
  creativeDirection:
    On a light field, flip both windows in from edge-on and split them apart into a
    mirrored tilt. Start both counters together so the shorter one finishes first and
    turns the accent colour, then hold until the second finishes before both windows whip
    off to the left. Label the timings as fictional beside each counter and in the footnote.
  avoid:
    The figures are presented as measured performance without a source, or the two
    windows show unrelated screens that invite no comparison.
  controls:
    - path: props.pair[].label
      label: Column labels
      description: A short label above each window.
    - path: props.pair[].counter
      label: Counters
      description:
        Value, unit, precision and the start and end frames. The earlier endFrame
        finishes first.
    - path: props.pair[].stat
      label: Stat line
      description: A small note under each counter, such as the figure's provenance.
    - path: props.badge
      label: Badge
      description: Labels the right-hand column.
    - path: props.enter.kind
      label: Entrance
      description: Flip-split or from-sides; both enter the pair layout only.
- id: brand-lockup
  title: Brand lockup and call to action
  category: compositions
  kind: scene
  description:
    A raster mark built through column masks, a wordmark wipe, and a call-to-action
    cascade ending in a typed command and a badge.
  frames: 210
  path: vocabulary/brand-lockup
  family: vocabulary
  sourceFilm: shot-vocabulary
  goodFor:
    Open or close a film on the brand, and end on one concrete next step the viewer can
    type or visit.
  tags:
    - brand lockup
    - column build
    - wordmark wipe
    - call to action
    - typed command
    - closing card
  creativeDirection:
    Raise the Avandar mark through eight column masks left to right, then wipe the
    wordmark in beside it. Once both settle, cascade the call to action below - the
    subtitle, a placeholder address, a terminal prompt typing the command that previews
    this study with a blinking block cursor, and a badge after the typing ends.
  avoid:
    The mark would have to be redrawn as vectors, or the command or address is invented
    for a product that does not offer it.
  controls:
    - path: props.build.columns
      label: Build columns
      description: How many column masks the mark rises through.
    - path: props.build.staggerFrames
      label: Build stagger
      description: Frames between neighbouring columns; fractions are allowed.
    - path: props.wordmark
      label: Wordmark
      description: Text set beside the mark; it wipes in left to right.
    - path: props.cta
      label: Call to action
      description: Subtitle, address, command and badge, cascading from atFrame.
    - path: props.cta.commandCharsPerSecond
      label: Typing speed
      description: Characters per second for the typed command.
- id: bar-comparison
  title: Bar comparison
  category: compositions
  kind: scene
  description:
    A hero number over ranked bars, in one panel or two, with straight or rough bar
    edges and an element-by-element erase before the cut.
  frames: 270
  path: vocabulary/bar-comparison
  family: vocabulary
  sourceFilm: shot-vocabulary
  goodFor:
    Land one headline figure and show where it ranks, or set two related figures side
    by side.
  tags:
    - bar chart
    - hero number
    - ranked rows
    - rough edges
    - erase exit
    - two panels
  creativeDirection:
    On a light field, bring in one hero figure in minutes, then its labels, bars growing
    from the left with the highlighted row in the accent, and values last. Cut to two
    panels staged a few frames apart with torn bar edges, hold for reading, then erase
    every element left to right in reading order, the left panel first. Keep the
    fictional-data footnote under both.
  avoid:
    The figures need axes, scales or negative values, or they are presented as sourced
    results without a citation.
  controls:
    - path: props.panels
      label: Panels
      description: One or two hero figures, each with up to eight ranked rows.
    - path: props.panels[].rows
      label: Rows
      description: Label, value, optional display text, and highlight for the accent bar.
    - path: props.panelStaggerFrames
      label: Panel stagger
      description: Delay of the second panel's staging.
    - path: props.barEdge
      label: Bar edge
      description: Straight or a seeded rough, torn edge.
    - path: props.exit
      label: Erase exit
      description: Start the erase inside the shot and cut when it ends.
    - path: props.footnote
      label: Footnote
      description: Keep Fictional demonstration data visible unless the figures are sourced.
- id: window-entrances
  title: Window entrances
  category: scene-motions
  kind: scene
  description:
    Four ways a tilted window arrives - a whip revealed through rising columns, a
    full-bleed pull-back into the tall box, a pair from both sides, and a flip-split pair.
  frames: 460
  path: vocabulary/window-entrances
  family: vocabulary
  sourceFilm: shot-vocabulary
  goodFor:
    Choose how a product still enters so the motion matches the beat, from a quick
    arrival to a reveal of context around a full-screen still.
  tags:
    - window entrance
    - whip in
    - stepped reveal
    - pull-back
    - from the sides
    - flip-split
  creativeDirection:
    Whip an Explorer still in from the right while four columns rise from its bottom
    edge to reveal it. Cut to a dashboard filling the frame with no tilt, hold, then ease
    it back into the tall box as the headline appears. On a light field, slide two windows
    in from opposite edges with horizontal blur. Finish with two dashboard stills flipping
    in from edge-on and splitting apart.
  avoid:
    A full-bleed pull-back starts on a bright still over a dark field with a fast ease,
    which dims the frame in one step, or a pair entrance is used on a single window.
  controls:
    - path: props.enter.kind
      label: Entrance
      description: Whip and pull-back enter a single window; from-sides and flip-split enter a pair.
    - path: props.enter.durationInFrames
      label: Entrance length
      description: How long the window takes to land.
    - path: props.enter.reveal
      label: Stepped reveal
      description: Clip a whipping window to columns rising from its bottom edge for the first frames.
    - path: props.enter.ease
      label: Pull-back ease
      description: inOut starts gently, which keeps a bright still from dimming the frame at once.
    - path: props.windowBox
      label: Landing box
      description: Tall is the box a full-bleed pull-back lands in.
- id: typography-reveals
  title: Typography line reveals
  category: scene-motions
  kind: scene
  description:
    Lines that fade up, wipe in, or cut on, with an icon above, a staged exit, and a small
    caption size.
  frames: 275
  path: vocabulary/typography-reveals
  family: vocabulary
  sourceFilm: shot-vocabulary
  goodFor:
    Give a statement the right weight - a calm fade under the mark, a brisk wipe, or a
    quiet caption that simply appears.
  tags:
    - line fade
    - line wipe
    - cut on
    - staged exit
    - icon
    - caption size
  creativeDirection:
    Fade the mark in, then fade two lines up beneath it a few frames apart, and leave
    line by line before the icon goes. Cut to a light field where two left-aligned lines
    wipe in from the left with a small leftward travel. End on black with a small
    regular-weight caption that cuts on after a beat of silence.
  avoid:
    Each word needs its own timing, which the default word-mask mode handles, or the
    lines are long enough that a wipe outlasts the read.
  controls:
    - path: props.revealMode
      label: Reveal mode
      description: line-fade, wipe or cut. word-mask is the default rising word reveal.
    - path: props.lineStaggerFrames
      label: Line stagger
      description: Frames between lines in the line modes.
    - path: props.icon
      label: Icon
      description: A public image above the lines that fades in first.
    - path: props.exit
      label: Staged exit
      description: Lines fade out top to bottom, then the icon, starting inside the shot.
    - path: props.size
      label: Caption size
      description: caption sets one small regular-weight size and rejects fontSize.
- id: heading-wipe
  title: Heading wipe
  category: scene-motions
  kind: scene
  description:
    A scene heading whose title and kicker wipe in left to right instead of rising,
    shown on a metric, a statement and a bar comparison.
  frames: 300
  path: vocabulary/heading-wipe
  family: vocabulary
  sourceFilm: shot-vocabulary
  goodFor:
    Introduce a figure or diagram with a heading that reads like it is being written
    across the frame, matching wipes elsewhere in the film.
  tags:
    - heading reveal
    - title wipe
    - kicker
    - metric
    - bar comparison
    - typography heading
  creativeDirection:
    On a light field, wipe the title in from the left and the kicker eight frames later,
    then let the scene's own content follow - a fictional row count running up, a two-line
    statement fading in, and a single ranked bar panel. The heading settles before the
    content moves so attention passes from the label to the figure.
  avoid:
    The heading is long enough to wrap, or the content starts moving before the heading
    has finished.
  controls:
    - path: props.headingReveal.mode
      label: Heading reveal
      description: wipe reveals left to right behind a clip; rise is the default lift.
    - path: props.headingReveal.atFrame
      label: Heading start
      description: When the title starts.
    - path: props.headingReveal.staggerFrames
      label: Kicker delay
      description: Frames between the title and the kicker.
    - path: props.title
      label: Title
      description: Short heading copy fitted at a fixed size.
    - path: props.kicker
      label: Kicker
      description: Supporting line under the title.
- id: graph-packets
  title: Graph packets
  category: scene-motions
  kind: scene
  description:
    An editorial diagram with item lists inside corner-tick frames and parallel arrowless
    edges carrying packets both ways.
  frames: 210
  path: vocabulary/graph-packets
  family: vocabulary
  sourceFilm: shot-vocabulary
  goodFor:
    Explain movement between parts of an illustrated system without drawing a single
    arrow for every exchange.
  tags:
    - graph diagram
    - travelling packets
    - parallel edges
    - arrowless edges
    - node items
    - corner ticks
  creativeDirection:
    Wipe the heading in, then stage three cards - fictional sources, the workspace with
    its entities, and a dashboard card. Draw three parallel plain lines between the first
    two, send packets across them, one travelling back, then send a final packet along the
    arrowed edge to the dashboard. Label the whole diagram as illustrative.
  avoid:
    The packets would read as measured telemetry, or the cards need automatic layout
    rather than authored positions.
  controls:
    - path: props.edges[].packets
      label: Packets
      description: Each window sends a dot along the edge, forward or in reverse.
    - path: props.edges[].offset
      label: Parallel offset
      description: Shift edges between the same cards sideways so they run in parallel.
    - path: props.edges[].arrow
      label: Arrowhead
      description: false draws a plain line, for example under packets travelling both ways.
    - path: props.nodes[].items
      label: Node items
      description: Up to eight list items inside a card under its label.
    - path: props.nodes[].frame
      label: Node frame
      description: ticks draws four corner ticks with no fill or border.
    - path: props.nodes[].width
      label: Node width
      description: Card width as a fraction of the content width.
