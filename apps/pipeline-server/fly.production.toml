# Fly production config for `apps/pipeline-server`.

app = "avandar-pipeline-server-prod"
primary_region = "iad"

[build]
dockerfile = "./Dockerfile"

[env]

[http_service]
internal_port = 8080
force_https = true

# Keep one machine always running. A catalog listing's Parquet copy is built
# in the background after its build request has returned, so a machine
# stopped for having no traffic would lose the build.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = "15s"
timeout = "2s"
grace_period = "10s"
method = "GET"
path = "/healthz"
