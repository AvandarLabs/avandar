<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dif · web shell</title>
  <link rel="stylesheet" href="/__wrap/shell.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="tb-left">
        <button class="icon-btn" id="toggleSide" title="Toggle guide" aria-label="Toggle guide sidebar">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.2"/><line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <div class="brand">
          <span class="mark" id="brandTitle">dif</span>
          <span class="wt-pill" id="worktreePill" title="worktree" hidden></span>
          <button class="changes-btn" id="showChangesBtn" type="button" hidden title="The working tree changed — reload difit + the guide in place (keeps your in-progress comment)">
            <svg class="rfx" width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M13.5 2.5V5H11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Show new changes</span>
          </button>
        </div>
        <div class="gh-bar" id="ghBar">
          <span class="gh-nopr" id="ghNoPr" hidden>No linked PR</span>
          <a class="gh-pr" id="ghPr" target="_blank" rel="noopener noreferrer" hidden><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg><span id="ghPrNum"></span></a>
          <button class="gh-sync" id="ghSync" type="button" hidden aria-label="Sync from GitHub">
            <svg class="gh-sync-ic" width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M13.5 2.5V5H11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="gh-review" id="ghReview" type="button" hidden aria-haspopup="dialog" aria-expanded="false" aria-controls="ghPop">
            <span id="ghReviewLabel">Review</span>
            <span class="gh-count" id="ghReviewCount" hidden></span>
          </button>
          <span class="gh-notice" id="ghNotice" role="status" hidden></span>
        </div>
      </div>
      <div class="view-info" id="viewInfo"></div>
      <div class="tb-right">
        <div class="dispatch" title="How your comments reach the LLM: Bulk holds them until Send all, Eager sends each one as soon as you save it">
          <div class="dispatch-seg" id="dispatchMode" role="radiogroup" aria-label="Comment delivery to the LLM">
            <button class="dispatch-opt active" type="button" role="radio" aria-checked="true" data-mode="bulk">Bulk</button>
            <button class="dispatch-opt" type="button" role="radio" aria-checked="false" data-mode="eager">Eager</button>
          </div>
          <button class="send-all-btn" id="sendAllBtn" type="button" hidden title="Send every held comment to the LLM as one prompt">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 8h10M8.5 4.5 12 8l-3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Send all</span>
            <span class="send-all-count" id="sendAllCount">0</span>
          </button>
        </div>
        <button class="commented-btn" id="commentedBtn" type="button" aria-label="With comments" aria-pressed="false" disabled title="No file has comments yet">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 3.5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1H7l-3 2.5V11h-.5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span class="commented-lbl">With comments</span>
          <span class="commented-count" id="commentedCount">0</span>
        </button>
        <div class="view-prog" id="viewProg"></div>
        <button class="cmd-btn" id="cmdBtn" type="button" title="Command palette">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span class="cmd-lbl">Jump to…</span>
          <kbd class="cmd-kbd" id="cmdKbd">⌘K</kbd>
        </button>
        <button class="theme-btn" id="themeBtn" type="button">Theme</button>
      </div>
    </header>

    <div class="body" id="bodyEl">
      <aside class="sidebar" aria-label="Diff guide">
        <div class="side-head">
          <span class="st">Diff guide</span>
          <button class="regen-btn" id="regenBtn" type="button" hidden title="A file was added or removed since the guide was generated - refresh it (asks the LLM via /diff-review)">
            <svg class="regen-ic" width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M13.5 2.5V5H11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="regen-lbl">Refresh diff guide</span>
          </button>
          <span class="prog" id="sideProg"></span>
          <button class="icon-btn" id="collapseBtn" title="Collapse" aria-label="Collapse guide">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M10 3l-4 5 4 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="side-tabs" role="tablist" aria-label="Diff guide panels">
          <button class="side-tab active" id="guideTab" type="button" role="tab" aria-selected="true">Diff guide</button>
          <button class="side-tab" id="testPlanTab" type="button" role="tab" aria-selected="false">Test plan</button>
        </div>
        <div class="side-scroll" id="sideScroll"></div>
      </aside>

      <nav class="rail" id="rail" aria-label="Collapsed group nav"></nav>

      <main class="main">
        <div class="iframe-wrap">
          <div class="loading" id="loading"><span class="spinner"></span> Loading difit…</div>
          <div class="ifr-error" id="ifrError" hidden>
            <div class="ifr-error-box">
              <p class="ifr-error-msg">difit didn’t load.</p>
              <p class="ifr-error-sub">The diff server may still be starting or was restarted.</p>
              <button class="retry-btn" id="ifrRetry" type="button">Retry</button>
            </div>
          </div>
          <iframe id="difit" title="difit diff viewer" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
      </main>
    </div>
  </div>

  <!-- command palette (spotlight) -->
  <div class="spotlight" id="spotlight" hidden>
    <div class="sl-backdrop" id="slBackdrop"></div>
    <div class="sl-modal" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="sl-input-wrap">
        <svg class="sl-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.3"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <input class="sl-input" id="slInput" type="text" autocomplete="off" spellcheck="false"
               placeholder="Jump to a file, group, or view — type a number for a group" aria-label="Command palette search" />
      </div>
      <div class="sl-list" id="slList" role="listbox"></div>
      <div class="sl-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>esc</kbd> close</span>
      </div>
    </div>
  </div>

  <!-- submit the pending GitHub review -->
  <div class="gh-pop" id="ghPop" role="dialog" aria-labelledby="ghPopTitle" hidden>
    <h2 class="gh-pop-title" id="ghPopTitle">Finish your review</h2>
    <p class="gh-pop-sub" id="ghPopSub"></p>
    <textarea class="gh-pop-body" id="ghPopBody" rows="4" placeholder="Leave a comment (optional)" aria-label="Review summary"></textarea>
    <fieldset class="gh-pop-events" id="ghPopEvents">
      <legend class="gh-sr-only">Review outcome</legend>
      <label class="gh-event"><input type="radio" name="ghEvent" value="COMMENT" checked /><span><b>Comment</b><small>Submit general feedback without explicit approval.</small></span></label>
      <label class="gh-event"><input type="radio" name="ghEvent" value="APPROVE" /><span><b>Approve</b><small>Give your approval to merge these changes.</small></span></label>
      <label class="gh-event"><input type="radio" name="ghEvent" value="REQUEST_CHANGES" /><span><b>Request changes</b><small>Submit feedback that must be addressed before merging.</small></span></label>
    </fieldset>
    <p class="gh-pop-error" id="ghPopError" role="alert" hidden></p>
    <div class="gh-pop-actions">
      <button class="gh-pop-cancel" id="ghPopCancel" type="button">Cancel</button>
      <button class="gh-pop-submit" id="ghPopSubmit" type="button">Submit review</button>
    </div>
  </div>

  <!-- a GitHub sync's merge conflicts: who resolves them -->
  <dialog class="gh-conflicts" id="ghConflicts" aria-labelledby="ghConflictsTitle" aria-describedby="ghConflictsSub">
    <h2 class="gh-pop-title" id="ghConflictsTitle">Merge conflicts after syncing</h2>
    <p class="gh-pop-sub" id="ghConflictsSub"></p>
    <ul class="gh-conflicts-files" id="ghConflictsFiles" aria-label="Conflicted files"></ul>
    <p class="gh-conflicts-ask">Resolve them yourself, or have the LLM resolve them?</p>
    <div class="gh-pop-actions">
      <button class="gh-pop-cancel" id="ghConflictsReviewer" type="button">I'll resolve them</button>
      <button class="gh-pop-submit" id="ghConflictsLlm" type="button" autofocus>Auto-resolve with the LLM</button>
    </div>
  </dialog>

  <div class="tip" id="tip" role="tooltip" hidden></div>

  <script src="/__wrap/shell.js"></script>
</body>
</html>
