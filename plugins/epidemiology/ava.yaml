# The epidemiology plugin: statistical tools for public-health data.
id: avandar.epidemiology
name: "%plugin.name%"
description: "%plugin.description%"
version: "0.1.0"
license: MIT
engines:
  avandar: "^1"
entry: src/index.tsx
icon: chart-dots
permissions:
  - data:context
  - query:addColumns
contributes:
  commands:
    - id: regression.linear
      title: "%regression.linear.title%"
      icon: trending-up
    - id: incidence.rate
      title: "%incidence.title%"
      icon: percentage
    - id: rolling.average
      title: "%rollingAverage.title%"
      icon: chart-line
  menus:
    dataExplorer.toolbar:
      - command: regression.linear
        when:
          numericColumnCount: { gte: 2 }
      - command: incidence.rate
        when:
          numericColumnCount: { gte: 1 }
      - command: rolling.average
        when:
          dateColumnCount: { gte: 1 }
  aiTools:
    - name: fitRegression
      description: >
        Fits a straight line of yColumn on xColumn using the numeric result
        already on screen. Returns slope, intercept, rSquared, n, and
        isTruncated. n is how many rows had a finite number in both columns.
        rSquared is null when it has no value. isTruncated is true when the
        result was longer than the first 50,000 rows. You never receive row
        values. State the slope, intercept, and fit in one or two plain
        sentences. This call does not end your turn. If the tool says nothing
        is on screen, say you need a result showing first. Do not call
        run_query in the same answer to create that result.
      parameters:
        type: object
        additionalProperties: false
        required: [xColumn, yColumn]
        properties:
          xColumn:
            type: string
            description: The predictor column, named as it appears on the result.
          yColumn:
            type: string
            description: The outcome column, named as it appears on the result.
  vizTypes:
    - id: epicurve
      title: "%viz.epicurve.title%"
      icon: chart-histogram
      render: transform
      settings:
        - key: dateColumn
          label: "%viz.epicurve.dateColumn%"
          control: { kind: columnPicker, dataType: temporal }
          required: true
        - key: countColumn
          label: "%viz.epicurve.countColumn%"
          control: { kind: columnPicker, dataType: numeric }
        - key: interval
          label: "%viz.epicurve.interval%"
          control:
            kind: segmented
            options:
              - { value: day, label: "%viz.epicurve.interval.day%" }
              - { value: epiWeek, label: "%viz.epicurve.interval.epiWeek%" }
              - { value: month, label: "%viz.epicurve.interval.month%" }
          default: epiWeek
        - key: stackByColumn
          label: "%viz.epicurve.stackByColumn%"
          control: { kind: columnPicker, dataType: text }
    - id: rate-plot
      title: "%viz.ratePlot.title%"
      icon: chart-dots-3
      render: component
      settings:
        - key: labelColumn
          label: "%viz.ratePlot.labelColumn%"
          control: { kind: columnPicker, dataType: text }
          required: true
        - key: rateColumn
          label: "%viz.ratePlot.rateColumn%"
          control: { kind: columnPicker, dataType: numeric }
          required: true
        - key: lowerColumn
          label: "%viz.ratePlot.lowerColumn%"
          control: { kind: columnPicker, dataType: numeric }
        - key: upperColumn
          label: "%viz.ratePlot.upperColumn%"
          control: { kind: columnPicker, dataType: numeric }
        - key: sort
          label: "%viz.ratePlot.sort%"
          control:
            kind: segmented
            options:
              - { value: rate, label: "%viz.ratePlot.sort.rate%" }
              - { value: label, label: "%viz.ratePlot.sort.label%" }
          default: rate
